心**，小米、荣耀、vivo 等九家首批。高层建议：2nm 采购价上行会二次挤压毛利，须提前锁量。", "l": "IT之家 / 新浪财经", "u": "https://finance.sina.cn/stock/jdts/2026-09-23/detail-inisuaam6442263.d.html"}, {"t": "**小米18 Pro今晚19:00发布**，与华为同日对撞争国庆前最后窗口", "s": "核心观点：卢伟冰确认性能、背屏、屏幕、影像四大升级并首发澎湃 OS 4，全系 2nm 平台、徕卡双 2 亿、硬件级智能防窥屏与 0.99mm 极窄边，电池 7000 与 8500mAh。业内预测 5999 至 7999 元，上代 17 Pro 为 5699 元。**这是国产双旗舰首次在国庆前同日正面对撞**。高层建议：首销资源投放须避开同日流量稀释。", "l": "科技衍生 / 今日头条", "u": "https://www.toutiao.com/article/7688394914089976335/"}, {"t": "**OPPO Find X10实测4999元起**，影像旗舰硬件下放标准版", "s": "核心观点：9/22 19:00 发布三款，X10 E 4999 元、标准版 5499 元、Pro Max 6799 元，9/24 10:00 全渠道开售。标准版与 Pro Max 同为天玑 9600 Pro，标准版即配双 2 亿与 8000mAh，Pro Max 三颗 2 亿支持全焦段 8K Log。**高规格影像硬件首次下放到标准版**。高层建议：标准版堆料将抬高六千元档竞争基线。", "l": "国际金融报 / 腾讯新闻", "u": "https://news.qq.com/rain/a/20260922A0ABUF00"}, {"t": "**存储涨价改写定价权**，DRAM与NAND同比涨超300%", "s": "核心观点：行业测算 DRAM 与 NAND 价格同比涨超 300%，在售手机全球均价涨约 15%，新机较上代高约 25%，超四成机型已调价，入门机型涨幅超过 50%。**定价权已从品牌厂商回到上游存储原厂**，头部存储厂息税前利润率最高达 82%。高层建议：把存储锁价纳入年度经营预算一级科目。", "l": "华商网 / 今日头条", "u": "https://www.toutiao.com/article/7688139173018026515/"}, {"t": "**新机出现减配升价**，16GB砍至12GB与20GB取消同现", "s": "核心观点：vivo X500 标准版 5499 元较 X300 同容量涨超 1100 元，顶配版 16GB 大内存被砍到 12GB；Mate 90 全系 16GB 起步、20GB 版本取消。vivo 副总裁黄韬称存储涨价是行业共性问题。**成本压力正以隐形减配而非明面涨价的方式转嫁**。高层建议：减配须在发布会上主动解释，否则反噬口碑。", "l": "BT财经 / 财经头条", "u": "https://businesstimescn.com/articles/626979.html"}, {"t": "**iPhone 18 Pro首销32.28万台**，破发与溢价并存但股价逼近新高", "s": "核心观点：第三方观测 9/18 开售日零售约 32.28 万台、为上代同期 130%，Pro Max 占 55.5%。拼多多百亿补贴低至 9699 元破发，得物 Pro Max 256GB 酒红成交均价 12799 元、溢价近两千。苹果股价年内涨 24%，机构目标价升至 380 美元。**同代机型破发与溢价并存已成万元档常态**。高层建议：高端排产按容量与配色结构化。", "l": "财联社 / 今日头条", "u": "https://www.toutiao.com/article/7688325900626035254/"}, {"t": "**鸿蒙小艺接入淘宝闪购**，系统级智能体开始接管服务分发", "s": "核心观点：9/22 华为终端云服务宣布小艺接入淘宝闪购智能体，升级鸿蒙 7 并更新小艺后可语音完成外卖搜索、选择与下单全流程。小艺已可调用 2100 多项系统能力、连接 500 多家伙伴精选 Skills 与 2000 多个鸿蒙智能体，滴滴、高德、腾讯视频与京东均已接入。**OS 竞争正从应用数量转向智能体调度能力**。高层建议：把智能体接入数纳入生态考核。", "l": "华为终端云服务 / CNMO", "u": "https://weibo.com/1737694250/5345893427445852"}, {"t": "**华为在6000元以上逼近苹果**，高端差距由17个百分点收窄至10个", "s": "核心观点：Counterpoint 口径下 6000 元以上市场约九成份额由苹果与华为分食，苹果曾以 54% 对 36.5% 领先近 17 个百分点，如今差距收窄至约 10 个百分点。W37 华为国内份额 27% 创 2020 年以来新高。**华为高端增量主要来自苹果阵营而非国产品牌**。高层建议：高端传播应直接对标苹果而非安卓。", "l": "爆侃数码圈 / 今日头条", "u": "https://www.toutiao.com/article/7687783537012949554"}, {"t": "**荣耀Magic9定档9月28日**，阿莱影像与至臻黑钻屏压轴旗舰潮", "s": "核心观点：荣耀 Magic 盛典 9/28 14:25 在北京首都国际会议中心举行，标准版、超能版与 Pro Max 三款。Pro Max 搭载 2nm 平台、至臻黑钻屏峰值 10000nits、阿莱双 2 亿与自研驭光 H1 影像芯片，网传 4999 元起。**荣耀选择压轴以观察友商定价再定盘**。高层建议：压轴发布必须配套国庆现货，否则热度被提前透支。", "l": "科技衍生 / 新浪财经", "u": "https://t.cj.sina.com.cn/articles/view/7879923512/1d5ae173806801gxxu"}], "opinionLeaders": [{"name": "余承东", "role": "华为常务董事、终端BG董事长", "items": [{"hl": "9/22 内存大涨价背景下 Mate 90 全系定价上调 500 至 1200 元，此前已定调不涨价就是亏本买卖", "detail": "余承东此前公开表示，内存大幅涨价，手机之后可能都要大规模涨价，否则按原价销售都将面临亏损。9/22 渠道流出的 Mate 90 五款预估价印证了这一判断：标准版 5499 至 6000 元、Pro 6999 至 8000 元、Pro Max 8999 至 9000 元、典藏版约 11000 元、RS 11999 至 13000 元。同时全系 16GB 内存起步、20GB 版本取消、128GB 型号消失，在涨价的同时出现内存规格收缩。", "l": "千机阁 / 今日头条", "u": "https://www.toutiao.com/article/7688398894912291389/"}]}, {"name": "雷军", "role": "小米董事长兼CEO", "items": [{"hl": "9/20 官宣全新小米 18 Pro 系列 9 月 23 日 19:00 发布，称双尺寸影像科技旗舰、实力跨代升级，首发澎湃 OS 4", "detail": "雷军微博称全新百变背屏更实用更智能，多款科技新品同场发布；卢伟冰同步表示这是小米数字旗舰系列升级幅度最大的一次，性能、背屏、屏幕、影像四大核心体验全面升级。", "l": "网易科技 / 都市现场", "u": "https://www.163.com/dy/article/L7AE799U055692EN.html"}]}, {"name": "卢伟冰", "role": "小米集团总裁", "items": [{"hl": "9/21 卢伟冰详解小米 18 Pro 四大升级，强调不能简单把成本转移给消费者、一定要把产品做得更好", "detail": "四大升级为性能、背屏、屏幕、影像：全系高通 2nm 平台，徕卡全焦段光学三摄主摄与潜望均为 2 亿像素、长焦进光量提升近 3 倍，背屏升级为 AI 百变背屏可生成专属应用卡并预置 100 款高频应用，屏幕为超级像素 2.0、峰值 4000nits、黑边 0.99mm 较上代减少 16%。他同时确认是会涨，但相信大家会觉得合理。", "l": "新浪看点 / 微博", "u": "https://k.sina.cn/article_7879923048_1d5ae156806801e5ke.html"}, {"hl": "9/20 亲口确认小米 18 Pro 会涨价：是会涨，但相信大家会觉得合理", "detail": "面对网友关于上代 17 Pro 5699 元的追问作出上述回应。同日官宣该系列双尺寸搭载 2nm 旗舰平台、徕卡双 2 亿影像、新一代超级像素屏幕与 0.99mm 极窄边，Pro 与 Pro Max 分别配 7000mAh 与 8500mAh 金沙江电池；9/21 再放出黑色与白色两款配色。", "l": "IT之家 / 搜狐科技", "u": "https://www.toutiao.com/article/7687555183651422756"}]}, {"name": "数码闲聊站", "role": "数码博主", "items": [{"hl": "9/22 爆料华为 Mate 90 五款机型全系预估定价，涨幅 500 至 1200 元不等", "detail": "标准版 12GB+256GB 起步约 5499 至 6000 元，Pro 约 6999 至 8000 元，Pro Max 约 8999 至 9000 元，Pro Max 典藏版约 11000 元，RS 非凡大师 11999 至 13000 元。受全球存储暴涨与麒麟 9050 自研投入影响全系上浮，标准版与 Pro 备货相对充裕、RS 供货最少。全系 16GB 起步，去年 RS 的 20GB 版本不再提供。", "l": "微博 / 数码闲聊站", "u": "https://weibo.com/6526817152/5345942455978360"}]}, {"name": "刘作虎", "role": "OPPO 首席产品官", "items": [{"hl": "9/22 Find X10 发布会上表示，基于在画质、色彩、光影等领域的系统性探索，OPPO 打造了哈苏超清原相机", "detail": "刘作虎称该系列仍延续 OPPO 一直坚持的影像路线。除哈苏超清原相机外，Find X10 系列还重点推出 LUMO 调色盘与 LUMO 灵感两项功能。系列三款机型 X10 E、标准版与 Pro Max 定价分别为 4999、5499 与 6799 元起，标准版与 Pro Max 同为天玑 9600 Pro，把双 2 亿影像硬件首次下放到标准版。", "l": "江南都市报 / 腾讯新闻", "u": "https://news.qq.com/rain/a/20260922A0ABUF00"}]}, {"name": "卢鑫刚", "role": "华为终端云服务开发者服务与平台部部长", "items": [{"hl": "9/19 全联接大会披露鸿蒙生态家底：终端破 8500 万、开发者超 1100 万，鸿蒙已迈过有没有的阶段", "detail": "应用市场可获取应用与服务超 40 万、日均下载超 2 亿次、开发者关键 API 调用超 3000 亿次每天；OpenHarmony 生态设备超 13 亿台、行业发行版超 100 个。HarmonyOS 7 开放 20 多项系统级 AI 能力，鸿蒙智能体框架 2.0 将复杂任务成功率提升至 90% 以上。", "l": "华为官网 / C114", "u": "https://www.163.com/dy/article/L79BKO4T0514847E.html"}]}], "leadersSummary": "①**余承东给涨价定调**：内存大涨不涨就亏本，Mate 90 顶配逼近一万三、20GB 内存取消\n②**卢伟冰把涨价包装成升级**：2nm、徕卡双 2 亿与百变背屏齐上，称大家会觉得合理\n③**数码闲聊站曝渠道定价**：Mate 90 五款机型全系涨 500 至 1200 元，16GB 起步\n④**刘作虎坚持影像路线**：Find X10 打造哈苏超清原相机，把双 2 亿下放到标准版", "institutionViews": [{"name": "Counterpoint", "items": [{"t": "2026 年在售智能手机全球均价上涨约 15%，新机较上代高约 25%，超四成机型已调价", "s": "存储是唯一主因：DRAM 与 NAND 价格同比涨超 300%，入门机型涨幅超过 50%。苹果官网在售 iPhone 17 系列价格不降反升，256GB 版本较发布时上调 800 元，打破新机发布老款清库存降价的惯例。Q2 智能手机内存价格环比涨超 80%，DRAM 首次超过 SoC 成为整机最贵单一器件。价格越低的机型受挤压越重，往高端走才有消化成本的空间。", "l": "Counterpoint Research / 华商网", "u": "https://www.toutiao.com/article/7688139173018026515/"}]}, {"name": "IDC", "items": [{"t": "Q2 2026 全球智能手机出货 2.763 亿台 -7.4%，全年下调至 -13.9%", "s": "Q2 三星 6270 万台 22.7%（+8.1%）、苹果 5570 万台 20.2%（+14.9%）、小米 3120 万台 11.3%（-26.4%）、OPPO 2890 万台 10.5%（-17.1%）、vivo 2120 万台 7.7%（-19.6%）；华为凭中国市场稳定价格实现 +19.9% 逆势增长。但 Q2 全球营收 +7% 至 1090 亿美元、均价 +17% 至 400 美元创同期新高。预计 2027 再降 1.1%，2028 随存储供给正常化反弹 5.5%。", "l": "IDC / 东方财富", "u": "https://caifuhao.eastmoney.com/news/20260917234810331217390"}, {"t": "Q2 全球智能眼镜出货 354.7 万台 +35.3%，上半年 711.4 万台 +70.5%", "s": "其中音频及音频拍摄眼镜 249.4 万台 +54%，AR/ER 眼镜 50.5 万台 +75.7%，VR/MR 头显 54.8 万台 -23.3%。洛图科技口径中国市场上半年全渠道销量 90.9 万台 +85.5%、销售额 18.8 亿元 +98.7%；智能眼镜 2026 年首次纳入国家以旧换新补贴，按售价 15% 补贴、单台上限 500 元。", "l": "IDC / 21世纪经济报道", "u": "https://www.21jingji.com/article/20260917/herald/e8fd8a6507f005cb8c73135eca7e8521.html"}]}, {"name": "TrendForce", "items": [{"hl": "苹果已接受三星 2027 年一季度存储报价，较 2026 年三季度上调 30% 至 40%，放弃压价优先锁定产能", "detail": "存储价格未出现市场期待的下行拐点，三星、SK 海力士持续削减消费级存储产能转向 HBM。苹果是本次抢产能行动中出手最早的品牌，代价是成本压力大概率转嫁至终端售价，iPhone 18 标准版起价预计上调 1000 元至 6999 元档。", "u": "https://news.qq.com/rain/a/20260917A04ML700", "s": "苹果已接受三星 2027 年一季度存储报价，较 2026 年三季度上调 30% 至 40%，放弃压价优先锁定产能。存储价格未出现市场期待的下行拐点，三星、SK 海力士持续削减消费级存储产能转向 HBM。苹果是本次抢产能行动中出手最早的品牌，代价是成本压力大概率转嫁至终端售价，iPhone 18 标准版起价预计上调 1000 元至 6999 元档。", "l": "TrendForce", "t": "苹果已接受三星 2027 年一季度存储报价，较 2026 年三季度上调 30% "}, {"hl": "三星计划本季度全面上调面向所有手机厂商的移动端 DRAM 与 NAND 供货价，传导周期约半年", "detail": "核心动因是 AI 高利润存储订单饱满，头部厂商产能向 AI 硬件侧倾斜，消费级存储产出被压缩、供需转向紧平衡。DRAM 与 NAND 在手机物料清单中成本占比极高，走量机型与中端产品线几乎没有多余利润空间自行消化涨幅，后续或选择终端调价或隐性减配。", "u": "https://news.mydrivers.com/1/1151/1151765.htm", "s": "三星计划本季度全面上调面向所有手机厂商的移动端 DRAM 与 NAND 供货价，传导周期约半年。核心动因是 AI 高利润存储订单饱满，头部厂商产能向 AI 硬件侧倾斜，消费级存储产出被压缩、供需转向紧平衡。DRAM 与 NAND 在手机物料清单中成本占比极高，走量机型与中端产品线几乎没有多余利润空间自行消化涨幅，后续或选择终端调价或隐性减配。", "l": "TrendForce", "t": "三星计划本季度全面上调面向所有手机厂商的移动端 DRAM 与 NAND 供货价，"}]}, {"name": "QuestMobile", "items": [{"t": "存量报告：华为2.76亿台21.6%居首但同比-4.0%、苹果20.9%-1.0%、vivo+9.5%至16.5%、小米+6.4%", "s": "2000至4999元活跃占比48.1%，中端价位段成存量主力。华为存量虽降但凭借Mate/Pura旗舰稳住高端基本盘，vivo靠iQOO游戏场景逆势增长。数据反映存量市场已进入零和博弈，份额增长须靠抢夺而非做大蛋糕。", "l": "QuestMobile / QQ新闻", "u": "https://new.qq.com/rain/a/20260909A035SN00"}]}, {"name": "Omdia", "items": [{"t": "2026Q2美国PC出货量(不含平板)同比增长1.0%至1880万台，平均渠道出货价格首次突破1000美元、同比+12.0%", "s": "本季度恢复增长主要得益于零售商与渠道伙伴在存储器和存储产品供应受限导致价格上涨之前提前备货，带动部分需求提前释放。PC与手机同受存储成本冲击，均价上行与需求前置是共同特征。", "l": "Omdia / 同花顺财经", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}, {"t": "2026H1全球折叠出货510万部同比-21.6%，但苹果入局将引爆下半年", "s": "上半年折叠屏出货下滑主因三星Z Fold7生命周期末端+华为三折叠尚未规模交付。9/7华为Mate XT 2已开售、9/10苹果iPhone Duo发布、9/10小米18 Fold开售，三强落地将驱动下半年反弹，预计2026全年折叠出货+20%，苹果首年夺25%份额升至第二。", "l": "Omdia / 网易新闻", "u": "https://c.m.163.com/news/a/L1S1I03R053159A3.html"}, {"t": "全球AI眼镜出货：2023年38万台、2024年206万台、2025年870万台，2026年预计突破1500万台", "s": "洛图数据补充：2026年7月京东、天猫、抖音三大平台智能眼镜零售量7.4万台、同比-15.3%，零售额1.3亿元、同比-25.8%，零售额降幅大于零售量说明均价下行、价格战已开打；近两年进入该赛道企业近70家。", "l": "Omdia", "u": "https://www.toutiao.com/article/7686393210817511970"}, {"t": "2026 年全球智能手机出货预计 -12% 至 10.97 亿部，但 ASP 大涨 27% 至 594 美元", "s": "出货总价值预计同比增长 12% 达 6516 亿美元，全球均价将从 467 美元升至 624 美元、增幅 33%。价格结构重构：200 美元以下份额由 2025 年 40.6% 降至 2027 年 25.6%，其中 100 美元以下由 12.6% 降至 3.0%、100 至 199 美元由 28.0% 降至 22.6%；800 美元以上由 21.1% 升至 28.4%。200 至 699 美元中端市场保持约四成份额，是行业基本盘。成本压力主要来自存储涨价，DRAM 合约价已连涨数季并超越 SoC 成为旗舰最贵单一器件。五大驱动因素：换机周期拉长、二手与翻新扩容、零部件成本上涨、厂商放弃冲量转攻高端、中端配置全面升级。", "l": "Omdia / TechWeb", "u": "https://new.qq.com/rain/a/20260921A03A1O00"}]}, {"name": "广发证券（Jeff Pu）", "items": [{"t": "iPhone Duo 2026 出货由 700 万下调至 600 万台，铰链制约为唯一原因", "s": "9/16 至 9/17 研究指出为实现近乎无折痕，苹果采用强度为钛合金 2.5 倍的液态金属铰链、由超 100 个精密零部件组成，量产良率一度仅 30% 至 65%、近期提升至 60% 至 70% 仍不理想，临近发布时日产量仅数百台、首批备货预计 50 万至 100 万部。减产并非需求不足。同期维持 iPhone 18 Pro 与 Pro Max 合计约 7200 万台的产量预估。", "l": "广发证券 / 环球网科技", "u": "https://www.sohu.com/a/1076736029_99900743"}]}], "instsSummary": "①**Omdia**：2026 全球出货 -12% 至 10.97 亿部，但 ASP +27% 至 594 美元、总价值 +12%\n②**IDC**：Q2 全球出货 -7.4%、全年下调至 -13.9%；Q2 全球智能眼镜 354.7 万台 +35.3%\n③**Counterpoint**：在售机型全球均价涨约 15%、新机较上代高约 25%，超四成机型已调价\n④**广发证券（Jeff Pu）**：iPhone Duo 2026 出货下调至 600 万台，铰链良率仅六至七成", "topNews": [{"t": "9/23 高通骁龙峰会发布第六代骁龙 8 至尊版与超级至尊版：双双 2nm、最高主频 5GHz", "s": "两款平台均采用 2 纳米制程与 Oryon CPU，由两颗 5GHz 的 Prime 核心与六颗 4GHz 性能核心组成，统一搭配 X105 5G 调制解调器。至尊版 CPU 性能 力斯集团董事、副总裁", "items": [{"hl": "问界仍是鸿蒙智行大家庭的核心成员，华为终端持续参与赋能，含华量不会降低", "detail": "9/21引望官方声明后接受专访：赛力斯持有深圳引望10%股权、115亿元对价已全部结清，引望聚合华为智能车业务核心技术，问界将持续获得最新技术与供应保障；新模式下产品定义、设计、品牌营销、渠道零售、服务体系由赛力斯主导，已交付的120万用户既有权益与OTA升级不受影响；9/22三方发声被解读为技术不减、渠道不撤、权益不变", "u": "https://www.toutiao.com/article/7687873282913157674/", "l": "南方都市报"}]}, {"name": "徐钦松", "role": "华为终端有限公司中国区总裁", "items": [{"hl": "问界依然在鸿蒙智行体系内，2027年分网是渠道运营调整而非品牌切割", "detail": "内部讲话明确问界未退出鸿蒙智行，2027年1月1日起华为专营店分为专卖问界与销售其余四界（尊界、享界、智界、尚界）两类；华为同期重申不造车决议延续至2028年。市场反馈正面：9/22午后四界关联方股价全线异动，江淮汽车触及涨停、北汽蓝谷与上汽集团跟涨、奇瑞汽车港股一度涨超1%，赛力斯A股自9/16起连续四个交易日收涨", "u": "https://www.toutiao.com/article/7687858683593671214/", "l": "封面新闻"}]}, {"name": "项兴初", "role": "江汽集团董事长", "items": [{"hl": "继续坚定地和华为做好车、卖好车、服务好车，尊界合作方向不变", "detail": "9/20前后在尊界S800典藏大观与尊界V800安徽首批交付仪式上表态，回应市场对华为与赛力斯合作调整后其余四界前景的担忧；同期余承东在华为坂田基地与奇瑞汽车董事长尹同跃会面。资本市场解读：四界仍保留完整华为智选车模式，产品、品牌、渠道的含华量不变，行情持续性最终取决于新车交付量与盈利兑现", "u": "https://www.toutiao.com/article/7688273256486306365/", "l": "财联社"}]}, {"name": "雷军", "role": "小米集团创始人、董事长兼CEO", "items": [{"hl": "澎程车主35岁以上占比46%、增换购达80%，首销月10月7日收官后公布完整数字", "detail": "9/21晚露营地直播复盘澎程上市两周表现：亲赴徐州、上海、杭州、成都四城为102位首批车主交车，其中6位是小米手机最早一批用户；N90 Max电动迎宾踏板选装率100%、N70 Max为62%；用户画像较SU7/YU7整体年长5至10岁，三口之家与多孩家庭比例明显更高；正面回应9/8试驾误操作事故，称车主次日即完成锁单", "u": "https://news.qq.com/rain/a/20260922A02V3200", "l": "腾讯新闻"}]}, {"name": "何小鹏", "role": "小鹏集团董事长兼CEO", "items": [{"hl": "XOS 6.3.0全量推送，第二代VLA Lite同步上线，智驾能力从旗舰下放到单芯片车型", "detail": "9/22小鹏开启第二代VLA全新版本XOS 6.3.0全量推送：图灵VLA 2.0推送至Ultra及Ultra SE车型，Lite版本推送至单图灵Max车型，适配MONA L03、GX、2026款MONA M03、G6、G9、G9L、P7+、X9、G7及P7等车型；配合9/17上市的G9L（限时23.18万元起、图灵AI 2250TOPS、双向15°线控后轮转向），把高阶智驾从旗舰配置变成全系标配", "u": "https://www.sohu.com/a/1079613256_115060", "l": "搜狐科技"}]}, {"name": "李想", "role": "理想汽车董事长兼CEO", "items": [{"hl": "把自研马赫M100芯片装进独立主体独立融资，证明理想不止会造车", "detail": "9/22行业信息显示理想已成立芯创智核（上海）科技承载马赫M100芯片业务，拟以约150亿元估值独立融资，为云端芯片等第二曲线找钱并为芯片团队设置独立股权激励；此前已有芯片团队软件研发负责人金一华、前端设计一组负责人戴颉离职。H1交付193,472辆、收入486亿元同比-13.4%、净亏39.8亿元，截至美东9/21理想报11.52美元、近半年跌约33%", "u 。"}, {"tag": "应用毛利", "l": "彭博/华尔街见闻", "u": "https://www.toutiao.com/article/7688088394135519805/", "t": "**Harvey毛利率一度-50%**：应用层被迫自研模型", "s": "核心观点：估值156亿$的Harvey今年token用量增二十倍，毛利率由年初约50%跌至6月的-50%；8月改用月之暗面Kimi K3自训Tenet后成本仅一小部分、毛利转正，Decagon八成流量已走自有模型。**调用前沿模型的中间层毛利不可持续。**高层建议：【成本】产品线建单位任务token成本看板并设熔断线。【选型】中低频场景走开源自建。"}, {"tag": "降价陷阱", "l": "每日经济新闻/Artificial Analysis", "u": "https://www.toutiao.com/article/7687818309509415466/", "t": "**降价不等于降本**：单任务token反升四成", "s": "核心观点：9/14-9/20周榜V4.1 Flash以15.8T（+219%）登顶，中国模型67.46T连续21周超美国；但第三方实测其单任务输出约8.9万token、高于上一代的6.2万，输出冗长。**单价与单位任务成本是两条曲线。**高层建议：【验收】采购改用单任务端到端成本乘成功率。【工程】给输出加token预算，别把降价当降本。"}, {"tag": "发行定价", "l": "路透/Sergey Tereshkin", "u": "https://sergeytereshkin.com/publications/startup-and-venture-investment-news-september-22-2026", "t": "**Nscale递交招股书**：AI基建估值接受公开首考", "s": "核心观点：英国AI云商Nscale已递交招股书、拟以NSCL在纽交所上市，目标估值至多350亿$；2026上半年营收1.406亿$、净亏10.2亿$，剩余合同义务564亿$但过半收入来自单一客户。**重资产AI云由合同额与客户集中度共同定价。**高层建议：【融资】算力板块融资前须先降单一客户占比。【投资】把NSCL首月表现当估值锚。"}, {"tag": "算力周期", "l": "英伟达/摩根大通/美银", "u": "https://www.toutiao.com/article/7687931548473213463/", "t": "**2027年capex冲1.3万亿$**：短缺延续而非回落", "s": "核心观点：英伟达预测五大超大规模厂2026年数据中心capex近8000亿$、2027年升至1.3万亿$；摩根大通预计Cloud Capex 2026约9530亿$；Nebius年内二次涨价、累计超50%，美银FMS显示半导体远期PE压到15.8倍。**算力供不应求至少延续到2027。**高层建议：【采购】2027算力以长约锁量锁价。【财务】把涨价与利率计入TCO。"}, {"tag": "监管博弈", "l": "华尔街日报/CBS/IT之家", "u": "https://new.qq.com/rain/a/20260921A027IB00", "t": "**三巨头搁置行业出资监管**：自律之路被堵死", "s": "核心观点：WSJ 9/20披露扎克伯格、黄仁勋与马斯克持续游说，成功搁置哈萨比斯提出的行业出资设立AI监管机构方案；黄仁勋在CBS采访称2030年世界末日概率为零、减速主张缺乏科学依据，主张先执行产品责任与网络安全现行法。**行业自律方案已被否，监管只剩政府立法一条路。**高层建议：【合规】按加州与欧盟最严口径准备底座。【话术】对外避免协同降速表述，防反垄断风险。"}, {"tag": "能力前沿", "l": "OpenAI/腾讯研究院", "u": "https://www.sohu.com/a/1079182317_455313", "t": "**OpenAI组建数学顾问组**：百道难题被机器解开", "s": "核心观点：OpenAI在普林斯顿高等研究院设立独立数学与AI顾问小组，成员含维滕、高尔斯与海勒等九位数学家，不领薪、可公开发表意见；官方披露8/28起训练的内部模型已解决超100个长期开放数学问题，含纳维-斯托克斯千禧年难题。**科学发现正成为能力叙事的新战场。**高层建议：【研发】评估把内部工程与形式化验证环节交给模型。【品牌】宣传须标明弱化版本，避免信誉透支。"}, {"tag": "中国落地", "l": "央广网/艾媒咨询/IDC", "u": "https://www.cnr.cn/szfw/wqyq/20260921/t20260921_527820670.shtml", "t": "**搭子月环比增9倍**：智能体跨过生产临界点", "s": "核心观点：9/20百度智能云深圳站披露搭子用户规模月环比+9倍、交付物需求+4.3倍、专家套件+7.3倍，沈抖把任务拆为20%通用、30%专业、50%定制；艾媒预计中国AI智能体市场2026年1558亿元，IDC估活跃企业智能体由200万升至500万。**国内企业智能体已从试点跨入规模化交付。**高层建议：【组织】按20/30/50配置三类智能体预算。【考核】以交付物数量而非调用量衡量成效。"}, {"tag": "出海分账", "l": "财联社/里昂", "u": "https://www.chinastarmarket.cn/detail/2488871", "t": "**Kimi K3上架Bedrock与百炼**：分成出海跑通", "s": "核心观点：AWS旗下Amazon Bedrock接入开源模型Kimi K3供全球企业直接调用，与海外云厂商的收入分成合作正式落地，阿里云百炼同步上架并达成类似合作；里昂同日首选腾讯与阿里，预计全球公共云市场2028年翻倍至2.3万亿$。**中国模型出海从被下载转向在海外云上分账。**高层建议：【出海】模型收入优先谈云平台分账而非自建渠道。【KPI】以海外云上架数乘分成率衡量国际化。"}], "opinionLeaders": [{"name": "萨姆·奥特曼 (Sam Altman)", "role": "OpenAI CEO", "items": [{"hl": "9/21-22 被曝正开发对标 Grok Bot 的新功能并讨论推出个人助手抗衡 Muse；同日开发者实锤其 __obi 跨站追踪链。", "detail": "财联社 9/21 援引知情人士，OpenAI 正开发一系列直接对标 SpaceX 旗下 Grok Bot 的功能，管理层还讨论推出个人 AI 助手抗衡 Meta 的 Muse，预计不会从零搭建，而是改造 ChatGPT 与编程工具 Codex 中的现有智能体能力重新包装，相关技术储备自 GPT-5 起已具备。同日安全研究者披露 OpenAI 通过内部广告平台 bazaar 搭建完整跨站追踪链：用户打开 ChatGPT 时客户端先生成随机标识、带上与账号绑定的 JWT，再写入名为 __obi 的跨站 Cookie；此后只要访问接入其广告像素的第三方网站，站内浏览行为即被直接关联回 ChatGPT 账号，且并不要求用户曾在 ChatGPT 中输入相关内容，该发现冲上 HackerNews 热榜第三。", "l": "财联社/AIBase/腾讯研究院", "u": "https://www.sohu.com/a/1079182317_455313"}]}, {"name": "Dario Amodei", "role": "Anthropic 联合创始人兼 CEO", "items": [{"hl": "上市推迟至 11 月、目标估值约 2 万亿$，同时被曝与 OpenAI 曾密谈互测协议。", "detail": "华尔街日报披露 Anthropic 已把 IPO 由 10 月推迟至 11 月，目标估值约 2 万亿美元、募资至多 1000 亿美元，以便先向投资者展示第三季度财务表现；7 月年化营收已超 650 亿美元，英伟达或作为锚定投资者投入至多 100 亿美元。The Information 9/22 报道，OpenAI 与 Anthropic 今年早些时候一度接近签署具法律约束力的互测协议，双方将通过 API 访问对方已商业化模型、用各自安全评估体系交叉测试并承诺不留存数据，未发布模型不在范围内，是否最终签署尚不清楚；2025 年夏天双方曾互测，结论是 Anthropic 模型违规后更易否认，OpenAI 模型更易回答可能致害的问题。", "l": "华尔街日报/The Information/华尔街见闻", "u": "https://www.163.com/dy/article/L7DIS99005198NMR.html"}]}, {"name": "黄仁勋 (Jensen Huang)", "role": "英伟达创始人兼 CEO", "items": [{"hl": "9/20 CBS 采访称 AI 致末日概率为零，反对新增 AI 监管与全面对华禁售。", "detail": "黄仁勋在 CBS《周日早间》节目表示 2030 年成为世界末日的概率为 0%，称警告 AI 风险是吓唬人、不负责任，并认为阿莫代伊与奥特曼呼吁放缓发展缺乏科学依据；主张先执行产品责任法与网络安全法而非新设 AI 监管，认同特朗普行业无需额外约束的立场，称不要让末日叙事成为摆脱现有法律约束的理由。他强调能源、芯片、模型、数据与应用五层蛋糕都要发展，反对政府禁止美国科技产品出口中国，称每家芯片公司都应走向全球竞争；对加州即将表决的亿万富翁税表示不介意多缴数十亿美元税款。英伟达市值一度达 5.3 万亿$，其个人净资产约 1820 亿$。", "l": "CBS/IT之家/至顶科技", "u": "https://new.qq.com/rain/a/20260921A027IB00"}]}, {"name": "马克·扎克伯格 (Mark Zuckerberg)", "role": "Meta 董事长兼 CEO", "items": [{"hl": "Muse 一周登顶美国免费榜带动股价单日涨逾 11%，同时被曝游说搁置行业出资监管机构。", "detail": "Sensor Tower 口径 Muse 上周五取代 ChatGPT 登顶美国 iOS 免费榜并持续霸榜，上线六天下载超 90.2 万次、高于前代同期 77.3 万次；Meta 周一股价大涨 11.43%、单日市值增加约 1.29 万亿元人民币，AMD、英特尔与 Arm 等相关供应商最高涨 10% 至 16%。但亚马逊周日以隐私与安全风险为由禁止 Muse 访问其网站，Shopify 则宣布与 Meta 合作接入智能体结账。另据华尔街日报 9/20 报道，扎克伯格与黄仁勋、马斯克一道持续游说，成功搁置哈萨比斯提出的由行业出资设立 AI 监管机构的计划。", "l": "Sensor Tower/雅虎财经/华尔街日报", "u": "https://finance.yahoo.com/technology/ai/articles/amazon-kicks-metas-muse-split-213337096.html"}]}, {"name": "戴密斯·哈萨比斯 (Demis Hassabis)", "role": "Google DeepMind CEO", "items": [{"hl": "由行业出资设立 AI 监管机构的方案被三位 CEO 联手搁置；其团队把洪水预警覆盖到 150 国约 20 亿人。", "detail": "华尔街日报 9/20 披露，哈萨比斯提出的由行业出资设立一家 AI 监管机构的计划，因扎克伯格、黄仁勋与马斯克持续游说主张少管而被成功搁置，美国方面也一再释放不给本国 AI 发展踩刹车的信号。研究侧，Google Research 副总裁约西·马蒂亚斯披露其多智能体系统 AI Co-Scientist 仅用三天就推导出帝国理工团队多年才形成的细菌耐药性假说，团队还用 Gemini 从 20 年新闻中提取 260 万起突发洪灾训练预测模型，洪水预警已覆盖 150 国约 20 亿人；他同时表示 AI 正接管基础性入门工作，年轻研究者一出道就需具备过去十余年才能积累的提问与判断力。", "l": "华尔街日报/Google Research/至顶科技", "u": "https://www.163.com/dy/article/L7CRCQ3H05118UGF.html"}]}, {"name": "张鹏 (Peng Zhang)", "role": "智谱AI CEO", "items": [{"hl": "就 ZCode 代码仓库数据上传争议致歉整改并开源客户端，接受第三方审计。", "detail": "针对社区反馈的代码仓库数据上传争议，ZCode 团队完成整改并致歉，将客户端代码开源至 GitHub，并建立常态化漏洞反馈与奖励机制；v3.14.0 已移除 Repo Wiki 功能，切断本地仓库快照生成与上传链路，团队承诺社区提及的代码数据无留存、从未用于模型训练。中国信通院与绿盟科技审计确认，相关阿里云 OSS 存储桶内全部数据及存储桶本身均已删除，未发现可触发文件外发的功能路径。此前公司 9/18 上线 GLM-5.3-FlashX 并披露与境内外头部云厂商的收入分成协议将于 10 月起确认收入。", "l": "智谱/中国信通院/绿盟科技", "u": "https://www.sohu.com/a/1079182317_455313"}]}, {"name": "梁文锋 (Liang Wenfeng)", "role": "深度求索(DeepSeek) 创始人兼CEO", "items": [{"hl": "V4.1-Flash 以 15.8T 登顶 OpenRouter 周榜，但被指单任务输出 token 反而更高。", "detail": "每日经济新闻根据 OpenRouter 数据测算，9 月 14 日至 20 日 V4.1-Flash 周调用量达 15.8 万亿 Token、环比增长 219% 升至全球第一，中国大模型合计 67.46 万亿、连续 21 周超过美国（美国 14.21 万亿、环比下滑 34.7%）。该模型采用因果编码器—解码器结构，全局 KV Cache 降至 V4-Flash 的约四分之一，官方峰谷计价下缓存命中输入每百万 Token 仅 0.02 元。但第三方机构 Artificial Analysis 实测其平均每项任务使用约 8.9 万输出 Token、高于上一代 V4 Flash 0731 的约 6.2 万，评价其输出非常冗长，说明单价下降并不必然带来单任务成本下降。", "l": "每日经济新闻/Artificial Analysis/OpenRouter", "u": "https://www.toutiao.com/article/7687818309509415466/"}]}, {"name": "沈抖 (Dou Shen)", "role": "百度集团执行副总裁 / 百度智能云事业群总裁", "items": [{"hl": "9/20 深圳站披露搭子三项指标月环比数倍增长，提出企业任务的 20/30/50 分层。", "detail": "百度智能云超级智能体大会深圳站上，沈抖表示企业经营系统已先后经历信息数字化、流程软件化两个阶段，产业智能体将推动企业进入任务自主化的 3.0 阶段，智能体真正的生产力在于创造过去不可能的事情。他把企业任务拆解为三层：约 20% 的日常运营任务交给通用智能体，30% 的专业攻坚任务由专业智能体与专家套件完成，剩余 50% 直接关系企业核心经营的任务则需定制智能体深度嵌入业务规则、数据与流程。会上披露搭子用户规模月环比增长 9 倍、交付物需求月环比增长 4.3 倍、专家套件使用量月环比增长 7.3 倍。", "l": "央广网/百度智能云", "u": "https://www.cnr.cn/szfw/wqyq/20260921/t20260921_527820670.shtml"}]}, {"name": "Gabe Pereyra", "role": "Harvey 总裁兼联合创始人", "items": [{"hl": "披露公司 token 用量今年增长二十倍、毛利率一度跌至 -50%，被迫改用开源基座自训。", "detail": "彭博报道，估值 156 亿美元的法律 AI 独角兽 Harvey 长期以 OpenAI 模型为核心，今年 3 月智能体完成重大更新后用户使用量急剧攀升，毛利率由年初约 50% 断崖式下滑至 6 月的 -50%。Pereyra 表示此前应用表现高度依赖底层模型能力，付费购买最佳模型是必要选择，但成本重压下逻辑开始松动；公司今年 AI Token 使用量增长二十倍，若继续依赖 OpenAI 与 Anthropic 的高价模型不可持续。8 月 Harvey 发布基于月之暗面 Kimi K3 后训练的自有模型 Tenet，性能接近 Anthropic 最佳产品而成本仅为一小部分，毛利率已重新转正，但最困难任务仍需使用 Opus 级模型。", "l": "彭博/华尔街见闻", "u": "https://www.toutiao.com/article/7688088394135519805/"}]}, {"name": "约西·马蒂亚斯 (Yossi Matias)", "role": "Google Research 副总裁", "items": [{"hl": "称 AI 正接管基础性入门工作，判断力成为职场新人的出道门槛。", "detail": "马蒂亚斯表示 AI 正在接管基础性入门工作，年轻研究者一出道就需具备过去十余年才能积累的提问与判断力，研究生培养体系需随之变革。其团队的多智能体系统 AI Co-Scientist 仅用三天推导出帝国理工团队多年才形成的细菌耐药性假说，说明 AI 正在为整套科学方法打造工具；团队还用 Gemini 从 20 年新闻中提取 260 万起突发洪灾训练预测模型，洪水预警已覆盖 150 国约 20 亿人。他强调未来还需要 10 倍乃至 100 倍的架构创新，才能支撑这类科学智能体继续扩展。", "l": "Google Research/腾讯研究院", "u": "https://www.sohu.com/a/1079182317_455313"}]}], "leadersSummary": "①**黄仁勋定调不减速**：末日概率为零、反对新增监管，并成功搁置行业出资监管方案。\n②**扎克伯格靠Muse赢下C端**：六天90.2万下载登顶，单日市值增1.29万亿元。\n③**阿莫代伊IPO推至11月**：目标2万亿$，同时与OpenAI密谈互测协议。\n④**Pereyra揭应用层伤口**：token用量增二十倍、毛利率一度-50%，被迫自训模型。\n⑤**沈抖给出任务分层**：20%通用、30%专业、50%定制，搭子月环比增9倍。\n⑥**张鹏就ZCode致歉整改**，代码开源并接受信通院与绿盟审计。", "institutionViews": [{"name": "摩根大通 / 英伟达", "items": [{"s": "摩根大通汇总亚马逊、谷歌、微软、Meta、甲骨文及部分新型云服务商后预计，Cloud Capex 2026 年约 9530 亿美元、2027 年升至约 1.405 万亿美元、2028 年进一步约 1.548 万亿美元。英伟达口径：五大 AI 超大规模厂商 2026 年数据中心资本开支接近 8000 亿美元、2027 年升至 1.3 万亿美元，公司自身 FY27 营收增速指引仍在 70% 以上，FY27Q2 数据中心收入 890 亿美元、同比 +117%。【9/22更新】五大 CSP 2026 年 capex 指引区间为 7850 亿至 8100 亿美元；同期全球半导体板块 12 个月远期 P/E 已压到 15.8 倍、跌穿负一倍标准差（16.8 倍），估值与业绩上修方向背离。", "l": "摩根大通/英伟达/雪球", "u": "https://xueqiu.com/2972066573/409955184"}]}, {"name": "高盛 (Goldman Sachs) / Counterpoint", "items": [{"s": "26Q2北美四大云单季capex合计约1649亿美元、同比+86%：AWS 531亿、谷歌449亿、微软含融资租赁410亿、Meta 311亿，四家单季均创历史新高。Counterpoint：2026年四大科技巨头capex合计约7500亿美元、较2025年翻倍（亚马逊2200亿、Alphabet 1950-2050亿、微软约1900亿、Meta 1350-1450亿），已改由私募信贷、表外合资、主权基金与长期承购协议担保的债务支撑。【9/22更新】成本转嫁继续：算力云商Nebius自10月1日启动年内第二轮GPU涨价，H100由3.85涨至4.50美元/时（+17%）、H200由4.50涨至5.40（+20%）、B200由7.15涨至8.50（+19%）、B300由7.85涨至9.50（+21%），年内累计涨幅已超50%。", "l": "高盛/Counterpoint/金融界", "u": "https://www.toutiao.com/article/7687931548473213463/"}]}, {"name": "美银美林 (BofA) / 皮尤研究中心 (Pew)", "items": [{"s": "美银：中国四大云2026年capex约7260亿元人民币、2027年破万亿，MaaS与Token经济是变现主路径。【9/22更新】美银9月全球基金经理调查：综合情绪指标自8月高位滑落，机构现金头寸由3.5%回升至3.9%，最拥挤的多头交易已自我瓦解；尾部风险首位由「AI泡沫」变为美债收益率超预期上行（占比33%）与11月3日中期选举博弈。皮尤研究中心最新调查显示，37个国家中有34国民众预期AI将减少就业岗位，71%的美国人持此观点，AI的就业外部性正在成为监管与社会议题的主要压力源。", "l": "美银美林/皮尤研究中心", "u": "https://briefing.forwardfuture.ai/p/ai-oversight-copyright-battles-manus-4b-valuation"}]}, {"name": "里昂 (CLSA)", "items": [{"s": "【9/22新增】里昂9/21研报：Agentic AI正从实验走向企业工作流程、成为新一代基础设施层；中国AI模型正迅速收窄性能差距并凭成本效益抢占全球份额，企业由单纯追求模型能力转向兼顾性能、成本与部署弹性，多模型采用将成未来趋势。该行预期AI应用激增将点燃下一轮全球云端超级周期，全球公共云市场至2028年翻倍至2.3万亿美元、带来超过1万亿美元的年收入机会；看好结合自家芯片、模型、云基建、开发工具与应用的全栈云及AI供应商，认为软件、视频串流、到店服务、招聘与网上旅游较为脆弱，首选腾讯（高度确信跑赢大市）与阿里巴巴（跑赢大市）。", "l": "里昂/财联社", "u": "https://www.chinastarmarket.cn/detail/2488871"}]}, {"name": "IDC / 艾媒咨询", "items": [{"s": "【9/22更新】IDC数据显示国内活跃企业智能体数量正从2025年的近200万跃升至2026年预计500万；艾媒咨询《2026年中国AI办公智能体产业发展白皮书》预计中国AI智能体市场规模由2025年804亿元增至2026年1558亿元，智能体正从回答问题的辅助工具跨入交付结果的规模化临界点。此前9/18 IDC发布国内首份《中国企业级通用Agent产品技术评估》，对11款主流产品采用统一任务、统一模型与统一环境的实测口径，避免厂商自测口径带来的可比性偏差。", "l": "IDC/艾媒咨询/央广网", "u": "https://www.cnr.cn/szfw/wqyq/20260921/t20260921_527820670.shtml"}]}, {"name": "穆迪 (Moody's) / 监管动向", "items": [{"s": "中国头部科技企业2026-27年capex达1400-1650亿美元，较2025年约650亿美元翻倍，AI基建是主因。【9/22更新】监管同时加速与刹车：加州州长纽森9/18行政令要求州机构11/16前提交独立审计与前沿模型急停开关建议；参议员要求FTC调查亚马逊与沃尔玛聊天机器人如何展示美国制造商品；纽约时报诉微软与OpenAI案中，微软应用科学总监在9/17法庭文件中称生成式AI可能是人类史上最大的劳动盗窃。另据Coveo调研仅16%消费者愿让AI代为下单，麦肯锡估2030年美国AI介导零售收入最高可达1万亿美元。", "l": "穆迪/加州州长办公室/证券时报", "u": "https://www.stcn.com/article/detail/4192026.html"}]}], "instsSummary": "①**摩根大通把能见度拉到2028**：Cloud Capex 2026约9530亿$、2027约1.405万亿$。\n②**英伟达称2027升至1.3万亿$**，同期半导体远期PE压到15.8倍、背离业绩。\n③**美银FMS：尾部风险首位换成美债**，机构现金升至3.9%。\n④**里昂首选腾讯与阿里**，预计2028公共云翻倍至2.3万亿$。\n⑤**IDC/艾媒：活跃企业智能体200万→500万**，2026市场1558亿元。\n⑥**监管两头加压**：加州急停开关、FTC查聊天机器人、NYT版权案。", "topNews": [{"t": "亚马逊封杀Meta购物智能体Muse，**AI代购入口之争正式开打**", "s": "9/20起亚马逊禁止Meta的Muse在Amazon.com替用户购物，弹出「未经授权的AI智能体继续访问违反使用条件」提示；亚马逊称Meta既未告知也未获授权，指Muse浏览时不标识自己是AI、疑似留存客户凭证。此前亚马逊已对Perplexity、谷歌与OpenAI的购物智能体出手，而Shopify选择与Meta合作接入智能体结账。**平台正在把Agent的进门许可变成一项需要谈判的权利。**", "u": "https://www.theverge.com/tech/998078/amazon-blocks-meta-muse-ai-agent-shopping"}, {"t": "Muse登顶美国iOS免费榜，Meta单日市值增约**1.29万亿元**", "s": "Sensor Tower统计，Meta个人智能体Muse上周五取代ChatGPT登顶美国iOS免费榜并持续霸榜，上线六天下载超90.2万次、高于前代同期77.3万次；受此提振Meta周一股价大涨11.43%，AMD、英特尔与Arm等相关供应商最高涨10%至16%。**C端Agent的需求验证已完成，接下来拼的是谁能拿到交易入口。**", "u": "https://finance.yahoo.com/technology/ai/articles/amazon-kicks-metas-muse-split-213337096.html"}, {"t": "OpenAI与Anthropic曾密谈**互测协议**，AI安全走向同行交叉检验", "s": "The Information 9/22援引知情人士，两家公司今年早些时候一度接近签署具法律约束力的协议，互相通过API访问对方已商业化模型寻找安全漏洞，使用各自安全评估体系并承诺不留存测试数据，未发布模型不在范围内。2025年夏天双方曾互测：Anthropic模型违规后更易否认，OpenAI模型更易回答可能致害的问题。**外部交叉检验正在替代单纯的内部评估。**", "u": "https://www.163.com/dy/article/L7DIS99005198NMR.html"}, {"t": "法律AI独角兽Harvey**毛利率一度跌至-50%**，应用层加速自研模型", "s": "彭博报道，估值156亿$的Harvey今年AI token用量增长二十倍，毛利率由年初约50%跌至6月的-50%；8月发布基于月之暗面Kimi K3后训练的自有模型Tenet，性能接近Anthropic最佳产品而成本仅为一小部分，毛利率重新转正。Abridge、Decagon与Ramp相继跟进，Decagon已有八成流量走自有模型。**应用层的单位经济性正在被重新计算。**", "u": "https://www.toutiao.com/article/7688088394135519805/"}, {"t": "DeepSeek V4.1-Flash**15.8T登顶**，中国模型连续21周领跑", "s": "每日经济新闻据OpenRouter测算，9/14-9/20全球总调用量129万亿Token（+1.57%），中国模型67.46万亿（+10.28%）、美国14.21万亿（-34.7%），中国连续21周超美国；前五中四款来自中国，V4.1-Flash以15.8万亿（+219%）居首，GLM-5.3-Flash 14.1万亿、腾讯混元Hy4 preview 12.5万亿分列二三位。**但第三方实测其单任务输出token高于上一代，降价不等于降本。**", "u": "https://www.toutiao.com/article/7687818309509415466/"}, {"t": "黄仁勋驳斥AI末日论：**2030年世界末日概率为零**", "s": "英伟达CEO接受CBS采访时称，AI可能在数年内灭绝人类的说法是过度渲染的末日叙事，2030年成为世界末日的概率为0%，并称阿莫代伊与奥特曼呼吁放缓发展缺乏科学依据。他主张先执行产品责任与网络安全现行法律而非新设AI监管，反对全面对华禁售，强调能源、芯片、模型、数据与应用五层蛋糕都要发展。**算力供给方的立场与模型方首次公开分裂。**", "u": "https://new.qq.com/rain/a/20260921A027IB00"}, {"t": "英国AI云商Nscale递交招股书，目标估值**至多350亿美元**", "s": "Nscale已向SEC递交IPO招股书、拟以NSCL在纽交所挂牌，承销商为高盛、摩根大通与摩根士丹利，目标募资至多30亿$、估值至多350亿$（3月C轮时为146亿$）。2026上半年营收由上年同期1040万$增至1.406亿$，净亏损扩大至10.2亿$；剩余合同义务564亿$，但过半收入来自单一客户，并获英伟达可转债。**重资产AI云的公开定价将首度接受检验。**", "u": "https://sergeytereshkin.com/publications/startup-and-venture-investment-news-september-22-2026"}, {"t": "微软用AI智能体把Copilot运行时重写为Rust，**性能提升15.9倍**", "s": "微软杰出工程师Stephen Toub披露，公司用AI智能体把GitHub Copilot运行时43万行TypeScript全量移植为80万行生产级Rust，横跨135个版本、14.5周，平均每天开1.3个PR，token成本约12万美元；单轮会话生命周期吞吐由每秒7.55提升到120，10个客户端内存占用由1383MB降到126MB。但他提醒最难的session.ts迁移用了25小时、冒出数十个回归bug。**编译通过不等于正确。**", "u": "https://www.sohu.com/a/1079182317_455313"}, {"t": "百度智能云深圳站：搭子用户规模**月环比增9倍**", "s": "9/20百度智能云超级智能体大会深圳站披露，搭子用户规模月环比增长9倍、交付物需求增长4.3倍、专家套件使用量增长7.3倍；沈抖把企业任务拆为20%通用、30%专业、50%定制三层。艾媒预计中国AI智能体市场2026年达1558亿元，IDC估国内活跃企业智能体由2025年近200万升至2026年500万。**企业智能体跨过从试点到规模化交付的临界点。**", "u": "https://www.cnr.cn/szfw/wqyq/20260921/t20260921_527820670.shtml"}, {"t": "2026云栖大会开幕：阿里把**芯片、模型、云与Agent**放进同一张商业账", "s": "9/22-24云栖大会在杭州举行，主题「智以致用」，设3大主论坛4场与12 不要沿用3nm成本模型做定价。", "l": "通信世界/雪球 9/21", "u": "https://xueqiu.com/7539058388/409944394"}, {"t": "费半单日涨5.29%，**资金在加息周期里独立定价存储**", "s": "核心观点：美东9月21日收盘，费城半导体指数涨5.29%、纳指涨2.26%创收盘新高27122.09点，ARM涨17.16%、英特尔涨12.14%、AMD涨9.95%市值首破1万亿美元、高通涨9.29%、美光涨2.77%。**加息与油价重挫没能压制半导体，产业逻辑压过宏观**。高层建议：把海外费半与存储板块走势作为2027年采购谈判的情绪参照，避免在情绪高点锁长约。", "l": "中新经纬/今日头条 9/22", "u": "https://www.toutiao.com/article/7688107125201125890/"}, {"t": "CoWoS缺口15%-20%，**封装从配套环节变成咽喉环节**", "s": "核心观点：2026年全球先进封装市场约522亿美元、占整体封装比重首破54%，2027年约572亿美元；CoWoS年需求80万-85万片，台积电与OSAT满载仍留1.5万-2万片月缺口，产能由2025年7.5万-8万片提至2026年底12万-14万片、2027年约20万片，CoWoS-L四季度占比升至约75%。**AI芯片交付卡口已从制程转到封装**。高层建议：2027年算力与高端平台排产按封装产能倒排。", "l": "Yole/东方财富 9/21", "u": "https://caifuhao.eastmoney.com/news/20260921104215878099760"}, {"t": "韩国半导体出货量增259.4%，**存储景气进入业绩兑现期**", "s": "核心观点：韩国海关数据，9月1日至20日出口同比增78.3%至714亿美元、创同期历史最高，其中半导体出货量增长259.4%、芯片占出口总额升至47.8%；9月21日三星电子股价大涨5%、创两周最大单日涨幅。**出口与股价形成正反馈，存储超级周期正从报价转向财报**。高层建议：以10月三星与SK海力士三季报作为2027年内存预算的最终校验点。", "l": "财闻/网易财经 9/21", "u": "https://www.163.com/dy/article/L7BL0ONA0550WHYR.html"}, {"t": "Solidigm赴美建NAND厂，**存储产能开启地理重构**", "s": "核心观点：SK海力士旗下Solidigm正评估在美国东海岸建设首座NAND前端晶圆厂，公司回应称仍在审视多方案；同时大连二厂在停工约四年后重启，设备最早11月进场、2027上半年量产，月投片约5万片，大连基地总产能由10万片升至约15万片/月。**NAND产能正从单点集中转向中美双基地**。高层建议：2027年企业级SSD与QLC采购可就美国产线与大连产线分别议价。", "l": "KED Global/IT时代网 9/20", "u": "https://dy.163.com/article/L782NUVP05527PMU.html"}, {"t": "光刻胶涨价倒逼国产导入，**验证进度比价格更关键**", "s": "核心观点：日系三大厂10月1日起全球提价15%，倒逼晶圆厂加快导入国产胶：彤程新材上半年半导体光刻胶及配套试剂营收2.86亿元、同比近增50%，ArF与BARC增幅接近300%；鼎龙股份300吨KrF/ArF产线投产、年产能330吨，8款高端胶批量供货、上半年获近1000加仑订单。**国产替代已从能用走向放量**。高层建议：把国产光刻胶验证节点纳入供应链安全看板按月跟踪。", "l": "中财网/今日头条 9/21", "u": "https://www.cfi.net.cn/p20260921000270.html"}, {"t": "内存支出占AI资本开支翻五倍，**需求侧被重新定价**", "s": "核心观点：瑞银估算2026年全球AI资本支出约9980亿美元，其中内存支出由710亿美元跃升至3670亿美元；摩根士丹利预计三季度成熟制程DRAM价格涨50%、四季度再涨10%；集邦数据显示存储在手机物料成本中的占比已由一成左右升至约40%。**AI投资的重心正从算力芯片移向存储**。高层建议：2027年整机成本模型按存储占四成重算，重新评估配置与售价。", "l": "瑞银/摩根士丹利/东方财富 9/21-9/22", "u": "https://caifuhao.eastmoney.com/news/20260922040742636977150"}, {"t": "现货出现分化，**存储涨势从普涨收窄为结构性**", "s": "核心观点：9月21日集邦现货，DDR5 16Gb均价56.933美元、单日涨1.67%，DDR4 16Gb跌0.88%至85.00美元、DDR4 8Gb持平46.036美元；NAND现货持续疲弱，eMMC 64G跌至27.958美元、128G跌至31.371美元。**DRAM强、NAND弱的剪刀差进一步扩大**。高层建议：DRAM继续锁长约，NAND与eMMC保留现货敞口并按季度议价。", "l": "集邦咨询 TrendForce 9/21", "u": "https://www.dramexchange.com/WeeklyResearch/Post/3/12844.html"}, {"t": "骁龙峰会今日开幕，**2nm双平台把旗舰成本再推高一档**", "s": "核心观点：9月22日至24日骁龙峰会在夏威夷举行，首日发布骁龙8 Elite Gen6双平台SM8950与SM8975，均采用台积电2nm，官方口径性能提升约18%、功耗降低约36%，Pro版配Adreno 850与LPDDR6、主频接近5GHz，单颗成本传闻突破300美元，小米18系列将首发。**安卓旗舰进入2nm成本定价阶段**。高层建议：2027年旗舰定价需为2nm与存储双重涨价预留空间。", "l": "全天候科技/Industry Wired 9/22", "u": "https://industrywired.com/artificial-intelligence/snapdragon-summit-2026-new-qualcomm-chips-ai-xr-take-center-stage-12557754/amp"}], "opinionLeaders": [{"name": "长鑫存储 CXMT", "role": "国产存储工艺", "items": [{"hl": "G5平台量产后，24GB LPDDR5X全面进入国产主流旗舰手机", "detail": "9/20世界制造业大会宣布第五代DRAM平台量产：四重曝光把有源区半间距微缩至11.95nm、电容深宽比45:1、核心区高度6762nm，每片晶圆裸片产出较第四代提升至少50%，两款24Gb LPDDR5X规模量产。9/21澎湃新闻与21世纪经济报道跟进称国产存储已进入主流竞争阶段，天风证券判断本轮景气由需求结构变化与供给理性扩张共同支撑。2026上半年营收1503.1亿元、毛利率84.84%、归母净利776.05亿元。", "l": "长鑫科技/澎湃新闻/21世纪经济报道 9/20-9/21", "u": "https://www.163.com/dy/article/L7BE9UFF05199NPP.html"}]}, {"name": "三星电子 Samsung", "role": "HBM 产能节奏", "items": [{"hl": "2027年HBM4与HBM4E产量至少翻倍，HBM总产能升至约25万片/月", "detail": "9/20首尔经济日报：玻璃载板外协清洗量由今年2万片/月增至明年5万片/月(去年1万片)，物料2.5倍增幅对应HBM4系列产量翻番；HBM总产能由约18万片/月增至约25万片/月，HBM4系列占出货比重由约40%升至约80%。第六代1c DRAM配4nm基础裸片已于2月量产HBM4，5月向英伟达等交付12层HBM4E样品，HBM4速度达11.7Gbps、HBM4E每引脚16Gbps。", "l": "首尔经济日报/ZAKER科技 9/20-9/21", "u": "https://en.sedaily.com/finance/2026/09/20/samsung-to-double-hbm4-output-next-year-sources-say"}]}, {"name": "摩根士丹利 (中国半导体设备与价格 9/19-9/22)", "role": "设备支出与管制", "items": [{"hl": "2027、2028年中国设备支出持续增长，成熟制程DRAM四季度再涨10%", "detail": "预计长鑫2026至2028年每年新增约10万片/月DRAM产能，整体由2025年18万片/月升至2028年50万片/月；长江存储2026年新增约3.5万片/月、2027与2028年各约10万片/月。MATCH Act若实施将覆盖浸没式DUV、TSV沉积与刻蚀、低温刻蚀、钴沉积，并延伸至设备安装、校准、维修与固件更新。9/22补充：预计三季度成熟制程DRAM价格涨50%、四季度再涨10%。", "l": "摩根士丹利/腾讯新闻/东方财富 9/19-9/22", "u": "https://news.qq.com/rain/a/20260919A0028N00"}]}, {"name": "美光科技 高管 Sadana", "role": "存储供需节奏", "items": [{"hl": "全球存储供需失衡格局大概率持续至2028年之后", "detail": "美光公开判断高端晶圆厂与洁净室建设周期漫长，本轮上行并非季度级反弹而是数年维度的结构性缺口；长期供货协议、联合研发以及端侧AI与机器人需求将重塑存储商业模式。9/22机构纪要重申该口径，并将其作为判断存储周期位置的核心锚。FY26Q4财报定于9/30发布，是HBM定价与出货量的下一个可验证读数。", "l": "美光/雪球机构纪要 9/17-9/22", "u": "https://www.xueqiu.com/3805643207/410108909"}]}, {"name": "英伟达 CEO 黄仁勋(Jensen Huang)", "role": "AI 芯片需求", "items": [{"hl": "明年芯片销量将是今年两倍，HBM与先进封装缺口难收敛", "detail": "9/17公开场合重申需求强度，HBM与先进封装需求预期随之上修；9/21美股费城半导体指数涨5.29%、纳指创收盘新高，AI算力叙事重新主导定价。对供应链的含义是：2027年HBM与CoWoS缺口仍难收敛，先进封装成为交付卡口。", "l": "财联社/中新经纬 9/17-9/22", "u": "https://www.toutiao.com/article/7688107125201125890/"}]}, {"name": "英特尔 CEO 陈立武(Lip-Bu Tan)", "role": "代工与 CPU 供给", "items": [{"hl": "CPU仅能满足前沿客户约五成需求，18A已量产、14A明年一季度投产", "detail": "9/17表示Panther Lake的18A良率已达约80%；9/21美股英特尔单日涨12.14%、居费半涨幅前列，反映代工与客户端供给改善预期被重新定价。对集团含义：x86客户端供给在2027年前仍偏紧，采购需提前锁量。", "l": "陆家嘴财经早餐/中新经纬 9/17-9/22", "u": "https://www.toutiao.com/article/7688107125201125890/"}]}, {"name": "高通 CEO 安蒙(Cristiano Amon)", "role": "手机 SoC / 代工策略", "items": [{"hl": "9/22发布2nm双平台，性能提升约18%、功耗降低约36%", "detail": "骁龙峰会9月22日至24日在夏威夷举行，首日发布骁龙8 Elite Gen6标准版SM8950与Pro版SM8975，均为台积电2nm：Pro版配Adreno 850、18MB图形内存与LPDDR6、主频接近5GHz，标准版配Adreno 845与LPDDR5X，两者均支持UFS 5.0。供应链称Pro版单颗成本突破300美元，小米18系列首发。", "l": "全天候科技/Industry Wired 9/22", "u": "https://industrywired.com/artificial-intelligence/snapdragon-summit-2026-new-qualcomm-chips-ai-xr-take-center-stage-12557754/amp"}]}, {"name": "集邦咨询 TrendForce", "role": "报价与份额", "items": [{"hl": "9/21现货DRAM强NAND弱，存储在手机物料成本占比升至约40%", "detail": "9/21现货：DDR5 16Gb均价56.933美元、单日涨1.67%，DDR4 16Gb跌0.88%至85.00美元、DDR4 8Gb持平46.036美元；NAND与eMMC在卖压下继续走弱。集邦此前口径：2027年长期协议占总产能将达68%、两年增近5倍，上半年NOR Flash合约价累计上涨100%-120%；存储占手机物料成本比重由一成左右升至约40%。", "l": "集邦咨询 TrendForce 9/16-9/21", "u": "https://www.trendforce.cn/price"}]}, {"name": "华为 轮值董事长 汪涛", "role": "AI 芯片路线图", "items": [{"hl": "昇腾960提前就绪，960DT将于2027年一季度发布、 美元", "note": "9/21-9/22：2026年全球AI资本支出约9980亿美元，内存支出翻五倍以上；存储在手机物料成本占比由一成升至约40%"}, {"cat": "长存 产能", "name": "长江存储 武汉三期", "share": "2026年底投产", "note": "9/19-9/22 研报：一二期满产，26Q1营收470.42亿元(+393.38%)、归母333.79亿元、毛利率76.77%、净利率71.18%；IPO拟募330亿元"}, {"cat": "NAND 产能布局", "name": "Solidigm 大连基地", "share": "10万→15万片/月", "note": "9/20-9/21：大连二厂停工约四年后重启，设备最早11月进场、2027上半年量产；同时评估在美国东海岸建首座NAND前端晶圆厂"}]}}, "macro": {"updateTime": "2026-09-22 08:00", "asOf": {"note": "口径提示：PMI、进出口与 CPI/PPI 为 2026 年 8 月数据；社会消费品零售、规模以上工业增加值与固定资产投资为 2026 年 8 月数据（9 月 15 日发布）；全社会用电量为 2026 年 7 月数据、规模以上工业企业利润为 1—7 月累计（8 月数据分别于 9 月下旬与 9 月 27 日前后发布）。", "pmi": "2026-08", "trade": "2026-08", "cpi": "2026-08", "retail": "2026-08", "profit": "1—7月累计", "power": "2026-07", "invest": "1—8月累计"}, "brief": {"window": "数据窗口 2026-08-16 → 2026-09-16　|　聚焦消费电子 / 汽车消费 / 进出口 / AI 与信息通信产业链", "lead": "宏观温度：**外需高热、生产回暖、内需偏冷、成本上行**——经济呈明显 **K 型分化**：8 月社零仅 **+0.4%**、1—8 月固投 **-7.2%**，而出口 **+19.8%**、高技术制造业增加值 **+16.7%**、通讯器材类零售 **+27.3%**。增长几乎全部由 **AI 电子链 + 出口** 贡献。对终端业务：机会在「AI 换机 + 出口」，风险在「BOM 成本 + 汽车生态」。", "conclusions": ["**增长已高度集中于「AI 电子链 + 出口」一条线，宏观总量口径失真。**8 月出口 +25.0%、1—7 月电子行业利润 **+110%**（单独拉动全部规上工业利润 **9.3 个百分点**），而汽车制造 **-20.4%**、黑色冶炼 -51.2% 仍在深跌——**不能用「工业利润 +17.6%」推导终端需求，必须按 AI 电子链与传统制造链分别设定目标**。", "**成本上行已获官方价格指数确认，且涨价开始向终端传导。**8 月工业生产者购进价格 **+5.8%** 高出出厂价格 **+3.8%** 两个百分点，**计算机通信电子设备制造业出厂价同比 +5.3%、环比 +0.6%**，集成电路进口均价 **+72.2%** 而出口量 -7.9%——**2027 上半年 BOM 成本仍将上行，但终端已打开提价空间，定价与锁量动作必须前移**。", "**内需只有 AI 终端一条增量，且已连续 4 个月加速。**8 月限额以上通讯器材类社零 **+27.3%**（较 7 月加快 6.9 个百分点，1—8 月 +16.3%），而汽车 **-18.5%**、社零总量仅 **+0.4%**；M2 7.5%、社融 7.2% 但对实体经济贷款增速降至 **5.0%**、前 8 个月贷款少增 **2.71 万亿元**——**机会在「AI 换机 + 出口 + 算力网项目」，不在总量刺激**。"], "implications": [{"h": "① 成本与定价：提前锁价锁量", "c": "存储/芯片「量缩价涨」未结束，集成电路进口均价 **+72.2%** 已开始向下游报表传导。建议 **2027H1 关键器件提前锁量锁价**，并把涨价因子前置进 Q4 新品定价模型，避免毛利被动侵蚀。"}, {"h": "② 产品与营销：押注 AI 终端", "c": "手机 / 平板 / PC 是内需唯一两位数增长且能提价的品类，8 月通讯器材类 **+27.3%**、连续 4 个月加速，**可穿戴智能设备与高能效等级家电零售额延续快速增长**。建议把 **AI 手机 / AI PC / 智能穿戴** 作为 2027 年产品与营销资源主战场，主打「AI 体验」而非参数。"}, {"h": "③ 渠道与生态：重估车 / 家电协同", "c": "汽车类社零 8 月 **-18.5%**（降幅再扩 1.5 个百分点），家电音像 **+2.3%** 在去年高基数上刚由负转正。建议**下调车机协同目标、暂缓汽车渠道资源加码**，家电按「结构性回暖」而非「全面复苏」配置；同时把主推资源继续向通讯器材（**+27.3%**）与全屋智能倾斜。"}, {"h": "④ 政策红利：对接「六张网」与两重清单", "c": "发改委推进算力网 + 新型电网 + 新一代通信网 **「2+3+N」** 协调机制，媒体披露算力网投资量级达 **4 万亿元**。终端与计算业务应对接重大项目清单，争取**政企与行业侧的算力/终端组合方案**落地。"}, {"h": "⑤ 供应链：警惕 2027 价格回落风险", "c": "集成电路 8 月出口额 **+129.8%** 但出口量 -7.9%，纯价格驱动。**高价备货需设置安全库存上限与跌价准备**，避免周期反转时形成呆滞库存。"}, {"h": "⑥ 出口：AI 硬件是当下最强 Beta", "c": "8 月计算机产品出口首破 **300 亿美元**、集成电路首破 **400 亿美元**，双双创历史新高。海外市场资源应优先配置到 **AI 终端与高附加值硬件**，借全球 AI 投资热潮放大出口弹性。"}], "gauge": [{"n": "外需 / 出口", "v": "高热", "s": "出口连续 4 个月两位数，机电出口创历史新高", "p": 88}, {"n": "AI 与电子产业链", "v": "高热", "s": "电子行业利润 +110%，集成电路 +18.5 倍", "p": 92}, {"n": "工业生产", "v": "中温", "s": "8 月 PMI 49.8% 回升，工业增加值 +5.2%（加快0.7pct）", "p": 56}, {"n": "内需消费", "v": "偏冷", "s": "社零仅 +0.4%，汽车 -18.5%，仅通讯器材 +27.3%", "p": 28}, {"n": "价格 / 成本", "v": "升温", "s": "PPI +3.8%、购进 +5.8%，芯片进口均价 +72.2%", "p": 78}, {"n": "货币金融", "v": "宽松", "s": "M2 7.5%、社融 7.2%，但对实体贷款降至 5.0%", "p": 58}]}, "headlineViewpoints": [{"tag": "中美经贸", "t": "中美纽约磋商首谈AI、元首将访美：**2027年出口链变量从订单转向关税与AI规则**", "s": "核心观点：9/20 何立峰与贝森特、格里尔在纽约举行经贸磋商，**首次就人工智能议题**对话；习近平将于 **9/23—25** 对美进行国事访问，系 11 年来首次。<b class=\"hl-red\">关税休战与对等降税框架进入元首外交窗口，出口链风险溢价有望下修。</b>高层建议：2027 年海外产能与出口报价按「关税延续 + AI 管制不松动」两套情景做预案。", "l": "中国政府网 / 新华社（9/20）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081636.htm"}, {"tag": "战略定位", "t": "先进制造业大会+电子信息十五五规划：**国家把终端硬件锁定为工业第一支柱**", "s": "核心观点：9/16—17 先进制造业大会传达习近平重要指示——坚持**智能化、绿色化、融合化**，李强要求纵深开展「人工智能+制造」；9/15 工信部、发改委发布《电子信息制造业发展「十五五」规划》，**2030 年营收 30 万亿元**、研发强度 **3.5%**。<b class=\"hl-red\">战略与规划双重锁定：终端硬件是「十五五」工业第一支柱。</b>高层建议：2027 年路线图对表「人工智能+制造」，按规划专栏争取消费电子创新专项。", "l": "全国先进制造业大会 / 工信部、发改委", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081384.htm"}, {"tag": "量价分化", "t": "社零+0.4%而通讯器材+27.3%、IC出口量-7.9%：**这轮景气靠价格不靠量**", "s": "核心观点：8 月社零同比仅 **+0.4%**，1—8 月固投 **-7.2%**；但限额以上**通讯器材类 +27.3%**。价格端 PPI **+3.8%**，手机 / 平板 / 存储同比 **+11.0% / +21.5% / +19.6%**，集成电路出口量 **-7.9%**。<b class=\"hl-red\">量缩价涨叠加总量磨底：景气来自 AI 涨价再分配而非消费扩张。</b>高层建议：2026H2 定价由保份额切到保毛利，2027 年资源压向通讯器材与全屋智能。", "l": "国家统计局 / 海关总署", "u": "https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html"}, {"tag": "稳投资", "t": "8000亿准财政开闸、六张网五年26万亿：**稳投资主战场已从房地产换到算力与通信网**", "s": "核心观点：9/17 首批 **8000 亿元**新型政策性金融工具资金加快投放，规模较去年 **5000 亿元**扩容，测算撬动项目总投资约 **10 万亿元**；9/16 平陆运河建成通航，「六张网」五年投资约 **26 万亿元**。<b class=\"hl-red\">固投 -7.2% 而准财政与六张网逆势加码，稳投资主战场已换成算力网与通信网。</b>高层建议：2027 年政企与行业方案对接口径对准算力枢纽、源网荷储与新一代通信网三类项目。", "l": "国家发展改革委 / 政策性银行", "u": "https://jingji.cctv.cn/2026/09/17/ARTIvwgLQDw13pbCH99aZHoh260917.shtml"}, {"tag": "利率锚", "t": "LPR连续16个月不动、美联储转加息：**2027年促销不能再等降息**", "s": "核心观点：9/20 LPR 1年期 **3.0%**、5年期以上 **3.5%**，连续 **16 个月**持平；9/16 美联储加息 25bp 至 3.75%—4%，外部转紧而政策利率稳在 **1.4%**。前 8 月股债融资占社融增量 **50.31%** 首超贷款。<b class=\"hl-red\">贷款降速提质叠加政策利率不动：信用扩张换了渠道，价格短期也不会降。</b>高层建议：2027 年资金筹措切到股权+债券，促销由等降息转向吃透以旧换新 15% 补贴。", "l": "中国人民银行", "u": "https://www.cnr.cn/jingji/ycbd/20260920/t20260920_527819128.shtml"}], "opinionLeaders": [{"name": "中美经贸磋商", "role": "中美经贸高层对话与人工智能议题沟通", "items": [{"hl": "9 月 20 日中美经贸磋商在美国纽约举行：中方牵头人、国务院副总理何立峰与美方牵头人、财政部长贝森特和贸易代表格里尔围绕落实历次经贸磋商共识、促进双边贸易投资深入交流，并首次就人工智能有关问题举行对话", "detail": "双方以两国元首重要共识为引领，秉持相互尊重、和平共处、合作共赢原则，就落实历次经贸磋商共识、促进双边贸易投资等共同关心的重要经贸问题进行了坦诚、深入、富有建设性的交流。据公开报道本轮磋商时长约 8 小时，议题涵盖关税与对等降税安排延期、市场准入、关键矿产供应链，并首次正式把人工智能纳入磋商议程；美方明确先进 AI 芯片与半导体制造设备的出口管制不在此次对话机制范围内。后续铺垫：9/21 外交部宣布习近平应特朗普邀请将于 9/23—25 对美国进行国事访问，为 11 年来首次、中美元首半年内互访。对 2C 的落点：关税休战与对等降税框架进入元首外交窗口，手机 / PC / 平板等出口链风险溢价有望下修；但先进制程与高端存储的对华管制不在议程内，2027 年供应链预案仍须按「关税缓和 + 管制不松动」两套情景并行准备。", "l": "中国政府网 / 新华社（9/20）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081636.htm"}]}, {"name": "全国先进制造业大会", "role": "宏观经济与产业政策顶层部署", "items": [{"hl": "习近平就发展先进制造业作出重要指示：坚持智能化、绿色化、融合化方向，持续做大做强先进制造业，提升产业链自主可控水平，加快构建以先进制造业为骨干的现代化产业体系", "detail": "全国先进制造业大会 9 月 16—17 日在京召开，会上传达重要指示，李强出席并讲话、张国清作总结讲话。李强要求顺应新一轮科技革命和产业变革趋势，以新一代智能制造为主攻方向，发展策略上更加注重数智赋能、技术路线上更加注重高端自主、生产方式上更加注重绿色低碳、场景业态上更加注重跨界融合；聚焦重点领域综合施策，打造产业创新驱动引擎、加快新兴产业规模应用、加强未来产业前瞻布局、推动传统产业焕新升级，纵深开展「人工智能+制造」行动，加大对 企业 数智化转型引导支持力度、夯实智能软硬件基础，推动先进制造业和现代服务业深度融合、创新发展服务型制造。", "l": "全国先进制造业大会（9/16—17）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081384.htm"}]}, {"name": "国家统计局", "role": "国民经济核算与价格、工业、贸易统计", "items": [{"hl": "《统计改革发展「十五五」规划》（9/16 印发）：缩短 CPI 基期轮换周期、将反映消费新业态新模式的商品和服务及时纳入 CPI 统计调查，优化 PPI 基期轮换并推进编制基于生产流阶段的 PPI", "detail": "全文 8 部分 44 条。与 2C 直接相关：加强全口径消费统计，健全服务消费统计、完善网上零售统计与消费新业态新模式统计监测；完善智能经济统计监测制度，强化对人工智能相关新兴领域的统计监测；实施数字经济和平台经济增加值核算制度并定期开展数据核算；加强工业战略性新兴产业统计、更新工业战略性新兴产业分类目录；完善投资领域统计，加强计算机软件和数据库投资统计调查；完善老龄事业和银发经济统计监测制度。目标是 2035 年基本建成与国家治理体系和治理能力现代化相适应的现代化统计调查体系。", "l": "《统计改革发展「十五五」规划》（9/16 14:10）", "u": "https://www.stats.gov.cn/xw/tjxw/tzgg/202609/t20260916_1965340.html"}, {"hl": "8 月规上工业增加值同比 +5.2%（比上月加快 0.7 个百分点）、环比 +0.54%，高技术制造业 +16.7%、装备制造业 +12.1%；1—8 月工业增加值 +5.3%", "detail": "8 月社零 39824 亿元、同比 +0.4%（环比 -0.13%），1—8 月 327569 亿元、+1.1%，其中除汽车以外消费品零售额 +2.7%；限额以上通讯器材类 8 月 +27.3%、1—8 月 +16.3%，家用电器和音像器材类 8 月 +2.3% 但 1—8 月 -5.6%，汽车类 8 月 -18.5%。1—8 月固投 293092 亿元、-7.2%，扣除房地产 -4.2%；房地产开发投资 -19.9%、新建商品房销售面积 -12.1%，而二手房交易网签面积 +10.6%；高技术产业投资 +5.2%（信息服务 +22.7%、电子及通信设备制造 +6.9%）。8 月进出口 46455 亿元、+19.8%（出口 +18.6%、进口 +21.7%）。城镇调查失业率 5.3%。锂离子电池、工业机器人、3D 打印设备产量分别 +57.2%、+34.6%、+29.9%。", "l": "8 月份国民经济运行情况（9/15 10:00）", "u": "https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html"}]}, {"name": "中国人民银行", "role": "货币政策与金融统计", "items": [{"hl": "9 月 21 日召开外资金融机构座谈会，潘功胜表示央行将实施好适度宽松的货币政策，继续推动金融高水平开放、稳步扩大金融市场双向开放", "detail": "美国银行、摩根大通银行等 15 家外资金融机构负责人参会并发言。潘功胜介绍当前中国经济金融形势和货币政策实施情况，表示中国经济运行总体平稳向好、结构持续优化，央行将实施好适度宽松的货币政策，为经济稳定增长和金融市场平稳运行营造良好的货币金融环境；继续推动金融高水平开放，持续完善政策供给，稳步扩大金融市场双向开放，不断优化跨境支付服务、更加便利人民币国际使用。同期市场面：9/21 人民币对美元中间价报 6.7487、调高 34 点，为连续第 9 个交易日调升，创 2023 年以来最长连涨；9/18 在岸与离岸人民币一度触及 6.70 关口。对 2C 的落点：人民币走强压缩出口链汇兑收益、但降低进口芯片与存储元器件的采购成本，2027 年海外报价与采购锁汇节奏需同步调整。", "l": "中国人民银行（9/21）", "u": "http://www.pbc.gov.cn/"}, {"hl": "9 月 20 日授权全国银行间同业拆借中心公布 LPR：1 年期 3.0%、5 年期以上 3.5%，连续 16 个月保持不变", "detail": "定价基础未变：7 天期逆回购操作利率自 2025 年 5 月下调至 1.4% 后一直维持，9 月以来 DR001 均值较上月小幅上行、1 年期 AAA 级同业存单到期收益率略有走高，商业银行货币市场批发融资成本上升。截至 2026 年二季度末商业银行净息差 1.41%，较一季度回升 1BP（2022 年一季度以来首次回升）但仍处历史低位，报价行缺乏主动下调 LPR 加点的动力。8 月新发放企业贷款加权平均利率略低于 3%、个人住房贷款约 3.1%。9 月 16 日美联储加息 25bp 至 3.75%—4%，为 2023 年 7 月以来首次；机构判断国内货币政策仍将坚持适度宽松、以我为主，后续 LPR 大概率随政策利率而动。", "l": "中国人民银行", "u": "https://www.cnr.cn/jingji/ycbd/20260920/t20260920_527819128.shtml"}, {"hl": "9 月 16 日《求是》第 18 期刊发潘功胜署名文章《深刻认识中国金融结构变迁 提升金融服务实体经济适配性》：持续优化货币政策中间变量，淡化对数量目标的关注、特别是对贷款单一渠道的关注，把金融总量更多作为观测性、参考性、预期性指标", "detail": "文章用四组数据刻画结构变化：2025 年社融增量 35.6 万亿元中企业债券、政府债券与股票融资合计占比约 47%，首次超过贷款；2026 年 6 月末社融存量中间接融资余额占比降至 2/3 左右、直接融资升至 1/3 左右、债券融资约 30%；近 10 年房地产与基建新增贷款占比由 60% 以上降至 10% 左右，金融「五篇大文章」领域新增贷款占比升至 70% 以上；A 股上市公司超 5500 家、总市值超 110 万亿元，债市总规模突破 200 万亿元、科创债券累计发行约 3 万亿元。判断货币化进程已基本结束、贷款降速提质或将成为宏观运行的新常态之一，金融总量增速趋缓有利于保持宏观杠杆率基本稳定。配套印发《中国人民银行「十五五」改革发展规划》及 9 份行动方案。", "l": "《求是》2026 年第 18 期潘功胜署名文章（9/16）", "u": "https://www.qstheory.cn/20260915/1c41fc49b4b44db4b2550ddd41f40315/c.html"}]}, {"name": "国家发展改革委", "role": "宏观调控、投资与产业协调", "items": [{"hl": "联合市场监管总局印发《关于重要工业品低价无序竞争成本核算有关事项的通知》（发改价格〔2026〕1303 号）：明确成本核算的主体、内容和方式，为治理低价无序竞争提供可操作的「成本标尺」", "detail": "核算主体：两部门必要时组织开展成本调查核算经营者成本，省级部门在国家统一指导下开展，行业协会可测算行业平均成本，经营者可核算自身个别成本。核算内容：原则上以经营者生产特定产品的个别成本为基础，无法核算个别成本时参考行业平均成本并考虑一定下浮幅度。核算方式：以经审计或手续齐备的账载资料为基础，成本费用与销售价格涵盖内容相匹配，并考虑产能利用率影响；行业平均成本可采取普查或抽样方式，区域差异大的行业分区域测算。落实安排为加强市场监测、加强行业自律（探索制定成本核算团体标准）、加强监管执法三方面，目标是推动行业从「拼价格」转向「拼质量、拼创新」。", "l": "《关于重要工业品低价无序竞争成本核算有关事项的通知》（9/17 答记者问）", "u": "https://www.ndrc.gov.cn/"}, {"hl": "8000 亿元新型政策性金融工具首批资金加快投放，规模由上年 5000 亿元扩容至 8000 亿元，据测算预计撬动项目总投资规模约 10 万亿元", "detail": "由国家开发银行、农业发展银行、进出口银行负责投放，用于补充重点项目资本金。首批项目已在浙江、云南、四川、湖北、山东等地落地，覆盖智能悬架产业化、抽水蓄能、动力电池基地、都市圈高速、核电与储能等。投向由上年的传统基建拓宽至「六张网」（水网、新型电网、算力网、新一代通信网、城市地下管网、物流网）、数字经济、人工智能、低空经济、商业航天、新能源新材料、新型工业化、城市更新与交通物流六大方向；明确加大对民间投资项目支持力度，符合条件的民营企业可享年化 1.5%、期限不超过 2 年的财政贴息。国家发展改革委同时调度 109 项重大工程建设进展，推动一批新项目尽早开工。", "l": "新型政策性金融工具投放进展（9/17）", "u": "https://jingji.cctv.cn/2026/09/17/ARTIvwgLQDw13pbCH99aZHoh260917.shtml"}, {"hl": "「六张网」建设进入项目储备与审批加速期：9/16 西部陆海新通道骨干工程平陆运河建成通航，全长 134.2 公里、按内河Ⅰ级航道建设、可通航 5000 吨级船舶，丁薛祥出席通航仪式", "detail": "平陆运河总投资约 727 亿元、历经 4 年建设；西南地区货物出海较绕道广州港缩短内河航程 560 公里以上，综合物流成本预计下降 18%—30%，每年可节约全社会运输费用超 50 亿元。国家统计局数据显示，前 8 个月与「六张网」相关的互联网和相关服务业投资同比增长 42%，航空运输业、水上运输业投资分别增长 16.7% 和 14.7%，电力供应业投资增长 12.7%；截至 6 月末已围绕算力枢纽建成 70 余条算力大通道。市场机构测算「十五五」期间「六张网」投资规模约 26 万亿元，较「十四五」增长 41%。", "l": "「六张网」重大项目建设进展（9/16）", "u": "https://www.news.cn/photo/20260916/79a59bf5fe05446daeeb1c0808f6b410/c.html"}]}, {"name": "海关总署", "role": "进出口贸易统计", "items": [{"hl": "8 月进出口 4.65 万亿元、同比 +19.8%，连续 3 个月超 4.5 万亿", "detail": "集成电路出口 407.3 亿美元 / +129.8%（首破 400 亿美元）、自动数据处理设备 304 亿美元 / +76.5%（首破 300 亿美元），双双创历史新高；高新技术产品出口占出口总额 29.0%。", "l": "2026 年 8 月进出口数据（9/08）", "u": "http://www.customs.gov.cn/"}]}, {"name": "工业和信息化部", "role": "电子信息制造业运行", "items": [{"hl": "联合发改委、金融监管总局、国管局、国家能源局印发《关于组织开展 2026 年度国家绿色算力设施推荐工作的通知》（工信厅联节函〔2026〕433 号）：推荐一批能效、碳效水平高的绿色算力设施", "detail": "9/21 对外发布，覆盖工业、信息通信、能源、互联网、金融、公共机构等领域，设施类型包括智算、通算、超算设施等；要求规模不小于 3000 个标准机架（公共机构、金融领域及智算设施除外）、上架率不低于 60%、绿色发展水平达到《绿色数据中心评价》（GB/T 44989）二级及以上，申报材料须于 11 月 16 日前报送。同步发布的新版评价指标体系按碳排放总量和强度双控要求优化调整，涵盖能源利用、碳排放管理、水资源利用、算力资源利用四方面，新纳入单位算力能效、碳利用效率、数字化碳管理、产品碳足迹等指标，并提高碳利用效率、可再生能源电量占比、机柜资源利用（上架率）等关键指标分值。对 2C 的落点：与 8000 亿元新型政策性金融工具、六张网算力枢纽形成配套，端侧 AI 与云侧算力一体化的能效门槛正成为项目准入的硬约束。", "l": "工业和信息化部等五部门（9/21 发布）", "u": "https://www.miit.gov.cn/"}, {"hl": "落实全国先进制造业大会部署：牢牢锚定基本实现新型工业化目标，推进科技创新和产业创新深度融合，实施产业基础再造和重大技术装备攻关工程，推进制造业重点产业链高质量发展", "detail": "工业和信息化部规划司司长姚珺在大会现场表示，「十五五」开局起步的关键时刻召开全国先进制造业大会意义重大，将推进科技创新和产业创新深度融合，持续做大做强先进制造业。国家发展改革委产业发展司副司长邵稷表示，将扎实推动重点产业提质升级，培育壮大新兴产业和未来产业，组织实施重大技术装备攻关，强化能源资源供应保障。国务院国资委规划发展局副局长尚鹏表示，将指导中央企业聚焦先进制造业方向优化布局结构、提升原始创新能力。此前辛国斌在部分省份工业经济运行座谈会上已要求抓紧推进「十五五」规划重大项目落地实施。", "l": "全国先进制造业大会部门落实表态（9/17）", "u": "https://politics.people.com.cn/n1/2026/0918/c461001-40800738.html"}, {"hl": "《电子信息制造业发展「十五五」规划》（工信部联规〔2026〕216 号）：2030 年规模以上企业营业收入突破 30 万亿元、研发投入强度达到 3.5%", "detail": "与发改委联合印发，围绕「筑基、提质、育新、治理」部署 17 项重点任务、9 个专栏。筑牢产业基础：推动集成电路全链条攻关，发展高性能处理器、高密度存储器等高端芯片，提升先进封装测试能力。增强整机与系统竞争力：构筑先进计算生态体系（存算一体、量子计算、光计算、类脑计算、太空计算），加快消费电子创新发展——推动手机、个人计算机、视听电子、虚拟现实、可穿戴设备、服务类新型终端智能化融合化升级，推进消费电子适老化改造。培育新增长点：巩固能源电子优势，推进固态电池、钠电池、液流电池、燃料电池产业化。消费电子专栏分设高端手机、个人计算机、视听电子、虚拟现实、可穿戴设备、服务类新型终端六大方向。", "l": "《电子信息制造业发展「十五五」规划》（9/15 对外发布）", "u": "https://www.gov.cn/lianbo/202609/content_7081208.htm"}, {"hl": "召开部分省份工业经济运行座谈会：把促进工业经济平稳运行摆在更加重要位置，加力挖掘内需潜力、加快推动人工智能产业发展和赋能应用", "detail": "辛国斌主持，河北、江苏、浙江、安徽、福建、山东、河南、湖北、湖南、广东、四川等 11 省工信主管部门参会，分析研判工业经济形势、研究谋划 2027 年经济工作思路。要求抓紧推进「十五五」规划重大项目落地实施，持续巩固提升工业品国际市场竞争力；强化供需平衡、加力推进大中小企业融通发展；加强产能治理，坚持因地制宜、突出差异化发展。", "l": "部分省份工业经济运行座谈会（9/14）", "u": "https://www.miit.gov.cn/jgsj/yxj/gzdt/art/2026/art_3c82ff9dd6fe423c8ea61083cea55685.html"}]}, {"name": "国务院办公厅", "role": "政策综合协调与督查落实", "items": [{"hl": "国新办政策例行吹风会五部门联合解读：明确「付款四项关键要素」，引导龙头企业率先践行「60 日付现承诺」", "detail": "工信部副部长柯吉欣：多数行业暂未出台专门结算支付规则，部分大型企业通过模糊账期起算节点、拖延验收结算、滥用商业汇票与应收账款电子凭证故意拉长账期；四项要素为账期起算节点、账款支付方式及流程、检验验收（或竣工结算）标准及期限、最长付款期限，将纳入合同示范文本。央行金融市场司司长曹媛媛：对压降账款与账期明显的企业在债券发行方面给予便利。国资委裴仁佺：推动央企带头不违约拖欠、带头少开票多付现，把对中小企业现金支付作为「硬杠杠」。市场监管总局周卫军：部署 2026 年反不正当竞争执法专项行动，已赴部分龙头汽车企业调研敦促。", "l": "国新办国务院政策例行吹风会（9/14）", "u": "https://www.gov.cn/zhengce/202609/content_7081057.htm"}, {"hl": "印发《关于加强中小企业回款难问题治理有关工作的通知》，发布大型企业及时支付倡议，引导 60 日内以现金向中小企业付款", "detail": "四方面部署：健全行业账款支付规则（明确账期起算节点、最长付款期限）；加强大型企业支付行为监管（建立账款监测机制、多部门联合约谈、上市公司须披露平均账期）；规范非现金支付工具（电子凭证最长付款期限压减至 6 个月，经营数据接入上海票据交易所）；强化资金传导（政府采购全额现金支付，支持大型企业融资置换应付账款）。", "l": "《关于加强中小企业回款难问题治理有关工作的通知》（9/10）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080631.htm"}]}, {"name": "商务部", "role": "消费促进与内需政策", "items": [{"hl": "1—8 月全国新设立外商投资企业 42582 家、同比 +0.3%，实际使用外资 4799.5 亿元、同比 -5.3%；高技术产业实际使用外资 2002.6 亿元、+35.1%，占全国 41.7%", "detail": "分行业：制造业实际使用外资 1195.5 亿元，服务业 3504.2 亿元；研发与设计服务、科技成果转化服务、电子及通信设备制造业实际使用外资分别增长 74%、64.2%、41.9%，高技术产业占比较去年同期提升 12.4 个百分点。分来源地：法国、瑞士、韩国实际对华投资分别增长 39.2%、16.7%、16.5%（含通过自由港投资数据）。同期披露 1—8 月进口增长 22%，为 2021 年以来最快，预计全年进口额将再创新高。", "l": "商务部", "u": "https://www.mofcom.gov.cn/xwfb/rcxwfb/art/2026/art_bd939b758a6243728e1f294973c5b2f2.html"}, {"hl": "9 月 17 日例行新闻发布会介绍《促进智能家居消费行动方案》：围绕「供需适配、互联互通、银发友好、便民到家」四方面发力，推动「单品智能」迈向「全屋智能」", "detail": "发布会明确支持方言识别、简化老年人操作，培育全屋智能消费场景。同场回应中美经贸团队正就相互降低关税安排保持密切交流，后续将适时发布进展。前三季度数据：前 7 个月境外人员在华消费 2636 亿元、同比增长 27.8%，办理离境退税的境外旅客数量同比增长 3 倍以上。2026 年以旧换新已覆盖 6 类家电与 4 类数码智能产品，补贴为售价 15%（家电每件≤1500 元、数码智能≤500 元）。", "l": "商务部例行新闻发布会（9/17）", "u": "http://www.mofcom.gov.cn/"}]}, {"name": "国务院常务会议", "role": "民生保障、消费与产业政策顶层部署", "items": [{"hl": "9 月 18 日国务院常务会议听取老龄工作情况汇报：丰富银发产品和服务、培育银发消费新场景，实现民生福祉与内需扩容双向促进", "detail": "会议指出要全面客观认识人口老龄化带来的影响，深入实施积极应对人口老龄化国家战略；在养老服务、健康促进、社会保障等方面持续用力，健全多层次多支柱养老保险体系，打通居家、社区、机构养老服务联动渠道，扩大普惠养老服务。同场部署实施医疗康复护理扩容提升工程——以基层为重点建强医疗康复护理服务体系，推动康复护理资源向社区、家庭延伸，依靠科技创新提升水平、开发更多智能康复技术和设备、优化新技术新产品审评审批、丰富服务场景，并动态调整康复医疗与长期照护服务项目目录。对 2C 的落点：与 9/14 八部门《促进智能家居消费行动方案》的适老化智能家居、家庭服务机器人、健康监测与智能照护形成政策闭环，健康穿戴与家庭服务机器人进入「补贴 + 场景」双向支持的窗口期。", "l": "中国政府网", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081464.htm"}]}], "metricNotes": [{"metric": "制造业 / 非制造业 / 综合 PMI", "org": "国家统计局服务业调查中心", "freq": "月度（月末）", "latest": "49.8% / 49.0% / 49.5%（8月）", "imp": "景气温度；计算机通信电子与电气机械分项是 ICT 与 AI 硬件订单的同步指标"}, {"metric": "CPI / PPI 当月同比", "org": "国家统计局城市司", "freq": "月度（9—10日）", "latest": "+0.8% / +3.8%（8月）", "imp": "剪刀差决定成本能否向终端传导；消费电子 CPI 分项反映实际提价能力"}, {"metric": "社会消费品零售总额（分品类）", "org": "国家统计局贸易外经司", "freq": "月度（15日前后）", "latest": "39824 亿元 / +0.4%（8月，除汽车 +2.5%）", "imp": "通讯器材类是 AI 换机先行指标；汽车类决定车机与渠道协同目标"}, {"metric": "规模以上工业增加值", "org": "国家统计局工业司", "freq": "月度（15日前后）", "latest": "+5.2%（8月，1—8月累计 +5.3%）", "imp": "电子与高技术制造业分项校验 AI 产业链实际产出强度"}, {"metric": "规模以上工业企业利润（分行业）", "org": "国家统计局工业司", "freq": "月度（27日前后）", "latest": "1—7月 4.58 万亿元 / +17.6%", "imp": "电子行业利润集中度决定供应链议价权归属与长协谈判节奏"}, {"metric": "进出口（分商品）", "org": "海关总署", "freq": "月度（7—8日）", "latest": "4.65 万亿元 / +19.8%（8月）", "imp": "集成电路与计算机产品出口是 AI 硬件外需读数；进口均价直接映射 BOM 成本"}, {"metric": "M2 / 社融 / 贷款 / LPR", "org": "中国人民银行", "freq": "月度（10—20日）", "latest": "M2 +7.5%、社融 +7.2%、对实体贷 function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function redify(s){
  var t = String(s==null?'':s);
  /* 数据中历史写入的 <b class="hl-red">…</b> 先归一化为 **…**，
     否则经 esc() 转义后会在页面上显示成可见的标签文本（程序符号） */
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>([\s\S]*?)<\/b\s*>/gi, '**$2**');
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>/gi, '');
  t = t.replace(/<\/b\s*>/gi, '');
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>');
}

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return redify(t||'');
  return '<div class="summary-lines">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}

function numberedLines(t){
  const s = bodyClean(t);
  const parts = s.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(x=>x.trim()).filter(Boolean);

function renderLaunchRadar(lr){
  // ① 周度变化（本周 vs 上周）卡片
  const wow = lr.products.map(function(p){
    const w = p.wow || {};
    const last = (w.lastWeek == null) ? '—' : (w.lastWeek + ' 万');
    const now = (w.thisWeek == null) ? '—' : (w.thisWeek + ' 万');
    const badge = (w.badge === 'new') ? '本周首发' : (w.badge === 'warn') ? '虚高预警' : '待W40';
    const bc = (w.badge === 'new') ? '#1FA971' : (w.badge === 'warn') ? '#E0A106' : '#9AA7BC';
    const bg = (w.badge === 'new') ? '#E8F6EF' : (w.badge === 'warn') ? '#FCEFD6' : '#EEF1F6';
    return '<div style="flex:1;min-width:200px;border:1px solid #E6EAF1;border-radius:9px;padding:8px 10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700"><span>' + esc(p.vendor) + ' ' + esc(p.product) + '</span>' +
      '<span style="font-size:10px;font-weight:700;color:' + bc + ';background:' + bg + ';padding:1px 6px;border-radius:5px">' + badge + '</span></div>' +
      '<div style="margin-top:6px;font-size:12px;color:#7A8AA3"><b style="color:#1B2433">' + last + '</b> → <b style="color:#1B2433">' + now + '</b></div>' +
      '<div style="font-size:11px;color:#7A8AA3;margin-top:4px">' + esc(w.note || '') + '</div></div>';
  }).join('');
  el('lr-wow').innerHTML = wow;
  // ② 其余机型定性芯片（无精确首销值）
  const chips = lr.products.filter(function(p){ return !(p.prevGen != null && p.currentGen != null); }).map(function(p){
    return '<span style="font-size:11px;padding:3px 9px;border-radius:14px;border:1px solid #E6EAF1;color:#7A8AA3">' + esc(p.vendor) + ' ' + esc(p.product) + '：' + esc(p.qualitative || '待披露') + '</span>';
  }).join('');
  el('lr-chips').innerHTML = chips;
  // ③ 消费者接受度状态矩阵（含抓取好评/差评率）
  const rows = lr.products.map(function(p){
    const rv = p.reviews || {};
    const gr = (rv.goodRate == null) ? '—' : (rv.goodRate + '%');
    const br = (rv.badRate == null) ? '—' : (rv.badRate + '%');
    const grc = (rv.goodRate == null) ? '#9AA7BC' : (rv.goodRate >= 85 ? '#1FA971' : '#E0A106');
    const brc = (rv.badRate == null) ? '#9AA7BC' : '#E0A106';
    const dot = (p.pullStatus === 'green') ? '#1FA971' : (p.pullStatus === 'yellow') ? '#E0A106' : '#9AA7BC';
    const stTxt = (p.pullStatus === 'green') ? '稳' : (p.pullStatus === 'yellow') ? '预警' : '待验';
    return '<tr><td><b>' + esc(p.vendor) + ' ' + esc(p.product) + '</b></td>' +
      '<td style="font-size:12px;line-height:1.5;color:#1B2433">' + esc(p.acceptance || '') + '</td>' +
      '<td style="font-weight:800;color:' + grc + '">' + gr + '</td>' +
      '<td style="font-weight:800;color:' + brc + '">' + br + '</td>' +
      '<td style="font-size:10px;color:#7A8AA3">' + esc(rv.source || '') + '</td>' +
      '<td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + dot + ';margin-right:5px;vertical-align:middle"></span>' + stTxt + '</td></tr>';
  }).join('');
  el('lr-table').innerHTML = '<tr><th>产品</th><th>接受度解读（Pull）</th><th>好评率</th><th>差评率</th><th>抓取平台</th><th>状态</th></tr>' + rows;
  // ④ 横向+纵向合并柱状图（同图：灰=上代，蓝=本代）
  const real = lr.products.filter(function(p){ return p.prevGen != null && p.currentGen != null; });
  if(real.length){
    const ch = echarts.init(el('lr-combo'));
    charts['lr'] = ch;
    ch.setOption({
      grid: { left: 48, right: 20, top: 42, bottom: 30 },
      legend: { top: 4, right: 6, itemWidth: 12, itemHeight: 12, textStyle: { fontSize: 11 } },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: { type: 'category', data: real.map(function(p){ return p.product; }), axisLabel: { fontSize: 12, fontWeight: 600 }, axisTick: { show: false }, axisLine: { lineStyle: { color: '#E6EAF1' } } },
      yAxis: { type: 'value', name: '万台', nameTextStyle: { fontSize: 11, color: '#7A8AA3' }, splitLine: { lineStyle: { color: '#EEF1F6' } }, axisLabel: { fontSize: 11 } },
      series: [
        { name: '上代首销', type: 'bar', barGap: '12%', barWidth: 34, itemStyle: { color: '#9AA7BC', borderRadius: [4,4,0,0] }, data: real.map(function(p){ return p.prevGen; }), label: { show: true, position: 'top', fontSize: 11, color: '#7A8AA3', formatter: '{c}' } },
        { name: '本代首销', type: 'bar', barWidth: 34, itemStyle: { color: '#2563eb', borderRadius: [4,4,0,0] }, data: real.map(function(p){ return p.currentGen; }), label: { show: true, position: 'top', fontSize: 12, fontWeight: 800, color: '#2563eb', formatter: function(d){ return '+' + real[d.dataIndex].genDeltaPct + '%'; } } }
      ]
    });
  }
}

let mktGC = 'global';
function renderCategoryMarket(){
  const keys = Object.keys(cur.marketData);

function drawMkt(key){
  const d = cur.marketData[key][mktGC];
  const labels = d.series.map(s=>s.label);
  const vals = d.series.map(s=>s.shipment);
  const yoy = d.series.map(s=>(typeof s.yoy==='number'? s.yoy : null));
  if(charts.mkt) charts.mkt.dispose();
  charts.mkt = echarts.init(el('mkt-chart'));
  charts.mkt.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },
    tooltip:{ trigger:'axis' },
    legend:{ data:['出货','同比YoY'], bottom:0 },
    grid:{ left:55, right:55, top:50, bottom:50 },
    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }
    ]
  }, true);
  const sh = el('mkt-shares');
  if(d.shares){
    el('mkt-share-note').textContent = '（'+(mktGC==='global'?'全球':'中国')+'厂商份额）';
    sh.innerHTML = '<tr><th>厂商</th><th>份额(%)</th><th>同比变化(pp)</th></tr>'+d.shares.map(s=>'<tr><td><b>'+esc(s.brand)+'</b></td><td>'+s.share+'</td><td class="'+(s.chg.indexOf('+')===0?'up':'down')+'">'+esc(s.chg)+'</td></tr>').join('');
  } else { sh.innerHTML=''; el('mkt-share-note').textContent='（该品类暂无分厂商份额数据 · '+(mktGC==='global'?'全球':'中国')+'）'; }
  const seg = el('mkt-segments');
  seg.innerHTML = d.segments? '<tr><th>分类</th><th>数值</th><th>说明</th></tr>'+d.segments.map(s=>'<tr><td>'+esc(s.name)+'</td><td><b>'+esc(s.val)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('') : '';
  const tbl = el('mkt-tbl');

  drawMktShare(key);
}

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);
    else if(card.type==='brandtable') drawBrandTable(id, card);
  });
}
function drawLine(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis'}, legend:{bottom:0,type:'scroll'}, grid:{left:55,right:30,top:46,bottom:54}, xAxis:{type:'category',data:card.months,axisLabel:{fontSize:11}}, yAxis:{type:'value',name:card.unit||''}, series:card.series.map(s=>({name:s.name,type:'line',data:s.data,smooth:true,symbolSize:6,lineStyle:{width:2.4},itemStyle:{color:s.color||'#2563eb'}})) }, true);
}
function drawBar(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  const items = card.items||[];
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, grid:{left:90,right:30,top:46,bottom:30}, xAxis:{type:'value',name:card.unit||''}, yAxis:{type:'category',data:items.map(i=>i.label).reverse(),axisLabel:{fontSize:11}}, series:[{type:'bar',data:items.slice().reverse().map(i=>({value:i.value,itemStyle:{color:i.color||'#2563eb',borderRadius:[0,4,4,0]}})), label:{show:true,position:'right',fontSize:11,formatter:'{c}'}}] }, true);

function drawPie(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;

function drawTable(id, card){
  el(id).innerHTML = '<tr>'+card.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+(card.rows||[]).map(r=>'<tr>'+r.map((x,i)=>{ const cls=(card.cls&&card.cls[i])?(' class="'+card.cls[i]+'"'):''; return '<td'+cls+'>'+esc(x)+'</td>'; }).join('')+'</tr>').join('');

function drawCombo(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({
    title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}},
    tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},

function ensureBrandTableCss(){
  if(document.getElementById('bt-css')) return;
  const s=document.createElement('style'); s.id='bt-css';
  s.textContent='.bt-bar-wrap{position:relative;display:flex;align-items:center;gap:8px;min-width:170px}.bt-bar{height:14px;border-radius:3px;background:linear-gradient(90deg,#16a34a,#22c55e);flex:0 0 auto}.bt-val{font-size:12px;color:#374151;font-weight:600}.bt-note-row td{background:#f8fafc;color:#6b7280;font-size:11px;padding:4px 10px}';
  document.head.appendChild(s);
}
function drawBrandTable(id, card){
  ensureBrandTableCss();
  const maxScale = 40;   // 比亚迪规模远超其余，按 40 万为满条，避免其他不可见
  const rows = (card.rows||[]).map(function(r){
    const barW = Math.min(100, (r.sales/maxScale)*100);
    let yoyCls=''; let yoyTxt='—';
    if(typeof r.yoy==='number'){ yoyTxt=(r.yoy>0?'+':'')+r.yoy+'%'; yoyCls=r.yoy>0?'up':'down'; }
    const share=(typeof r.share==='number')?r.share+'%':(r.share||'—');
    return '<tr><td><b>'+esc(r.brand)+'</b></td>'+
      '<td><div class="bt-bar-wrap"><div class="bt-bar" style="width:'+barW.toFixed(1)+'%"></div><span class="bt-val">'+r.sales+'</span></div></td>'+
      '<td class="'+yoyCls+'">'+yoyTxt+'</td>'+
      '<td>'+share+'</td></tr>'+
      (r.note?'<tr class="bt-note-row"><td colspan="4">'+esc(r.note)+'</td></tr>':'');
  }).join('');
  el(id).innerHTML = '<tr><th>'+card.headers.join('</th><th>')+'</th></tr>'+rows;
}

/* 汽车 / 互联网 / 芯片 专用大盘 */
function renderMarket(m){

let abChartsPending = false;

    abMk('ab_c_total', abLine(D.pt_dates,[{name:'终端销量(万辆)',type:'line',smooth:true,data:D.pt_total.map(function(v){return v==null?null:+(v/10000).toFixed(1);}),itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],false));
    abMk('ab_c_nev', abLine(D.pt_dates,[{name:'新能源渗透率',type:'line',smooth:true,data:D.nev_pen,itemStyle:{color:'#16a34a'},areaStyle:{color:'rgba(22,163,74,.08)'}}],true));

      var tot = months.map(function(_,i){ var s2=0; brands.forEach(function(b){ var v=D.oem[b][idx0+i]; if(v) s2+=v; }); return s2; });
      s.push({name:'自主品牌合计',type:'line',yAxisIndex:1,data:tot,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:6,
        label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(0)+'万';}}});
      abMk('ab_c_dom', {
        tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},

        xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},

               {type:'value',name:'合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
    series:s1
  });
  // 九·2 当年累计（各品牌 + 五界/三境/一塔汇总）
  var g = H.group_ytd || {};
  var extra = [];

    if(!box.id) return;
    const cfg = MC_CHART_MAP[box.id]; if(!cfg) return;
    if(charts[box.id]){ try{charts[box.id].dispose();}catch(e){} }
    charts[box.id] = echarts.init(box);
    charts[box.id].setOption(mcOpt(cfg), true);
  });
}
function drawMacroCharts(){ macDraw(); }
function mcOpt(cfg){
  const AX = {color:'#6b7280', fontSize:11};
  if(cfg.type==='line'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), bottom:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:52,bottom:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',min:(cfg.min==null?null:cfg.min),max:(cfg.max==null?null:cfg.max),axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'line',data:s.data,smooth:0.28,symbol:'circle',symbolSize:5,connectNulls:true,
          lineStyle:{width:2.4,color:s.color},itemStyle:{color:s.color},
          markLine:s.markLine?{silent:true,symbol:'none',lineStyle:{color:'#cbd5e1',type:'dashed',width:1.2},
            label:{formatter:s.markLine,position:'insideEndTop',color:'#6b7280',fontSize:10},data:[{yAxis:s.markVal}]}:null};
      }) };
  }
  if(cfg.type==='hbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:20,right:52,top:46,bottom:20,containLabel:true},
      xAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      yAxis:{type:'category',data:cfg.y,axisLabel:Object.assign({width:cfg.yw||150,overflow:'truncate'},AX)},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',barMaxWidth:15,
          data:s.data.map(function(v,i){ return {value:v, itemStyle:{color:(s.colors&&s.colors[i])||s.color||'#2563eb', borderRadius:[0,3,3,0]}}; }),
          label:{show:true,fontSize:10.5,color:'#6b7280',formatter:function(p){return (p.value>0?'+':'')+p.value+'%';}},
          labelLayout:function(p){ var pos=p.value>=0; return {x:p.rect.x+(pos?p.rect.width+6:-6),y:p.rect.y+p.rect.height/2,verticalAlign:'middle',align:pos?'left':'right'}; }};
      }) };
  }
  if(cfg.type==='vbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:46,bottom:cfg.rotate?82:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,rotate:cfg.rotate||0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',data:s.data,barMaxWidth:s.barMaxWidth||26,
          itemStyle:{color:s.color||'#2563eb',borderRadius:[3,3,0,0]},
          label:{show:true,position:'top',fontSize:10.5,color:'#6b7280',
            formatter:function(p){return p.value==null?'':(p.value>0?'+':'')+p.value+'%';}}};
      }) };
  }
  if(cfg.type==='combo'){
    return { tooltip:{trigger:'axis'},
      legend:{data:[cfg.bar.name,cfg.line.name], top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:58,top:46,bottom:cfg.rotate?74:44,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,lineHeight:13,fontSize:10.5},AX)},
      yAxis:[{type:'value',name:cfg.yBar||'',axisLabel:AX},{type:'value',name:cfg.yLine||'',splitLine:{show:false},axisLabel:AX}],
      series:[
        {name:cfg.bar.name,type:'bar',data:cfg.bar.data,barMaxWidth:30,
         itemStyle:{color:cfg.bar.color||'#2563eb',borderRadius:[3,3,0,0]},
         label:{show:true,position:'top',fontSize:10,color:'#6b7280',formatter:'{c}'}},
        {name:cfg.line.name,type:'line',yAxisIndex:1,data:cfg.line.data,smooth:0.2,symbol:'circle',symbolSize:8,
         lineStyle:{width:2.4,color:cfg.line.color||'#dc2626'},itemStyle:{color:cfg.line.color||'#dc2626'}}
      ]};
  }
  return {};
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  /* 事件委托：tabnav 的 innerHTML 会随一级板块重写，逐个绑定会导致切换后监听失效 */
  const nav = el('tabnav');
  nav.addEventListener('click', function(ev){
    const t = ev.target && ev.target.closest ? ev.target.closest('.tab-item') : null;
    if(!t) return;
    nav.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id = t.dataset.tab;
    curTab = id;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    renderMacroBrief();
    setTimeout(()=>{
      for(const k in charts){ try{ charts[k].resize(); }catch(e){} }
      if(id==='t4'){
        if(cur===DATA.auto) drawAutoBoardCharts();
        if(curCat==='macro') drawMacroCharts();
      }
    },60);
  });
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
