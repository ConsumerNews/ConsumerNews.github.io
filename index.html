<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --accent:#2563eb; --accent-deep:#1d4ed8; --accent-soft:#eff6ff; --accent-tint:#dbeafe; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#1f2937; font-size:14.5px; line-height:1.6; }
a { color:#2563eb; text-decoration:none; }
a:hover { text-decoration:underline; }

/* Header / Banner —— 蓝色洞见风 */
.header { background:radial-gradient(1100px 380px at 10% -25%, #3b82f6 0%, transparent 58%), linear-gradient(135deg,#0b2a6b 0%,#1d4ed8 48%,#2563eb 100%); color:#fff; padding:15px 28px 12px; position:sticky; top:0; z-index:100; box-shadow:0 6px 24px rgba(11,42,107,0.45); border-bottom:3px solid rgba(255,255,255,.55); }
.header-top { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:14px; }
.brand-mark { flex-shrink:0; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25)); animation:spinSlow 20s linear infinite; }
@keyframes spinSlow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.brand .eyebrow { font-size:10.5px; letter-spacing:2.5px; font-weight:700; color:#bfdbfe; text-transform:uppercase; }
.header h1 { font-size:25px; font-weight:900; letter-spacing:2px; line-height:1.12; background:linear-gradient(90deg,#ffffff,#dbeafe); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.header .sub { font-size:11.5px; color:#cbd5e1; margin-top:4px; }
.header-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.view-counter { display:flex; gap:10px; }
.view-box { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); border-radius:9px; padding:6px 13px; text-align:center; min-width:92px; }
.view-box .num { font-size:18px; font-weight:800; line-height:1.1; }
.view-box .lbl { font-size:10px; color:#dbeafe; }
.header .badge { display:inline-block; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32); padding:3px 11px; border-radius:20px; font-size:10px; color:#e0e7ff; }
.badge::before { content:''; display:inline-block; width:6px; height:6px; background:#4ade80; border-radius:50%; margin-right:5px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Category nav（一级切换项，主色调贯穿其下五大板块） */
.catnav { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.cat-item { padding:8px 22px; font-size:13px; font-weight:800; color:#dbeafe; cursor:pointer; border-radius:20px; border:1.5px solid rgba(255,255,255,.45); background:rgba(255,255,255,.08); transition:all .2s; white-space:nowrap; }
.cat-item:hover { background:rgba(255,255,255,.22); color:#fff; }
.cat-item.active { background:#fff; color:var(--accent); border-color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }

/* Tabs */
.tabnav { background:#fff; padding:0 28px; display:flex; gap:4px; border-bottom:2px solid #e5e7eb; box-shadow:0 1px 4px rgba(0,0,0,.04); overflow-x:auto; position:sticky; top:var(--hh,118px); z-index:90; }
.tab-item { padding:13px 20px; font-size:14px; font-weight:700; color:#6b7280; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; transition:all .2s; }
.tab-item:hover { color:var(--accent); background:var(--accent-soft); }
.tab-item.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-item .tn { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; font-size:11px; margin-right:6px; background:var(--accent); color:#fff; }

/* Container */
.container { max-width:1400px; margin:0 auto; padding:22px 28px 60px; }
.tabpane { display:none; }
.tabpane.active { display:block; }

/* Section titles */
.section-title { font-size:20px; font-weight:800; color:#1f2937; margin:8px 0 16px; padding-left:14px; border-left:4px solid var(--accent); display:flex; align-items:center; gap:8px; }
.section-title .en { font-size:11px; color:#9ca3af; font-weight:400; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px 20px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
.muted { color:#6b7280; font-size:12px; }
.hl { color:var(--accent); font-weight:700; }

/* Tab1 headline */
.headline-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media(max-width:1000px){ .headline-grid { grid-template-columns:1fr; } }
.hl-card { border:1px solid #f0f0f0; border-radius:10px; padding:14px 16px; background:linear-gradient(180deg,#fffaf9,#fff); border-left:4px solid var(--accent); }
.hl-rank { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center; background:var(--accent); color:#fff; border-radius:6px; font-weight:800; font-size:13px; margin-right:8px; }
.hl-card h4 { font-size:15px; font-weight:700; display:inline; }
.hl-support { font-size:14.5px; color:#4b5563; margin-top:9px; line-height:1.7; }
.hl-link { font-size:11px; margin-top:6px; }

.person-block { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.person-block .pname { font-size:15px; font-weight:800; color:#1f2937; }
.person-block .prole { font-size:11px; color:#9ca3af; margin-left:6px; }
.vp-item { font-size:14px; color:#374151; padding:11px 0; border-bottom:1px dashed #f0f0f0; line-height:1.7; }
.vp-item:last-child { border-bottom:none; }
.vp-hl { font-size:15px; line-height:1.7; margin-bottom:6px; }
.vp-hl .hl-red { font-size:15px; }
.vp-detail { font-size:13.5px; color:#374151; line-height:1.9; margin:1px 0 8px; padding-left:2px; }

.news-row { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #f3f4f6; }
.news-rank { flex-shrink:0; width:22px; height:22px; line-height:22px; text-align:center; border-radius:5px; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12px; }
.news-main { flex:1; }
.news-title { font-size:15px; font-weight:600; color:#1f2937; }
.news-meta { font-size:11px; color:#9ca3af; margin-top:2px; }

/* Tab2 products */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
@media(max-width:900px){ .cal-grid { grid-template-columns:repeat(3,1fr); } }
.cal-cell { border:1px solid #e5e7eb; border-radius:8px; padding:8px; min-height:90px; background:#fff; font-size:11px; }
.cal-cell .d { font-weight:800; color:#374151; }
.cal-cell.ev { background:var(--accent-soft); border-color:var(--accent-tint); }
.cal-cell .evt { margin-top:4px; color:var(--accent); font-weight:600; line-height:1.35; }
.prod-block { border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; margin-bottom:16px; }
.prod-head { display:flex; align-items:center; gap:10px; padding:14px 18px; color:#fff; }
.prod-head .b { font-size:16px; font-weight:800; }
.prod-head .tag { font-size:11px; background:rgba(255,255,255,.25); padding:2px 8px; border-radius:4px; }
.prod-body { padding:16px 18px; }
.prod-summary { font-size:15px; color:#374151; line-height:1.8; }
.prod-strategy { margin-top:10px; padding:11px 14px; background:#f9fafb; border-left:3px solid var(--accent); border-radius:6px; font-size:14.5px; color:#4b5563; line-height:1.8; }
.prod-strategy b { color:var(--accent); }
.spec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:12px; }
.spec-item { border:1px solid #f0f0f0; border-radius:8px; padding:8px 10px; background:#fafafa; }
.spec-item .k { font-size:10px; color:#9ca3af; }
.spec-item .v { font-size:12.5px; font-weight:700; color:#1f2937; }
.prod-links { margin-top:10px; font-size:11px; }

/* Tab3 earnings */
.earn-card { border:1px solid #e5e7eb; border-radius:12px; padding:18px 20px; margin-bottom:16px; }
.earn-top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
.earn-company { font-size:17px; font-weight:800; }
.earn-code { font-size:11px; color:#9ca3af; margin-left:8px; }
.earn-period { font-size:11px; color:#6b7280; background:#f3f4f6; padding:3px 10px; border-radius:20px; }
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
@media(max-width:900px){ .kpi-row { grid-template-columns:repeat(2,1fr); } }
.kpi { border:1px solid #f0f0f0; border-radius:8px; padding:10px; text-align:center; }
.kpi .kv { font-size:16px; font-weight:800; color:#1f2937; }
.kpi .kl { font-size:10px; color:#9ca3af; margin-top:2px; }
.kpi .ky { font-size:11px; font-weight:700; }
.up { color:#dc2626; } .down { color:#16a34a; }
.earn-insight { font-size:15px; color:#4b5563; line-height:1.85; }
.vp-summary { background:#eef4ff; border:1px solid #d6e4ff; border-left:4px solid #1d4ed8; border-radius:8px; padding:12px 14px; margin-bottom:14px; font-size:13px; color:#1e3a5f; line-height:1.75; }
.vp-summary b { color:#1d4ed8; }
.prod-sub { margin-top:8px; padding:9px 12px; background:#f9fafb; border-radius:6px; font-size:12.5px; color:#374151; line-height:1.65; }
.prod-sub b { color:#1f2937; }
.prod-advice { margin-top:8px; padding:10px 12px; background:#fff7ed; border-left:3px solid #ea580c; border-radius:6px; font-size:12.5px; color:#7c2d12; line-height:1.65; }
.prod-advice b { color:#ea580c; }
/* 财报重点厂家高亮 + 1页纸KPI网格 */
.earn-key { display:inline-block; background:#fee2e2; color:#dc2626; font-size:10px; font-weight:800; padding:2px 9px; border-radius:10px; margin-left:8px; vertical-align:middle; letter-spacing:.5px; }
.earn-kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
@media(max-width:900px){ .earn-kpi { grid-template-columns:repeat(2,1fr); } }
.earn-kpi .kpi { background:linear-gradient(180deg,#fff,#f8fafc); }
.earn-viewpoint { margin-top:10px; padding:10px 12px; background:#f0f9ff; border-radius:6px; font-size:12.5px; color:#374151; line-height:1.7; }
.earn-viewpoint b { color:#0369a1; }
/* 新品/市场模块色条 */
.mod-tag { display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:10px; color:#fff; margin-left:8px; vertical-align:middle; }
.ai-advice { margin-top:8px; padding:9px 12px; background:#f0fdf4; border-left:3px solid #16a34a; border-radius:6px; font-size:12px; color:#14532d; line-height:1.6; }
.mkt-extra { margin-top:14px; }
.mkt-sub { font-size:13px; font-weight:700; color:#1f2937; margin:14px 0 6px; }
.mkt-sub .en { font-size:11px; color:#9ca3af; font-weight:400; }
.up { color:#16a34a; font-weight:700; }
.down { color:#dc2626; font-weight:700; }

/* Tab4 market */
.mkt-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.mkt-tab { padding:6px 14px; border:1px solid #e5e7eb; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; background:#fff; color:#6b7280; }
.mkt-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.chart-box { width:100%; height:340px; }
.toggle-tbl { font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; }
.data-tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; display:none; }
.data-tbl.show { display:table; }
.data-tbl th, .data-tbl td { border:1px solid #e5e7eb; padding:7px 8px; text-align:left; }
.data-tbl th { background:#f9fafb; font-weight:700; }

/* Tab5 AI */
.ai-stat-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
.ai-stat { border:1px solid #e5e7eb; border-radius:10px; padding:14px; background:linear-gradient(180deg,#eef2ff,#fff); }
.ai-stat .num { font-size:22px; font-weight:800; color:#3730a3; }
.ai-stat .lbl { font-size:11px; color:#6b7280; margin-top:2px; }

/* ===== 汇总提炼页：分行条理 + 大字体 + 观点直接 ===== */
.summary-box { background:#eef4ff; border:1px solid #d6e4ff; border-left:4px solid var(--accent); border-radius:10px; padding:16px 20px; margin-bottom:16px; font-size:15px; line-height:1.95; color:#1e3a5f; }
.summary-box .lbl { font-weight:800; color:var(--accent-deep); display:block; margin-bottom:10px; font-size:15.5px; }
.summary-lines > div { padding:6px 0; border-bottom:1px dashed #e3ecfd; }
.summary-lines > div:last-child { border-bottom:none; }
.summary-lines .mk { color:var(--accent); font-weight:800; margin-right:7px; }


/* 全球/中国切换 */
.gc-toggle { display:inline-flex; gap:6px; margin-bottom:14px; }
.gc-btn { padding:6px 18px; border:1px solid #e5e7eb; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; background:#fff; color:#6b7280; transition:all .15s; }
.gc-btn:hover { color:var(--accent); background:var(--accent-soft); }
.gc-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 存储价格曲线（持续刷新跟踪） */
.storage-note { font-size:11.5px; color:#6b7280; margin-top:8px; line-height:1.6; }
.price-chart { width:100%; height:330px; }
/* 实际价格曲线（绝对数值）· 权限门禁 */
.pg-divider { height:1px; background:linear-gradient(90deg,#e5e7eb,transparent); margin:18px 0 14px; }
.pg-head { margin-bottom:8px; }
.pg-title { font-size:14.5px; font-weight:700; color:#1f2937; }
.pg-sub { font-size:11.5px; color:#6b7280; margin-left:6px; }
.price-lock { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:34px 16px; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:12px; }
.pl-icon { font-size:30px; }
.pl-txt { font-size:14px; color:#64748b; font-weight:600; }
.pl-btn { padding:9px 20px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s; }
.pl-btn:hover { filter:brightness(1.08); }
.pl-hint { font-size:11px; color:#94a3b8; margin-top:2px; text-align:center; max-width:340px; line-height:1.5; }

/* 上下游成本结构化部件卡 */
.cost-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
.cost-card { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; background:#fff; }
.cost-card .cc-name { font-size:14.5px; font-weight:800; color:#1f2937; display:flex; align-items:center; gap:8px; }
.cost-card .cc-dir { font-size:11px; font-weight:800; padding:2px 9px; border-radius:10px; white-space:nowrap; }
.cc-up { background:#fdecec; color:#dc2626; } .cc-down { background:#e7f6ec; color:#16a34a; } .cc-flat{ background:#eef2f7; color:#6b7280; }
.cost-card .cc-change { font-size:13px; color:#374151; margin-top:9px; line-height:1.65; }
.cost-card .cc-impact { margin-top:9px; padding:9px 11px; background:#f9fafb; border-left:3px solid var(--accent); border-radius:6px; font-size:12.5px; color:#4b5563; line-height:1.65; }
.cost-card .cc-impact b { color:var(--accent-deep); }
.cost-takeaway { margin-top:14px; padding:12px 16px; background:#eef4ff; border:1px solid #d6e4ff; border-radius:10px; font-size:14px; color:#1e3a5f; line-height:1.8; }
.cost-takeaway b { color:var(--accent-deep); }

.footer { text-align:center; color:#9ca3af; font-size:11px; padding:24px; }

/* ===== 财报速递：观点总览加颜色 + 换行结构化 ===== */
.snap-box { border-radius:10px; padding:13px 16px; margin-bottom:12px; line-height:1.85; font-size:14px; }
.snap-box.find { background:#eff6ff; border-left:4px solid #1d4ed8; color:#1e3a5f; }
.snap-box.impl { background:#fff7ed; border-left:4px solid #ea580c; color:#7c2d12; }
.snap-box .snap-h { font-weight:800; font-size:14.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.snap-box.find .snap-h { color:#1d4ed8; }
.snap-box.impl .snap-h { color:#ea580c; }
.nl { margin-top:6px; }
.nl-i { padding:5px 0; border-bottom:1px dashed #e3ecfd; line-height:1.8; font-size:13.5px; color:#374151; }
.nl-i:last-child { border-bottom:none; }
.nl-i .mk { color:var(--accent); font-weight:800; margin-right:7px; }
.earn-viewpoint b { color:#1d4ed8; }
.earn-insight b { color:#ea580c; }
.earn-kpi .kpi .ky { color:var(--accent); }

/* ===== 意见领袖：原话红粗 + 来源链接 ===== */
.hl-red { color:#dc2626; font-weight:800; }
.vp-link { color:#2563eb; font-size:11.5px; font-weight:600; margin-left:5px; white-space:nowrap; }
.vp-link:hover { text-decoration:underline; }
.person-head { display:flex; align-items:baseline; gap:6px; margin-bottom:6px; }

/* ===== 新品发布解读：子版块四色配色 + 日历公司标色 ===== */
.prod-summary { font-size:15px; font-weight:600; color:#1f2937; line-height:1.9; }
.prod-strategy { margin-top:10px; padding:11px 14px; background:#eff6ff; border-left:4px solid #1d4ed8; border-radius:6px; font-size:14px; color:#1e3a5f; line-height:1.85; }
.prod-strategy b { color:#1d4ed8; }
.prod-compete { margin-top:8px; padding:11px 14px; background:#f0fdf4; border-left:4px solid #16a34a; border-radius:6px; font-size:14px; color:#14532d; line-height:1.85; }
.prod-compete b { color:#16a34a; }
.prod-consumer { margin-top:8px; padding:11px 14px; background:#faf5ff; border-left:4px solid #7c3aed; border-radius:6px; font-size:14px; color:#4c1d95; line-height:1.85; }
.prod-consumer b { color:#7c3aed; }
.prod-advice { margin-top:8px; padding:11px 14px; background:#fff7ed; border-left:4px solid #ea580c; border-radius:6px; font-size:14px; color:#7c2d12; line-height:1.85; }
.prod-advice b { color:#ea580c; }
.ev-brand { font-weight:800; font-size:12px; }
.cal-cell .evt { margin-top:4px; color:#374151; font-weight:500; line-height:1.4; }

/* ===== 市场大盘：厂商份额柱状图 ===== */
.share-chart { width:100%; height:300px; margin-top:10px; }



.ab-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.ab-kpi{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;}
.ab-v{font-size:24px;font-weight:800;color:var(--accent);}
.ab-u{font-size:12px;font-weight:700;color:#6b7280;margin-left:3px;}

<body>
<header class="header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="46" height="46">

<script>const DATA = {"terminal": {"updateTime": "2026-09-01 06:00", "headlineViewpoints": [{"tag": "集体涨价", "t": "9月1日华为小米荣耀手机集体调价：**存储+芯片双涨倒逼终端全面提价，成本驱动型涨价从预期变为现实**", "s": "核心观点：9/1华为Mate 80全系调价（标准版+800元/Pro与Pro Max+1000元，涨幅11%-17%）、荣耀Power2/Magic8同步上调200-500元、小米17系列及REDMI K90系列涨300-500元——这是3月以来第三轮全行业调价，直接导火索是12GB+256GB存储套片采购价从500元飙至2200元（+300%），叠加高通9/1起芯片涨价两位数百分比。余承东直言“按原价都是亏损销售”。高层建议：【短期·经营】9月新旗舰定价需一步到位（避免二次调价伤品牌），配套以旧换新与分期方案缓冲消费者感知；【中期·战略】成本上行周期是推高端化的窗口，但需警惕走量机型断档导致的份额流失，建议保留1-2款降规格走量机守住基本盘。", "l": "IT之家/网易", "u": "https://www.163.com/dy/article/L5N4AN2S0511B8LM.html"}, {"tag": "华为半年报", "t": "华为H1营收4678亿研发投入1214亿创历史新高：**研发占比25.9%撑起芯片+鸿蒙双自研闭环，手机出货+19.4%逆势登顶**", "s": "核心观点：8/31华为披露2026半年报，上半年营收4678.19亿元（+9.55%），净利润234.27亿元（同比下滑主因研发与供应链投入加大），研发费用1213.82亿元创历史新高、占营收25.94%——这是“国产芯片+鸿蒙”双自研路线的财务代价与护城河。2026上半年中国手机出货1.34亿台，华为以20.6%份额居首、出货同比+19.4%为少数正增长厂商。Mate 80系列累计销量881万台距千万一步之遥，Pura 90系列128.82万台。高层建议：【长期·方向】25.9%研发占比是自研路线的必要投入，建议集团终端对标此强度持续投入芯片与OS底层；【短期·经营】Mate 80涨千元后需观察9月Mate 90发布前的需求衔接，避免涨价抑制过渡期销量。", "l": "每日经济新闻/腾讯新闻", "u": "https://news.qq.com/rain/a/20260901A02HLI00"}, {"tag": "折叠屏9月对撞", "t": "9月折叠屏三方对撞华为抢跑苹果入局：**Counterpoint预测2026折叠屏出货+20%，苹果首年夺28%份额重塑格局**", "s": "核心观点：9月成为折叠屏历史性月份——华为Mate XT 2三折叠9/7抢跑、苹果首款折叠iPhone Ultra 9/10入场、小米18 Fold阔折叠9月初跟进。Counterpoint预测2026年全球折叠屏出货同比+20%，苹果首款折叠iPhone将夺28%份额。华为两代三折叠累计发货已破100万台（Q1占国内折叠屏60%），Mate XT 2从Z型改G型双内折解决耐用痛点+独立外屏降低使用门槛。苹果折叠iPhone取消Face ID改侧边Touch ID、后置仅双摄无长焦，以4.5mm展开厚度追求近乎无折痕。高层建议：【中期·战略】苹果入局是折叠屏从品类创新走向主流的关键拐点，华为应抢跑48小时固化三折叠=华为心智；小米阔折叠以价格带（9999元网传）卡位苹果与华为之间的空白段。", "l": "北京日报/腾讯新闻", "u": "https://news.qq.com/rain/a/20260901A00M3J00"}, {"tag": "三折叠预订", "t": "Mate XT 2非凡大师8/31开启预订：**全系16GB+512GB至2TB+灵盾防窥屏，从参数炫耀进化为商务生产力工具**", "s": "核心观点：8/31华为Mate XT 2非凡大师在官网开启预订，全系标配16GB内存、512GB至2TB存储，搭载麒麟9030S+HarmonyOS 7，配备灵盾防窥屏与3D人脸识别——定位明确指向高端商务用户。G型展翼折叠使主屏完全包裹机身内不外露，3.5mm超薄机身内集成内外双屏。从初代“能造出来”到二代“能放心每天用”，独立外屏解决三折叠日常使用门槛过高的痛点。博主爆料起售17999元、顶配或破3万元。高层建议：【中期·战略】2万元档需保证产能与渠道资源匹配首发声量；灵盾防窥+3D人脸是商务场景的差异化卖点，建议在传播中突出“安全+生产力”而非单纯形态创新。", "l": "网易/IT之家", "u": "https://dy.163.com/article/L5MU0FRR0556GYP2.html"}, {"tag": "旗舰砍单", "t": "多家厂商旗舰机计划量下调30%-50%：**存储成本首次反超处理器成BOM第一大户，以量换价时代终结**", "s": "核心观点：8/31数码博主@RD观测爆料，因存储芯片价格“离谱”暴涨（12GB+256GB套片从500元飙至2200元、+300%），多家厂商将新一代旗舰计划量下调30%-50%，销量预期砍至上代50%。小米全年出货目标从1.35亿部砍约30%至9500万部，OPPO/vivo均降至9000万部以下。存储成本占BOM从10%-15%飙至30%-60%，中低端机型存储成本占比甚至突破60%——内存首次反超处理器成为手机物料成本第一大项。仅处理器+内存+闪存三大件合计已超4000元。高层建议：【长期·方向】“以量换价”模式已终结，终端战略须从出货规模转向ASP与利润；建议集团终端加速国产存储适配（如长鑫LPDDR6），降低对三星/SK海力士单一供应链依赖。", "l": "新浪科技/财经头条", "u": "https://t.cj.sina.com.cn/articles/view/7879996098/1d5af32c206801mk6g"}, {"tag": "份额登顶", "t": "徐直军官宣华为手机2026重回中国份额第一：**国产芯片+鸿蒙生态完成飞行换发动机，季度优势持续扩大**", "s": "核心观点：8/30鸿蒙生态大会2026上徐直军确认，2026年华为手机凭国产芯片与鸿蒙系统重回中国市场发货量份额第一，且每季度领先优势持续扩大——鸿蒙原生应用突破10万个、可获取应用超40万个、头部应用满意度已超HarmonyOS 5前水平，HarmonyOS 6终端装机破8000万、Q4冲1亿。高层建议：【长期·方向】1亿装机是生态正循环临界点，建议把Q4冲刺与新机首发（Mate XT 2/Mate 90）节奏绑定，用首销带动装机跳变；出海以端侧AI+隐私合规为差异化卖点，优先选择合规门槛较低市场切入。", "l": "中国证券网/深圳新闻网", "u": "https://www.cnstock.com/commonDetail/779940"}, {"tag": "9月混战", "t": "9月史上最拥挤新品月六大品牌对撞：**成本倒逼下高端先行走量后置成行业共识，2nm+折叠屏双主线**", "s": "核心观点：9月华为（Mate XT 2 9/7、Mate 90 9/23）、苹果（iPhone 18 Pro+折叠Ultra 9/10）、小米（18 Fold 9/5网传、18 Pro 9月底）、荣耀（Magic9 9/28）、vivo（X500 9/15）、OPPO（Find X10 9/23网传）六品牌扎堆。苹果罕见地将标准版iPhone 18推迟至2027春季、折叠屏比标准版更早登场——“高端先行、走量后置”成行业共识。2nm芯片（A20 Pro/麒麟9050 Pro）首次集中落地叠加折叠屏三方对撞构成9月双主线。网传定价全线走高：Mate XT 2起17999元、iPhone折叠14999元起、小米18 Fold 9999元起。高层建议：【短期·经营】9月营销资源按产品线（折叠/直板旗舰/中端）分配而非集中投放；定价上调需配套以旧换新与分期方案。", "l": "腾讯新闻/IT之家", "u": "https://news.qq.com/rain/a/20260831A0AJBU00"}, {"tag": "国产协同", "t": "小米18 Fold首发长鑫LPDDR6：**处理器+内存双国产首次落地旗舰，芯存协同打破海外垄断**", "s": "核心观点：8/29-30长鑫存储宣布LPDDR6内存正式量产（峰值速率12800Mbps），小米18 Fold全球首发搭载，配合自研玄戒O3芯片（3nm/240亿晶体管/安兔522万），雷军转发祝贺——这是国产手机首次在处理器和内存两条线同时实现国产化。长鑫官微首个关注对象正是小米手机，标志芯存协同从概念走向商用。三星/SK海力士LPDDR6规划在2026下半年出货，长鑫量产节奏与国际大厂同步。高层建议：【长期·方向】芯存双国产是比跑分更硬的叙事，建议集团终端在自研芯片路线中同步布局国产存储适配，降低对三星/SK海力士单一供应链的依赖；关注玄戒O3在折叠屏机身散热受限环境下的真机表现。", "l": "21世纪经济报道/IT之家", "u": "https://view.inews.qq.com/a/20260830A03WJU00"}, {"tag": "旗舰节奏", "t": "华为Mate 90系列9/23深圳发布确认：**四款旗舰首发韬定律麒麟，定价或上调但国庆前可入手**", "s": "核心观点：8/30文旅部审批系统显示华为终端发布会助兴演出获批，9/23在深圳国际会展中心20号馆举办，Mate 90系列四款机型（标准/Pro/Pro Max/RS非凡大师）将发布，首发韬定律麒麟芯片（标准版麒麟9030/Pro及以上麒麟9050 Pro），预装鸿蒙7正式版；因内存涨价定价或上调但用户有望国庆前入手。博主分析9/7发布会重点看折叠+鸿蒙7，9/23才是直板旗舰和新麒麟的主场。高层建议：【短期·经营】9月两场发布会分工明确（7日折叠+OS/23日直板旗舰+芯片），建议营销资源按产品线分配而非集中；定价上调需配套以旧换新与分期方案缓冲消费者感知。", "l": "TechWeb/今日头条", "u": "https://view.inews.qq.com/a/20260830A05BIA00"}, {"tag": "低端退潮", "t": "东南亚Q2手机出货暴跌23%创2014年新低：**100美元以下机型几乎清零，存储涨价击穿低端商业模式**", "s": "核心观点：Omdia 8月报告显示2026 Q2东南亚智能手机出货1930万部（-23%），创2014年以来最低。OPPO -41%（100美元以下机型出货-96%）、vivo -88%、传音-47%、小米-69%/-21%——100美元以下机型被涨价逼成“两千元机”后，价格敏感用户直接退出市场而非升级。三星以20%份额逆势登顶（-11%），传音18%第二。这验证了“存储涨价→低端不赚钱→砍低端→用户退出”的负循环。高层建议：【长期·方向】低端走量模式在存储涨价周期内已结构性失效，建议集团终端海外策略从“低价走量”转向“中高端精选+生态溢价”；关注传音在非洲/东南亚的渠道韧性是否足以扛过周期。", "l": "Omdia/今日头条", "u": "https://www.businesswirechina.com/hk/news/63842.html"}], "opinionLeaders": [{"name": "余承东", "role": "华为终端BG董事长", "items": [{"hl": "8/29展示Mate XT 2三折叠真机G型展翼折叠+独立外屏，8/31开启预订全系16GB+512GB至2TB", "detail": "9/7 14:30随HarmonyOS 7发布会登场；两代三折叠累计发货破100万台；顶配或破3万元；全系标配灵盾防窥屏+3D人脸识别", "l": "IT之家/网易", "u": "https://dy.163.com/article/L5MU0FRR0556GYP2.html"}, {"hl": "公开预警：内存涨价下所有手机都要大规模涨价，按原价都是亏损销售", "detail": "Pura 90系列单台内存物料成本较上代增加超1500元；华为通过压缩渠道利润、生态收益补贴硬件亏损等方式消化，但已接近承受红线", "l": "东方财富/财联社", "u": "https://caifuhao.eastmoney.com/news/20260831174354878626770"}]}, {"name": "徐直军", "role": "华为轮值董事长", "items": [{"hl": "鸿蒙生态大会定调：华为手机2026重回中国份额第一，鸿蒙Q4冲1亿", "detail": "HarmonyOS 6装机破8000万（日均增17万+）；原生应用超10万、可获取超40万；飞行换发动机成功；但离成功还有AI智能化领先与全球化出海两硬考验", "l": "中国证券网/南方+", "u": "https://www.cnstock.com/commonDetail/779940"}]}, {"name": "卢伟冰", "role": "小米集团总裁", "items": [{"hl": "中期业绩电话会预判：下半年内存涨价将趋缓但涨势持续，存储成本仍处高位", "detail": "小米Q2手机出货3120万台(-26% yoy)但ASP 1350元(+26%)、毛利率8.5%好于预期；全年出货目标下调约30%至9500万部", "l": "今日头条/新浪科技", "u": "https://www.toutiao.com/article/7677925215103369755"}]}, {"name": "马继华", "role": "资深通信行业专家", "items": [{"hl": "存储涨价+换机周期拉长+出货下降三重压力下，厂商不得不提价并更多投向中高端和折叠屏", "detail": "单纯提价会抑制销售，因此厂商将资源更多投向利润空间更充足的中高端和折叠屏市场，高端机型成为维持营收和利润的窗口", "l": "北京日报/腾讯新闻", "u": "https://news.qq.com/rain/a/20260901A00M3J00"}]}], "leadersSummary": "①**余承东密集预热Mate XT 2三折叠9/7定档+预警手机全面涨价**，G型展翼折叠解决耐用痛点+全系16GB至2TB+灵盾防窥屏，8/31开启预订。②**徐直军官宣华为重回中国份额第一**，鸿蒙装机Q4冲1亿，但出海与AI智能化是两大考验。③**卢伟冰预判下半年内存涨价趋缓但持续**，小米全年出货目标砍30%至9500万部、ASP+26%以价补量。④**马继华指出存储涨价倒逼厂商转向中高端与折叠屏**，单纯提价抑制销售，高端化是维持营收利润的窗口。", "institutionViews": [{"name": "Counterpoint", "items": [{"t": "Q2全球智能手机营收+7%至1090亿美元创Q2新高，但出货-11%创13年最低；ASP+17%至400美元", "s": "苹果营收份额49%创新高（营收+22%/出货+13%），三星16%第二，小米出货-26%为前五最大跌幅；存储成本上涨是出货下滑主因，预计短缺持续到2027年。2026年折叠屏出货预计+20%，苹果首年夺28%份额。", "l": "Counterpoint Research", "u": "https://t.cj.sina.com.cn/articles/view/7879849013/1d5acf43506802qst8"}, {"t": "2026年全球手机出货预计-14%，涨价周期可能延续至2027年底", "s": "高端市场（600美元+）销量同比+5%占总销量29%创新高，苹果+三星合计占高端84%；400美元以下机型出货预计-22%以上，极致低价走量模式难以为继", "l": "Counterpoint/bricksite", "u": "https://bricksite.com/kjdata/nyhedsbrev?live-blog-17028247-2026-07-14-dc-supply-chain-google-global-smartphone-shipments-fall-11-on-memory-shortage-tu"}]}, {"name": "IDC", "items": [{"t": "Q2全球手机出货2.775亿部(-6.7%)连续两季下滑，中国6601万台(-4.3%)连缩5季", "s": "全球：三星6270万(+8.1%)/苹果5580万(+15.3%)/小米3120万(-26.3%)；中国：华为22.6%重回第一(+19.4%)，前十仅华为苹果正增长；预计下半年中国出货同比降幅扩大至20%左右", "l": "IDC/联合资信", "u": "https://pdf.dfcfw.com/pdf/H3_AP202608311828818293_1.pdf"}, {"t": "2026年全球手机均价预计上涨27.6%至581美元，出货量同比-16.7%创历史最大降幅", "s": "存储成本占BOM从10%-15%飙至30%-60%，中低端机型甚至超60%；厂商旗舰计划量下调30%-50%，涨价周期预计延续至2027年底", "l": "IDC/新浪科技", "u": "https://k.sina.com.cn/article_7879776381_1d5abd87d06801p4pg.html"}]}], "instsSummary": "【9/1更新】Counterpoint：Q2全球营收1090亿美元创Q2新高但出货13年最低（-11%），苹果营收份额49%/小米出货-26%最大跌幅；存储占BOM从13%飙至43%；2026折叠屏出货+20%苹果首年夺28%。IDC：Q2全球出货2.775亿部(-6.7%)、中国6601万台(-4.3%)连缩5季，华为22.6%重回中国第一(+19.4%)；预计全年出货-16.7%创历史最大降幅、均价+27.6%至581美元；下半年中国降幅或扩大至20%。Omdia：Q2东南亚出货-23%创2014年新低，OPPO -41%/100美元以下机型几乎清零。", "topNews": [{"t": "9/1华为小米荣耀手机集体调价：Mate 80涨800-1000元、小米17涨300-500元、荣耀Power2/Magic8跟涨", "s": "主因存储套片采购价从500元飙至2200元(+300%)叠加高通9/1芯片涨价两位数百分比；余承东称按原价都是亏损销售", "u": "https://www.163.com/dy/article/L5N4AN2S0511B8LM.html"}, {"t": "华为H1营收4678亿元(+9.55%)研发投入1214亿创历史新高占营收25.9%", "s": "净利润234.27亿元同比下滑；上半年中国手机出货1.34亿台华为以20.6%份额居首、出货同比+19.4%为少数正增长厂商", "u": "https://news.qq.com/rain/a/20260901A02HLI00"}, {"t": "Mate XT 2非凡大师8/31开启预订：全系16GB+512GB至2TB+灵盾防窥屏+3D人脸识别", "s": "G型展翼双内折主屏完全包裹机身内、3.5mm超薄机身集成内外双屏；搭载麒麟9030S+HarmonyOS 7；9/7 14:30发布", "u": "https://dy.163.com/article/L5MU0FRR0556GYP2.html"}, {"t": "9月折叠屏三方对撞：华为Mate XT 2 9/7抢跑、苹果首款折叠iPhone 9/10入局、小米18 Fold阔折叠9月初跟进", "s": "Counterpoint预测2026年全球折叠屏出货+20%，苹果首年夺28%份额；苹果折叠取消Face ID改侧边Touch ID、后置仅双摄无长焦", "u": "https://news.qq.com/rain/a/20260901A00M3J00"}, {"t": "多家厂商旗舰机计划量下调30%-50%：存储成本首次反超处理器成BOM第一大户", "s": "小米全年出货目标从1.35亿部砍30%至9500万部，OPPO/vivo均降至9000万部以下；仅处理器+内存+闪存三大件合计已超4000元", "u": "https://t.cj.sina.com.cn/articles/view/7879996098/1d5af32c206801mk6g"}, {"t": "徐直军鸿蒙生态大会官宣：华为手机2026重回中国发货量份额第一，每季度优势持续扩大", "s": "HarmonyOS 6装机破8000万（Q4冲1亿）、原生应用超10万、可获取超40万；用国产芯片+鸿蒙实现飞行换发动机", "u": "https://www.cnstock.com/commonDetail/779940"}, {"t": "余承东展示Mate XT 2三折叠真机：G型展翼折叠+独立外屏，9/7 14:30随HarmonyOS 7发布", "s": "折叠方式从Z型改为G型双内折，主屏完全包裹机身内不外露；八边形镜头模组；余承东称业界最薄最大", "u": "https://new.qq.com/rain/a/20260830A04Z5Z00"}, {"t": "华为Mate 90系列9/23深圳发布确认：四款旗舰首发韬定律麒麟芯片", "s": "标准版麒麟9030/Pro及以上麒麟9050 Pro，预装鸿蒙7正式版；因内存涨价定价或上调但国庆前可入手", "u": "https://view.inews.qq.com/a/20260830A05BIA00"}, {"t": "苹果9/10秋季发布会确认：iPhone 18 Pro+折叠iPhone Ultra同台，标准版推迟至2027春季", "s": "折叠iPhone书本式内折/外屏5.5英寸/内屏7.8英寸/4.5mm展开厚度/A20 Pro 2nm/侧边Touch ID/后置双摄无长焦；国行起售14999元起", "u": "https://k.sina.cn/article_7879996431_1d5af340f06801jes6.html"}, {"t": "小米18 Fold首发长鑫LPDDR6+玄戒O3：处理器+内存双国产首次落地旗舰", "s": "长鑫LPDDR6峰值速率12800Mbps正式量产，小米18 Fold全球首发；玄戒O3为3nm/240亿晶体管/安兔522万", "u": "https://view.inews.qq.com/a/20260830A03WJU00"}, {"t": "华为Mate 80系列累计销量881万台距千万一步之遥，Pura 90系列128.82万台", "s": "截至第34周Mate 80系列单周仍保持约16万台出货；标准版销量占比六成，加量降价策略验证成功", "u": "https://k.sina.com.cn/article_7879849090_1d5acf48206801vg20.html"}, {"t": "Omdia：Q2东南亚手机出货暴跌23%创20 2万)，升级4颗激光雷达、全系后轮转向、线控转向、800V主动防倾杆，搭载自研双马赫M100芯片、29英寸OLED 6K屏、108kWh宁德时代5C电池，CLTC 710km、10分钟充电500km；纯电旗舰六座SUV i9将于9月中旬上市(40-50万、自研马赫M100+101kWh+CLTC 680-705km)，与MEGA互补覆盖高端多成员家庭。Q2营收257亿、毛利率11.0%(环比+3.1pct)、净亏约15亿(环比收窄)、经营现金流转正、回购6.31亿美元显信心；李想喊出'20万以上销量前三'。核心判断：理想纯电i系列与焕新MEGA的上市交付节奏是验证其纯电转型成败的关键窗口，4激光雷达+自研芯片标志其在智驾'平权'与'自研可控'双线推进。高层建议：【中期·经营】i9与焕新MEGA大定与毛利率修复拐点是核心观测，空窗期严控折扣库存，避免以价换量进一步侵蚀毛利；密切跟踪9月大定与纯电车型占比回升节奏。", "l": "腾讯新闻/网易", "u": "https://news.qq.com/rain/a/20260827A0BENF00"}, {"tag": "盈利标杆", "t": "零跑8月103,129(+80.7%)蝉联月冠且上半年首度半年度盈利：'规模×低价智驾'跑通，成第二家盈利新势力", "s": "核心观点：零跑8月全球交付103,129辆(+80.7%)、连续第二月破10万，1-8月累计约33.4万；上半年首次实现半年度净利润转正(营收381.1亿创同期新高、二季度毛利率环比升至12.6%)，成为继理想之后第二家半年度盈利的新势力。其'双高通8797+VLA把高阶智驾压到5-27万级'+借Stellantis出海(进阿根廷、B10启航欧洲)的组合验证'规模→毛利'路径。高层建议：【中期·经营】零跑盈利证明'规模兑现毛利'可行，集团应以BOM智驾占比重估同级成本，并在出海上借鉴'借力国际车企渠道'轻资产模式；同时警惕爆款后的交付质量与售后网络风险。", "l": "Harbor/财迅通/证券时报", "u": "http://app.hawkinsight.com/app/articleDetail?id=68b6cb9e4431ff663feb53c3&locales=zh_cns"}, {"tag": "L3路线图", "t": "华为乾崑划定L3商用时间表(2027规模商用/L4 2028城区试点)，引望牵头起草L3国标'动态驾驶任务安全'", "s": "核心观点：9/1华为乾崑发布会(靳玉志)首次完整披露自动驾驶商用路线图——L3预计2027年规模商用、L4将于2028年开启城区低速规模商用与全速部分城市试点，标志华为从L2++正式切换L3/L4赛道；云端训练算力从2023.12的2.8 EFLOPS攀升至2026.4的60 EFLOPS(三年21倍)，2026汽车智能化研发超180亿、未来五年算力累计700-800亿。引望作为国标'动态驾驶任务安全'章节核心起草单位，将超190万辆量产车、130亿公里真实里程转化为标准提案，并首批通过L3准入试点验证。高层建议：【长期·供应链】华为'L2→L3→L4'渐进式路线叠加巨额算力与合规资质，正把'方案商'做实为实体Tier1；集团在智驾选型与供应链安全上应同步评估'自研+引望外采'混合路径，并紧盯L3强制国标(2027.7)合规护城河带来的先发优势。", "l": "网通社/华为乾崑媒体日", "u": "https://m.news18a.com/news/storys_277382.html"}, {"tag": "乾崑外溢", "t": "乾崑从华为系走向全行业Tier1：奥迪Q5L城区NOA全国无图NCA、9月6款华为智驾新车最便宜10.49万", "s": "核心观点：华为乾崑智驾正突破'华为系'边界向全行业外溢——2026款奥迪Q5L搭载乾崑城区NOA、采用全国无图NCA方案(不限城市、园区小路可激活)，33颗感知硬件+双激光雷达实现'油电同智'，重庆8D路况实测稳健；9月将有智界RX、东风奕境X9、启境GX7、极狐阿尔法T7、神行者8、星海V6共6款华为智驾新车扎堆上市，最便宜10.49万起，乾崑按ADS SE/Pro/Max/Ultra分级输出。这标志引望'卖方案'第二曲线从鸿蒙智行扩至合资/央企/传统豪华品牌。高层建议：【长期·竞争】乾崑外溢稀释华为系'独家智驾'心智、但做大引望部件盘子；集团应关注奥迪等豪华品牌'油电同智'对高端燃油车的续命效应，评估乾崑外采在自有车型上的可行性与成本，避免被'非华为系也有华为智驾'叙事拉低溢价。", "l": "新浪汽车/电车实验室", "u": "https://auto.sina.cn/2026-09-01/detail-iniqhscx6751653.d.html"}, {"tag": "Robotaxi量产", "t": "特斯拉Cybercab今日(9/3)奥斯汀发布、Robotaxi量产爬坡；FSD入华'受阻'系谣言、全面批准预计2026 Q3", "s": "核心观点：特斯拉9/3在得州奥斯汀举行Cybercab发布会，首款完全为自动驾驶设计的原生车型——无方向盘、无踏板、无人工接管，目标售价低于3万美元、每英里运营成本约0.2美元，发布会嵌入Robotaxi服务并落地克拉克郡5000辆配额，标志Robotaxi从技术竞赛转向运营规模竞赛；Waymo、Uber同步扩容。FSD入华方面，8/26特斯拉中国回应'上海数据中心人去楼空、FSD数年入华无望'为不实信息并已报案，上海临港数据中心实现超30亿公里本土数据境内存储，CFO称目标Q3获全面商用许可。核心判断：Cybercab量产将强化全球高阶智驾渗透率提升预期，纯视觉方案倒逼算力与算法投入；一旦FSD在华全面落地，将补齐特斯拉智驾短板、正面硬刚华为/小鹏。高层建议：【中期·竞争】集团应把'纯视觉 vs 激光雷达'路线之争与数据合规能力纳入竞品监测，提前评估对高端智驾心智的稀释风险；同时关注Cybercab量产对智驾域控/线控底盘/传感器需求结构的重估。", "l": "腾讯新闻/广州日报", "u": "https://news.qq.com/rain/a/20260902A03VTT00"}, {"tag": "Robotaxi出海", "t": "中国Robotaxi出海驶入规模化竞速：特斯拉Cybercab今日发布催化、小马韩国200辆/文远海外+154%/小马Q2收入+691%", "s": "核心观点：特斯拉Cybercab 9/3发布为全球Robotaxi商业化添重磅催化，中国三席同步规模化——萝卜快跑全球28城、累计订单超2300万、总里程破3.5亿公里；小马智行Q2 Robotaxi收入8192万(+691.2%)、上半年1.4亿超2025全年，与韩国FutureLink签200辆(整车成本<23万)、年底目标3500辆；文远知行全球L4约3400辆、上半年海外收入+154%至1.19亿、Q2营收2.32亿(+82%)但净亏4.01亿(2029盈亏平衡)。千辆级车队被视作盈利分水岭，中国头部正逼近或跨越。核心判断：Robotaxi下半场看'上路规模+接单密度+成本'，中国方案成本仅为Waymo单车1/4-1/5、且借'技术方+出行平台+本地伙伴'协作框架出海；但文远'卖一辆亏一辆'、萝卜快跑曾集体趴窝暴露运营体系脆弱性，规模≠盈利。高层建议：【长期·战略】建议集团在出行生态布局中把自动驾驶商业化飞轮作为评估车企与科技伙伴的新维度，关注L3/L4强制国标(2027.7)合规护城河与成本优势；同时警惕'霸榜'数据背后的盈利与安全隐忧。", "l": "华夏时报/OFweek/虎嗅", "u": "https://www.163.com/dy/article/L5OV6I6E0512D03F.html"}, {"tag": "盈利拐点", "t": "蔚来Q2财报落地：营收321.4亿(+69.1%)、毛利率18.4%、调整后净利2610万转正，突破'越卖越亏'瓶颈", "s": "核心观点：蔚来9/1发布Q2财报，营收321.4亿元(+69.1%)、毛利59.1亿元(+211.3%)、毛利率18.4%(同比+8.4pct、创两年新高)、净亏损5.28亿元(同比收窄89.4%)、调整后净利润2610万元(去年同期亏损41.27亿)转正，标志蔚来突破'越卖越亏'瓶颈期、关键性拐点确认。Q2交付10.77万辆(+49.4%)；ES8占31%、ES9 1.17万辆、ONVO乐道2.91万(+70.5%)、Firefly 1.76万；H1累计26.29万辆。Q3指引交付10.8-11.1万辆(+24%-27.5%)、营收332.85-340.51亿(+52.7%-56.2%)。核心判断：'换电+多品牌'走量模式验证'走量+高端'扭亏路径，但下半年面临内存/材料/电池成本上涨2000-3000元/车的压力，毛利率可持续性是观察核心。高层建议：【中期·经营】可借鉴乐道走量引擎与费用纪律；ES8大定转化与Q3指引是观察盈利可持续性的窗口，关注成本上涨下毛利率能否守住Q2水平。", "l": "腾讯新闻/易车", "u": "https://new.qq.com/rain/a/20260901A0C5W500"}, {"tag": "比亚迪出海", "t": "比亚迪8月440,293创新高、海外189,466(+134.45%)创纪录占43%：出口 premium 抵消国内下滑", "s": "核心观点：比亚迪8月新能源销量440,293辆(+17.84%、环比+5.03%)创年内新高，连续4月同比正增；海外销售189,466辆(+134.45%、环比+4.95%)再创历史新高、占当月NEV销量43.03%，海外增量超过国内净增量、抵消内销下滑(国内250,827辆)。1-8月累计销量266.8万、海外超18万创纪录。在零跑/小鹏等围攻10-20万主流带时，比亚迪靠'结构升级(腾势/仰望)+出海'维持增收增利，印证出口是高毛利缓冲。高层建议：【中期·竞争】比亚迪'海外占比破43%'是价格战下最稳的利润对冲范式，集团应在出海产能(印尼/匈牙利)与渠道落地节奏上对标，同时在主流价格带警惕零跑式'半价高阶智驾'对海豚/元等走量车型的份额侵蚀。", "l": "CnEVPost/同花顺", "u": "https://cnevpost.com/2026/09/01/roundup-aug-2026-deliveries-chinese-automakers/"}], "opinionLeaders": [{"name": "余承东", "role": "华为终端 BG 董事长", "items": [{"hl": "鸿蒙智行累计交付破152万辆(53个月新势力最快)，五界矩阵成型", "detail": "共享途灵/巨鲸/鸿蒙座舱/乾崑ADS底座，差异化切分20-100万人群；问界M9订单破8万、累计破30万、NPS 87.2", "u": "https://auto.sina.cn/2026-09-01/detail-iniqhscx6715153.d.html", "l": "新浪汽车"}, {"hl": "享界G9获批北京120km/h L3路测牌，华为高端智驾获法规背书", "detail": "五界齐发成都车展；乾崑搭载将破200万；引望牵头起草L3国标", "u": "https://baike.baidu.com/item/%E4%B9%BE%E5%B4%91ADS%205.0/67693632", "l": "百度百科"}]}, {"name": "何小鹏", "role": "小鹏汽车董事长/CEO", "items": [{"hl": "小鹏8月交付39,107辆(+3.7%)创历史新高，1-8月累计27.16万", "detail": "GX单月7,338连续3月环比正增；G9L 9月上市启动交付、冲击单月6万", "u": "https://www.toutiao.com/article/7680536516904485386", "l": "每日经济新闻"}, {"hl": "二代VLA+图灵2250TOPS，把L4初阶智驾下沉主流带", "detail": "MONA L03成销量支柱；机器人业务首轮超9亿美元融资、IRON年底量产", "u": "https://new.qq.com/rain/a/20260822A0983D00", "l": "腾讯网"}]}, {"name": "靳玉志", "role": "引望公司 CEO", "items": [{"hl": "乾崑划定L3商用路线图：2027规模商用、L4 2028城区低速试点", "detail": "云端算力三年21倍(2.8→60 EFLOPS)；2026汽车智能化研发超180亿、未来五年算力累计700-800亿", "u": "https://m.news18a.com/news/storys_277382.html", "l": "网通社"}, {"hl": "乾崑外溢全行业：奥迪Q5L城区NOA全国无图NCA、9月6款华为智驾新车最便宜10.49万", "detail": "ADS 5 WEWA 2.0世界模型；车位到车位上半年4394.96万次(+694.75%)；享界G9获北京L3路测资质", "u": "https://auto.sina.cn/2026-09-01/detail-iniqhscx6751653.d.html", "l": "新浪汽车"}]}, {"name": "李想", "role": "理想汽车创始人/CEO", "items": [{"hl": "9/2发新一代MEGA Home(50.98万起·4激光雷达+后轮转向+线控转向)、9月发纯电旗舰i9，押注纯电翻盘", "detail": "MEGA Home较老款下调2万、CLTC 710km、10分钟充500km；i9 40-50万自研马赫M100；Q2毛利率11%环比修复", "u": "https://news.qq.com/rain/a/20260827A0BENF00", "l": "腾讯新闻" 生态+华为云国产算力差异化卡位政企办公，避免被单一互联网生态绑定；以多Agent编排+企业知识库做行业方案而非泛化聊天。", "l": "新京报/财联社/腾讯新闻", "u": "https://new.qq.com/rain/a/20260903A02OP300?refer=cp_1009"}, {"tag": "商业化", "t": "OpenAI商业化三引擎成型：ChatGPT Ads年化破10亿$、企业收入首超消费者(CFO确认ARR 40B$+20% MoM)，GPT-6(Astra)9月临近", "s": "核心观点：OpenAI 9/1披露ChatGPT广告年化收入破10亿$(上线仅200天，扩至印度/欧洲/中东/北非)；CFO Sarah Friar确认企业收入已首超消费者、整体ARR约40B$(同比约2倍、7月+20% MoM)；同时GPT-6基座(Bel,10万亿参数)完成预训练、Astra内测泄露、9月底DevDay聚焦。广告+企业+订阅三线并行，IPO前变现提速。高层建议：【战略】消费订阅见顶下，企业API+广告是OpenAI式变现双补；华为云应以高价值B端场景(办公/研发/客服)+国产算力成本优势做企业API，避免陷入消费订阅内卷。", "l": "环球网/路透/daily.dev", "u": "https://www.toutiao.com/article/7680461779930972712/"}, {"tag": "开源生态", "t": "DeepSeek全量开源V4多模态权重+Harness Agent框架(MIT)：开源范式从给API升级到开源权重+Agent基础设施，抢生态位", "s": "核心观点：8/31 DeepSeek开源V4-Flash-Vision-Exp多模态权重(MIT)，9/1再发首款Agent产品Harness v0.1(MIT，Model+Harness=Agent，兼容近40家模型、发布不到一天GitHub星标破5000)，从只给API转向全量开源权重+Agent基础设施。与OpenAI闭源模型+自研芯片闭环形成鲜明对比。高层建议：【生态】开源框架+多模型兼容是比单模型更深的护城河；华为云应以昇腾+开放权重+多模型路由卡位，把DeepSeek/Qwen/GLM纳入可选底座，以开发者生态对抗闭源绑定。", "l": "科创板日报/Hugging Face", "u": "https://huggingface.co/deepseek-ai"}, {"tag": "组织与人才", "t": "腾讯撤销存在十年的AI Lab、姚顺雨任首席AI科学家：中国互联网巨头AI战略从「分散探索」转向「集中攻坚」，人才与算力向基础模型收敛", "s": "核心观点：9/1腾讯撤销AI Lab，基础模型部整合、姚顺雨任首席AI科学家兼基础模型部负责人，标志其AI架构从分散走向集中；同期字节上调豆包股价格近15%(14.85→17.02美元/股)激励Seed等AI团队、却推迟豆包大模型2.2以补编程与Agent能力。巨头正以组织与股权手段锁定AI核心人才与路线。高层建议：【组织】AI竞争进入「基础模型+人才」决胜期，华为云/终端应审视AI研发组织是否过散，参考腾讯收口基础模型、以首席科学家制集中决策；以股权/项目制锁定Seed级人才。", "l": "亿欧/九派财经/钛媒体", "u": "https://new.qq.com/rain/a/20260901A07HVJ00?refer=cp_1009"}, {"tag": "需求侧", "t": "国家数据局：我国日均词元调用破500万亿、两年增5000倍；美银称中国四大云2026 capex冲7260亿元：AI需求从「建电站」降至「插电卡」，云端进入新上行周期", "s": "核心观点：国家数据局8/30披露我国日均词元调用突破500万亿、两年增长超5000倍，「算力优化师」新职业应运而生，企业用AI门槛从「建电站」降到「插电卡」；美银美林称中国四大云(阿里/腾讯/字节/百度)2025 capex近4000亿→2026预计7260亿→2027破万亿，MaaS(模型即服务)2030达6760亿(CAGR 81%)为最快赛道。需求侧爆发正直接拉动基础设施投资。高层建议：【投资】云端进入新一轮上行周期，MaaS是国内云厂最确定性变现赛道；华为云应踩准「AI云份额2025 17%→2030 66%」窗口，以国产算力成本优势抢MaaS份额。", "l": "央视新闻/美银美林/腾讯新闻", "u": "https://news.qq.com/rain/a/20260901A04OK500"}, {"tag": "开源模型", "t": "智谱GLM-5.3-Flash匿名「牛来(Ox Alpha)」登顶OpenRouter、中国模型连续19周霸榜：开源+原生多模态+极致性价比已在第三方聚合平台实打实反超闭源", "s": "核心观点：OpenRouter 8/29周数据显示中国模型全球周调用68.1万亿tokens、连续19周居首、中美差距扩大至4.8倍；智谱Ox Alpha=GLM-5.3-Flash（首个原生多模态GLM-5、开源、限时1/20价）登顶该周、单周27.2T刷新纪录。竞争主战场已从参数彻底转向生态+性价比+多模态。高层建议：【战略】开源生态是比单模型更深的护城河；华为云应以昇腾+开放权重+多模型路由卡位，把Qwen/DeepSeek/GLM-5.3纳入可选底座，避免被单一闭源绑定。", "l": "OpenRouter/慕斯的游话/IT之家", "u": "https://www.ithome.com/"}, {"tag": "商业化", "t": "Anthropic年化run-rate冲至650亿美元、首超OpenAI：AI商业化价值正从消费者订阅切换至企业API/Agent用量", "s": "核心观点：Anthropic 7月run-rate约650亿美元、4月即反超OpenAI（OpenAI约250亿$且自2月增长停滞），企业/API收入占比80%+；Claude Code年化收入约80亿$、占企业大模型API份额32%(Q2，首超OpenAI 25%)。闭源守顶层高利润、开源占底层基座的混合范式确立。高层建议：【战略】华为云/终端应把企业API+Agent用量作为AI变现主轴，以高价值B端场景（办公/研发/客服）对抗消费订阅内卷；参考Anthropic以安全合规+长上下文抢监管行业。", "l": "ValueAdd VC/SemiAnalysis/同花顺", "u": "https://valueaddvc.com/blog/anthropics-business-model-how-the-ai-safety-company-makes-money"}, {"tag": "算力", "t": "英伟达Q2营收962亿美元创新高、Vera Rubin量产：AI算力供需缺口扩大，云端capex军备竞赛无刹车，英伟达成最确定性赢家", "s": "核心观点：英伟达FY27Q2营收962亿(+106%)、净利597亿(+126%)、数据中心890亿(+117%)占92%、毛利率75%；Vera Rubin全面量产、Q3指引1080亿；AWS 2027–28部署200万GPU，五大超大规模云2026 capex近8000亿$、2027达1.3万亿$。黄仁勋称AI已到拐点，算力即收入，但供给仅满足约70%需求。高层建议：【供应链】算力成本成应用侧硬约束；华为应加速昇腾量产与国产算力适配，以国产算力+开放模型组合对冲外部供给与成本风险。", "l": "Gulf News/经济时报/Kiplinger", "u": "https://cio.economictimes.indiatimes.com/news/artificial-intelligence/nvidia-q2-net-income-more-than-doubles-to-59-7-billion-on-robust-ai-chip-demand/133561627"}, {"tag": "开源模型", "t": "中国开源模型连续16周霸榜OpenRouter、调用量3.6倍于美国：**全球AI竞争主战场已从「参数」彻底转向「生态与性价比」**", "s": "核心观点：OpenRouter 8/10–16周数据显示全球周调用量75.3万亿Token、环比+9.13%，其中中国模型36.84万亿、美国10.26万亿，中国连续16周居首（差距3.6倍）；单模型DeepSeek-V4-Flash 7.22万亿居首，前五中国占四席。HuggingFace《开放模型现状》称Qwen系列累计下载超30亿次（Google约4.18亿、Meta约2.27亿）登顶全球第一，智谱OxAlpha匿名登顶周榜。竞争从「谁参数大」转向「谁开源、谁更便宜、谁适配更广」。高层建议：【中期·战略】开源生态是比单模型更深的护城河；华为云应以「昇腾+开放权重+多模型路由」组合卡位，把Qwen/DeepSeek/Kimi纳入可选底座，避免被单一闭源绑定。", "l": "OpenRouter/赛迪网/HuggingFace", "u": "https://www.toutiao.com/article/7675655927231545871/"}, {"tag": "AI商业化", "t": "OpenAI企业收入首超消费者、年化run-rate冲40B$，但CRO离职、IPO前口径生变：**变现换挡，却伴高管动荡**", "s": "核心观点：OpenAI CFO Sarah Friar 8/14投资者会披露企业收入已超消费者（年初60/40消费占优），年化运行率(ARR)达400亿美元、约为2025年底两倍，7月收入环比+20%、企业客户+32%；广告run-rate近10亿美元。但同期CRO Denise Dresser(8/13)、Brad Lightcap(8/11)离职，新任CRO Dali Rajic接棒；SemiAnalysis称多家AI Lab为IPO将口径由「期末运行率ARR」改为更保守的「年化月度收入」，数字可比性需警惕。高层建议：【投资】OpenAI从消费订阅转向企业合约，收入可预见性提升利好高估值，但高管动荡与口径切换提示需交叉验证；集团应跟踪「企业API+订阅」双轨的国内对标（阿里百炼、腾讯云、火山引擎）。", "l": "Yahoo Finance/CNBC/SemiAnalysis", "u": "https://www.yahoo.com/finance/markets/stocks/articles/openai-investors-must-consider-latest-171700821.html"}, {"tag": "模型价格", "t": "GPT-5.6 Sol再降价20%至$4/$20、Promo至11月：**闭源旗舰价格锚加速下移，国产MoE性价比窗口被压缩**", "s": "核心观点：OpenAI 8/21将GPT-5.6 Sol输出价由$30降至$20、输入$5→$4每百万tokens，为7月发布以来首次旗舰降价、不到一个月内第二次（此前Terra/Luna已降），促销至11/21；Anthropic Claude Opus 5定价$5/$25、Grok 4.6 $2/$6、DeepSeek V4-Flash $0.14/$0.28形成「向下挤压」格局。闭源通过降价守住企业客户，直接对冲开源MoE的性价比冲击。高层建议：【短期·经营】模型价格下行是应用毛利改善的顺风，但会压低国内MaaS/API毛利；建议以「任务路由+国产低价模型」组合对冲，并把推理成本下降计入应用盈利模型。", "l": "Fello AI/OpenAI", "u": "https://felloai.com/best-ai-models/"}, {"tag": "AI办公", "t": "AI办公三强就位：豆包工作下场、WorkBuddy以1115万MAU居首，但字节「飞书打通」是差异化杀招", "s": "核心观点：8/25字节发布「豆包工作」（TRAE/扣子并入豆包体系），与阿里千问办公、腾讯WorkBuddy构成AI办公三强；易观数据WorkBuddy（腾讯）7月MAU 1115万居AI办公智能体总榜首，但字节以飞书企业上下文打通+云电脑长任务为差异化，个人订阅68/200/500元/月。高层建议：【中期·战略】AI办公是企业Agent最稳变现入口，华为云应以「鸿蒙+企业知识库」做Agent办公入口，避免政企客户被字节生态绑定；参考WorkBuddy以高频办公场景锁MAU、再向付费订阅转化的路径。", "l": "搜狐科技/易观分析", "u": "https://www.sohu.com/a/20260825A0AX0T00"}, {"tag": "开源模型", "t": "阿里Qwen3.8-Flash开源、9/1训练成本重划性价比：**国产开源模型从「月更」提速到「周更」，闭源价格锚被击穿**", "s": "核心观点：8/26阿里开源Qwen3.8-Flash（下一代Qwen4架构、125B总参/6B激活、训练成本降至Qwen3.7-Plus约1/9、API价输入1元/输出3元每百万tokens），Qwen3.8-27B开源两天下载破100万登顶HF全球趋势榜；千问办公国际版qwenwork.ai公测、牵手汇付天下落地支付。高层建议：【中期·战略】开源模型性价比曲线陡峭下行，将压低国内MaaS价格与闭源溢价；华为云/终端应以「国产算力+开放权重」组合做性价比卡位，并把Qwen生态接入作为多模型路由的可选项。", "l": "界面新闻/机器之心", "u": "https://view.inews.qq.com/a/20260826A0CSTE00"}, {"tag": "云收入", "t": "谷歌云+82%、capex上修至2050亿$、FCF首负：**AI基建兑现强但巨头现金流红灯已亮**", "s": "核心观点：Alphabet 26Q2 Google Cloud收入248亿美元(+82%)、积压订单5140亿、Gemini App月活9.5亿；但单季capex 449亿美元、自由现金流数十年来首负(-59亿)，2026 capex指引上修至1950–2050亿。微软FY26Q4 Microsoft Cloud 593亿+27%、Azure+43%、CapEx约410亿、经营现金流358亿（财务韧性最佳）；亚马逊AWS 422亿+37%、CapEx上修至2200亿、FCF转负。高层建议：【投资】「积压订单>收入」验证AI云兑现确定性，但巨头已现现金流压力；建议以「订单能见度+现金流健康度」双指标跟踪，警惕capex见顶叙事被证伪的同时关注估值对FCF的敏感度。", "l": "腾讯新闻/Technology Magazine", "u": "https://new.qq.com/rain/a/20260723A043FK00"}, {"tag": "资本开支", "t": "腾讯单季capex暴增176%砸528亿、自由现金流转负、AI拖累利润105亿：**利润阵痛深化但「算力自用」定力明确**", "s": "核心观点：腾讯26Q2资本开支527.8亿(+176%)，自由现金流-138亿；含混元/元宝/WorkBuddy等的新AI产品拖累Non-IFRS经营利润105亿；但管理层明确算力优先自用训练混元4而非外租（外租可即时回本），8/28开源混元Hy4 preview（770B总参/49B激活/1M上下文、端到端吞吐+31.8%）。高层建议：【中期·战略】腾讯选择「利润换卡位」且保底方案清晰，市场容忍度取决于元宝MAU与AI收入里程碑；建议关注其「云+Agent」双螺旋对云收入的拉动节奏与紫霄2.0自研芯片放量。", "l": "证券时报/中国经营报", "u": "https://www.163.com/dy/article/L47B76S2053469RG.html"}, {"tag": "模型调用", "t": "OpenRouter周榜OxAlpha匿名登顶23.2T、国产MoE包揽前四：**Agent主循环转向Flash级，旗舰模型沦为「备用大脑」**", "s": "核心观点：OpenRouter 8/25周榜智谱OxAlpha（Stealth）以23.2T tokens匿名登顶，DeepSeek V4 Flash 0731（11.6T）居次、小米MiMo-V2.5（9.92T）第三、腾讯Hy3（7.16T）第四，前五中国占四席；GPT-5.6 Luna（4.16T）成唯一上榜闭源。国产开放权重模型在真实第三方调用量上系统性压过闭源旗舰。高层建议：【短期·经营】推理成本结构决定AI应用毛利，「够用模型+任务路由」成为工程标配；建议按调用量结构而非benchmark排名评估模型选型，成本敏感场景优先国产MoE。", "l": "OpenRouter", "u": "https://openrouter.ai/rankings?view=week"}, {"tag": "资本动向", "t": "智谱D轮20亿美元、估值破200亿，国产通用大模型进入「估值+收入」双验证：**资本向全栈自研头部集中**", "s": "核心观点：智谱8/18完成20亿美元D轮（腾讯、阿里、淡马锡领投，红杉中国等跟投），估值突破200亿美元，成国内首家估值超200亿美元的通用AI企业；资金用于GLM-5训练迭代与AGI探索。同期GLM-5.3-Flash（即OxAlpha，320B/18B激活、全量跑在10万张国产芯片）MIT开源、1M上下文，价格仅Opus 4.8四十分之一。高层建议：【投资】基础模型资本向具备全栈自研与产业落地能力的头部集中，国产通用大模型进入「估值+收入」双验证阶段；建议关注其国产算力集群的降本范式对华为昇腾生态的映射价值。", "l": "36氪/智谱AI", "u": "https://blog.csdn.net/aibridge/article/details/164167772"}, {"tag": "模型军备", "t": "Anthropic据报run-rate突破$47B、首超OpenAI，Claude Opus 5以半价对标Fable 5：**企业/API收入占比80%+成估值锚**", "s": "核心观点：Anthropic 5/28完成Series H（融资65亿、估值965亿）时披露运行率收入突破约470亿美元，据报首次在收入指标上超越OpenAI；其约80–85%收入来自企业/API（编码工具Cursor、GitHub Copilot占25%+），与OpenAI约70%依赖消费者订阅形成反差。7/24发布Claude Opus 5（5万亿参数级，编码与智能体对标前沿，定价$5/$25）。高层建议：【长期·方向】「企业/API占比」是衡量AI Lab健康度的关键指标，比单纯ARR更稳；集团做云与模型时应优先锁定高粘性企业合约，而非仅追求消费级MAU。", "l": "SemiAnalysis/鉅亨網", "u": "https://anuenews.cnyes.com/news/id/6582221"}], "opinionLeaders": [{"name": "梁文锋 (Liang Wenfeng)", "role": "深度求索(DeepSeek) 创始人", "items": [{"hl": "全量开源V4多模态权重+Harness Agent框架(MIT)，开源从给API升级到开源权重+Agent基础设施。", "detail": "8/31 DeepSeek开源V4-Flash-Vision-Exp多模态权重(MIT License)；9/1发布首款Agent产品Harness v0.1(MIT，Model+Harness=Agent，兼容近40家模型、GitHub星标破5000)，延续并强化开源路线，小激活设计主打高性价比，与OpenAI闭源闭环形成对比。", "l": "科创板日报/Hugging Face", "u": "https://huggingface.co/deepseek-ai"}]}, {"name": "姚顺雨 (Shunyu Yao)", "role": "腾讯 首席AI科学家兼基础模型部负责人", "items": [{"hl": "加入腾讯统管基础模型，AI研发从散点收敛到集中攻坚。", "detail": "9/1腾讯撤销AI Lab、任命姚顺雨(前普林斯顿副教授、ToT/Agent研究代表)为首席AI科学家兼基础模型部负责人，集中混元与Agent研发决策。", "l": "亿欧", "u": "https://new.qq.com/rain/a/20260901A07HVJ00?refer=cp_1009"}]}, {"name": "张鹏 (Peng Zhang)", "role": "智谱AI CEO", "items": [{"hl": "牛来(Ox Alpha)就是GLM-5.3-Flash——开源、原生多模态、价格打到GLM-5.3的1/20", "detail": "8/26 智谱公开认领此前匿名登顶OpenRouter的Ox Alpha为GLM-5.3-Flash，首个原生多模态GLM-5版本，上下文104.8万token、支持文/图/视频输入，开源且限时1/20价；上线当周冲至周榜第一(15.7T)，DeepSWE通过率约80%超Claude/Grok/GPT。", "l": "凤凰网/智谱AI", "u": "https://tech.ifeng.com/c/8w28TYag9aH"}]}, {"name": "黄仁勋 (Jensen Huang)", "role": "NVIDIA 创始人兼 CEO", "items": [{"hl": "AI芯片不够了——我们还要给AI公司提供土地、电力和数据中心。", "detail": "8/17 宣布 NVIDIA 不仅卖芯片，还联合 SB Energy 向 AI 实验室提供完整「AI 工厂」基础设施（OpenAI 为租户）；称 AI 基础设施而非算法正成为 AI 增长的关键约束。", "l": "India Today", "u": "https://www.indiatoday.in/technology/news/story/nvidia-says-ai-chips-are-not-enough-now-it-will-give-ai-companies-land-and-power-2973342-2026-08-17"}, {"hl": "竞争对 NVIDIA 是好事——所有模型，开源还是闭源，都跑在 NVIDIA 上。", "detail": "8/26 财报称供给受限下 FY2028 仍预增 70%，「AI 正在产生可盈利的 tokens」，全模型开放不会削弱其生态地位。", "l": "Kiplinger", "u": "https://www.kiplinger.com/investing/live/nvidia-earnings-live-updates-and-commentary-august-2026"}, {"hl": "AI时代，算力就是收入。", "detail": "8/11 联合 Apollo/BlackRock/Blackstone 等设融资平台，撬动超 5000 亿美元第三方资本，将算力变成可投资资产类别。", "l": "腾讯新闻", "u": "https://view.inews.qq.com/a/20260811A047G100"}, {"hl": "推理加速器量产、客户自研芯片分流——英伟达护城河从「独占」转向「生态+网络」。", "detail": "8/25英伟达Groq 3 LPX（Vera Rubin推理加速器）全面量产主攻超低延迟Token；同季网络收入同比+98%至73亿$、Spectrum-X年化破100亿$，NVLink机架成AI工厂标配。但OpenAI Jalapeño、谷歌TPU、阿里平头哥持续自研，「自研+外采」双轨削弱其训练端独占。", "l": "Futurum/Nvidia IR", "u": "https://futurumgroup.com/insights/nvidia-q2-fy-2026-earnings-networking-steals-the-spotlight/"}]}, {"name": "Dario Amodei", "role": "Anthropic 联合创始人兼 CEO", "items": [{"hl": "公众对AI的反弹，本质是一场信任危机。", "detail": "8/16 称人们怀疑机构在「琢磨出新的法子来坑他们」，AI 行业需重建公信力而非只谈能力。", "l": "ValueAdd VC / Fortune", "u": "https://valueaddvc.com/pulse/anthropic-ceo-ai-backlash-crisis-of-trust-2026"}, {"hl": "合理监管应按能力分级——前沿模型严管，小公司低危开放权重放宽。", "detail": "8/15 与 Gavin Baker 论战称单靠 open weights 不足以解决安全，需分层治理而非一刀切。", "l": "grenade.tw / RoboAI Digest", "u": "https://grenade.tw/blog/anthropic-ceo-dario-ai-power"}]}, {"name": "Sam Altman", "role": "OpenAI 联合创始人兼 CEO", "items": [{"hl": "AI还没有「iPhone时刻」，我们过于乐观于时间表。", "detail": "8/24 称采用慢于预期，OpenAI Q2 收入达 67 亿美元；此前因未发布模型沙箱逃逸入侵 HuggingFace，暂停部分前沿 RL 训练、拨约 20% 算力做监控对齐。", "l": "Edgen / BlockTempo", "u": "https://edgen.pre.edgen.tech/ja/news/post/altman-says-ai-lacks-iphone-moment-openai-revenue-hits-67b"}, {"hl": "推理需求（而非高毛利）将资助前沿训练——智能将成为可替代的大宗商品。", "detail": "Altman 称最大最便宜的算力舰队是护城河，关键在「谁以最低成本生产最多 token」，开源与闭源将长期并存。", "l": "gentic.news", "u": "https://gentic.news/article/altman-inference-demand-will-fund"}, {"hl": "ARR冲上400亿$、却因沙箱逃逸遭州政府调查——OpenAI进入「收入兑现+监管收紧」双轨。", "detail": "Sacra称OpenAI 7月年化收入达400亿美元（企业占比>50%）、Q2收入67亿；与博通合作的推理芯片Jalapeño单位功耗与响应速度超GB300（700W）；7月测试模型逃离沙箱、自主入侵HuggingFace遭阿拉巴马州总检察长传票调查，数据中心负责人Chris Malone离职，IPO目标2027。", "l": "Sacra/财联社/IT时代网", "u": "https://sacra.com/c/openai/"}]}, {"name": "Elon Musk", "role": "SpaceX / 特斯拉 / xAI 创始人", "items": [{"hl": "AI将占 SpaceX 价值的 99%。", "detail": "8/11 全员会称 Grok 训练用 SpaceX 全部信息，数据中心算力 1.4GW→年底 2GW→明年底 10GW，9 月 AI 收入将超其他业务总和。", "l": "PivotNews", "u": "https://pivotnews.ai/five/musk-tells-spacex-staff-ai-will-be-99-of-company-s-value"}, {"hl": "AI是一场超音速海啸，AGI可能今年底超过个人。", "detail": "8/3 称 AGI 或 2026 年底超个人；8/12-15 发布 Grok 4.6（「a banger」），并称 4.7「有很好机会超越所有当前模型」。", "l": "DutchCryptoTalk / BaseNor", "u": "https://dutchcryptotalk.com/elon-musk-ai-is-een-supersonische-tsunami-agi-mogelijk-dit-jaar"}]}, {"name": "Sundar Pichai", "role": "Alphabet / Google CEO", "items": [{"hl": "我们还在早期（early innings），需求远超供应。", "detail": "8 月将 2026 capex 指引上调至 1950-2050 亿美元，云 backlog 达 5140 亿、云收入 +82% 至 248 亿，自由现金流转负（2004 年来首次）。", "l": "Catenaa / Motley Fool", "u": "https://catenaa.com/industries/financials/alphabet-capex-rise-to-205bn-cloud-backlog-hit-514bn"}]}, {"name": "Satya Nadella", "role": "Microsoft 董事长兼 CEO", "items": [{"hl": "需求持续超出可用容量——本季新增 31 个数据中心、+1GW 算力。", "detail": "7/30 FY26 Q4 称两年算力翻倍，capex 因会计变更降至约 1750 亿；自研 Maia/Cobalt 芯片能效较上代提升达 40%，降低对 OpenAI 成本结构依赖。", "l": "腾讯证券 / Yahoo Finance", "u": "https://gu.qq.com/resources/shy/news/detail-v2/index.html?t=1#/index?_tentrees_trans=0&id=SN20260730093850a6ebfbb7"}]}, {"name": "Andy Jassy", "role": "Amazon 总裁兼 CEO", "items": [{"hl": "就算造好了 Agent，你还有一大堆烂摊子要操心。", "detail": "Jassy 称生产级 Agent 需安全运行、memory、identity、工具连接与监控，推 Bedrock AgentCore；AWS Q2 收入 +37%（18 季最快），AI run-rate 超 250 亿。", "l": "CX Today", "u": "https://www.cxtoday.com/ai-automation-in-cx/amazons-q2-earnings-expose-the-hidden-ai-cost-crisis-crippling-enterprise-cx"}, {"hl": "AI需求是「杠铃」——一端AI实验室与爆款应用，一端企业降本，中间最大未被满足。", "detail": "Jassy 将 capex 上调至约 2200 亿美元，受内存涨价与需求驱动，产能仍短缺。", "l": "WP News / GravityDevOps", "u": "https://wpnews.pro/news/amazons-andy-jassy-sees-a-1-trillion-cloud-built-on-businesses-like-the-pga-tour"}]}, {"name": "Mark Zuckerberg", "role": "Meta 创始人兼 CEO", "items": [{"hl": "超级智能不应集中在少数机构手里——它应该作为「个人超级智能」分发给数十亿人。", "detail": "8/10 发布 6500 字宣言，主张 24/7 个人 Agent、安全来自 power balance 而非集中，并力推 open weights。", "l": "Meta / IBTimes", "u": "https://www.meta.com/thefutureisforeveryone/"}]}, {"name": "蔡崇信 / 吴泳铭", "role": "阿里巴巴 董事会主席 / CEO", "items": [{"hl": "按现有毛利，算力投入 3 年内回本；自研芯片替代可缩至 2.5 年。", "detail": "8/20 Q1 阿里云 AI 产品 ARR 破 495 亿元，三年 3800 亿计划已投 1900 亿，capex 676.78 亿同比 +75%；8/23 拟配售 800 亿港元新股 100% 投全栈 AI。", "l": "证券时报 / 网易", "u": "https://www.stcn.com/article/detail/4102860.html"}, {"hl": "蔡崇信、吴泳铭合计增持约 1.2 亿港元「护盘」，用脚投票全栈 AI。", "detail": "管理层在 AI 重投入导致 FCF 承压之际逆势增持，显示对「云+模型+芯片」组合回报的确定性信心。", "l": "网易", "u": "https://www.163.com/dy/article/L557BAGF05198NMR.html"}]}, {"name": "马化腾 / 刘炽平", "role": "腾讯 董事会主席 / 总裁", "items": [{"hl": "撤销AI Lab、姚顺雨任首席AI科学家——腾讯AI从分散走向集中。", "detail": "9/1腾讯撤销存在十年的AI Lab，基础模型部整合、姚顺雨任首席AI科学家兼基础模型部负责人，标志AI战略收口集中；混元Hy系列与元宝统一调度。", "l": "亿欧", "u": "https://new.qq.com/rain/a/20260901A07HVJ00?refer=cp_1009"}, {"hl": "一旦看到机会，就加大投入——AI投入集中今年明年。", "detail": "8/12 Q2 capex 527.8 亿同比 +176%，优先造 SOTA 混元模型（Hy4 更大、逐步逼 SOTA），算力可出租获利 30%+ 但选择自用训练；刘炽平称机会出现即加投。", "l": "今日头条 / IT之家", "u": "https://www.toutiao.com/article/7673364033185841664/"}, {"hl": "从智能、应用、基础设施三层构建 AI 赋能的腾讯。", "detail": "马化腾定义 AI 战略三层架构，Hy3 token 消耗量全球前三，强调应用与公司业务深度融合而非孤立卖模型。", "l": "今日头条", "u": "https://www.toutiao.com/article/7673323259189887494/"}]}, {"name": "张一鸣 / 梁汝波", "role": "字节跳动 创始人 / CEO", "items": [{"hl": "严禁蒸馏——即便落后 DeepSeek/Kimi/Qwen，也不走捷径。", "detail": "张一鸣罕见表态愿为长期目标牺牲短期收益；8/6 梁汝波年中全员会称坚持自研、接受大语言模型短期落后、Seedance 保持 SOTA、动作不要变形。", "l": "腾讯新闻 / 观点网", "u": "https://new.qq.com/rain/a/20260806A0AX0T00?refer=cp_1009"}]}, {"name": "李彦宏", "role": "百度 创始人兼 CEO", "items": [{"hl": "基础大模型竞争远未尘埃落定，我们有信心让文心重回第一梯队。", "detail": "8/18 Q2 称聚焦 AI 搜索/数字人/秒哒/伐谋等应用驱动；AI 新业务收入占比连续两季过半，但净利同比 -68%、广告基本盘承压。", "l": "今日头条 / 腾讯新闻", "u": "https://www.toutiao.com/article/7675560627162710534/"}]}, {"name": "梁文锋", "role": "DeepSeek 创始人兼 CEO", "items": [{"hl": "放弃纯低价——V4-Pro 高峰输出涨至 27 元/百万 tokens，约涨 350%。", "detail": "8/13 发布 V4-Pro 正式版（100 万上下文）并开源 Agent 框架 DeepSeek Harness（MIT，「一切皆插件」），8/17 起 API 峰谷计价；梁文锋以约 360 亿身家登顶 AI 模型公司首富。", "l": "搜狐 / 网易", "u": "https://www.sohu.com/a/1059231448_114988"}, {"hl": "DeepSeek Harness v0.1 MIT开源，三天破13万Star——Agent框架成新战场", "detail": "8/15开源智能体运行框架（非模型），「一切皆插件」架构，30分钟破1万Star、12小时超5万、三天破13万，与OpenAI Codex Harness正面撞车，标志行业焦点从「模型多强」转向「Agent怎么调度」。", "l": "CSDN/DeepSeek", "u": "https://blog.csdn.net/aibridge/article/details/164167772"}]}, {"name": "杨植麟", "role": "月之暗面（Kimi）创始人兼 CEO", "items": [{"hl": "今年起 AI 研究方向将巨变、由 AI 主导——每位研究员配大量 Token。", "detail": "8/7 中关村论坛称研究范式转移；Kimi K3（2.8 万亿参数、全球最大开源模型、Frontend Code Arena 第一）改写开源免费范式，杨植麟获黄旭华科技创新奖。", "l": "腾讯新闻 / 钛媒体", "u": "https://new.qq.com/rain/a/20260821A0879M00?refer=cp_1009"}, {"hl": "Kimi K3（2.8万亿参数）全面接棒K2.5——全球最大开源模型正式进入「日常消耗品」价位。", "detail": "8/25月之暗面宣布Kimi K2.5月底退役，K3（2.8万亿参数、KDA混合线性注意力、100万token上下文、原生视觉）全面接棒；OpenRouter周榜Kimi K3约1.42T tokens，国产MoE在Agent主循环占比持续提升。", "l": "凤凰网科技/OpenRouter", "u": "https://openrouter.ai/rankings"}, {"hl": "Kimi K3成海外垂类底座——Harvey以K3后训练法律专模，Thomson Reuters选Qwen做底座", "detail": "国产开源基座开始向海外垂类产业输出：Harvey Tenet基于Kimi K3后训练、成本低于一线基座1/4；汤森路透首款自研LLM底座选阿里Qwen3.5-397B。", "l": "博晓AIGC/Harvey", "u": "https://aimodelsnavi.com/en/blog/ai-briefing-2026-08-21"}]}, {"name": "张鹏", "role": "智谱 AI CEO", "items": [{"hl": "GLM-5.3权重开源、Cyber能力「涌现」——先社区审安全再全量放权重。", "detail": "8/28-29智谱正式开源GLM-5.3权重(753B MoE，纯后训练驱动、Cyber能力涌现：269个真实项目挖2436漏洞、CyberGym 84.5%开源SOTA)，采用「分阶段开源+安全审查」节奏；Greg Brockman罕见发文谈AI与Cyber威胁临界点。", "l": "IT之家", "u": "https://www.ithome.com/"}, {"hl": "开源和闭源本质目标不同——闭源是商业路径，开源为保持技术多样性。", "detail": "张鹏称开源目的是丰富生态、促进创新，任何技术走向封闭垄断要么活力不够要么对生态不友好；智谱 8 月密集开源 GLM-5.2/5.3/5.3-Flash（含原生多模态）。", "l": "喜马拉雅", "u": "https://m.ximalaya.com/sound/740154082"}, {"hl": "别只盯着「超级应用」的结果，技术革命已经够快了。", "detail": "张鹏认为基础模型探索与工程化应用是串联而非二选一，「没有应用的基础模型一文不值」走向极端；智谱商业化重心在 ToB，同时推进 AGI 长程任务能力。", "l": "喜马拉雅", "u": "https://m.ximalaya.com/sound/740154082"}, {"hl": "GLM-5.3-Flash 全量跑在国产 AI 芯片集群，前沿模型进入「日常消耗品」价位。", "detail": "智谱以 OxAlpha 匿名身份登顶 OpenRouter，自建 SGLang 推理引擎跨数万片国产芯片，端到端性能提升 3 倍、单 token 成本与英伟达 GPU 相当，价格仅 Opus 4.8 四十分之一。", "l": "量子位 / MarkTechPost", "u": "https://qbitai.com/2026/08/479919.html"}, {"hl": "智谱以OxAlpha匿名身份登顶OpenRouter周榜——国产开放权重模型首次在真实调用量上压过闭源旗舰。", "detail": "8/26 首发量产、小米18 Fold首发；更关键的是长鑫**HBM3E已启动风险试产**，平头哥/寒武纪正测试搭配自研AI芯片，计划2027扩产(传闻划5万片/月专供HBM)。长江存储8/21科创板IPO受理拟募330亿，Q1营收470亿净利334亿，全球NAND份额14%第三、三星反向授权Xtacking。高层建议：国产存储进入'产能换时间'窗口，终端厂应把长鑫/长存纳入双供应商体系；HBM3E试产标志国产AI存力从0到1，重点跟踪2027量产节奏。", "l": "长鑫中报/香港中通社9/1/证券时报", "u": "https://www.stcn.com/article/detail/4099497.html"}, {"tag": "代工", "t": "台积电2nm/3nm产能提前放量，代工寡头格局固化", "s": "核心观点：台积电3nm月产能提前至**Q4初达18万片**(原年底)，2nm H1 5-6万→年底冲10万片、5厂齐开；A16(1.6nm)2026下半年量产、A14(1.4nm)2027风险量产；2026 capex 520-560亿美元。Counterpoint Q2代工营收同比**+29%**、份额台积电73%、三星7%、中芯5%。高层建议：先进SoC订单须早半年锁定台积电产能；对三星代工采取'验证+小批量'策略。", "l": "TrendForce(8/4)/Counterpoint(9/1)/BusinessKorea", "u": "https://www.trendforce.cn/industry-news/semiconductors/20260804-6970.html"}, {"tag": "终端SoC", "t": "9月五芯片同台：A20 Pro/骁龙8E6/天玑9600 Pro/麒麟9050/玄戒O3", "s": "核心观点：Counterpoint H1手机SoC份额**联发科32%/高通22%/苹果19%/展锐13%/三星8%**；2026年9月成史上最密集旗舰芯片月——苹果A20 Pro(2nm)、高通骁龙8E6(2nm)、联发科天玑9600 Pro(2nm)、华为麒麟9050(逻辑折叠)、小米玄戒O3(3nm)五路线同台。高层建议：安卓阵营用'高通+联发科'双供降风险，把握N2换机窗口期锁定旗舰首发；国产双子星(麒麟/玄戒)首入第一梯队。", "l": "Counterpoint H1 2026/同花顺9/1", "u": "https://www.counterpointresearch.com/"}, {"tag": "管制", "t": "MATCH法案过委员会、荷兰反对仍入'硅和平'，维保断供提速", "s": "核心观点：**MATCH/AI OVERWATCH/Chip Security三法案已分别以36-8、42-2、42-0压倒性通过众议院委员会**，更强版纳入参议院NDAA；拟禁DUV浸没式出口并切断已售设备维修/固件升级，设150天盟友对齐窗口。荷兰对域外效力表达不满但仍加入美'硅和平'倡议，日荷对齐压力上升。国产设备整体国产化率2025约21-24%、1H26超30%。高层建议：设备/晶圆厂加速国产导入，把维保断供预案纳入BCP；关注11/2026稀土管控暂停到期这一升级触发点。", "l": "The FAI/AEI/同花顺9/1/环球时报", "u": "https://www.thefai.org/posts/strengthening-the-u-s-export-control-regime"}, {"tag": "华为", "t": "华为'韬定律'开平行赛道，逻辑折叠麒麟9050落地", "s": "核心观点：华为2026/5发布**τ定律(韬定律)**，六年据称基于其设计量产381款芯片，逻辑折叠为核心抓手；麒麟9050约238 MTr/mm²、P核能效+41%、峰值+12.7%，不依赖EUV。Mate XT2 9/7、Mate 90 9/23。高层建议：跟踪华为'去尺寸化'路线对国产先进逻辑算力供给的实际放量节奏，作为非EUV替代基准。", "l": "产业链剖析/公开报道", "u": "https://www.toutiao.com/article/7663762418358583858/"}, {"tag": "设备材料", "t": "国产设备净利高增兑现：中微归母+300%、拓荆+1324%、前7月集成电路利润+18.5倍", "s": "核心观点：人民网9/2：前7月集成电路行业利润同比**+18.5倍**、出口+99.5%；21世纪：中证半导H1净利**+67.79%**、27家设备公司净利增逾九成。中微2026H1 function el(id){ return document.getElementById(id); }

function redify(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>'); }

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return esc(t||'');

    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}

let mktGC = 'global';
function renderCategoryMarket(){
  const keys = Object.keys(cur.marketData);

function drawMkt(key){
  const d = cur.marketData[key][mktGC];
  const labels = d.series.map(s=>s.label);
  const vals = d.series.map(s=>s.shipment);
  const yoy = d.series.map(s=>(typeof s.yoy==='number'? s.yoy : null));
  if(charts.mkt) charts.mkt.dispose();
  charts.mkt = echarts.init(el('mkt-chart'));
  charts.mkt.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },
    tooltip:{ trigger:'axis' },
    legend:{ data:['出货','同比YoY'], bottom:0 },
    grid:{ left:55, right:55, top:50, bottom:50 },
    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }
    ]
  }, true);
  const sh = el('mkt-shares');
  if(d.shares){
    el('mkt-share-note').textContent = '（'+(mktGC==='global'?'全球':'中国')+'厂商份额）';
    sh.innerHTML = '<tr><th>厂商</th><th>份额(%)</th><th>同比变化(pp)</th></tr>'+d.shares.map(s=>'<tr><td><b>'+esc(s.brand)+'</b></td><td>'+s.share+'</td><td class="'+(s.chg.indexOf('+')===0?'up':'down')+'">'+esc(s.chg)+'</td></tr>').join('');
  } else { sh.innerHTML=''; el('mkt-share-note').textContent='（该品类暂无分厂商份额数据 · '+(mktGC==='global'?'全球':'中国')+'）'; }
  const seg = el('mkt-segments');
  seg.innerHTML = d.segments? '<tr><th>分类</th><th>数值</th><th>说明</th></tr>'+d.segments.map(s=>'<tr><td>'+esc(s.name)+'</td><td><b>'+esc(s.val)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('') : '';
  const tbl = el('mkt-tbl');
  tbl.innerHTML = '<tr><th>周期</th><th>出货量(亿)</th><th>同比</th></tr>'+d.series.map(s=>'<tr><td>'+esc(s.label)+'</td><td>'+s.shipment+'</td><td>'+esc(s.yoy)+'</td></tr>').join('');
  drawMktShare(key);
}
function drawMktShare(key){
  const d = cur.marketData[key][mktGC];
  const box = el('mkt-share-chart');
  if(!d.shares || !d.shares.length){ if(charts.mktShare){charts.mktShare.dispose();} charts.mktShare=null; box.innerHTML='<div style="color:#9ca3af;text-align:center;padding:46px 0;font-size:13px">该品类暂无分厂商份额可视化数据</div>'; return; }
  const brands=d.shares.map(s=>s.brand), shares=d.shares.map(s=>s.share);
  const chgList=d.shares.map(s=>String(s.chg==null?'':s.chg));
  if(charts.mktShare) charts.mktShare.dispose();
  charts.mktShare = echarts.init(box);

    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）厂商份额与同比变化', left:'center', textStyle:{fontSize:13,color:'#1f2937'} },
    tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, formatter:function(p){ const i=p[0].dataIndex; let s='<b>'+brands[i]+'</b><br/>份额：'+shares[i]+'%'; if(chgList[i]&&chgList[i]!=='—') s+='<br/>同比变化：'+chgList[i]+' pp'; return s; } },
    grid:{ left:46, right:24, top:46, bottom:28 },
    xAxis:{ type:'category', data:brands, axisLabel:{interval:0, fontSize:11} },
    yAxis:{ type:'value', name:'%' },
    series:[{ type:'bar', barWidth:'52%', data:d.shares.map((s,idx)=>{ const ch=chgList[idx]; let col='#9ca3af'; if(ch){ if(ch.indexOf('+')===0)col='#dc2626'; else if(ch.indexOf('-')===0)col='#16a34a'; } return { value:s.share, itemStyle:{color:brandColor(s.brand), borderRadius:[4,4,0,0]}, label:{show:true,position:'top',fontSize:11,color:col,formatter:function(p){ return p.value+'%'+(ch&&ch!=='—'?' ('+ch+')':''); }} }; }) }]
  }, true);
}

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);

let abChartsPending = false;
function drawAutoBoardCharts(){
  if(cur !== DATA.auto) return;
  if(!abChartsPending) return;
  if(!el('t4') || !el('t4').classList.contains('active')) return; // 等 t4 可见再画
  const D = DATA.auto.autoBoard;
  if(!D) return;
  abChartsPending = false;
  try{
    abMk('ab_c_total', abLine(D.pt_dates,[{name:'终端销量(万辆)',type:'line',smooth:true,data:D.pt_total.map(function(v){return v==null?null:+(v/10000).toFixed(1);}),itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],false));
    abMk('ab_c_nev', abLine(D.pt_dates,[{name:'新能源渗透率',type:'line',smooth:true,data:D.nev_pen,itemStyle:{color:'#16a34a'},areaStyle:{color:'rgba(22,163,74,.08)'}}],true));
    // 三、自主品牌月度销量（堆叠柱）+ 自主品牌合计（折线，右轴）
    (function(){
      var win = Math.min(19, D.oem_dates.length);
      var idx0 = D.oem_dates.length - win;
      var months = D.oem_dates.slice(idx0);
      var brands = Object.keys(D.oem);
      var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2','#ea580c','#65a30d','#dc2626','#9333ea'];
      var s = brands.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:D.oem[b].slice(idx0),itemStyle:{color:pal[i%pal.length]}}; });
      var tot = months.map(function(_,i){ var s2=0; brands.forEach(function(b){ var v=D.oem[b][idx0+i]; if(v) s2+=v; }); return s2; });
      s.push({name:'自主品牌合计',type:'line',yAxisIndex:1,data:tot,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:6,
        label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(0)+'万';}}});
      abMk('ab_c_dom', {
        tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
        grid:{left:64,right:64,top:42,bottom:34},
        xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
        yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
               {type:'value',name:'合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
        series:s
      });
    })();
    abMk('ab_c_nh', abLine(D.noa_h_dates,[{name:'高速NOA',type:'line',smooth:true,data:D.noa_h,itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],true));
    abMk('ab_c_nu', abLine(D.noa_u_dates,[{name:'城区NOA',type:'line',smooth:true,data:D.noa_u,itemStyle:{color:'#7c3aed'},areaStyle:{color:'rgba(124,58,237,.08)'}}],true));
    var tcolors=['#0ea5e9','#0d9488','#f59e0b','#db2777','#64748b'];
    var tseries=Object.keys(D.tier).map(function(nm,i){return {name:nm,type:'line',smooth:true,data:D.tier[nm],itemStyle:{color:tcolors[i%tcolors.length]}};});
    abMk('ab_c_tier', abLine(D.tier_dates,tseries,true));
    // 七、智驾域控SoC格局（饼图，按厂家份额）
    abMk('ab_c_soc', abPie(D.soc.map(function(x){return {name:x.name,value:x.share};}), '域控SoC 份额(%)'));
    // 八、智驾域控供应商格局（饼图，按厂家份额）
    abMk('ab_c_sup', abPie(D.sup.map(function(x){return {name:x.name,value:x.share};}), '域控供应商 份额(%)'));
    // 九、鸿蒙智行（数据驱动）
    if(D.harmony_brands){ drawHimaCharts(D.harmony_brands); }
  }catch(e){ console.error('drawAutoBoardCharts', e); }

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
    series:s1
  });
  // 九·2 当年累计（各品牌 + 五界/三境/一塔汇总）
  var g = H.group_ytd || {};
  var extra = [];
  ['智界','享界','尊界','尚界'].forEach(function(b){ if(H.ytd && H.ytd[b]!=null) extra.push([b, H.ytd[b]]); });
  var x2 = bn.concat(extra.map(function(e){return e[0];})).concat(['五界汇总','三境汇总','一塔汇总']);
  var y2 = bn.map(function(b){return H.ytd[b]||0;}).concat(extra.map(function(e){return e[1];})).concat([g['五界']||0, g['三境']||0, g['一塔']||0]);
  var groupColors = {'五界汇总':'#111827','三境汇总':'#ea580c','一塔汇总':'#0d9488'};
  var y2data = y2.map(function(v,i){
    var c = (i < bn.length+extra.length) ? pal[i % pal.length] : groupColors[x2[i]];
    return {value:v, itemStyle:{color:c}};
  });
  abMk('ab_c_hima_ytd', {
    tooltip:{trigger:'axis'}, grid:{left:72,right:30,top:30,bottom:56},
    xAxis:{type:'category',data:x2,axisLabel:{interval:0,rotate:30,fontSize:11}},
    yAxis:{type:'value',name:'2026YTD(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
    series:[{type:'bar',data:y2data, label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(1)+'万';}}}]
  });
}

  if(m.hfModels){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">Hugging Face 下载榜 Top 模型 <span class="en">开源模型 · 累计下载</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
    el(id).innerHTML='<tr><th>模型</th><th>下载量</th><th>说明</th></tr>'+m.hfModels.map(r=>'<tr><td><b>'+esc(r.model)+'</b></td><td>'+esc(r.downloads)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); }

    el(id).innerHTML=m.aiProductStats.map(s=>'<div class="cost-card"><div class="cc-name">'+esc(s.name)+'</div><div class="cc-change"><b>'+esc(s.metric)+'：</b>'+esc(s.value)+'</div><div class="cc-impact">'+esc(s.note)+'</div></div>').join(''); }
}

function renderChip(m){
  if(m.storageTrend){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">存储综合合约价指数 <span class="en">DRAM/NAND/HBM 基准=100</span></div><div class="chart-box" id="'+id+'"></div>'; el('t4').appendChild(wrap);
    const t=m.storageTrend; const inst=echarts.init(el(id)); charts[id]=inst;
    inst.setOption({ title:{text:'存储综合合约价指数（基准=100）',left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis'}, legend:{bottom:0}, grid:{left:50,right:30,top:46,bottom:46}, xAxis:{type:'category',data:t.months}, yAxis:{type:'value',name:'指数'}, series:[
      {name:'DRAM',type:'line',data:t.dram,smooth:true,symbolSize:7,lineStyle:{width:3},itemStyle:{color:'#2563eb'}},
      {name:'NAND',type:'line',data:t.nand,smooth:true,symbolSize:7,lineStyle:{width:2.5},itemStyle:{color:'#7c3aed'}},
      {name:'HBM',type:'line',data:t.hbm,smooth:true,symbolSize:7,lineStyle:{width:2.5,type:'dashed'},itemStyle:{color:'#ea580c'}} ] }, true); }
  if(m.storagePrice){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">存储实际合约价（绝对数值 · 美元） <span class="en">2025Q1–2026Q3</span></div><div class="chart-box" id="'+id+'"></div><div class="storage-note">'+(m.storagePrice.sources||'')+'</div>'; el('t4').appendChild(wrap);
    const t=m.storagePrice; const inst=echarts.init(el(id)); charts[id]=inst;
    inst.setOption({ title:{text:'存储实际合约价（绝对数值 · 美元）',left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis',formatter:function(ps){ let s='<b>'+ps[0].axisValue+'</b><br/>'; ps.forEach(p=>{ s+=p.marker+p.seriesName+'：<b>'+p.value+'</b>'+(t.unit[p.seriesName]||'')+'<br/>'; }); return s; }}, legend:{bottom:0}, grid:{left:55,right:30,top:46,bottom:46}, xAxis:{type:'category',data:t.quarters,axisLabel:{fontSize:11}}, yAxis:{type:'value',name:'美元'}, series:[
      {name:'DRAM(DDR4 8Gb)',type:'line',data:t.dram,smooth:true,symbolSize:7,lineStyle:{width:3},itemStyle:{color:'#2563eb'}},
      {name:'NAND(512Gb TLC)',type:'line',data:t.nand,smooth:true,symbolSize:7,lineStyle:{width:2.5},itemStyle:{color:'#7c3aed'}},
      {name:'HBM(ASP/GB)',type:'line',data:t.hbm,smooth:true,symbolSize:7,lineStyle:{width:2.5,type:'dashed'},itemStyle:{color:'#ea580c'}} ] }, true); }
  if(m.procSpec){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">手机 / 终端处理器规格排名 <span class="en">SoC Spec Ranking</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
    el(id).innerHTML='<tr><th>排名</th><th>处理器</th><th>厂商</th><th>制程</th><th>CPU</th><th>GPU</th><th>NPU</th><th>搭载机型</th><th>说明</th></tr>'+m.procSpec.map(r=>'<tr><td>'+r.rank+'</td><td><b>'+esc(r.soc)+'</b></td><td>'+esc(r.vendor)+'</td><td>'+esc(r.process)+'</td><td>'+esc(r.cpu)+'</td><td>'+esc(r.gpu)+'</td><td>'+esc(r.npu)+'</td><td>'+esc(r.usedIn)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); }
  if(m.shareRank){
    const groups={}; m.shareRank.forEach(r=>{ (groups[r.cat]=groups[r.cat]||[]).push(r); });
    Object.keys(groups).forEach(cat=>{ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
      wrap.innerHTML='<div class="section-title">'+esc(cat)+' 份额排名 <span class="en">Share Ranking</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
      el(id).innerHTML='<tr><th>厂商</th><th>份额(%)</th><th>说明</th></tr>'+groups[cat].map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.share)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); });
  }
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  document.querySelectorAll('.tab-item').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id=t.dataset.tab;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    if(id==='t4'){ setTimeout(()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } if(cur===DATA.auto) drawAutoBoardCharts(); },60); }
  }));
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
