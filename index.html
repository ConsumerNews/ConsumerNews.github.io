<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --accent:#2563eb; --accent-deep:#1d4ed8; --accent-soft:#eff6ff; --accent-tint:#dbeafe; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#1f2937; font-size:14.5px; line-height:1.6; }
a { color:#2563eb; text-decoration:none; }
a:hover { text-decoration:underline; }

/* Header / Banner —— 蓝色洞见风 */
.header { background:radial-gradient(1100px 380px at 10% -25%, #3b82f6 0%, transparent 58%), linear-gradient(135deg,#0b2a6b 0%,#1d4ed8 48%,#2563eb 100%); color:#fff; padding:15px 28px 12px; position:sticky; top:0; z-index:100; box-shadow:0 6px 24px rgba(11,42,107,0.45); border-bottom:3px solid rgba(255,255,255,.55); }
.header-top { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:14px; }
.brand-mark { flex-shrink:0; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25)); animation:spinSlow 20s linear infinite; }
@keyframes spinSlow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.brand .eyebrow { font-size:10.5px; letter-spacing:2.5px; font-weight:700; color:#bfdbfe; text-transform:uppercase; }
.header h1 { font-size:25px; font-weight:900; letter-spacing:2px; line-height:1.12; background:linear-gradient(90deg,#ffffff,#dbeafe); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.header .sub { font-size:11.5px; color:#cbd5e1; margin-top:4px; }
.header-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.view-counter { display:flex; gap:10px; }
.view-box { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); border-radius:9px; padding:6px 13px; text-align:center; min-width:92px; }
.view-box .num { font-size:18px; font-weight:800; line-height:1.1; }
.view-box .lbl { font-size:10px; color:#dbeafe; }
.header .badge { display:inline-block; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32); padding:3px 11px; border-radius:20px; font-size:10px; color:#e0e7ff; }
.badge::before { content:''; display:inline-block; width:6px; height:6px; background:#4ade80; border-radius:50%; margin-right:5px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Category nav（一级切换项，主色调贯穿其下五大板块） */
.catnav { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.cat-item { padding:8px 22px; font-size:13px; font-weight:800; color:#dbeafe; cursor:pointer; border-radius:20px; border:1.5px solid rgba(255,255,255,.45); background:rgba(255,255,255,.08); transition:all .2s; white-space:nowrap; }
.cat-item:hover { background:rgba(255,255,255,.22); color:#fff; }
.cat-item.active { background:#fff; color:var(--accent); border-color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }

/* Tabs */
.tabnav { background:#fff; padding:0 28px; display:flex; gap:4px; border-bottom:2px solid #e5e7eb; box-shadow:0 1px 4px rgba(0,0,0,.04); overflow-x:auto; position:sticky; top:var(--hh,118px); z-index:90; }
.tab-item { padding:13px 20px; font-size:14px; font-weight:700; color:#6b7280; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; transition:all .2s; }
.tab-item:hover { color:var(--accent); background:var(--accent-soft); }
.tab-item.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-item .tn { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; font-size:11px; margin-right:6px; background:var(--accent); color:#fff; }

/* Container */
.container { max-width:1400px; margin:0 auto; padding:22px 28px 60px; }
.tabpane { display:none; }
.tabpane.active { display:block; }

/* Section titles */
.section-title { font-size:20px; font-weight:800; color:#1f2937; margin:8px 0 16px; padding-left:14px; border-left:4px solid var(--accent); display:flex; align-items:center; gap:8px; }
.section-title .en { font-size:11px; color:#9ca3af; font-weight:400; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px 20px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
.muted { color:#6b7280; font-size:12px; }
.hl { color:var(--accent); font-weight:700; }

/* Tab1 headline */
.headline-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media(max-width:1000px){ .headline-grid { grid-template-columns:1fr; } }
.hl-card { border:1px solid #f0f0f0; border-radius:10px; padding:14px 16px; background:linear-gradient(180deg,#fffaf9,#fff); border-left:4px solid var(--accent); }
.hl-rank { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center; background:var(--accent); color:#fff; border-radius:6px; font-weight:800; font-size:13px; margin-right:8px; }
.hl-card h4 { font-size:15px; font-weight:700; display:inline; }
.hl-support { font-size:14.5px; color:#4b5563; margin-top:9px; line-height:1.7; }
.hl-link { font-size:11px; margin-top:6px; }

.person-block { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.person-block .pname { font-size:15px; font-weight:800; color:#1f2937; }
.person-block .prole { font-size:11px; color:#9ca3af; margin-left:6px; }
.vp-item { font-size:14px; color:#374151; padding:11px 0; border-bottom:1px dashed #f0f0f0; line-height:1.7; }
.vp-item:last-child { border-bottom:none; }
.vp-hl { font-size:15px; line-height:1.7; margin-bottom:6px; }
.vp-hl .hl-red { font-size:15px; }
.vp-detail { font-size:13.5px; color:#374151; line-height:1.9; margin:1px 0 8px; padding-left:2px; }

.news-row { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #f3f4f6; }
.news-rank { flex-shrink:0; width:22px; height:22px; line-height:22px; text-align:center; border-radius:5px; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12px; }
.news-main { flex:1; }
.news-title { font-size:15px; font-weight:600; color:#1f2937; }
.news-meta { font-size:11px; color:#9ca3af; margin-top:2px; }

/* Tab2 products */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
@media(max-width:900px){ .cal-grid { grid-template-columns:repeat(3,1fr); } }
.cal-cell { border:1px solid #e5e7eb; border-radius:8px; padding:8px; min-height:90px; background:#fff; font-size:11px; }
.cal-cell .d { font-weight:800; color:#374151; }
.cal-cell.ev { background:var(--accent-soft); border-color:var(--accent-tint); }
.cal-cell .evt { margin-top:4px; color:var(--accent); font-weight:600; line-height:1.35; }
.prod-block { border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; margin-bottom:16px; }
.prod-head { display:flex; align-items:center; gap:10px; padding:14px 18px; color:#fff; }
.prod-head .b { font-size:16px; font-weight:800; }
.prod-head .tag { font-size:11px; background:rgba(255,255,255,.25); padding:2px 8px; border-radius:4px; }
.prod-body { padding:16px 18px; }
.prod-summary { font-size:15px; color:#374151; line-height:1.8; }
.prod-strategy { margin-top:10px; padding:11px 14px; background:#f9fafb; border-left:3px solid var(--accent); border-radius:6px; font-size:14.5px; color:#4b5563; line-height:1.8; }
.prod-strategy b { color:var(--accent); }
.spec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:12px; }
.spec-item { border:1px solid #f0f0f0; border-radius:8px; padding:8px 10px; background:#fafafa; }
.spec-item .k { font-size:10px; color:#9ca3af; }
.spec-item .v { font-size:12.5px; font-weight:700; color:#1f2937; }
.prod-links { margin-top:10px; font-size:11px; }

/* Tab3 earnings */
.earn-card { border:1px solid #e5e7eb; border-radius:12px; padding:18px 20px; margin-bottom:16px; }
.earn-top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
.earn-company { font-size:17px; font-weight:800; }
.earn-code { font-size:11px; color:#9ca3af; margin-left:8px; }
.earn-period { font-size:11px; color:#6b7280; background:#f3f4f6; padding:3px 10px; border-radius:20px; }
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
@media(max-width:900px){ .kpi-row { grid-template-columns:repeat(2,1fr); } }
.kpi { border:1px solid #f0f0f0; border-radius:8px; padding:10px; text-align:center; }
.kpi .kv { font-size:16px; font-weight:800; color:#1f2937; }
.kpi .kl { font-size:10px; color:#9ca3af; margin-top:2px; }
.kpi .ky { font-size:11px; font-weight:700; }
.up { color:#dc2626; } .down { color:#16a34a; }
.earn-insight { font-size:15px; color:#4b5563; line-height:1.85; }
.vp-summary { background:#eef4ff; border:1px solid #d6e4ff; border-left:4px solid #1d4ed8; border-radius:8px; padding:12px 14px; margin-bottom:14px; font-size:13px; color:#1e3a5f; line-height:1.75; }
.vp-summary b { color:#1d4ed8; }
.prod-sub { margin-top:8px; padding:9px 12px; background:#f9fafb; border-radius:6px; font-size:12.5px; color:#374151; line-height:1.65; }
.prod-sub b { color:#1f2937; }
.prod-advice { margin-top:8px; padding:10px 12px; background:#fff7ed; border-left:3px solid #ea580c; border-radius:6px; font-size:12.5px; color:#7c2d12; line-height:1.65; }
.prod-advice b { color:#ea580c; }
/* 财报重点厂家高亮 + 1页纸KPI网格 */
.earn-key { display:inline-block; background:#fee2e2; color:#dc2626; font-size:10px; font-weight:800; padding:2px 9px; border-radius:10px; margin-left:8px; vertical-align:middle; letter-spacing:.5px; }
.earn-kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
@media(max-width:900px){ .earn-kpi { grid-template-columns:repeat(2,1fr); } }
.earn-kpi .kpi { background:linear-gradient(180deg,#fff,#f8fafc); }
.earn-viewpoint { margin-top:10px; padding:10px 12px; background:#f0f9ff; border-radius:6px; font-size:12.5px; color:#374151; line-height:1.7; }
.earn-viewpoint b { color:#0369a1; }
/* 新品/市场模块色条 */
.mod-tag { display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:10px; color:#fff; margin-left:8px; vertical-align:middle; }
.ai-advice { margin-top:8px; padding:9px 12px; background:#f0fdf4; border-left:3px solid #16a34a; border-radius:6px; font-size:12px; color:#14532d; line-height:1.6; }
.mkt-extra { margin-top:14px; }
.mkt-sub { font-size:13px; font-weight:700; color:#1f2937; margin:14px 0 6px; }
.mkt-sub .en { font-size:11px; color:#9ca3af; font-weight:400; }
.up { color:#16a34a; font-weight:700; }
.down { color:#dc2626; font-weight:700; }

/* Tab4 market */
.mkt-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.mkt-tab { padding:6px 14px; border:1px solid #e5e7eb; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; background:#fff; color:#6b7280; }
.mkt-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.chart-box { width:100%; height:340px; }
.toggle-tbl { font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; }
.data-tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; display:none; }
.data-tbl.show { display:table; }
.data-tbl th, .data-tbl td { border:1px solid #e5e7eb; padding:7px 8px; text-align:left; }
.data-tbl th { background:#f9fafb; font-weight:700; }

/* Tab5 AI */
.ai-stat-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
.ai-stat { border:1px solid #e5e7eb; border-radius:10px; padding:14px; background:linear-gradient(180deg,#eef2ff,#fff); }
.ai-stat .num { font-size:22px; font-weight:800; color:#3730a3; }
.ai-stat .lbl { font-size:11px; color:#6b7280; margin-top:2px; }

/* ===== 汇总提炼页：分行条理 + 大字体 + 观点直接 ===== */
.summary-box { background:#eef4ff; border:1px solid #d6e4ff; border-left:4px solid var(--accent); border-radius:10px; padding:16px 20px; margin-bottom:16px; font-size:15px; line-height:1.95; color:#1e3a5f; }
.summary-box .lbl { font-weight:800; color:var(--accent-deep); display:block; margin-bottom:10px; font-size:15.5px; }
.summary-lines > div { padding:6px 0; border-bottom:1px dashed #e3ecfd; }
.summary-lines > div:last-child { border-bottom:none; }
.summary-lines .mk { color:var(--accent); font-weight:800; margin-right:7px; }


/* 全球/中国切换 */
.gc-toggle { display:inline-flex; gap:6px; margin-bottom:14px; }
.gc-btn { padding:6px 18px; border:1px solid #e5e7eb; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; background:#fff; color:#6b7280; transition:all .15s; }
.gc-btn:hover { color:var(--accent); background:var(--accent-soft); }
.gc-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 存储价格曲线（持续刷新跟踪） */
.storage-note { font-size:11.5px; color:#6b7280; margin-top:8px; line-height:1.6; }
.price-chart { width:100%; height:330px; }
/* 实际价格曲线（绝对数值）· 权限门禁 */
.pg-divider { height:1px; background:linear-gradient(90deg,#e5e7eb,transparent); margin:18px 0 14px; }
.pg-head { margin-bottom:8px; }
.pg-title { font-size:14.5px; font-weight:700; color:#1f2937; }
.pg-sub { font-size:11.5px; color:#6b7280; margin-left:6px; }
.price-lock { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:34px 16px; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:12px; }
.pl-icon { font-size:30px; }
.pl-txt { font-size:14px; color:#64748b; font-weight:600; }
.pl-btn { padding:9px 20px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s; }
.pl-btn:hover { filter:brightness(1.08); }
.pl-hint { font-size:11px; color:#94a3b8; margin-top:2px; text-align:center; max-width:340px; line-height:1.5; }

/* 上下游成本结构化部件卡 */
.cost-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
.cost-card { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; background:#fff; }
.cost-card .cc-name { font-size:14.5px; font-weight:800; color:#1f2937; display:flex; align-items:center; gap:8px; }
.cost-card .cc-dir { font-size:11px; font-weight:800; padding:2px 9px; border-radius:10px; white-space:nowrap; }
.cc-up { background:#fdecec; color:#dc2626; } .cc-down { background:#e7f6ec; color:#16a34a; } .cc-flat{ background:#eef2f7; color:#6b7280; }
.cost-card .cc-change { font-size:13px; color:#374151; margin-top:9px; line-height:1.65; }
.cost-card .cc-impact { margin-top:9px; padding:9px 11px; background:#f9fafb; border-left:3px solid var(--accent); border-radius:6px; font-size:12.5px; color:#4b5563; line-height:1.65; }
.cost-card .cc-impact b { color:var(--accent-deep); }
.cost-takeaway { margin-top:14px; padding:12px 16px; background:#eef4ff; border:1px solid #d6e4ff; border-radius:10px; font-size:14px; color:#1e3a5f; line-height:1.8; }
.cost-takeaway b { color:var(--accent-deep); }

.footer { text-align:center; color:#9ca3af; font-size:11px; padding:24px; }

/* ===== 财报速递：观点总览加颜色 + 换行结构化 ===== */
.snap-box { border-radius:10px; padding:13px 16px; margin-bottom:12px; line-height:1.85; font-size:14px; }
.snap-box.find { background:#eff6ff; border-left:4px solid #1d4ed8; color:#1e3a5f; }
.snap-box.impl { background:#fff7ed; border-left:4px solid #ea580c; color:#7c2d12; }
.snap-box .snap-h { font-weight:800; font-size:14.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.snap-box.find .snap-h { color:#1d4ed8; }
.snap-box.impl .snap-h { color:#ea580c; }
.nl { margin-top:6px; }
.nl-i { padding:5px 0; border-bottom:1px dashed #e3ecfd; line-height:1.8; font-size:13.5px; color:#374151; }
.nl-i:last-child { border-bottom:none; }
.nl-i .mk { color:var(--accent); font-weight:800; margin-right:7px; }
.earn-viewpoint b { color:#1d4ed8; }
.earn-insight b { color:#ea580c; }
.earn-kpi .kpi .ky { color:var(--accent); }

/* ===== 意见领袖：原话红粗 + 来源链接 ===== */
.hl-red { color:#dc2626; font-weight:800; }
.vp-link { color:#2563eb; font-size:11.5px; font-weight:600; margin-left:5px; white-space:nowrap; }
.vp-link:hover { text-decoration:underline; }
.person-head { display:flex; align-items:baseline; gap:6px; margin-bottom:6px; }

/* ===== 新品发布解读：子版块四色配色 + 日历公司标色 ===== */
.prod-summary { font-size:15px; font-weight:600; color:#1f2937; line-height:1.9; }
.prod-strategy { margin-top:10px; padding:11px 14px; background:#eff6ff; border-left:4px solid #1d4ed8; border-radius:6px; font-size:14px; color:#1e3a5f; line-height:1.85; }
.prod-strategy b { color:#1d4ed8; }
.prod-compete { margin-top:8px; padding:11px 14px; background:#f0fdf4; border-left:4px solid #16a34a; border-radius:6px; font-size:14px; color:#14532d; line-height:1.85; }
.prod-compete b { color:#16a34a; }
.prod-consumer { margin-top:8px; padding:11px 14px; background:#faf5ff; border-left:4px solid #7c3aed; border-radius:6px; font-size:14px; color:#4c1d95; line-height:1.85; }
.prod-consumer b { color:#7c3aed; }
.prod-advice { margin-top:8px; padding:11px 14px; background:#fff7ed; border-left:4px solid #ea580c; border-radius:6px; font-size:14px; color:#7c2d12; line-height:1.85; }
.prod-advice b { color:#ea580c; }
.ev-brand { font-weight:800; font-size:12px; }
.cal-cell .evt { margin-top:4px; color:#374151; font-weight:500; line-height:1.4; }

/* ===== 市场大盘：厂商份额柱状图 ===== */
.share-chart { width:100%; height:300px; margin-top:10px; }



.ab-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.ab-kpi{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;}
.ab-v{font-size:24px;font-weight:800;color:var(--accent);}
.ab-u{font-size:12px;font-weight:700;color:#6b7280;margin-left:3px;}

<body>
<header class="header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="46" height="46">

<script>const DATA = {"terminal": {"updateTime": "2026-08-29 09:30", "headlineViewpoints": [{"tag": "新品爆单", "t": "华为Pura X View阔直板8/29预订爆单：**未定价即售罄，“阔屏”从折叠下放直板，直板机十年最大形态变革**", "s": "核心观点：华为Pura X View于8/29开启线下预订，在售价未公布的情况下多地门店排队、首批货源迅速售罄——6.39英寸16:9.5阔型屏（比传统直板宽约15%）、96.1%业界最高屏占比、四边边框1.05mm、6.68mm机身塞入7000mAh电池（201g）、麒麟9030S、首发HarmonyOS 7、5000万三摄含潜望长焦，9/7正式发布会公布价格；参考前两代阔折叠累计销量超200万台，阔屏形态已被市场验证。高层建议：【短期·经营】“盲订爆单”说明形态创新的号召力强于参数堆料，建议9/7定价兼顾走量与高端心智，并提前锁定阔屏产能与渠道首销排期；同步推动头部App完成16:9.5适配，把“阔屏生态”做成护城河而非体验短板。", "l": "新浪/财经头条", "u": "https://k.sina.com.cn/article_7879848900_1d5acf3c406803ahu8.html"}, {"tag": "生态", "t": "鸿蒙生态大会定调：**HarmonyOS 6装机破8000万、Q4冲1亿，鸿蒙从“活下来”转入“出海扩张”**", "s": "核心观点：8/28深圳鸿蒙生态大会2026上，徐直军披露截至8/20搭载HarmonyOS 6的终端突破8000万、原生应用超10万个，预计四季度用户破1亿正式进入成长期，并明确推动鸿蒙出海。高层建议：【长期·方向】1亿是生态正循环的临界点（开发者意愿随装机量非线性提升），建议把Q4冲刺与鸿蒙7正式版、Mate 90/Mate XT 2新机节奏绑定，用新机首销带动装机跳变；出海优先选择渠道与合规门槛较低的市场，以“端侧AI+隐私合规”作为差异化卖点，规避GMS依赖争议。", "l": "封面新闻/腾讯新闻", "u": "https://new.qq.com/rain/a/20260829A036NQ00"}, {"tag": "竞争格局", "t": "Counterpoint Q2中国份额再确认：华为23%创2020Q4新高、**小米-21%成最大跌幅，成本周期下“高低端分化”加剧**", "s": "核心观点：Counterpoint Q2 2026中国份额——华为23%（同比增速最高，麒麟5G回归畅享系列，畅享90 Pro Max与Mate 80为主力）、苹果18%（+23% YoY，价格稳定反而受益）、vivo 16%、OPPO 15%、小米12%（-21% YoY为头部最大跌幅，主因依赖低端机型）、荣耀11%；单品销量榜iPhone 17 Pro Max(6%)/iPhone 17(5%)居前，华为畅享90 Pro Max与Mate 80入围，小米等国产单品出局。Counterpoint判断存储与SoC成本上涨将迫使厂商继续涨价、出货压力加大，预计2026中国大陆出货同比-6%。高层建议：【中期·战略】成本上行周期中“高端+自研芯片+垂直整合”是唯一抗压组合（华为/苹果已验证），依赖低端的品牌将加速出清；建议华为中低端继续以麒麟下放+规模采购锁成本，把成本优势转化为份额。", "l": "Counterpoint/热点科技", "u": "https://www.counterpointresearch.com/insights/china-smartphone-share/"}, {"tag": "竞争格局", "t": "折叠屏进入\"华为主场\"时间：**9/7抢跑苹果48小时，本质是高端定义权之争**", "s": "核心观点：Mate XT 2（U型双内折/独立外屏/麒麟9050/首发鸿蒙7正式版）定档9/7 14:30，较苹果首款折叠iPhone（9/9）早两天——华为要在苹果入局前把\"三折叠=华为\"的心智立住；三折叠全球发货已破100万台、Q1占国内折叠屏60%份额居首。高层建议：【中期·战略】把\"抢跑48小时\"固化为高端发布节奏打法，2万元档优先保证产能与渠道资源匹配首发声量；折叠屏竞争已从\"能造出来\"转向\"能放心用\"（抗摔/防刮/外屏高频操作），营销应从参数转向耐用性心智。", "l": "网易科技/ZAKER", "u": "https://www.163.com/dy/article/L59D8KCK0550A7UY.html"}, {"tag": "市场份额", "t": "大盘连缩5季但华为22.6%重回榜首：**终端复苏是头部集中，不是总量回暖**", "s": "核心观点：IDC数据显示Q2中国手机出货6601万台同比-4.3%（连续5季度下滑），华为以22.6%份额/约1492万台/+19.4%重回第一，前十中仅华为、苹果两家正增长。高层建议：【长期·方向】缩量市场里\"份额质量>出货规模\"，资源应向折叠屏+旗舰高价段集中，用鸿蒙生态粘性对冲40个月+的换机周期；对依赖走量的二线品牌，警惕份额加速出清带来的渠道风险。", "l": "IDC/网易", "u": "https://www.163.com/dy/article/L59D8KCK0550A7UY.html"}, {"tag": "竞对动态", "t": "苹果9/10双线作战：**Pro涨价100美元+首款折叠约1.5万元，初代折叠\"赶工痕迹\"是安卓窗口期**", "s": "核心观点：苹果8/27官宣9/10凌晨1点（太平洋时间9/9上午10点）发布会，推iPhone 18 Pro（A20 Pro 2nm/涨价100美元至1199美元/苹果自消化部分内存成本/自研C2基带/可变光圈f1.4-f4.0/灵动岛缩小30%/新增深樱桃红+天蓝色）与首款折叠iPhone Ultra（国行约14999元/初期仅美国/影像缩水无双长焦/侧边Touch ID替代Face ID/钛合金4.5mm）；标准版延至2027春。高层建议：【短期·经营】初代折叠的妥协点（影像/生物识别）正是华为、三星折叠成熟度的对比靶点，9月传播中应主动设置\"折叠成熟度\"议题；同时评估Pro涨价对6000-8000元档的挤压与让出的空间。", "l": "腾讯新闻/PConline", "u": "https://www.toutiao.com/article/7678544094225990179/"}, {"tag": "竞对动态", "t": "苹果突袭Mac产品线：**M6 Mac mini 6999元起，端侧AI算力下沉到桌面入门款**", "s": "核心观点：苹果8/25无预警上架新Mac mini（M6/M5 Pro，AI性能最高提升4倍，Wi-Fi 7/蓝牙6，6999元起，8/25预购9/22发售）与Mac Studio（M5 Ultra），端侧AI从手机扩展到桌面全线。高层建议：【中期·战略】PC端侧AI化将重估桌面算力标配，\"本地大模型体验\"叙事若被苹果拿走，Windows阵营与华为MateBook将陷入参数追赶；建议把AI PC的软件体验（本地Agent/隐私计算）作为差异化传播重点。", "l": "腾讯IT早报", "u": "https://new.qq.com/rain/a/20260826A0373600"}, {"tag": "行业节奏", "t": "9月史上最激烈新品月：**七家旗舰同月对撞，供应链锁量与渠道首销先于产品定胜负**", "s": "核心观点：9月将密集发布iPhone 18 Pro、华为Mate 90/Mate XT 2、小米18、荣耀Magic9、vivo X500、OPPO Find X10、iQOO 16，为机圈史上最拥挤新品月；叠加内存涨价周期，\"发布即缺货\"风险上升。高层建议：【短期·经营】同月对撞会摊薄单家营销声量，胜负手前移到供应链锁量（内存/面板/SoC）与渠道首销资源排布；建议按周跟踪竞对定档变化并预设两周弹性窗口，避免与苹果9/10、华为9/7正面撞车。", "l": "腾讯新闻", "u": "https://new.qq.com/rain/a/20260826A0373600"}, {"tag": "品牌势能", "t": "EISA年度奖中国厂商四席取三：**欧洲高端话语权东移，\"单点冠军\"策略奏效**", "s": "核心观点：欧洲影音协会2026-2027年度奖中，小米17T Pro获年度智能手机、荣耀Magic V6获最佳折叠屏、OPPO Find X9 Ultra获最佳影像、三星S26 Ultra获最佳AI手机——中国品牌拿下关键细分奖项。高层建议：【长期·方向】EISA是欧洲运营商渠道与高端用户的重要背书，荣耀/OPPO/小米正以\"单点冠军\"切欧洲高端；华为回归欧洲市场的差异化抓手应是折叠屏+卫星通信，而非影像同质化竞争。", "l": "手机中国/EISA", "u": "https://new.qq.com/rain/a/20260826A06TUB00"}, {"tag": "定价策略", "t": "Mate XT 2顶配或破3万元：**三折叠从科技产品转向\"身份符号\"，超高端定价试验开启**", "s": "核心观点：8/26爆料Mate XT 2顶配售价或突破3万元（首屏无孔/硬件级防窥/100W快充/2亿像素/紫黑白三色取消红色），较上代17999元起售大幅上探。高层建议：【中期·战略】3万元档对应的必须是专属服务、渠道体验与用户运营体系（而非堆料逻辑）；建议同步规划超高端用户的权益体系与二手保值机制，防止高价上市后价格破发损伤品牌。", "l": "今日头条/CNMO", "u": "https://www.toutiao.com/article/7678279831397597734"}, {"tag": "竞对动态", "t": "三星S26 FE 8/27发布涨价149美元：**存储涨价向终端传导的\"FE样本\"，性价比定位被成本侵蚀**", "s": "核心观点：三星8/27发布Galaxy S26 FE（Exynos 2500 3nm 10核/6.7\"AMOLED/50MP三摄/4900mAh硅碳/45W），起售价799美元比S25 FE贵149美元（+22.9%），但升级基本仅处理器（9to5Google评\"基本就是换了设计的S25 FE\"），8GB内存在国产普遍12GB起步背景下偏小。高层建议：【短期·经营】S26 FE是存储涨价向中端机型传导的标杆案例——规格原地踏步但价格上涨，性价比定位被成本侵蚀；国产厂商在中端价位面临同样压力，建议以\"加量不加价\"或\"微涨+体验升级\"策略对冲，避免陷入\"涨价不减配即失竞争力\"的困境。", "l": "IT之家/Android Headline", "u": "https://www.ithome.com/0/991/872.htm"}, {"tag": "生态", "t": "鸿蒙跨过规模临界点：**装机破8000万+鸿蒙7正式版首发，系统级AI成差异化主战场**", "s": "核心观点：HarmonyOS装机量突破8000万台（日均新增17万+，中国份额19%超iOS），鸿蒙7正式版9/7随Mate XT 2首发，为首个全系统AI化改造OS（智能体框架2.0复杂任务成功率>90%）。高层建议：【长期·方向】鸿蒙已从\"可用\"进入\"生态引力\"阶段，开发者与应用伙伴运营优先级应上调；系统级AI是区别于安卓/iOS的核心卖点，建议在旗舰营销中前置为一级信息而非附加功能。", "l": "网易/华为开发者", "u": "https://www.163.com/dy/article/L59D8KCK0550A7UY.html"}, {"tag": "定价策略", "t": "成本周期下的终端定价分化：**苹果自消化、安卓高端化、华为不涨反降，三种选择三种结果**", "s": "核心观点：内存/BOM上行周期中，苹果iPhone 18 Pro涨价100美元但自消化部分内存成本，三星DX部门利润承压，中国厂商被迫加速高端化；华为Mate 90被预估\"不涨反降\"形成鲜明反差。高层建议：【短期·经营】成本周期是份额重洗窗口，\"保价保份额\"与\"涨价保毛利\"应按品牌势能分层决策；建议按月度跟踪BOM成本对ASP与毛利率的传导斜率，把成本定价权作为经营例会固定议题。", "l": "网易/第一深度观察", "u": "https://www.163.com/dy/article/L57HV9JM0511AMS8.html"}], "opinionLeaders": [{"name": "余承东", "role": "华为终端BG董事长", "items": [{"hl": "官宣Mate XT 2定档9/7 14:30，改U型双内折+独立外屏，首发鸿蒙7正式版", "detail": "抢跑苹果9/9两天；第三代三折叠从\"能造出来\"进入\"能放心用\"，顶配或破3万元", "l": "腾讯IT早报", "u": "https://new.qq.com/rain/a/20260826A0373600"}, {"hl": "三折叠全球发货破100万台，Q1占国内折叠屏60%份额居首", "detail": "用出货规模证明超高端形态不是小众玩具，折叠屏定义权暂归华为", "l": "网易/ZAKER", "u": "https://www.163.com/dy/article/L59D8KCK0550A7UY.html"}]}, {"name": "何刚", "role": "华为终端BG CEO", "items": [{"hl": "鸿蒙7正式版9/7随Mate XT 2首发，首个全系统AI化改造OS", "detail": "智能体框架2.0复杂任务成功率>90%；HarmonyOS装机破8000万，日均新增17万+", "l": "网易 0"}, {"tag": "盈利标杆", "t": "零跑上半年首度半年度盈利：'低价+高阶智驾'跑通规模×毛利，成第二家盈利新势力", "s": "核心观点：零跑上半年首次实现半年度净利润转正，成为继理想之后第二家半年度盈利的新势力；8月交付57,066辆(+88%)、1-8月累计32.89万(+136%)，连续多月蝉联新势力月冠。其'双高通8797+VLA把高阶智驾压到5-25万级'+借Stellantis出海(进阿根廷、B10启航欧洲)的组合验证'规模→毛利'路径。高层建议：【中期·经营】零跑盈利证明'规模兑现毛利'可行，集团应以BOM智驾占比重估同级成本，并在出海上借鉴'借力国际车企渠道'轻资产模式；同时警惕爆款后的交付质量与售后网络风险。", "l": "Harbor/财迅通", "u": "http://app.hawkinsight.com/app/articleDetail?id=68b6cb9e4431ff663feb53c3&locales=zh_cns"}, {"tag": "L3牌照", "t": "华为乾崑搭载将破200万+享界G9获北京120km/h L3路测牌：首款获此资质量产车", "s": "核心观点：引望乾崑智驾总搭载量突破190万、8月底将破200万，合作25+品牌50+车型；享界G9于8月获批北京市时速120公里L3级自动驾驶道路测试牌照，为行业首款获此资质、覆盖高速最高法定限速场景的量产车型，启境GT7亦获广州L3许可。ADS 5年度OTA规划：7月V5.0已推、9-10月V5.X增强脱困绕行、2027初推紧急逃生。高层建议：【长期·供应链】华为从'卖方案'走向'造核心部件+拿L3资质'的实体跨越，集团在智驾选型与供应链安全上应同步评估'自研+引望外采'混合路径，并关注L3强制国标(2027.7)带来的合规护城河。", "l": "百度百科/引望", "u": "https://baike.baidu.com/item/%E4%B9%BE%E5%B4%91ADS%205.0/67693632"}, {"tag": "FSD入华", "t": "特斯拉FSD入华'受阻'系谣言：官方辟谣已报案，全面批准预计2026 Q3", "s": "核心观点：8/26特斯拉中国回应'上海数据中心人去楼空、FSD数年入华无望'为不实信息并已报案，上海临港数据中心实现超30亿公里本土数据境内存储、本土AI训练中心2月投运、与百度地图合作合规高精地图。FSD监督版入华仍推进，已付费HW4.0车主可体验高速领航，城市全场景待监管审批；CFO称目标Q3获全面商用许可。FSD全球累计里程已破100亿英里。高层建议：【中期·竞争】特斯拉FSD一旦在华全面落地，将补齐其智驾短板、正面硬刚华为/小鹏，集团应把'纯视觉 vs 激光雷达'路线之争与数据合规能力纳入竞品监测，提前评估对高端智驾心智的稀释风险。", "l": "广州日报/新浪", "u": "https://news.dayoo.com/finance/202608/27/171077_54996716.htm"}, {"tag": "Robotaxi", "t": "Robotaxi中国三席进全球前五、跨过'烧钱验证'：萝卜快跑320万单/27城、小马Q2营收+395%", "s": "核心观点：Autonomy AI全球Robotaxi榜中国占三席(萝卜快跑/小马/文远)；萝卜快跑Q1全无人订单320万单、覆盖27城(此前榜首81.7分超Waymo，后因12小时动态更新Waymo 79.3分回第一，差距已可反复交替)；小马Q2 Robotaxi营收+395%、车队破1700辆、国内唯一北上广深全无人收费许可；文远约1300辆落4城纯无人。远程安全员人车比1:20-1:40，多家单车盈亏平衡，行业进入'自我造血'。高层建议：【长期·战略】Robotaxi下半场看'上路规模+接单密度+成本'，建议集团在出行生态布局中把自动驾驶商业化飞轮作为评估车企与科技伙伴的新维度，关注L3/L4强制国标(2027.7)合规护城河。", "l": "钜亨网/新浪", "u": "https://hao.cnyes.com/post/256883"}, {"tag": "多品牌", "t": "蔚来多品牌释放潜能：8月3.13万历史新高，乐道L90两月破万、ONVO成逆袭引擎", "s": "核心观点：蔚来8月交付31,305辆(+55.2%)创历史新高，结构变化显著——ONVO乐道16,434辆(+175%)、Firefly萤火虫4,346辆(+84%)，而主品牌蔚来仅10,525辆；乐道L90上市两月破万刷新蔚来交付速度纪录。多品牌(蔚来/乐道/萤火虫)矩阵从单一高端转向中 ps://view.inews.qq.com/a/20260826A0CSTE00"}, {"tag": "云收入", "t": "谷歌云+82%、capex上修至2050亿$、FCF首负：**AI基建兑现强但巨头现金流红灯已亮**", "s": "核心观点：Alphabet 26Q2 Google Cloud收入248亿美元(+82%)、积压订单5140亿、Gemini App月活9.5亿；但单季capex 449亿美元、自由现金流数十年来首负(-59亿)，2026 capex指引上修至1950–2050亿。高层建议：【投资】「积压订单>收入」验证AI云兑现确定性，但巨头已现现金流压力；建议以「订单能见度+现金流健康度」双指标跟踪，警惕capex见顶叙事被证伪的同时关注估值对FCF的敏感度。", "l": "腾讯新闻/Technology Magazine", "u": "https://new.qq.com/rain/a/20260723A043FK00"}, {"tag": "资本开支", "t": "腾讯单季capex暴增176%砸528亿、自由现金流转负、AI拖累利润105亿：**利润阵痛深化但「算力自用」定力明确**", "s": "核心观点：腾讯26Q2资本开支527.8亿(+176%)，自由现金流-138亿；含混元/元宝/WorkBuddy等的新AI产品拖累Non-IFRS经营利润105亿；但管理层明确算力优先自用训练混元4而非外租（外租可即时回本），汤道生8/25撰文回应「做AI慢了」称算力不足拖累混元迭代、Hy4将有更多突破。高层建议：【中期·战略】腾讯选择「利润换卡位」且保底方案清晰，市场容忍度取决于元宝MAU与AI收入里程碑；建议关注其「云+Agent」双螺旋对云收入的拉动节奏与紫霄2.0自研芯片放量。", "l": "证券时报/中国经营报", "u": "https://www.163.com/dy/article/L47B76S2053469RG.html"}, {"tag": "AI助手", "t": "ChatGPT周活9亿但份额79%→54%：**规模到顶前，护城河先从「独占」变「领先」**", "s": "核心观点：OpenAI官方口径周活9亿(+125%)、App月活破10亿、年化收入约400亿$、92%财富500强在用；但流量份额由79%降至54%，竞品分流明显。高层建议：【长期·方向】消费级AI从「一家独占」进入「多强分流」，OpenAI的变现窗口在其份额被摊薄之前；对应用开发者，多模型路由而非单家绑定是更稳的技术策略。", "l": "PopularAiTools", "u": "https://popularaitools.ai/blog/chatgpt-usage-statistics"}, {"tag": "中国AI", "t": "豆包月活3.82亿居首但C端收入偏弱：**流量≠收入，MaaS ARR 40亿揭示「订阅转化」才是分水岭**", "s": "核心观点：豆包月活3.82亿、日均tokens 180万亿居国内首位，C端单日收入仍偏弱；但MaaS ARR按7月口径达40亿美元，说明B端/API变现已跑通。高层建议：【投资】流量≠收入，国内AI应用的估值分水岭在「流量→订阅/API」转化率；关注豆包办公等场景化变现对估值的修复，以及其企业Agent(HiAgent)市占进展。", "l": "腾讯网/华夏时报", "u": "https://new.qq.com/rain/a/20260625A045HJ00"}, {"tag": "算力", "t": "英伟达Groq 3 LPX量产+SpaceX太空AI卫星：**推理加速器进入「量产时代」，但客户自研芯片开始分流**", "s": "核心观点：8/25英伟达Groq 3 LPX（Vera Rubin推理加速器）全面量产，主攻超低延迟Token生成；马斯克宣布SpaceX首批搭载英伟达Vera Rubin NVL72的AI卫星2027发射、2028大规模部署，费城半导体指数涨。但OpenAI Jalapeño、谷歌TPU、阿里平头哥持续自研，「自研+外采」双轨削弱英伟达训练端独占。高层建议：【短期·经营】推理侧供给宽松将降AI应用成本、扩实时交互场景；建议把「推理成本下降」作为应用毛利改善的关键变量，同时跟踪客户自研芯片对英伟达订单能见度的潜在稀释。", "l": "新浪财经/证券时报", "u": "https://futurumgroup.com/insights/nvidia-q2-fy-2026-earnings-networking-steals-the-spotlight/"}, {"tag": "模型调用", "t": "OpenRouter周榜低成本MoE霸榜、智谱OxAlpha匿名登顶：**Agent主循环转向Flash级，旗舰模型沦为「备用大脑」**", "s": "核心观点：OpenRouter 8月周榜DeepSeek V4 Flash 0731（11.3T）居首、腾讯Hy3（9.83T）第二、小米MiMo-V2.5（5.46T）第四；智谱以OxAlpha匿名身份在whatstrending周榜以23.25T tokens登顶，国产开放权重模型首次在真实调用量上压过闭源旗舰。高层建议：【短期·经营】推理成本结构决定AI应用毛利，「够用模型+任务路由」成为工程标配；建议按调用量结构而非benchmark排名评估模型选型，成本敏感场景优先国产MoE。", "l": "OpenRouter/whatstrending", "u": "https://openrouter.ai/rankings"}, {"tag": "终端云", "t": "苹果服务收入占比26%、毛利率75%：**硬件见顶不可怕，利润结构「服务化」才是估值锚**", "s": "核心观点：FY26Q3苹果服务收入稳增、毛利率75%（整体50.1%）；与Google Gemini签多年合作，端侧AI以「服务订阅+生态」变现而非硬件溢价。高层建议：【长期·方向】苹果证明终端厂商AI变现可以不靠硬件涨价而靠服务分成，「Gemini合作+自有服务」模式值得安卓阵营研究；建议测算自家服务收入占比与苹果的可比差距。", "l": "Apple 10-K/SEC", "u": "https://axis-intelligence.com/apple-statistics"}], "opinionLeaders": [{"name": "黄仁勋 (Jensen Huang)", "role": "NVIDIA 创始人兼 CEO", "items": [{"hl": "AI芯片不够了——我们还要给AI公司提供土地、电力和数据中心。", "detail": "8/17 宣布 NVIDIA 不仅卖芯片，还联合 SB Energy 向 AI 实验室提供完整「AI 工厂」基础设施（OpenAI 为租户）；称 AI 基础设施而非算法正成为 AI 增长的关键约束。", "l": "India Today", "u": "https://www.indiatoday.in/technology/news/story/nvidia-says-ai-chips-are-not-enough-now-it-will-give-ai-companies-land-and-power-2973342-2026-08-17"}, {"hl": "竞争对 NVIDIA 是好事——所有模型，开源还是闭源，都跑在 NVIDIA 上。", "detail": "8/26 财报称供给受限下 FY2028 仍预增 70%，「AI 正在产生可盈利的 tokens」，全模型开放不会削弱其生态地位。", "l": "Kiplinger", "u": "https://www.kiplinger.com/investing/live/nvidia-earnings-live-updates-and-commentary-august-2026"}, {"hl": "AI时代，算力就是收入。", "detail": "8/11 联合 Apollo/BlackRock/Blackstone 等设融资平台，撬动超 5000 亿美元第三方资本，将算力变成可投资资产类别。", "l": "腾讯新闻", "u": "https://view.inews.qq.com/a/20260811A047G100"}, {"hl": "推理加速器量产、客户自研芯片分流——英伟达护城河从「独占」转向「生态+网络」。", "detail": "8/25英伟达Groq 3 LPX（Vera Rubin推理加速器）全面量产主攻超低延迟Token；同季网络收入同比+98%至73亿$、Spectrum-X年化破100亿$，NVLink机架成AI工厂标配。但OpenAI Jalapeño、谷歌TPU、阿里平头哥持续自研，「自研+外采」双轨削弱其训练端独占。", "l": "Futurum/Nvidia IR", "u": "https://futurumgroup.com/insights/nvidia-q2-fy-2026-earnings-networking-steals-the-spotlight/"}]}, {"name": "Dario Amodei", "role": "Anthropic 联合创始人兼 CEO", "items": [{ ip": {"updateTime": "2026-08-28 06:30", "headlineViewpoints": [{"tag": "存储", "t": "DDR5现货一年暴涨至48美元、64GB服务器DRAM破3100美元：**存储从周期品变战略品，但已逼近下游承受拐点**", "s": "核心观点：2026年8月DDR5-5600/6400 24Gb现货价达48美元，较一年前8美元涨约5倍（同比+483%）；64GB服务器DRAM现货突破3100美元，较6月底合约价高146%。涨价由AI虹吸先进产能驱动，而非需求共振。高层建议：【短期·经营】价格已至极端区间，OPPO/vivo已拒三星Q3约20%涨价，存储占整机BOM升至20%以上（低端30-60%）；建议集团按基准+回落双情景做采购与定价预案，避免在顶点加库存，并加速国产存储导入对冲。", "l": "财联社/今日头条/安博电子", "u": "https://www.toutiao.com/article/7675633538745516594/"}, {"tag": "国产资本化", "t": "长鑫市值约4万亿、长存330亿IPO受理：**国产存储双雄从\"产品替代\"走向\"资本+生态替代\"**", "s": "核心观点：长鑫科技7/27上市、市值约4万亿元居A股前列；长江存储8/21科创板IPO受理、拟募330亿元（超长鑫295亿、中芯200亿），创板块拟募资之最。二者赛道分野清晰——长鑫主攻DRAM（断电丢失、作运行内存），长存聚焦NAND（断电离线、大容量存储），2026全球DRAM产值约6187亿美元、NAND约2706亿（2.3倍）。里程碑在生态：长鑫LPDDR6已进入小米玄戒O3供应链、成首款配套国产旗舰SoC商用的LPDDR6。高层建议：【投资】国产存储完成资本化，产能扩张与研发获长期资金；建议集团把长鑫/长存纳入核心供应与战略投资，提前锁定DDR5/LPDDR5与NAND长协产能，并以长鑫LPDDR6国产配套降低对外依赖。", "l": "网易/新浪财经", "u": "https://www.163.com/dy/article/L55U578705118O92.html"}, {"tag": "封锁", "t": "MATCH法案拟纳入NDAA、150天逼盟国对齐：**美国对华封锁从卡先进滑向卡存量维保**", "s": "核心观点：MATCH Act（S.4281）由Ricketts/Kim提出，拟纳入2026财年NDAA manager's amendment，设150天期限强制荷兰/日本对齐对华设备管制，并叫停已装机DUV的销售、维修、备件与远程升级，点名中芯/长存/长鑫/华虹/华为。ASML 2025中国销售占33%。高层建议：【长期·方向】管制从新购扩至存量运维，现有产线稼动率与精度衰减风险上升；建议按设备品类梳理存量产线进口依赖度，加速国产备件与第三方运维验证，预案先行。", "l": "CoinDesk/格隆汇/国防新闻", "u": "https://coindesk.cc/match-act-poised-for-inclusion-in-senate-ndaa-as-us-tightens-chip-export-controls-101236.html"}, {"tag": "下游博弈", "t": "OPPO/vivo拒三星Q3约20%涨价、存储占BOM升至20%+：**涨价博弈白热化，周期拐点信号隐现**", "s": "核心观点：三星2026年内第三次涨价、累计近300%，OPPO与vivo已正式拒绝其Q3约20%报价；存储占整机BOM由10-15%飙升至20%以上、低端机型达30-60%，Omdia预估2026全球智能手机出货降12%、ASP达565美元（较2025 +98美元）。高层建议：【短期·经营】下游拒单显示涨价触及承受底线，是周期中后段特征；建议集团终端业务对存储成本做转嫁+自研替代双轨，避免被动消化，同时关注拐点后的库存跌价风险。", "l": "安博电子/集微", "u": "https://www.ambleelec.com/NewsDetail/1050"}, {"tag": "封装瓶颈", "t": "TSMC CoWoS售罄至2027、HBM4量产：**AI算力新瓶颈从晶圆转向先进封装与HBM**", "s": "核心观点：台积电CoWoS-S/L产能售罄、月产能冲12-13万片仍满载，交期52-78周；英伟达占约60%（~59.5万片）并锁半数2026-27扩产；HBM4量产、SK海力士占英伟达HBM4约2/3、整体位元市占约50-62%。高层建议：【投资】封装+HBM是比晶圆更硬的约束，设计公司须以长约锁CoWoS与HBM；集团云/AI业务应跟踪HBM4认证与CoWoS排产，把产能即竞争力作为采购铁律。", "l": "The CODEW/Silicon Analysts", "u": "https://www.thecodew.com/2026/08/semiconductor-watch-tsmc-n2-cowos-hbm4-ai-chip-race.html?m=1"}, {"tag": "制程", "t": "台积电N2/A16售罄至2028、苹果独占近半初期产能：**先进制程寡头化，安卓旗舰被迫延后**", "s": "核心观点：TSMC N2（2nm）与A16产能售罄至2028，交期78-156周、晶圆单价超3万美元；苹果锁定约50%初期产能，安卓阵营2nm旗舰至少晚2-3季度。高层建议：【中期·战略】制程代差成营销武器，2026下半年安卓旗舰仍以3nm为主；建议关注N2良率与安卓客户（高通/联发科）排产窗口，集团终端自研SoC须锚定2nm节点对冲。", "l": "WCCFtech/Silicon Analysts", "u": "https://wccftech.com/roundup/apple-a20-pro-first-iphone-2nm-chipsets-here-is-everything-you-need-to-know/"}, {"tag": "国产DRAM", "t": "长鑫DRAM份额~8%跻身全球第四、LPDDR6打入小米玄戒O3：**国产存储从\"敢用\"走向\"旗舰规模商用\"**", "s": "核心观点：长鑫全球DRAM份额2026Q1升至约8%（较去年3%翻倍）居第四，Q1营收约508亿元、同比+719%；更关键的是LPDDR6研发验证临近完成、自3月向大客户供样，已进入小米8/24新发玄戒O3（首款支持LPDDR6、113.8GB/s、较O1 +48%）供应链，成为首款配套国产旗舰SoC商用的LPDDR6，与SK海力士同台竞供。高层建议：【中期·战略】长鑫突破使双供应商策略首次在LPDDR6层级可行；建议评估国产DRAM在旗舰机型验证进度，供应链安全溢价正在兑现，宜早锁长协并推动长鑫LPDDR6在集团终端导入。", "l": "DigitalToday/长桥", "u": "https://www.digitaltoday.co.kr/en/view/96439/cxmt-ymtc-supply-push-may-reshape-dram-nand-market"}, {"tag": "HBM", "t": "HBM市场420-546亿美元、占DRAM近四成：**海力士半壁江山，是消费级DRAM短缺的根因**", "s": "核心观点：TrendForce/SEMI预估2026年HBM市场420-546亿美元（占DRAM近四成），SK海力士位元市占约50-62%、绑定英伟达Rubin；HBM4认证完成、下半年量产、单颗最高48GB/3.6TB/s。高层建议：【长期·方向】HBM占投片比重抬升是通用DRAM短缺根因，HBM4量产进度直接决定英伟达Rubin节奏；建议跟踪海力士/三星HBM4良率，国产HBM差距仍约2代。", "l": "TrendForce/中央社", "u": "https://ieknet.iek.org.tw/ieknews/news_open.aspx/news_more.aspx?actiontype=ieknews&indu_id=1&nsl_id=7bafbd0a1aa7480f9543e01827f9e986"}, {"tag": "算力迭代", "t": "英伟达Feynman转A16+SoIC 3D+CPO、AMD MI350X挑战Blackwell：**平台迭代加速虹吸先进产能**", "s": "核心观点：英伟达下一代Feynman拟用台积电A16（2nm升级）+SoIC 3D堆叠+共封装光学（CPO）；AMD MI350X（3nm CDNA4/288GB HBM3E/8TB/s）挑战Blackwell推理霸权，Omdia上调2026半导体收入增长至+94.1%、存储占半导体收入50%+。高层建议：【中期·战略】算力平台快速迭代持续虹吸先进制程与HBM，供给紧张至少延续至2027；建议集团AI业务以多供应商+长协破单点锁死，并关注CPO/先进封装技术路线。", "l": "IT之家/Omdia", "u": "https://www.toutiao.com/article/7673837024146686464"}, {"tag": "投资", "t": "高盛估中国2035芯片自给率仍差34%、中芯良率23%：**国产替代是长跑，按晚一步控风险**", "s": "核心观点：高盛模型显示受EUV禁运约束，中芯先进制程良率约23%（台积>90%），2035年自给率仍缺口约34%；但仍给予中芯买入，看好AI驱动国产替代放量。中芯成熟制程利用率由68%升至93%。高层建议：【投资】先进制程差距短期不可逾越，但成熟制程+存储+设备国产替代确定性强；投资与采购宜晚一步——跟随验证而非抢先押注，重点跟踪中芯良率改善斜率与国产设备验证进度。", "l": "Tech Times/高盛", "u": "https://www.techtimes.com/articles/325392/20260824/goldman-sees-china-34-short-chip-self-sufficiency-2035-smic-yield-fragile-key.htm"}, {"tag": "晶圆代工", "t": "中芯/三星代工先后提价、成熟制程同步趋紧：**AI外溢让\"代工定价权\"从先进制程扩散到全谱系**", "s": "核心观点：中芯国际8月已对最紧缺产能提价（新价计入Q3晶圆）、Q2产能利用率升至93.7%、出货环比+14%、ASP+5.7%；三星Foundry 4nm满载并对4/5/8nm新单最高提价15%，SF4线除服务高通外还造HBM base die。AI需求外溢至电源管理、模拟、特色工艺，全球晶圆重回紧平衡。高层建议：【中期·战略】代工涨价将沿产业链传导至终端与AI硬件BOM，集团应在先进制程（2nm窗口）与成熟特色工艺双线锁定产能与长约，并把代工涨价纳入产品定价模型。", "l": "Reuters/x-techcon/东方", "u": "https://www.x-techcon.com/article/177417.html"}], "opinionLeaders": [{"name": "黄仁勋 (Jensen Huang)", "role": "英伟达 NVIDIA 创始人兼CEO", "items": [{"hl": "美国出口管制\"已基本适得其反\"", "detail": "2026年5月表示，从市场份额结果看管制已反噬美国企业，但承认前沿算力仍维持能力差距；主张更大对华市场开放。", "l": "Tech Times / 高盛报告引述", "u": "https://www.techtimes.com/articles/325392/20260824/goldman-sees-china-34-short-chip-self-sufficiency-2035-smic-yield-fragile-key.htm"}, {"hl": "HBM需求虹吸效应", "detail": "Blackwell/Rubin 平台对HBM需求占用SK海力士近60%、三星近40%产能，推高全链存储价格。", "l": "中研网", "u": "https://big5.chinairn.com/hyzx/20260820/114834728.shtml"}]}, {"name": "崔泰源", "role": "SK海力士会长", "items": [{"hl": "\"客户要求原需求两倍供货\"", "detail": "公开表态HBM与高端存储需求远超供给，订单能见度长，支撑公司286亿美元回购与资本开支信心。", "l": "中研网", "u": "https://big5.chinairn.com/hyzx/20260820/114834728.shtml"}]}, {"name": "孔蓉", "role": "国联民生研究所副总、海外研究首席", "items": [{"hl": "本轮周期完全由AI驱动，拐点锚定AI技术节奏", "detail": "认为不同于传统库存周期，一旦全球AI迭代放缓、算力建设见顶，存储供需将快速逆转；当前仍处规模化落地初期，短期无需过度担忧见顶。", "l": "上海证券报", "u": "https://paper.cnstock.com/html/2026-08/15/content_2255558.htm"}]}, {"name": "李双亮", "role": "天风证券研究所电子首席分析师", "items": [{"hl": "AI基础设施对成熟产能形成\"虹吸效应\"", "detail": "龙头将先进产能优先投向HBM等高毛利产品，挤压消费电子所需DRAM/NAND产能，短期带动整体存储价格上行。", "l": "上海证券报", "u": "https://paper.cnstock.com/html/2026-08/15/content_2255558.htm"}]}, {"name": "摩根士丹利半导体团队", "role": "国际投行研究", "items": [{"hl": "上调存储景气，DDR4 Q3+50%/Q4+10%", "detail": "预测成熟DRAM与SLC NAND大幅涨价，并把2026年全球超大规模云资本开支上修至超8000亿美元(+67%)。", "l": "腾讯财经(大摩研报)", "u": "https://so.html5.qq.com/page/real/search_news?docid=70000021_3236a85bfb489952"}]}, {"name": "郭明錤 (Ming-Chi Kuo)", "role": "天风国际分析师", "items": [{"hl": "仅iPhone 18 Pro系列首发A20(2nm)", "detail": "因2nm成本与产能限制，A20 Pro由Chiayi P1专线量产，采用WMCM封装(整合CPU/GPU/内存/AI加速器)，Pro版配12GB RAM。", "l": "MacObserver / DigiTimes", "u": "https://www.macobserver.com/?p=242644"}]}, {"name": "瑞银 UBS 半导体团队", "role": "国际投行研究", "items": [{"hl": "2027年HBM总需求约615亿Gb、英伟达独占超40%", "detail": "瑞银预测到2027年全球HBM总需求约615亿Gb，仅英伟达一家消耗约251亿Gb（占比超40%）；HBM对晶圆消耗约为传统DRAM的3倍，是通用DRAM缺口根源。", "l": "财联社/瑞银（大摩研报引述）", "u": "https://cj.sina.com.cn/article/norm_detail?url=https%3A%2F%2Ffinance.sina.com.cn%2Froll%2F2026-08-19%2Fdoc-ininvwqt9366297.shtml&finpagefr=w_110"}]}, {"name": "雷军 (Lei Jun)", "role": "小米集团创始人、董事长兼CEO", "items": [{"hl": "玄戒O3为首款支持LPDDR6的移动平台（113.8GB/s，较O1 +48%）", "detail": "8/24发布第二代自研SoC玄戒O3（3nm、240亿晶体管、200 TOPS），并引入长鑫LPDDR6国产存储配套，推动国产供应链从\"可用\"走向\"旗舰商用\"。", "l": "Korea Herald / 北京日报", "u": "http://www.beijingnews.net/news/279267223/cxmt-enters-race-with-sk-hynix-to-supply-next-generation-lpddr6-memory-for-xiaomi-chip"}]}, {"name": "何庭波", "role": "华为 海思总裁 / 终端芯片负责人", "items": [{"hl": "\"韬定律\"：以逻辑折叠把单层芯片改双层垂直堆叠，在成熟工艺逼近3nm性能", "detail": "2026年5月提出，通过逻辑折叠（Logic Fold）把单层芯片改为双层垂直堆叠，在无法获得EUV/先进工艺下硬做出接近3nm性能；过去六年基于该路径已设计量产381款芯片，麒麟9030Pro即中芯等效7nm落地。", "l": "网易/163科技", "u": "https://www.163.com/dy/article/L56J8I4C053502RT.html"}]}], "leadersSummary": "①**产业领袖共识：本轮存储超级周期由AI算力驱动**，价格全面上涨且能见度长，但DDR5现货一年涨约5倍、下游拒单频现，拐点信号累积。②**供给端高端吃产能、中低端涨价且晶圆代工同步提价**——HBM被虹吸、中芯/三星代工先后涨价（中芯利用率93.7%、三星4nm提价15%）、CoWoS售罄至2027成新瓶颈。③**资本化、自研与管制三线并进：长鑫市值破4万亿、长存IPO募330亿**；雷军发布玄戒O3/O100（首款LPDDR6平台+6nm近存AI加速芯片）、何庭波以\"韬定律\"逻辑折叠在成熟工艺逼近3nm，标志国产自研多点突破；而MATCH法案拟纳入NDAA卡存量维保倒逼国产设备/EDA自主。集团应预案先行、把握自主可控窗口，以双供应商+长协对冲。", "institutionViews": [{"name": "摩根士丹利 Morgan Stanley", "items": [{"s": "2026Q3 DDR4等成熟DRAM单季涨价50%、Q4再涨10%(累计约65%)；SLC NAND两季各+50%。", "l": "大摩研报(腾讯财经)", "u": "https://so.html5.qq.com/page/real/search_news?docid=70000021_3236a85bfb489952"}]}, {"name": "集邦咨询 TrendForce", "items": [{"s": "2026Q3 DRAM合约价环比+13%~18%、NAND +10%~15%(较Q1的+93%~98%明显回落)；HBM 2026市场约420亿美元、海力士位元市占约50%。", "l": "TrendForce / 中央社", "u": "https://ieknet.iek.org.tw/ieknews/news_open.aspx/news_more.aspx?actiontype=ieknews&indu_id=1&nsl_id=7bafbd0a1aa7480f9543e01827f9e986"}]}, {"name": "高盛 Goldman Sachs", "items": [{"s": "中国2035年芯片自给率仍差约34%；中芯先进制程良率约23%(台积>90%)；给予中芯买入，看好AI驱动国产替代放量。", "l": "Tech Times / 高盛", "u": "https://www.techtimes.com/articles/325392/20260824/goldman-sees-china-34-short-chip-self-sufficiency-2035-smic-yield-fragile-key.htm"}]}, {"name": "SEMI", "items": [{"s": "2026年HBM市场规模预计增长58%至546亿美元，占DRAM近四成；即使三大厂70%新增产能倾斜HBM，缺口仍达50%-60%。", "l": "上海证券报(SEMI中国研判)", "u": "https://paper.cnstock.com/html/2026-08/15/content_2255558.htm"}]}, {"name": "中研普华产业研究院", "items": [{"s": "2026H1涨价集中于HBM3E/DDR5/企业级SSD，Q3扩至DDR4/LPDDR4X/消费级NAND，标志超级周期从\"结构性\"走向\"全面性\"。", "l": "中研网", "u": "https://big5.chinairn.com/hyzx/20260820/114834728.shtml"}]}, {"name": "Counterpoint Research", "items": [{"s": "2026Q1以来内存价格较2025Q4末涨80%-90%，DRAM/NAND/HBM全品类创历史新高；64GB RDIMM合约价由450美元飙至900美元以上；2026Q2按出货量，全球内存三星以25%份额居首、SK海力士22%次之，长存控股NAND跻身全球前三（中国第一），景气由AI服务器与企业级SSD驱动。", "l": "Counterpoint / 中新经纬", "u": "https://news.qq.com/rain/a/20260827A02QJ100?adChannelId=finance"}]}, {"name": "Omdia", "items": [{"s": "上调2026年半导体市场收入增长预测至同比+94.1%，存储将占半导体总收入50%以上；判断AI需求已超出行业现有芯片生产与封装能力，HBM/先进封装/先进制程瓶颈至少持续至2027。", "l": "Omdia/C114", "u": "https://so.html5.qq.com/page/real/search_news?docid=70000021_2686a705d8b76352"}]}, {"name": "美银证券 BofA Securities", "items": [{"s": "上调2026年全球超大规模云资本开支预测至超8000亿美元（同比+67%），并预计2027年突破1万亿美元；AI大基建是存储与先进产能持续紧张的总引擎。", "l": "上海证券报(美银研报引述)", "u": "https://paper.cnstock.com/html/2026-08/15/content_2255558.htm"}]}], "instsSummary": "①**价格判断一致：2026为存储全面涨价年**，Q3-Q4成熟DRAM function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function redify(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>'); }

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return esc(t||'');

    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}

/* 终端：各品类（手机/平板/PC/折叠屏/眼镜/穿戴/音频/智慧屏/CPE/新能源） */
let mktGC = 'global';
function renderCategoryMarket(){
  const keys = Object.keys(cur.marketData);
  el('mkt-gc').innerHTML = '<div class="gc-btn active" data-gc="global">全球</div><div class="gc-btn" data-gc="china">中国</div>';
  el('mkt-gc').querySelectorAll('.gc-btn').forEach(t=>t.addEventListener('click',()=>{
    el('mkt-gc').querySelectorAll('.gc-btn').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); mktGC=t.dataset.gc; drawMkt(keys[0]);
  }));
  el('mkt-tabs').innerHTML = keys.map((k,i)=>'<div class="mkt-tab '+(i===0?'active':'')+'" data-k="'+k+'">'+esc(cur.marketData[k].name)+'</div>').join('');
  el('mkt-tabs').querySelectorAll('.mkt-tab').forEach(t=>t.addEventListener('click',()=>{
    el('mkt-tabs').querySelectorAll('.mkt-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); drawMkt(t.dataset.k);
  }));
  el('mkt-toggle').addEventListener('click',()=>{ const t=el('mkt-tbl'); t.classList.toggle('show'); el('mkt-toggle').textContent = t.classList.contains('show')?'▾ 隐藏数据表格':'▸ 显示数据表格'; });
  drawMkt(keys[0]);
}
function drawMkt(key){
  const d = cur.marketData[key][mktGC];
  const labels = d.series.map(s=>s.label);
  const vals = d.series.map(s=>s.shipment);
  const yoy = d.series.map(s=>(typeof s.yoy==='number'? s.yoy : null));
  if(charts.mkt) charts.mkt.dispose();
  charts.mkt = echarts.init(el('mkt-chart'));
  charts.mkt.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },
    tooltip:{ trigger:'axis' },
    legend:{ data:['出货','同比YoY'], bottom:0 },
    grid:{ left:55, right:55, top:50, bottom:50 },
    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }
    ]
  }, true);
  const sh = el('mkt-shares');
  if(d.shares){
    el('mkt-share-note').textContent = '（'+(mktGC==='global'?'全球':'中国')+'厂商份额）';
    sh.innerHTML = '<tr><th>厂商</th><th>份额(%)</th><th>同比变化(pp)</th></tr>'+d.shares.map(s=>'<tr><td><b>'+esc(s.brand)+'</b></td><td>'+s.share+'</td><td class="'+(s.chg.indexOf('+')===0?'up':'down')+'">'+esc(s.chg)+'</td></tr>').join('');
  } else { sh.innerHTML=''; el('mkt-share-note').textContent='（该品类暂无分厂商份额数据 · '+(mktGC==='global'?'全球':'中国')+'）'; }
  const seg = el('mkt-segments');
  seg.innerHTML = d.segments? '<tr><th>分类</th><th>数值</th><th>说明</th></tr>'+d.segments.map(s=>'<tr><td>'+esc(s.name)+'</td><td><b>'+esc(s.val)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('') : '';
  const tbl = el('mkt-tbl');
  tbl.innerHTML = '<tr><th>周期</th><th>出货量(亿)</th><th>同比</th></tr>'+d.series.map(s=>'<tr><td>'+esc(s.label)+'</td><td>'+s.shipment+'</td><td>'+esc(s.yoy)+'</td></tr>').join('');
  drawMktShare(key);
}
function drawMktShare(key){
  const d = cur.marketData[key][mktGC];
  const box = el('mkt-share-chart');
  if(!d.shares || !d.shares.length){ if(charts.mktShare){charts.mktShare.dispose();} charts.mktShare=null; box.innerHTML='<div style="color:#9ca3af;text-align:center;padding:46px 0;font-size:13px">该品类暂无分厂商份额可视化数据</div>'; return; }
  const brands=d.shares.map(s=>s.brand), shares=d.shares.map(s=>s.share);
  const chgList=d.shares.map(s=>String(s.chg==null?'':s.chg));
  if(charts.mktShare) charts.mktShare.dispose();
  charts.mktShare = echarts.init(box);
  charts.mktShare.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）厂商份额与同比变化', left:'center', textStyle:{fontSize:13,color:'#1f2937'} },
    tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, formatter:function(p){ const i=p[0].dataIndex; let s='<b>'+brands[i]+'</b><br/>份额：'+shares[i]+'%'; if(chgList[i]&&chgList[i]!=='—') s+='<br/>同比变化：'+chgList[i]+' pp'; return s; } },
    grid:{ left:46, right:24, top:46, bottom:28 },
    xAxis:{ type:'category', data:brands, axisLabel:{interval:0, fontSize:11} },
    yAxis:{ type:'value', name:'%' },
    series:[{ type:'bar', barWidth:'52%', data:d.shares.map((s,idx)=>{ const ch=chgList[idx]; let col='#9ca3af'; if(ch){ if(ch.indexOf('+')===0)col='#dc2626'; else if(ch.indexOf('-')===0)col='#16a34a'; } return { value:s.share, itemStyle:{color:brandColor(s.brand), borderRadius:[4,4,0,0]}, label:{show:true,position:'top',fontSize:11,color:col,formatter:function(p){ return p.value+'%'+(ch&&ch!=='—'?' ('+ch+')':''); }} }; }) }]
  }, true);
}

function drawBrandTable(id, card){

    abMk('ab_c_total', abLine(D.pt_dates,[{name:'终端销量(万辆)',type:'line',smooth:true,data:D.pt_total.map(function(v){return v==null?null:+(v/10000).toFixed(1);}),itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],false));
    abMk('ab_c_nev', abLine(D.pt_dates,[{name:'新能源渗透率',type:'line',smooth:true,data:D.nev_pen,itemStyle:{color:'#16a34a'},areaStyle:{color:'rgba(22,163,74,.08)'}}],true));

      var s = brands.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:D.oem[b].slice(idx0),itemStyle:{color:pal[i%pal.length]}}; });

      s.push({name:'自主品牌合计',type:'line',yAxisIndex:1,data:tot,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:6,
        label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(0)+'万';}}});
      abMk('ab_c_dom', {
        tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
        grid:{left:64,right:64,top:42,bottom:34},
        xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},

               {type:'value',name:'合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],

    var tcolors=['#0ea5e9','#0d9488','#f59e0b','#db2777','#64748b'];

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
    series:s1
  });
  // 九·2 当年累计（各品牌 + 五界/三境/一塔汇总）
  var g = H.group_ytd || {};
  var extra = [];
  ['智界','享界','尊界','尚界'].forEach(function(b){ if(H.ytd && H.ytd[b]!=null) extra.push([b, H.ytd[b]]); });
  var x2 = bn.concat(extra.map(function(e){return e[0];})).concat(['五界汇总','三境汇总','一塔汇总']);
  var y2 = bn.map(function(b){return H.ytd[b]||0;}).concat(extra.map(function(e){return e[1];})).concat([g['五界']||0, g['三境']||0, g['一塔']||0]);
  var groupColors = {'五界汇总':'#111827','三境汇总':'#ea580c','一塔汇总':'#0d9488'};
  var y2data = y2.map(function(v,i){
    var c = (i < bn.length+extra.length) ? pal[i % pal.length] : groupColors[x2[i]];
    return {value:v, itemStyle:{color:c}};
  });
  abMk('ab_c_hima_ytd', {
    tooltip:{trigger:'axis'}, grid:{left:72,right:30,top:30,bottom:56},
    xAxis:{type:'category',data:x2,axisLabel:{interval:0,rotate:30,fontSize:11}},
    yAxis:{type:'value',name:'2026YTD(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
    series:[{type:'bar',data:y2data, label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(1)+'万';}}}]
  });
}

    el(id).innerHTML='<tr>'+m.subs.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+m.subs.rows.map(r=>{ const mm=r.mom||''; const cls=mm==='--'?'':(mm.indexOf('-')===0?'down':'up'); return '<tr><td>'+r.rank+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.company)+'</td><td>'+esc(r.region)+'</td><td>'+r.mau+'</td><td class="'+cls+'">'+esc(r.mom)+'</td><td>'+esc(r.trend)+'</td><td>'+esc(r.sub)+'</td></tr>'; }).join(''); }
  if(m.openrouter){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">OpenRouter 平台调用量 Top 模型 <span class="en">聚合平台 · 周调用 Tokens</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
    el(id).innerHTML='<tr><th>模型</th><th>厂商</th><th>周调用(十亿 Token)</th><th>说明</th></tr>'+m.openrouter.map(r=>'<tr><td><b>'+esc(r.model)+'</b></td><td>'+esc(r.vendor)+'</td><td>'+esc(r.weeklyTokens)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); }
  if(m.hfModels){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">Hugging Face 下载榜 Top 模型 <span class="en">开源模型 · 累计下载</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
    el(id).innerHTML='<tr><th>模型</th><th>下载量</th><th>说明</th></tr>'+m.hfModels.map(r=>'<tr><td><b>'+esc(r.model)+'</b></td><td>'+esc(r.downloads)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); }
  if(m.aiProductStats){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">AI 产品关键指标 <span class="en">Product Metrics</span></div><div class="cost-grid" id="'+id+'"></div>'; el('t4').appendChild(wrap);
    el(id).innerHTML=m.aiProductStats.map(s=>'<div class="cost-card"><div class="cc-name">'+esc(s.name)+'</div><div class="cc-change"><b>'+esc(s.metric)+'：</b>'+esc(s.value)+'</div><div class="cc-impact">'+esc(s.note)+'</div></div>').join(''); }
}

function renderChip(m){
  if(m.storageTrend){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">存储综合合约价指数 <span class="en">DRAM/NAND/HBM 基准=100</span></div><div class="chart-box" id="'+id+'"></div>'; el('t4').appendChild(wrap);
    const t=m.storageTrend; const inst=echarts.init(el(id)); charts[id]=inst;
    inst.setOption({ title:{text:'存储综合合约价指数（基准=100）',left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis'}, legend:{bottom:0}, grid:{left:50,right:30,top:46,bottom:46}, xAxis:{type:'category',data:t.months}, yAxis:{type:'value',name:'指数'}, series:[
      {name:'DRAM',type:'line',data:t.dram,smooth:true,symbolSize:7,lineStyle:{width:3},itemStyle:{color:'#2563eb'}},
      {name:'NAND',type:'line',data:t.nand,smooth:true,symbolSize:7,lineStyle:{width:2.5},itemStyle:{color:'#7c3aed'}},
      {name:'HBM',type:'line',data:t.hbm,smooth:true,symbolSize:7,lineStyle:{width:2.5,type:'dashed'},itemStyle:{color:'#ea580c'}} ] }, true); }
  if(m.storagePrice){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">存储实际合约价（绝对数值 · 美元） <span class="en">2025Q1–2026Q3</span></div><div class="chart-box" id="'+id+'"></div><div class="storage-note">'+(m.storagePrice.sources||'')+'</div>'; el('t4').appendChild(wrap);
    const t=m.storagePrice; const inst=echarts.init(el(id)); charts[id]=inst;
    inst.setOption({ title:{text:'存储实际合约价（绝对数值 · 美元）',left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis',formatter:function(ps){ let s='<b>'+ps[0].axisValue+'</b><br/>'; ps.forEach(p=>{ s+=p.marker+p.seriesName+'：<b>'+p.value+'</b>'+(t.unit[p.seriesName]||'')+'<br/>'; }); return s; }}, legend:{bottom:0}, grid:{left:55,right:30,top:46,bottom:46}, xAxis:{type:'category',data:t.quarters,axisLabel:{fontSize:11}}, yAxis:{type:'value',name:'美元'}, series:[
      {name:'DRAM(DDR4 8Gb)',type:'line',data:t.dram,smooth:true,symbolSize:7,lineStyle:{width:3},itemStyle:{color:'#2563eb'}},
      {name:'NAND(512Gb TLC)',type:'line',data:t.nand,smooth:true,symbolSize:7,lineStyle:{width:2.5},itemStyle:{color:'#7c3aed'}},
      {name:'HBM(ASP/GB)',type:'line',data:t.hbm,smooth:true,symbolSize:7,lineStyle:{width:2.5,type:'dashed'},itemStyle:{color:'#ea580c'}} ] }, true); }
  if(m.procSpec){ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
    wrap.innerHTML='<div class="section-title">手机 / 终端处理器规格排名 <span class="en">SoC Spec Ranking</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
    el(id).innerHTML='<tr><th>排名</th><th>处理器</th><th>厂商</th><th>制程</th><th>CPU</th><th>GPU</th><th>NPU</th><th>搭载机型</th><th>说明</th></tr>'+m.procSpec.map(r=>'<tr><td>'+r.rank+'</td><td><b>'+esc(r.soc)+'</b></td><td>'+esc(r.vendor)+'</td><td>'+esc(r.process)+'</td><td>'+esc(r.cpu)+'</td><td>'+esc(r.gpu)+'</td><td>'+esc(r.npu)+'</td><td>'+esc(r.usedIn)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); }
  if(m.shareRank){
    const groups={}; m.shareRank.forEach(r=>{ (groups[r.cat]=groups[r.cat]||[]).push(r); });
    Object.keys(groups).forEach(cat=>{ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
      wrap.innerHTML='<div class="section-title">'+esc(cat)+' 份额排名 <span class="en">Share Ranking</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
      el(id).innerHTML='<tr><th>厂商</th><th>份额(%)</th><th>说明</th></tr>'+groups[cat].map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.share)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); });
  }
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  document.querySelectorAll('.tab-item').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id=t.dataset.tab;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    if(id==='t4'){ setTimeout(()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } if(cur===DATA.auto) drawAutoBoardCharts(); },60); }
  }));
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
