<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --accent:#2563eb; --accent-deep:#1d4ed8; --accent-soft:#eff6ff; --accent-tint:#dbeafe; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#1f2937; font-size:14.5px; line-height:1.6; }
a { color:#2563eb; text-decoration:none; }
a:hover { text-decoration:underline; }

/* Header / Banner —— 蓝色洞见风 */
.header { background:radial-gradient(1100px 380px at 10% -25%, #3b82f6 0%, transparent 58%), linear-gradient(135deg,#0b2a6b 0%,#1d4ed8 48%,#2563eb 100%); color:#fff; padding:15px 28px 12px; position:sticky; top:0; z-index:100; box-shadow:0 6px 24px rgba(11,42,107,0.45); border-bottom:3px solid rgba(255,255,255,.55); }
.header-top { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:14px; }
.brand-mark { flex-shrink:0; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25)); animation:spinSlow 20s linear infinite; }
@keyframes spinSlow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.brand .eyebrow { font-size:10.5px; letter-spacing:2.5px; font-weight:700; color:#bfdbfe; text-transform:uppercase; }
.header h1 { font-size:25px; font-weight:900; letter-spacing:2px; line-height:1.12; background:linear-gradient(90deg,#ffffff,#dbeafe); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.header .sub { font-size:11.5px; color:#cbd5e1; margin-top:4px; }
.header-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.view-counter { display:flex; gap:10px; }
.view-box { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); border-radius:9px; padding:6px 13px; text-align:center; min-width:92px; }
.view-box .num { font-size:18px; font-weight:800; line-height:1.1; }
.view-box .lbl { font-size:10px; color:#dbeafe; }
.header .badge { display:inline-block; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32); padding:3px 11px; border-radius:20px; font-size:10px; color:#e0e7ff; }
.badge::before { content:''; display:inline-block; width:6px; height:6px; background:#4ade80; border-radius:50%; margin-right:5px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Category nav（一级切换项，主色调贯穿其下五大板块） */
.catnav { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.cat-item { padding:8px 22px; font-size:13px; font-weight:800; color:#dbeafe; cursor:pointer; border-radius:20px; border:1.5px solid rgba(255,255,255,.45); background:rgba(255,255,255,.08); transition:all .2s; white-space:nowrap; }
.cat-item:hover { background:rgba(255,255,255,.22); color:#fff; }
.cat-item.active { background:#fff; color:var(--accent); border-color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }

/* Tabs */
.tabnav { background:#fff; padding:0 28px; display:flex; gap:4px; border-bottom:2px solid #e5e7eb; box-shadow:0 1px 4px rgba(0,0,0,.04); overflow-x:auto; position:sticky; top:var(--hh,118px); z-index:90; }
.tab-item { padding:13px 20px; font-size:14px; font-weight:700; color:#6b7280; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; transition:all .2s; }
.tab-item:hover { color:var(--accent); background:var(--accent-soft); }
.tab-item.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-item .tn { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; font-size:11px; margin-right:6px; background:var(--accent); color:#fff; }

/* Container */
.container { max-width:1400px; margin:0 auto; padding:22px 28px 60px; }
.tabpane { display:none; }
.tabpane.active { display:block; }

/* Section titles */
.section-title { font-size:20px; font-weight:800; color:#1f2937; margin:8px 0 16px; padding-left:14px; border-left:4px solid var(--accent); display:flex; align-items:center; gap:8px; }
.section-title .en { font-size:11px; color:#9ca3af; font-weight:400; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px 20px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
.muted { color:#6b7280; font-size:12px; }
.hl { color:var(--accent); font-weight:700; }

/* Tab1 headline */
.headline-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media(max-width:1000px){ .headline-grid { grid-template-columns:1fr; } }
.hl-card { border:1px solid #f0f0f0; border-radius:10px; padding:14px 16px; background:linear-gradient(180deg,#fffaf9,#fff); border-left:4px solid var(--accent); }
.hl-rank { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center; background:var(--accent); color:#fff; border-radius:6px; font-weight:800; font-size:13px; margin-right:8px; }
.hl-card h4 { font-size:15px; font-weight:700; display:inline; }
.hl-support { font-size:14.5px; color:#4b5563; margin-top:9px; line-height:1.7; }
.hl-link { font-size:11px; margin-top:6px; }

.person-block { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.person-block .pname { font-size:15px; font-weight:800; color:#1f2937; }
.person-block .prole { font-size:11px; color:#9ca3af; margin-left:6px; }
.vp-item { font-size:14px; color:#374151; padding:11px 0; border-bottom:1px dashed #f0f0f0; line-height:1.7; }
.vp-item:last-child { border-bottom:none; }
.vp-hl { font-size:15px; line-height:1.7; margin-bottom:6px; }
.vp-hl .hl-red { font-size:15px; }
.vp-detail { font-size:13.5px; color:#374151; line-height:1.9; margin:1px 0 8px; padding-left:2px; }

.news-row { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #f3f4f6; }
.news-rank { flex-shrink:0; width:22px; height:22px; line-height:22px; text-align:center; border-radius:5px; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12px; }
.news-main { flex:1; }
.news-title { font-size:15px; font-weight:600; color:#1f2937; }
.news-meta { font-size:11px; color:#9ca3af; margin-top:2px; }

/* Tab2 products */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
@media(max-width:900px){ .cal-grid { grid-template-columns:repeat(3,1fr); } }
.cal-cell { border:1px solid #e5e7eb; border-radius:8px; padding:8px; min-height:90px; background:#fff; font-size:11px; }
.cal-cell .d { font-weight:800; color:#374151; }
.cal-cell.ev { background:var(--accent-soft); border-color:var(--accent-tint); }
.cal-cell .evt { margin-top:4px; color:var(--accent); font-weight:600; line-height:1.35; }
.prod-block { border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; margin-bottom:16px; }
.prod-head { display:flex; align-items:center; gap:10px; padding:14px 18px; color:#fff; }
.prod-head .b { font-size:16px; font-weight:800; }
.prod-head .tag { font-size:11px; background:rgba(255,255,255,.25); padding:2px 8px; border-radius:4px; }
.prod-body { padding:16px 18px; }
.prod-summary { font-size:15px; color:#374151; line-height:1.8; }
.prod-strategy { margin-top:10px; padding:11px 14px; background:#f9fafb; border-left:3px solid var(--accent); border-radius:6px; font-size:14.5px; color:#4b5563; line-height:1.8; }
.prod-strategy b { color:var(--accent); }
.spec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:12px; }
.spec-item { border:1px solid #f0f0f0; border-radius:8px; padding:8px 10px; background:#fafafa; }
.spec-item .k { font-size:10px; color:#9ca3af; }
.spec-item .v { font-size:12.5px; font-weight:700; color:#1f2937; }
.prod-links { margin-top:10px; font-size:11px; }

/* Tab3 earnings */
.earn-card { border:1px solid #e5e7eb; border-radius:12px; padding:18px 20px; margin-bottom:16px; }
.earn-top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
.earn-company { font-size:17px; font-weight:800; }
.earn-code { font-size:11px; color:#9ca3af; margin-left:8px; }
.earn-period { font-size:11px; color:#6b7280; background:#f3f4f6; padding:3px 10px; border-radius:20px; }
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
@media(max-width:900px){ .kpi-row { grid-template-columns:repeat(2,1fr); } }
.kpi { border:1px solid #f0f0f0; border-radius:8px; padding:10px; text-align:center; }
.kpi .kv { font-size:16px; font-weight:800; color:#1f2937; }
.kpi .kl { font-size:10px; color:#9ca3af; margin-top:2px; }
.kpi .ky { font-size:11px; font-weight:700; }
.up { color:#dc2626; } .down { color:#16a34a; }
.earn-insight { font-size:15px; color:#4b5563; line-height:1.85; }
.vp-summary { background:#eef4ff; border:1px solid #d6e4ff; border-left:4px solid #1d4ed8; border-radius:8px; padding:12px 14px; margin-bottom:14px; font-size:13px; color:#1e3a5f; line-height:1.75; }
.vp-summary b { color:#1d4ed8; }
.prod-sub { margin-top:8px; padding:9px 12px; background:#f9fafb; border-radius:6px; font-size:12.5px; color:#374151; line-height:1.65; }
.prod-sub b { color:#1f2937; }
.prod-advice { margin-top:8px; padding:10px 12px; background:#fff7ed; border-left:3px solid #ea580c; border-radius:6px; font-size:12.5px; color:#7c2d12; line-height:1.65; }
.prod-advice b { color:#ea580c; }
/* 财报重点厂家高亮 + 1页纸KPI网格 */
.earn-key { display:inline-block; background:#fee2e2; color:#dc2626; font-size:10px; font-weight:800; padding:2px 9px; border-radius:10px; margin-left:8px; vertical-align:middle; letter-spacing:.5px; }
.earn-kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
@media(max-width:900px){ .earn-kpi { grid-template-columns:repeat(2,1fr); } }
.earn-kpi .kpi { background:linear-gradient(180deg,#fff,#f8fafc); }
.earn-viewpoint { margin-top:10px; padding:10px 12px; background:#f0f9ff; border-radius:6px; font-size:12.5px; color:#374151; line-height:1.7; }
.earn-viewpoint b { color:#0369a1; }
/* 新品/市场模块色条 */
.mod-tag { display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:10px; color:#fff; margin-left:8px; vertical-align:middle; }
.ai-advice { margin-top:8px; padding:9px 12px; background:#f0fdf4; border-left:3px solid #16a34a; border-radius:6px; font-size:12px; color:#14532d; line-height:1.6; }
.mkt-extra { margin-top:14px; }
.mkt-sub { font-size:13px; font-weight:700; color:#1f2937; margin:14px 0 6px; }
.mkt-sub .en { font-size:11px; color:#9ca3af; font-weight:400; }
.up { color:#16a34a; font-weight:700; }
.down { color:#dc2626; font-weight:700; }

/* Tab4 market */
.mkt-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.mkt-tab { padding:6px 14px; border:1px solid #e5e7eb; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; background:#fff; color:#6b7280; }
.mkt-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.chart-box { width:100%; height:340px; }
.toggle-tbl { font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; }
.data-tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; display:none; }
.data-tbl.show { display:table; }
.data-tbl th, .data-tbl td { border:1px solid #e5e7eb; padding:7px 8px; text-align:left; }
.data-tbl th { background:#f9fafb; font-weight:700; }

/* Tab5 AI */
.ai-stat-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
.ai-stat { border:1px solid #e5e7eb; border-radius:10px; padding:14px; background:linear-gradient(180deg,#eef2ff,#fff); }
.ai-stat .num { font-size:22px; font-weight:800; color:#3730a3; }
.ai-stat .lbl { font-size:11px; color:#6b7280; margin-top:2px; }

/* ===== 汇总提炼页：分行条理 + 大字体 + 观点直接 ===== */
.summary-box { background:#eef4ff; border:1px solid #d6e4ff; border-left:4px solid var(--accent); border-radius:10px; padding:16px 20px; margin-bottom:16px; font-size:15px; line-height:1.95; color:#1e3a5f; }
.summary-box .lbl { font-weight:800; color:var(--accent-deep); display:block; margin-bottom:10px; font-size:15.5px; }
.summary-lines > div { padding:6px 0; border-bottom:1px dashed #e3ecfd; }
.summary-lines > div:last-child { border-bottom:none; }
.summary-lines .mk { color:var(--accent); font-weight:800; margin-right:7px; }


/* 全球/中国切换 */
.gc-toggle { display:inline-flex; gap:6px; margin-bottom:14px; }
.gc-btn { padding:6px 18px; border:1px solid #e5e7eb; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; background:#fff; color:#6b7280; transition:all .15s; }
.gc-btn:hover { color:var(--accent); background:var(--accent-soft); }
.gc-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 存储价格曲线（持续刷新跟踪） */
.storage-note { font-size:11.5px; color:#6b7280; margin-top:8px; line-height:1.6; }
.price-chart { width:100%; height:330px; }
/* 实际价格曲线（绝对数值）· 权限门禁 */
.pg-divider { height:1px; background:linear-gradient(90deg,#e5e7eb,transparent); margin:18px 0 14px; }
.pg-head { margin-bottom:8px; }
.pg-title { font-size:14.5px; font-weight:700; color:#1f2937; }
.pg-sub { font-size:11.5px; color:#6b7280; margin-left:6px; }
.price-lock { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:34px 16px; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:12px; }
.pl-icon { font-size:30px; }
.pl-txt { font-size:14px; color:#64748b; font-weight:600; }
.pl-btn { padding:9px 20px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s; }
.pl-btn:hover { filter:brightness(1.08); }
.pl-hint { font-size:11px; color:#94a3b8; margin-top:2px; text-align:center; max-width:340px; line-height:1.5; }

/* 上下游成本结构化部件卡 */
.cost-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
.cost-card { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; background:#fff; }
.cost-card .cc-name { font-size:14.5px; font-weight:800; color:#1f2937; display:flex; align-items:center; gap:8px; }
.cost-card .cc-dir { font-size:11px; font-weight:800; padding:2px 9px; border-radius:10px; white-space:nowrap; }
.cc-up { background:#fdecec; color:#dc2626; } .cc-down { background:#e7f6ec; color:#16a34a; } .cc-flat{ background:#eef2f7; color:#6b7280; }
.cost-card .cc-change { font-size:13px; color:#374151; margin-top:9px; line-height:1.65; }
.cost-card .cc-impact { margin-top:9px; padding:9px 11px; background:#f9fafb; border-left:3px solid var(--accent); border-radius:6px; font-size:12.5px; color:#4b5563; line-height:1.65; }
.cost-card .cc-impact b { color:var(--accent-deep); }
.cost-takeaway { margin-top:14px; padding:12px 16px; background:#eef4ff; border:1px solid #d6e4ff; border-radius:10px; font-size:14px; color:#1e3a5f; line-height:1.8; }
.cost-takeaway b { color:var(--accent-deep); }

.footer { text-align:center; color:#9ca3af; font-size:11px; padding:24px; }

/* ===== 财报速递：观点总览加颜色 + 换行结构化 ===== */
.snap-box { border-radius:10px; padding:13px 16px; margin-bottom:12px; line-height:1.85; font-size:14px; }
.snap-box.find { background:#eff6ff; border-left:4px solid #1d4ed8; color:#1e3a5f; }
.snap-box.impl { background:#fff7ed; border-left:4px solid #ea580c; color:#7c2d12; }
.snap-box .snap-h { font-weight:800; font-size:14.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.snap-box.find .snap-h { color:#1d4ed8; }
.snap-box.impl .snap-h { color:#ea580c; }
.nl { margin-top:6px; }
.nl-i { padding:5px 0; border-bottom:1px dashed #e3ecfd; line-height:1.8; font-size:13.5px; color:#374151; }
.nl-i:last-child { border-bottom:none; }
.nl-i .mk { color:var(--accent); font-weight:800; margin-right:7px; }
.earn-viewpoint b { color:#1d4ed8; }
.earn-insight b { color:#ea580c; }
.earn-kpi .kpi .ky { color:var(--accent); }

/* ===== 意见领袖：原话红粗 + 来源链接 ===== */
.hl-red { color:#dc2626; font-weight:800; }
.vp-link { color:#2563eb; font-size:11.5px; font-weight:600; margin-left:5px; white-space:nowrap; }
.vp-link:hover { text-decoration:underline; }
.person-head { display:flex; align-items:baseline; gap:6px; margin-bottom:6px; }

/* ===== 新品发布解读：子版块四色配色 + 日历公司标色 ===== */
.prod-summary { font-size:15px; font-weight:600; color:#1f2937; line-height:1.9; }
.prod-strategy { margin-top:10px; padding:11px 14px; background:#eff6ff; border-left:4px solid #1d4ed8; border-radius:6px; font-size:14px; color:#1e3a5f; line-height:1.85; }
.prod-strategy b { color:#1d4ed8; }
.prod-compete { margin-top:8px; padding:11px 14px; background:#f0fdf4; border-left:4px solid #16a34a; border-radius:6px; font-size:14px; color:#14532d; line-height:1.85; }
.prod-compete b { color:#16a34a; }
.prod-consumer { margin-top:8px; padding:11px 14px; background:#faf5ff; border-left:4px solid #7c3aed; border-radius:6px; font-size:14px; color:#4c1d95; line-height:1.85; }
.prod-consumer b { color:#7c3aed; }
.prod-advice { margin-top:8px; padding:11px 14px; background:#fff7ed; border-left:4px solid #ea580c; border-radius:6px; font-size:14px; color:#7c2d12; line-height:1.85; }
.prod-advice b { color:#ea580c; }
.ev-brand { font-weight:800; font-size:12px; }
.cal-cell .evt { margin-top:4px; color:#374151; font-weight:500; line-height:1.4; }

/* ===== 市场大盘：厂商份额柱状图 ===== */
.share-chart { width:100%; height:300px; margin-top:10px; }



.ab-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.ab-kpi{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;}
.ab-v{font-size:24px;font-weight:800;color:var(--accent);}
.ab-u{font-size:12px;font-weight:700;color:#6b7280;margin-left:3px;}

<body>
<header class="header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="46" height="46">

  "chip": {"updateTime": "2026-08-27 06:30", "headlineViewpoints": [{"tag": "存储", "t": "DDR5现货一年暴涨至48美元、64GB服务器DRAM破3100美元：存储从周期品变战略品，但已逼近下游承受拐点", "s": "核心观点：2026年8月DDR5-5600/6400 24Gb现货价达48美元，较一年前8美元涨约5倍（同比+483%）；64GB服务器DRAM现货突破3100美元，较6月底合约价高146%。涨价由AI虹吸先进产能驱动，而非需求共振。高层建议：【短期·经营】价格已至极端区间，OPPO/vivo已拒三星Q3约20%涨价，存储占整机BOM升至20%以上（低端30-60%）；建议集团按基准+回落双情景做采购与定价预案，避免在顶点加库存，并加速国产存储导入对冲。", "l": "财联社/今日头条/安博电子", "u": "https://www.toutiao.com/article/7675633538745516594/"}, {"tag": "国产资本化", "t": "长鑫市值约4万亿、长存330亿IPO受理：国产存储双雄从\"产品替代\"走向\"资本+生态替代\"", "s": "核心观点：长鑫科技7/27上市、市值约4万亿元居A股前列；长江存储8/21科创板IPO受理、拟募330亿元（超长鑫295亿、中芯200亿），创板块拟募资之最。二者赛道分野清晰——长鑫主攻DRAM（断电丢失、作运行内存），长存聚焦NAND（断电离线、大容量存储），2026全球DRAM产值约6187亿美元、NAND约2706亿（2.3倍）。里程碑在生态：长鑫LPDDR6已进入小米玄戒O3供应链、成首款配套国产旗舰SoC商用的LPDDR6。高层建议：【投资】国产存储完成资本化，产能扩张与研发获长期资金；建议集团把长鑫/长存纳入核心供应与战略投资，提前锁定DDR5/LPDDR5与NAND长协产能，并以长鑫LPDDR6国产配套降低对外依赖。", "l": "网易/新浪财经", "u": "https://www.163.com/dy/article/L55U578705118O92.html"}, {"tag": "封锁", "t": "MATCH法案拟纳入NDAA、150天逼盟国对齐：美国对华封锁从卡先进滑向卡存量维保", "s": "核心观点：MATCH Act（S.4281）由Ricketts/Kim提出，拟纳入2026财年NDAA manager's amendment，设150天期限强制荷兰/日本对齐对华设备管制，并叫停已装机DUV的销售、维修、备件与远程升级，点名中芯/长存/长鑫/华虹/华为。ASML 2025中国销售占33%。高层建议：【长期·方向】管制从新购扩至存量运维，现有产线稼动率与精度衰减风险上升；建议按设备品类梳理存量产线进口依赖度，加速国产备件与第三方运维验证，预案先行。", "l": "CoinDesk/格隆汇/国防新闻", "u": "https://coindesk.cc/match-act-poised-for-inclusion-in-senate-ndaa-as-us-tightens-chip-export-controls-101236.html"}, {"tag": "下游博弈", "t": "OPPO/vivo拒三星Q3约20%涨价、存储占BOM升至20%+：涨价博弈白热化，周期拐点信号隐现", "s": "核心观点：三星2026年内第三次涨价、累计近300%，OPPO与vivo已正式拒绝其Q3约20%报价；存储占整机BOM由10-15%飙升至20%以上、低端机型达30-60%，Omdia预估2026全球智能手机出货降12%、ASP达565美元（较2025 +98美元）。高层建议：【短期·经营】下游拒单显示涨价触及承受底线，是周期中后段特征；建议集团终端业务对存储成本做转嫁+自研替代双轨，避免被动消化，同时关注拐点后的库存跌价风险。", "l": "安博电子/集微", "u": "https://www.ambleelec.com/NewsDetail/1050"}, {"tag": "封装瓶颈", "t": "TSMC CoWoS售罄至2027、HBM4量产：AI算力新瓶颈从晶圆转向先进封装与HBM", "s": "核心观点：台积电CoWoS-S/L产能售罄、月产能冲12-13万片仍满载，交期52-78周；英伟达占约60%（~59.5万片）并锁半数2026-27扩产；HBM4量产、SK海力士占英伟达HBM4约2/3、整体位元市占约50-62%。高层建议：【投资】封装+HBM是比晶圆更硬的约束，设计公司须以长约锁CoWoS与HBM；集团云/AI业务应跟踪HBM4认证与CoWoS排产，把产能即竞争力作为采购铁律。", "l": "The CODEW/Silicon Analysts", "u": "https://www.thecodew.com/2026/08/semiconductor-watch-tsmc-n2-cowos-hbm4-ai-chip-race.html?m=1"}, {"tag": "制程", "t": "台积电N2/A16售罄至2028、苹果独占近半初期产能：先进制程寡头化，安卓旗舰被迫延后", "s": "核心观点：TSMC N2（2nm）与A16产能售罄至2028，交期78-156周、晶圆单价超3万美元；苹果锁定约50%初期产能，安卓阵营2nm旗舰至少晚2-3季度。高层建议：【中期·战略】制程代差成营销武器，2026下半年安卓旗舰仍以3nm为主；建议关注N2良率与安卓客户（高通/联发科）排产窗口，集团终端自研SoC须锚定2nm节点对冲。", "l": "WCCFtech/Silicon Analysts", "u": "https://wccftech.com/roundup/apple-a20-pro-first-iphone-2nm-chipsets-here-is-everything-you-need-to-know/"}, {"tag": "国产DRAM", "t": "长鑫DRAM份额~8%跻身全球第四、LPDDR6打入小米玄戒O3：国产存储从\"敢用\"走向\"旗舰规模商用\"", "s": "核心观点：长鑫全球DRAM份额2026Q1升至约8%（较去年3%翻倍）居第四，Q1营收约508亿元、同比+719%；更关键的是LPDDR6研发验证临近完成、自3月向大客户供样，已进入小米8/24新发玄戒O3（首款支持LPDDR6、113.8GB/s、较O1 +48%）供应链，成为首款配套国产旗舰SoC商用的LPDDR6，与SK海力士同台竞供。高层建议：【中期·战略】长鑫突破使双供应商策略首次在LPDDR6层级可行；建议评估国产DRAM在旗舰机型验证进度，供应链安全溢价正在兑现，宜早锁长协并推动长鑫LPDDR6在集团终端导入。", "l": "DigitalToday/长桥", "u": "https://www.digitaltoday.co.kr/en/view/96439/cxmt-ymtc-supply-push-may-reshape-dram-nand-market"}, {"tag": "HBM", "t": "HBM市场420-546亿美元、占DRAM近四成：海力士半壁江山，是消费级DRAM短缺的根因", "s": "核心观点：TrendForce/SEMI预估2026年HBM市场420-546亿美元（占DRAM近四成），SK海力士位元市占约50-62%、绑定英伟达Rubin；HBM4认证完成、下半年量产、单颗最高48GB/3.6TB/s。高层建议：【长期·方向】HBM占投片比重抬升是通用DRAM短缺根因，HBM4量产进度直接决定英伟达Rubin节奏；建议跟踪海力士/三星HBM4良率，国产HBM差距仍约2代。", "l": "TrendForce/中央社", "u": "https://ieknet.iek.org.tw/ieknews/news_open.aspx/news_more.aspx?actiontype=ieknews&indu_id=1&nsl_id=7bafbd0a1aa7480f9543e01827f9e986"}, {"tag": "算力迭代", "t": "英伟达Feynman转A16+SoIC 3D+CPO、AMD MI350X挑战Blackwell：平台迭代加速虹吸先进产能", "s": "核心观点：英伟达下一代Feynman拟用台积电A16（2nm升级）+SoIC 3D堆叠+共封装光学（CPO）；AMD MI350X（3nm CDNA4/288GB HBM3E/8TB/s）挑战Blackwell推理霸权，Omdia上调2026半导体收入增长至+94.1%、存储占半导体收入50%+。高层建议：【中期·战略】算力平台快速迭代持续虹吸先进制程与HBM，供给紧张至少延续至2027；建议集团AI业务以多供应商+长协破单点锁死，并关注CPO/先进封装技术路线。", "l": "IT之家/Omdia", "u": "https://www.toutiao.com/article/7673837024146686464"}, {"tag": "投资", "t": "高盛估中国2035芯片自给率仍差34%、中芯良率23%：国产替代是长跑，按晚一步控风险", "s": "核心观点：高盛模型显示受EUV禁运约束，中芯先进制程良率约23%（台积>90%），2035年自给率仍缺口约34%；但仍给予中芯买入，看好AI驱动国产替代放量。中芯成熟制程利用率由68%升至93%。高层建议：【投资】先进制程差距短期不可逾越，但成熟制程+存储+设备国产替代确定性强；投资与采购宜晚一步——跟随验证而非抢先押注，重点跟踪中芯良率改善斜率与国产设备验证进度。", "l": "Tech Times/高盛", "u": "https://www.techtimes.com/articles/325392/20260824/goldman-sees-china-34-short-chip-self-sufficiency-2035-smic-yield-fragile-key.htm"}], "opinionLeaders": [{"name": "黄仁勋 (Jensen Huang)", "role": "英伟达 NVIDIA 创始人兼CEO", "items": [{"hl": "美国出口管制\"已基本适得其反\"", "detail": "2026年5月表示，从市场份额结果看管制已反噬美国企业，但承认前沿算力仍维持能力差距；主张更大对华市场开放。", "l": "Tech Times / 高盛报告引述", "u": "https://www.techtimes.com/articles/325392/20260824/goldman-sees-china-34-short-chip-self-sufficiency-2035-smic-yield-fragile-key.htm"}, {"hl": "HBM需求虹吸效应", "detail": "Blackwell/Rubin 平台对HBM需求占用SK海力士近60%、三星近40%产能，推高全链存储价格。", "l": "中研网", "u": "https://big5.chinairn.com/hyzx/20260820/114834728.shtml"}]}, {"name": "崔泰源", "role": "SK海力士会长", "items": [{"hl": "\"客户要求原需求两倍供货\"", "detail": "公开表态HBM与高端存储需求远超供给，订单能见度长，支撑公司286亿美元回购与资本开支信心。", "l": "中研网", "u": "https://big5.chinairn.com/hyzx/20260820/114834728.shtml"}]}, {"name": "孔蓉", "role": "国联民生研究所副总、海外研究首席", "items": [{"hl": "本轮周期完全由AI驱动，拐点锚定AI技术节奏", "detail": "认为不同于传统库存周期，一旦全球AI迭代放缓、算力建设见顶，存储供需将快速逆转；当前仍处规模化落地初期，短期无需过度担忧见顶。", "l": "上海证券报", "u": "https://paper.cnstock.com/html/2026-08/15/content_2255558.htm"}]}, {"name": "李双亮", "role": "天风证券研究所电子首席分析师", "items": [{"hl": "AI基础设施对成熟产能形成\"虹吸效应\"", "detail": "龙头将先进产能优先投向HBM等高毛利产品，挤压消费电子所需DRAM/NAND产能，短期带动整体存储价格上行。", "l": "上海证券报", "u": "https://paper.cnstock.com/html/2026-08/15/content_2255558.htm"}]}, {"name": "摩根士丹利半导体团队", "role": "国际投行研究", "items": [{"hl": "上调存储景气，DDR4 Q3+50%/Q4+10%", "detail": "预测成熟DRAM与SLC NAND大幅涨价，并把2026年全球超大规模云资本开支上修至超8000亿美元(+67%)。", "l": "腾讯财经(大摩研报)", "u": "https://so.html5.qq.com/page/real/search_news?docid=70000021_3236a85bfb489952"}]}, {"name": "郭明錤 (Ming-Chi Kuo)", "role": "天风国际分析师", "items": [{"hl": "仅iPhone 18 Pro系列首发A20(2nm)", "detail": "因2nm成本与产能限制，A20 Pro由Chiayi P1专线量产，采用WMCM封装(整合CPU/GPU/内存/AI加速器)，Pro版配12GB RAM。", "l": "MacObserver / DigiTimes", "u": "https://www.macobserver.com/?p=242644"}]}, {"name": "瑞银 UBS 半导体团队", "role": "国际投行研究", "items": [{"hl": "2027年HBM总需求约615亿Gb、英伟达独占超40%", "detail": "瑞银预测到2027年全球HBM总需求约615亿Gb，仅英伟达一家消耗约251亿Gb（占比超40%）；HBM对晶圆消耗约为传统DRAM的3倍，是通用DRAM缺口根源。", "l": "财联社/瑞银（大摩研报引述）", "u": "https://cj.sina.com.cn/article/norm_detail?url=https%3A%2F%2Ffinance.sina.com.cn%2Froll%2F2026-08-19%2Fdoc-ininvwqt9366297.shtml&finpagefr=w_110"}]}, {"name": "雷军 (Lei Jun)", "role": "小米集团创始人、董事长兼CEO", "items": [{"hl": "玄戒O3为首款支持LPDDR6的移动平台（113.8GB/s，较O1 +48%）", "detail": "8/24发布第二代自研SoC玄戒O3（3nm、240亿晶体管、200 TOPS），并引入长鑫LPDDR6国产存储配套，推动国产供应链从\"可用\"走向\"旗舰商用\"。", "l": "Korea Herald / 北京日报", "u": "http://www.beijingnews.net/news/279267223/cxmt-enters-race-with-sk-hynix-to-supply-next-generation-lpddr6-memory-for-xiaomi-chip"}]}], "leadersSummary": "① 产业领袖共识：本轮存储超级周期由AI算力（非消费电子）驱动，价格全面上涨且能见度长，但DDR5现货一年涨5倍、下游拒单频现，拐点信号已现。② 供给端高端吃产能、中低端涨价结构性紧张确立：HBM/先进DRAM被英伟达等虹吸，成熟制程缺口扩大，CoWoS封装售罄至2027成新瓶颈。③ 资本化与管制双线：长鑫市值破4万亿、长存IPO募330亿标志国产存储走向资本替代；而MATCH法案拟纳入NDAA、卡存量维保，倒逼国产设备/EDA加速自主。集团应预案先行、把握自主可控窗口，并以双供应商+长协对冲波动。④ 终端自研芯片突围：雷军发布玄戒O3（首款LPDDR6平台）并引入长鑫LPDDR6国产配套，标志国产存储进入旗舰商用，国产替代从\"能用\"迈向\"敢用+规模用\"。", "institutionViews": [{"name": "摩根士丹利 Morgan Stanley", "items": [{"s": "2026Q3 DDR4等成熟DRAM单季涨价50%、Q4再涨10%(累计约65%)；SLC NAND两季各+50%。", "l": "大摩研报(腾讯财经)", "u": "https://so.html5.qq.com/page/real/search_news?docid=70000021_3236a85bfb489952"}]}, {"name": "集邦咨询 TrendForce", "items": [{"s": "2026Q3 DRAM合约价环比+13%~18%、NAND +10%~15%(较Q1的+93%~98%明显回落)；HBM 2026市场约420亿美元、海力士位元市占约50%。", "l": "TrendForce / 中央社", "u": "https://ieknet.iek.org.tw/ieknews/news_open.aspx/news_more.aspx?actiontype=ieknews&indu_id=1&nsl_id=7bafbd0a1aa7480f9543e01827f9e986"}]}, {"name": "高盛 Goldman Sachs", "items": [{"s": "中国2035年芯片自给率仍差约34%；中芯先进制程良率约23%(台积>90%)；给予中芯买入，看好AI驱动国产替代放量。", "l": "Tech Times / 高盛", "u": "https://www.techtimes.com/articles/325392/20260824/goldman-sees-china-34-short-chip-self-sufficiency-2035-s <script>'use strict';

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return esc(t||'');
  return '<div class="summary-lines">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+esc(body)+'</div>';
  }).join('')+'</div>';
}
const BRAND_COLORS = {
  '华为':'#c7000b','苹果':'#1d1d1f','小米':'#ff6900','红米':'#ff0000','三星':'#1428a0',

function brandColor(b){ if(!b) return '#2563eb'; for(const k in BRAND_COLORS){ if(b.indexOf(k)>=0) return BRAND_COLORS[k]; } return '#2563eb'; }
function bodyClean(t){ return (t||'').replace(/^(关键发现|管理启示|分析观点)[：:]\s*/, ''); }
function numberedLines(t){
  const s = bodyClean(t);
  const parts = s.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<=1) return esc(s);

    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);

    return '<div class="nl-i"><span class="mk">'+mk+'</span>'+esc(body)+'</div>';

}

function setCategory(cat){
  cur = DATA[cat] || DATA.terminal;

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);
    else if(card.type==='brandtable') drawBrandTable(id, card);
  });
}

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
    series:s1
  });
  // 九·2 当年累计（各品牌 + 五界/三境/一塔汇总）
  var g = H.group_ytd || {};
  var extra = [];
  ['智界','享界','尊界','尚界'].forEach(function(b){ if(H.ytd && H.ytd[b]!=null) extra.push([b, H.ytd[b]]); });
  var x2 = bn.concat(extra.map(function(e){return e[0];})).concat(['五界汇总','三境汇总','一塔汇总']);
  var y2 = bn.map(function(b){return H.ytd[b]||0;}).concat(extra.map(function(e){return e[1];})).concat([g['五界']||0, g['三境']||0, g['一塔']||0]);
  var groupColors = {'五界汇总':'#111827','三境汇总':'#ea580c','一塔汇总':'#0d9488'};
  var y2data = y2.map(function(v,i){
    var c = (i < bn.length+extra.length) ? pal[i % pal.length] : groupColors[x2[i]];
    return {value:v, itemStyle:{color:c}};
  });
  abMk('ab_c_hima_ytd', {
    tooltip:{trigger:'axis'}, grid:{left:72,right:30,top:30,bottom:56},
    xAxis:{type:'category',data:x2,axisLabel:{interval:0,rotate:30,fontSize:11}},
    yAxis:{type:'value',name:'2026YTD(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
    series:[{type:'bar',data:y2data, label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(1)+'万';}}}]
  });
}

    el(id).innerHTML='<tr><th>排名</th><th>处理器</th><th>厂商</th><th>制程</th><th>CPU</th><th>GPU</th><th>NPU</th><th>搭载机型</th><th>说明</th></tr>'+m.procSpec.map(r=>'<tr><td>'+r.rank+'</td><td><b>'+esc(r.soc)+'</b></td><td>'+esc(r.vendor)+'</td><td>'+esc(r.process)+'</td><td>'+esc(r.cpu)+'</td><td>'+esc(r.gpu)+'</td><td>'+esc(r.npu)+'</td><td>'+esc(r.usedIn)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); }
  if(m.shareRank){
    const groups={}; m.shareRank.forEach(r=>{ (groups[r.cat]=groups[r.cat]||[]).push(r); });
    Object.keys(groups).forEach(cat=>{ const id='ac'+(autoCardSeq++); const wrap=document.createElement('div'); wrap.className='card';
      wrap.innerHTML='<div class="section-title">'+esc(cat)+' 份额排名 <span class="en">Share Ranking</span></div><table class="data-tbl show" id="'+id+'"></table>'; el('t4').appendChild(wrap);
      el(id).innerHTML='<tr><th>厂商</th><th>份额(%)</th><th>说明</th></tr>'+groups[cat].map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.share)+'</td><td>'+esc(r.note)+'</td></tr>').join(''); });
  }
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  document.querySelectorAll('.tab-item').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id=t.dataset.tab;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    if(id==='t4'){ setTimeout(()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } if(cur===DATA.auto) drawAutoBoardCharts(); },60); }
  }));
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
