<script>const DATA = {"terminal": {"updateTime": "2026-09-14 06:00", "headlineViewpoints": [{"t": "**华为Mate XT 2首销秒罄**，2万元三折叠验证国产超高端定价权", "s": "核心观点：9/12 10:08全渠道开售19999元起，三配色全规格几分钟售罄，代抢费一度炒至5000元、线下排队超一个月，9/13 10:08二次放货。**华为是唯一能把2万元定价卖成缺货的国产厂商**。高层建议：按双铰链与柔性屏良率倒排产能，分批放货维持价格刚性，把稀缺度转化为品牌资产。", "l": "澎湃新闻 / 中关村在线", "u": "https://www.thepaper.cn/newsDetail_forward_34057093"}, {"t": "**苹果在售iPhone 17同步涨价800元**，涨价从新机扩散到老机型", "s": "核心观点：证券日报9/14报道，iPhone 18 Pro国行起售较上代+1000元、顶配+3500元，苹果中国官网同步上调iPhone 17等四款在售机型，起售价涨至6799元。**涨价已从新机扩散到在售老机型，全价格带重定价**。高层建议：终端应同步重估在售机型价格体系，避免老机型变相降价稀释新品价格锚。", "l": "证券日报 / 今日头条", "u": "https://www.toutiao.com/article/7685055606079717915/"}, {"t": "**DRAM成本首超SoC成旗舰最贵器件**，行业转入成本定价", "s": "核心观点：Counterpoint数据显示2026Q2手机内存价格环比涨超80%，DRAM已超越SoC成旗舰最贵单一元器件；TrendForce预计Q3 DRAM合约价再涨13%至18%、NAND涨10%至15%。**成本结构被不可逆改写，定价逻辑从竞争导向转为成本导向**。高层建议：组合向高毛利上移，低端砍配保价，锁定长约平抑波动。", "l": "证券日报 / 太平洋科技", "u": "https://www.toutiao.com/article/7685055606079717915/"}, {"t": "**小米18 Fold首销日销3.6万台**，万元折叠需求被系统性低估", "s": "核心观点：第三方博主RD观测，小米18 Fold 9/10开售首日销量约3.6万台（10999元起），官方口径首销同比+310%，西野红顶配线上全渠道断货，卢伟冰称正抓紧补货。**万元折叠需求真实存在，备货不足20万台的判断偏保守**。高层建议：重估需求弹性，产能按首销3倍预留，避免二手溢价侵蚀定价权。", "l": "17173 / 今日头条", "u": "https://news.17173.com/content/09132026/020604795.shtml"}, {"t": "**iPhone Duo预约破120万、黄牛报价9.9万**，供给是唯一约束", "s": "核心观点：截至9/13京东旗舰店预约超80万人、全网破120万，闲鱼代抢报价1000至5000元、现货加价2.4万元、最高叫价9.9万元；郭明錤预测Q3组装出货仅50万至100万部。**折叠屏当前约束在供给端而非需求端**。高层建议：华为应在10/23苹果发售前完成三折叠首轮放量，前置截流换机决策。", "l": "联合早报 / 今日头条", "u": "https://www.toutiao.com/article/7685049152333513250/"}, {"t": "**华为Mate 90定档9/15亮相**，韬定律芯片对位苹果2nm", "s": "核心观点：9/12镜头膜谍照确认标准版、Pro、Pro Max延续星环Deco，RS改八边形；华为将于9/15（成立日兼芯片断供纪念日）公布新机信息，9/23深圳正式发布。麒麟9050 Pro为全球首款量产韬定律逻辑折叠SoC。**华为用架构创新绕开制程封锁对位苹果2nm**。高层建议：9/23后须即大批量现货。", "l": "中关村在线 / 微博", "u": "https://mobile.zol.com.cn/1246/12463358.html"}, {"t": "**鸿蒙6与7终端破8500万**，Q4冲1亿、稳居国内第二大手机OS", "s": "核心观点：9/11华为终端公布鸿蒙生态周更新，鸿蒙6与7终端数突破8500万，鸿蒙7公测24小时升级破500万；Mate XT 2已完成20余款主流金融应用深度适配，部分支持全屏形态运行PC级应用。**生态从兼容走向原生自循环，拐点确认**。高层建议：加速原生应用迁移，把鸿蒙升级为全场景底座。", "l": "CNMO / 手机中国", "u": "https://internet.cnmo.com/event/818353.html"}, {"t": "**IDC下调2026全球出货至-16.7%**，史上最大收缩但市场值反增", "s": "核心观点：IDC最新预测2026年全球出货下滑16.7%至略高于10亿部，为有记录以来最大年度收缩；但均价+27.6%至581美元，市场总值仍+6.3%至6130亿美元，下半年出货-27.2%。**量跌价升成为新常态，规模指标应让位于价值指标**。高层建议：集团考核从出货量转向ASP与毛利额。", "l": "IDC / 今日头条", "u": "https://www.idc.com/?p=19948/"}, {"t": "**W36国内大盘骤降10%**，华为20.3%唯一逆势扩张、苹果垫底", "s": "核心观点：2026W36（8/31至9/6）国内Sell out大盘同比降约10%，华为20.3%居首且环比+0.85pct，OPPO与vivo各16.2%、小米14.5%、荣耀14.4%、苹果13.7%环比-0.99pct。**大盘萎缩期只有品牌力能实现份额逆增**。高层建议：把握新iPhone上市前的空窗期加大渠道主推。", "l": "智慧芯片案内人 / 网易", "u": "https://dy.163.com/article/L6N7QL1K0511BBQT.html"}, {"t": "**千元新机基本绝迹**，起步价上移至2000元、低端出清加速", "s": "核心观点：截至9/14统计，红米Note 14从725元涨至1404元、OPPO K12s从608元涨至1261元，iQOO顶配累计涨1500元，小米17一月两次调价累计贵600元。**千元价位段在经济上已不具备生存条件**。高层建议：低端以减配保价加在以旧换新组合承接，把用户导入中端价位。", "l": "新浪新闻 / 中国蓝新闻", "u": "https://k.sina.com.cn/article_7879777295_1d5abdc0f06801isle.html"}], "opinionLeaders": [{"name": "余承东", "role": "华为常务董事、终端BG董事长", "items": [{"hl": "9/12 Mate XT 2非凡大师全渠道首销秒罄，9/13 10:08二次放货；三折叠全球累计发货已突破100万台", "detail": "19999元起四版本几分钟全部售罄，代抢费一度炒至5000元，线下门店预订五六十台当日仅到货五六台、新用户排队超一个月。G型展翼三折叠内屏完全包裹，3.5mm机身展开10.2英寸3K，首发麒麟9050 Pro整机性能+42%，IP58/59双认证。", "l": "证券时报 / 今日头条", "u": "https://www.toutiao.com/article/7684569869278396991"}, {"hl": "9/7发布会详解麒麟9050 Pro：时隔六年再推全新麒麟，采用逻辑折叠（韬定律）架构", "detail": "全球首发逻辑折叠技术，每平方毫米多容纳55%晶体管、关键任务功耗降66%；余承东坦言内存成本涨了2000多元、配置也增加很多，这次价格真的非常有诚意。", "l": "腾讯新闻 / 今日头条", "u": "https://www.toutiao.com/article/7683226445342081574/"}]}, {"name": "雷军", "role": "小米董事长兼CEO", "items": [{"hl": "9/10小米18 Fold开售喊出物超所值，首销同比+310%、首日销量约3.6万台", "detail": "第三方博主RD观测首日销量约3.6万台（10999元起），远超荣耀Magic V6首销三天3.46万台；首发玄戒O3（10核全大核、GeekBench6多核15221分、较前代+60%）+长鑫LPDDR6双国产。雷军称这是小米迄今最高端的手机，定价不便宜但绝对物超所值。", "l": "17173 / 今日头条", "u": "https://news.17173.com/content/09132026/020604795.shtml"}]}, {"name": "卢伟冰", "role": "小米集团总裁", "items": [{"hl": "9/13回应小米18 Fold缺货：西野红顶配线上全渠道确已缺货，正抓紧补货，部分小米之家仍有现货", "detail": "截至9/13上午11点小米商城16+512G、16+1TB两个规格全颜色缺货。业内预估受玄戒O3产能制约整机备货不足20万台，首销当天即卖出备货约18%。顶配14999元与限量1500台陶瓷特别版15999元线上一分钟售罄，二手溢价400至1000元。", "l": "今日头条 / 网易新闻", "u": "https://www.toutiao.com/article/7684842533372953122"}]}, {"name": "郭明錤", "role": "天风国际证券分析师", "items": [{"hl": "预判iPhone Duo第三季组装出货仅50万至100万部，等待4至6周、二手溢价可达官方售价50%至100%", "detail": "日经亚洲引述供应链消息称iPhone Duo截至8月日产量仅数百部，折叠结构生产难度大；截至9/13京东旗舰店预约已超80万人，全网预约破120万，黄牛现货加价2.4万元、代抢最高叫价9.9万元。供给端的稀缺性是溢价的唯一来源。", "l": "联合早报 / 今日头条", "u": "https://www.toutiao.com/article/7685049152333513250/"}]}, {"name": "孙燕飙", "role": "手机中国联盟秘书长", "items": [{"hl": "判断手机起售价2000元起步，存储占BOM飙至30%以上、千元机绝迹", "detail": "过去一年全球存储芯片价格持续上涨，智能手机运行内存与机身存储价格均上涨超100%。12+256G套片采购成本从约500元涨到2200元翻了3倍多，存储已超越处理器成为手机最贵单一零件。4000元高端门槛标准失效，千元机份额从2023年22%降至2026Q1的2.7%。", "l": "新华财经 / 新浪科技", "u": "https://www.toutiao.com/article/7681574187386814986/"}]}, {"name": "马克·古尔曼", "role": "彭博社首席记者", "items": [{"hl": "9/10苹果发布会前再报折叠iPhone目前日产量仅数百台、品控严苛致产能爬坡缓慢", "detail": "iPhone Duo铰链良率约65%、初期日产量仅数百台，国行延后至国庆后。9/4苹果收跌2.51%报319.97美元，单日市值蒸发1203亿美元（约8074亿元人民币）。", "l": "彭博社 / 新浪财经", "u": "https://finance.sina.cn/tech/2026-09-04/detail-2.html"}]}], "leadersSummary": "①**余承东见证Mate XT 2首销秒罄**：9/12 10:08开售19999元起全规格售罄、代抢费炒至5000元，三折叠全球累计发货破100万台，9/13二次放货②**雷军喊出物超所值**：小米18 Fold首日3.6万台、首销同比+310%，玄戒O3+长鑫LPDDR6双国产验证万元折叠需求③**卢伟冰回应缺货**：顶配线上全渠道断货正抓紧补货，备货不足20万台判断偏保守，二手溢价400至1000元④**郭明錤预判折叠iPhone供给紧张**：Q3组装出货仅50万至100万部，日产数百台、二手溢价可达50%至100%⑤**孙燕飙判断起售价2000元起步**：存储占BOM飙至30%以上、千元机绝迹，4000元高端门槛标准失效⑥**古尔曼再报折叠iPhone产能爬坡缓慢**：铰链良率65%、国行延后国庆后，9/4苹果单日蒸发8074亿元", "institutionViews": [{"name": "Counterpoint", "items": [{"t": "Q2智能手机内存价格环比涨超80%，存储占BOM从10%至15%升至20%以上，内存首超SoC成旗舰最贵单一器件", "s": "分价格段看：低端机（批发价低于200美元）BOM同比增70%、几乎全部由存储驱动；中端机（400至600美元）BOM增52%、内存已占总成本40%；旗舰（800美元以上）BOM增近50%。价格越低的机型受涨价挤压越重，往高端走才有消化成本的空间。", "l": "Counterpoint Research / 21世纪经济报道", "u": "https://news.qq.com/rain/a/20260908A07N2Y00"}, {"t": "2026年迄今全球智能手机零售价平均上涨约15%，中国市场涨幅约10%，新上市机型较去年同期高约25%", "s": "国家统计局数据8月移动电话机价格同比上涨11.0%，涨价主要集中在上市新机型；苹果中国官网已同步上调iPhone 17等四款在售机型售价，iPhone 17起售价涨至6799元、较发布价上调800元。消费者普遍推迟换机、延长换机周期至42个月。", "l": "Counterpoint Research / 证券日报", "u": "https://www.toutiao.com/article/7685055606079717915/"}, {"t": "2026H1折叠屏智能手机面板出货同比-13%，但内部结构剧变：翻盖式-62%、大折叠+35%", "s": "预计2026全年折叠面板出货增长23%，下半年较上半年增长53%、同比增长71%；2026至2030年出货量将增长74%、对应复合年增长率约15%。苹果首款折叠第一年出货份额预计25%、超越华为22%升至第二，三星38%居首。", "l": "Counterpoint 咨询 / 同花顺财经", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}]}, {"name": "IDC", "items": [{"t": "2026年全球智能手机出货下调至-16.7%、略高于10亿部，为有记录以来最大年度收缩；但均价+27.6%至581美元", "s": "市场总值仍增长6.3%至6130亿美元，下半年出货同比-27.2%。NAND与DRAM成本同比上升超300%，去年出货1.73亿部的百美元以下机型面临生存危机，Q2该价位段同比近乎-60%。折叠屏是唯一亮点、全年+12.6%。", "l": "IDC Worldwide Quarterly Mobile Phone Tracker", "u": "https://www.idc.com/?p=19948/"}, {"t": "2026Q2全球出货2.763亿部(-7.4%)：三星62.7M/22.7%(+8.1%)、苹果55.7M/20.2%(+14.9%)、小米31.2M/11.3%(-26.4%)", "s": "OPPO 28.9M/10.5%(-17.1%)、vivo 21.2M/7.7%(-19.6%)、其他76.6M。华为是唯一逆势者：在安卓竞品普遍涨价时保持中国区价格稳定、做定向促销、扩大价格带覆盖，取得+19.9%同比增长。二手与翻新机市场2026年预计增长13%。", "l": "IDC Quarterly Mobile Phone Tracker", "u": "https://www.idc.com/?p=19948/"}]}, {"name": "TrendForce", "items": [{"t": "2026Q3传统DRAM合约价预计环比上涨13%至18%，NAND闪存合约价预计上涨10%至15%", "s": "存储容量越大涨幅越大：iPhone 18系列256GB版本BOM成本预估年增幅达38%，从256GB到1TB、2TB版本涨幅递增，反映存储元器件已成为整机成本结构中的核心变量。AI服务器单台内存需求是普通服务器8至10倍，已消耗全球过半DRAM月产能。", "l": "TrendForce / 证券日报", "u": "https://www.toutiao.com/article/7685055606079717915/"}]}, {"name": "QuestMobile", "items": [{"t": "存量报告：华为2.76亿台21.6%居首但同比-4.0%、苹果20.9%-1.0%、vivo+9.5%至16.5%、小米+6.4%", "s": "2000至4999元活跃占比48.1%，中端价位段成存量主力。华为存量虽降但凭借Mate/Pura旗舰稳住高端基本盘，vivo靠iQOO游戏场景逆势增长。数据反映存量市场已进入零和博弈，份额增长须靠抢夺而非做大蛋糕。", "l": "QuestMobile / QQ新闻", "u": "https://new.qq.com/rain/a/20260909A035SN00"}]}, {"name": "Omdia", "items": [{"t": "2026Q2美国PC出货量(不含平板)同比增长1.0%至1880万台，平均渠道出货价格首次突破1000美元、同比+12.0%", "s": "本季度恢复增长主要得益于零售商与渠道伙伴在存储器和存储产品供应受限导致价格上涨之前提前备货，带动部分需求提前释放。PC与手机同受存储成本冲击，均价上行与需求前置是共同特征。", "l": "Omdia / 同花顺财经", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}, {"t": "2026H1全球折叠出货 存命中输入0.02元/百万token、输出4元，高峰翻倍。**架构级省显存+峰谷计价，Agent长任务成本被重新定价。**高层建议：【定价】以峰谷计价与缓存命中率设计MaaS报价。"}, {"tag": "AI治理", "l": "Anthropic/美国参议院", "u": "https://www.siliconreport.com/openai-commits-to-independent-safety-evaluators", "t": "Anthropic向第三方评估员发**工牌与工位**、并首次承认**Claude对齐缺陷**：合规成本开始内生化", "s": "核心观点：9/12 Anthropic公布「嵌入式评估员」计划，向第三方专家提供办公桌、公司笔记本与门禁并允许训练期核验；同日首次承认Claude安全对齐存在缺陷且尚无解决方案；威胁报告披露Claude Code被用于导弹相关软件研发。参议院要求OpenAI 10/1前提交HF入侵事件全部文件。**外部审计与安全举证正从公关动作变为制度成本。**高层建议：【合规】提前建设模型行为留痕与可验证评估体系。"}, {"tag": "商业化", "l": "月之暗面/腾讯研究院", "u": "https://www.sohu.com/a/1075592451_455313", "t": "Kimi K2.8把**百万上下文下放全会员**、8月ARR破**10亿$**：次旗舰接棒变现", "s": "核心观点：9/11月之暗面在Kimi Code与Kimi Work全量上线K2.8 Preview，性能接近旗舰K3、支持三档推理与图片视频输入，1M上下文向所有会员开放（K3仍需199元档以上）；8月ARR突破10亿美元、年底目标20亿美元，已递表港交所。**以次旗舰承接海量请求，是模型厂毛利修复的现实路径。**高层建议：【产品】建立旗舰/次旗舰分层调度，按单任务完工成本定档。"}, {"tag": "调用量大盘", "l": "OpenRouter", "u": "https://openrouter.ai/rankings", "t": "Hy4 preview以**17.2T Token**居首、Luna逼至**0.8T差距**：调用量领先不等于护城河", "s": "核心观点：OpenRouter最新周榜（截至9/12）腾讯Hy4 preview周调用17.2T token居全球第一(+22%)，GPT-5.6 Luna 16.4T(+35%)升至#2，GLM 5.3 Flash 12T、MiMo-V2.5 6.91T(+150%)。**调用量差已收窄至不足1T，流量优势正被美系反扑侵蚀。**高层建议：【生态】把调用量转为付费ARR与工具链绑定。"}, {"tag": "供应链", "l": "汇丰研报/芯榜", "u": "https://www.163.com/dy/article/L6BH22670552IBJ1.html", "t": "腾讯Q2预付**逾500亿元**锁定内存：中国云厂把涨价周期一次性买断（9/3口径）", "s": "核心观点：汇丰9/3路演披露，腾讯Q2预付逾500亿元锁定当前及下一代内存芯片，管理层定性为「五年一遇」的一次性支出；预计腾讯2026 capex约2124亿元(2025年1127亿元)、Q4起资本密集度正常化。**内存涨价已从芯片成本升级为云厂现金流事件，锁量能力即算力成本护城河。**高层建议：【供应链】以长约锁定下一代内存产能，对冲2027年涨价与AI服务器BOM上行。"}, {"tag": "AI for Science", "l": "腾讯研究院/英伟达", "u": "https://www.sohu.com/a/1075592451_455313", "t": "**25位菲尔兹奖得主联名**警示AI损害数学、英伟达开源**IMO金牌方案**：评价范式受拷问", "s": "核心观点：陶哲轩、Peter Scholze、邓煜等25位菲尔兹奖得主9/13联名，批评AI公司把解题当基准竞赛正在摧毁数学的概念理解与传承；同期英伟达开源纯自然语言IMO推理方案（30分达金牌线）及含200道奥数题的Nemotron-IMO-Bench。**评价权与学术合法性成为新的争夺焦点。**高层建议：【研发】以「可复现洞见+形式化验证」而非解题数量衡量AI科研产出。"}, {"tag": "需求侧", "l": "中国电信研究院/中国算力平台", "u": "https://www.163.com/dy/article/L6OCHT0S0511D0T2.html", "t": "**2026年Token年耗将达10亿亿**、智算**2185 EFLOPS(+177%)**：中国需求确定性最高", "s": "核心观点：中国电信研究院预计2026年我国Token年消耗量达10亿亿、2030年超3500亿亿；中国算力平台已推动31省区市接入，汇聚超1万家企业、2000多项算力产品、300多个大模型，截至6月底智算规模2185 EFLOPS、同比+177%。**中国AI需求确定性来自统一调度与真实调用量，而非云厂指引。**高层建议：【布局】把国产算力供给与东数西算节点、行业Token消耗挂钩。"}], "opinionLeaders": [{"name": "萨姆·奥特曼 (Sam Altman)", "role": "OpenAI CEO", "items": [{"hl": "「拿人类做赌注不可接受」：OpenAI 2026年不上市，必要时愿站出来对抗自己的投资者。", "detail": "9/12接受《财富》专访明确IPO推迟至2027，称眼下还有安全与对齐要求、以及行业与政府如何协作的大量工作要完成；并暗示头部AI公司接近就放缓开发节奏达成共同协议。同日声援阿莫代伊「我需要控制前沿的发展节奏」。", "l": "财富杂志/中新经纬", "u": "https://www.toutiao.com/article/7684885599152767488"}]}, {"name": "Dario Amodei", "role": "Anthropic 联合创始人兼 CEO", "items": [{"hl": "「我们必须放慢提升AI模型能力的速度」，并警告不减速则6-12个月内AI可能领导集群接管互联网。", "detail": "9/12发表长文提出由第三方评估员持工牌与工位常驻核验、在反垄断豁免下让头部实验室协调安全；同日Anthropic首次承认Claude安全对齐存在缺陷且尚无解决方案。公司IPO未放缓，最快10月中推介、11月中期选举前挂牌。", "l": "Silicon Report/路透", "u": "https://www.siliconreport.com/openai-commits-to-independent-safety-evaluators"}]}, {"name": "张鹏 (Peng Zhang)", "role": "智谱AI CEO", "items": [{"hl": "50亿美元押注「完全自训练」：让下一代GLM在上一代构建的环境里训练，形成递归自我改进。", "detail": "9/13宣布完成约50亿美元融资（约20亿配售+约30亿零息可转债，转股价892.50港元溢价12.55%），用于自动生成与筛选训练数据、构建任务环境、增强长程推理及国产芯片适配；智谱已建成1GW级国产芯片数据中心并收购中科加禾。", "l": "IT之家/潮新闻", "u": "https://www.toutiao.com/article/7685002629910364715/"}]}, {"name": "梁文锋 (Liang Wenfeng)", "role": "深度求索(DeepSeek) 创始人兼CEO", "items": [{"hl": "V4.1 Flash以非对称结构把KV Cache压到1/4，并用峰谷计价把闲置算力折成价格武器。", "detail": "9/10发布552B MoE的V4.1 Flash（输入激活8B/输出16B、原生多模态），HBM需求降至上一代1/4、SSD降至1/8；非高峰缓存命中输入0.02元/百万token，高峰翻倍，9/14后部分Pro请求转Flash。9/11国家超算互联网上线其API与权重。", "l": "36氪/太平洋科技", "u": "https://www.36kr.com/p/3978882752894599"}]}, {"name": "杨植麟 (Zhilin Yang)", "role": "月之暗面（Kimi）创始人兼 CEO", "items": [{"hl": "K2.8把1M上下文下放全会员档：以低成本次旗舰承接海量请求，旗舰留给高价值任务。", "detail": "9/11在Kimi Code与Kimi Work全量上线K2.8 Preview，性能逼近K3、支持三档推理强度与图片视频输入；公司8月ARR突破10亿美元、年底目标20亿美元，已向港交所递交上市申请。K3此前与微软/亚马逊/谷歌洽谈最高30%托管分成。", "l": "腾讯研究院/月之暗面", "u": "https://www.sohu.com/a/1075592451_455313"}]}, {"name": "陶哲轩 (Terence Tao)", "role": "菲尔兹奖得主 / UCLA 教授", "items": [{"hl": "联名25位菲尔兹奖得主：把解题当基准的竞赛式推进正在损害数学科学与共同体。", "detail": "9/13公开声明指出解题只是工具、根本目标是概念理解与洞见；仓促发布的解答来不及规范写作与引用，引发成果归属与剽窃问题，数学家之间的传承链条可能断裂。此前OpenAI以GPT-6 Astra刷FrontierMath Tier 4并宣称AGI已来。", "l": "腾讯研究院/公开声明", "u": "https://www.sohu.com/a/1075592451_455313"}]}, {"name": "James Mitchell", "role": "腾讯 首席战略官", "items": [{"hl": "内存锁量是「五年一遇」：Q2预付逾500亿元锁定当前及下一代内存芯片，资本密集度跃升已在Q2完成。", "detail": "9/3汇丰NDR路演披露；并称Harness付费用户推理毛利率已追平MaaS、付费用户token消耗为免费用户2倍以上；MaaS当前毛利率约40%回报最高，但因需求由训练转推理、模型厂自建算力，长期毛利承压。", "l": "汇丰研报/芯榜", "u": "https://www.163.com/dy/article/L6BH22670552IBJ1.html"}]}, {"name": "周靖人 (Jingren Zhou)", "role": "阿里云 CTO", "items": [{"hl": "Qwen3.8-Max(2.4万亿MoE)开源倒计时，编程仅次于Claude Fable 5.1，被海外厂商反向选型。", "detail": "9/9上线旗舰(激活95B/百万token)，Arena Text第5、Vision第2；国内API 12元/36元每百万token；Perplexity已基于Qwen3.8-27B推本地Agent，Cerebras亦上线Qwen3.8-27B（Artificial Analysis智能指数34，与GPT-5.6 Luna同档）。", "l": "阿里云/The Neuron", "u": "https://view.inews.qq.com/a/20260909A0DJOY00"}]}, {"name": "张一鸣 (Zhang Yiming)", "role": "字节跳动 创始人", "items": [{"hl": "亲自督导实时空间视频模型：把自研模型、云计算、内容平台与Pico硬件串成一个飞轮。", "detail": "9/8彭博社报道，基于Seedance的实时空间视频生成模型最快10月推出，约20帧/秒、50ms延迟按需生成视频流，响应Pico头显语音与动作；火山引擎占国内公有云大模型调用市场份额49.5%。", "l": "彭博社/IT之家", "u": "https://view.inews.qq.com/a/20260908A072YK00"}]}, {"name": "Arthur Mensch", "role": "Mistral AI 联合创始人兼 CEO", "items": [{"hl": "主权AI是欧洲独立门票：30亿欧元D轮三星领投，模型+存储芯片厂直接绑定。", "detail": "9/8完成30亿欧元D轮(三星电子领投)、估值超210亿欧元，为欧洲史上最大私有科技股权融资；主打数据不出境、模型可控，ARR目标剑指10亿美元。", "l": "TechCrunch/三星", "u": "https://techcrunch.com/2026/09/08/mistral-raises-e3b-as-sovereign-ai-becomes-big-business/"}]}], "leadersSummary": "①**奥特曼确认OpenAI 2026年不上市、愿为安全对抗投资者**，阿莫代伊同日呼吁放慢能力提升速度，马斯克声援——安全议题首次决定前沿节奏。②**张鹏以50亿美元押注「完全自训练」**，智谱两个月内二度融资，行业从比参数转向比造血与算力自持。③**梁文锋用V4.1 Flash把KV Cache压到1/4并引入峰谷计价**，推理成本曲线再下台阶。④**杨植麟把1M上下文下放全会员档**，Kimi 8月ARR破10亿$，次旗舰接棒变现。⑤**陶哲轩等25位菲尔兹奖得主联名**，警示解题竞赛正在摧毁数学的概念理解与传承。⑥**Amodei推第三方评估员持工牌常驻**，Anthropic同时承认Claude对齐缺陷尚无解。⑦**腾讯James Mitchell定性内存预付「五年一遇」**，阿里周靖人推Qwen3.8-Max开源，主权AI与开源双线并进。", "institutionViews": [{"name": "高盛 (Goldman Sachs)", "items": [{"s": "美系四大云2026 capex约7250亿$(较2025年约4100亿$增约77%)；五家(含Oracle)单季自由现金流跌至不足50亿$(此前约610亿$)，2025年末以来举债超1000亿$；2026年4340亿$设备支出中仅约1490亿$计入当期损益。单位效率分化：AWS每1$ capex产出0.30$营业利润，谷歌云仅0.17-0.18$。", "l": "高盛/证券时报", "u": "https://stcn.com/article/detail/4057343.html"}]}, {"name": "UBS / 标普全球 (S&P Global)", "items": [{"s": "超大规模厂商AI capex将由2025年约4920亿$翻倍至2026年约1.0万亿$、2027年约1.45万亿$；2026年三大云capex将吃掉约102%的云收入。标普全球模型显示Alphabet/亚马逊/微软/Meta/Oracle等在2026与2027年自由经营性现金流均为负，恢复要等到2029年。英伟达则联合Apollo、BlackRock、高盛、KKR等动员超5000亿$第三方资本为AI基建融资。", "l": "UBS/标普全球/AInvest", "u": "https://www.ainvest.com/news/nvidia-demand-runs-capital-customer-cash-2609"}]}, {"name": "美银美林 (BofA Merrill Lynch)", "items": [{"s": "中国四大云（阿里/腾讯/字节/百度）capex由2025年近4000亿元升至2026年约7260亿元、2027年破万亿；MaaS 2030年达6760亿元（CAGR 81%）为AI云最快赛道。9/6阿里配股800亿港元、字节举债近300亿美元，中国大厂以股权+债权双线备战AI算力。", "l": "美银美林/腾讯新闻", "u": "https://news.qq.com/rain/a/20260901A04OK500"}]}, {"name": "摩根士丹利 (Morgan Stanley)", "items": [{"s": "AI capex并未放缓：2027年或再+29%、达约1.4万亿美元；开放权重压低Token价格反而扩大推理需求，云巨头凭借GPU/自研芯片/生态仍享20%-60% ROIC。但AI投资进入「半场休整」，主线转向应用端与能源/储能等HALO资源。", "l": "大摩研报", "u": "https://um.stcn.com/article/detail/3998599.html"}]}, {"name": "汇丰 (HSBC)", "items": [{"s": "腾讯Q2预付逾500亿元锁定当前及下一代内存芯片，管理层定性为「五年一遇」的部分一次性支出；资本密集度主要跃升已在Q2完成、预付或延续至Q3、Q4起正常化。预计腾讯2026全年capex约2124亿元(2025年1127亿元)，维持买入、目标价655港元。", "l": "汇丰研报/芯榜", "u": "https://www.163.com/dy/article/L6BH22670552IBJ1.html"}]}, {"name": "中国电信研究院 / 中国算力平台", "items": [{"s": "《智能体时代AI基础设施发展研究报告(2026)》预计2026年我国Token年消耗量将达10亿亿、2030年超3500亿亿，年复合增长率接近12倍。中国算力平台已推动31省区市接入，汇聚超1万家企业、2000多项算力产品、300多个大模型；截至6月底我国智算规模达2185 EFLOPS、同比+177%，已建成70多条重点区域算力传输通道。", "l": "中国电信研究院/IT之家", "u": "https://www.163.com/dy/article/L6OCHT0S0511D0T2.html"}]}], "instsSummary": "①**UBS：2026 capex约1.0万亿$、2027约1.45万亿$**，2026年三大云capex约占102%云收入，自由经营性现金流2029年才恢复。②**高盛：四大云2026 capex约7250亿$，单季FCF跌破50亿$**，单位效率分化(AWS 0.30$ vs谷歌云0.17$)。③**美银：中国四大云2026 capex约7260亿元、2027破万亿**，MaaS 2 {"tag": "议价权拐点", "t": "原厂主动控价：铠侠称内存涨得够多了，NAND熄火、DRAM独强", "s": "核心观点：铠侠CEO太田裕雄9/9直言**内存价格已经涨得够多了**，已指示销售团队**不再向数据中心客户积极推动涨价**，首要任务是守住高位；9/13周度DRAM指数4358.7(+1.97%)、NAND指数2973.8(-0.21%)。**卖方由拉涨转向控价，本轮涨价进入尾声。**高层建议：Q4前锁定长协、停止囤货，消费级存储按季重议价。", "l": "太平洋科技/日媒 9/9-9/14", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}, {"tag": "代工景气", "t": "台积电8月营收5148亿新台币暴增53.3%，扩产预算再加294亿美元", "s": "核心观点：台积电9/10公布8月营收**5148.06亿新台币(约163亿美元)**，月增10.1%、年增53.3%，1-8月累计3.39万亿(+39.3%)；8月另核准约**294亿美元资本预算**扩产。**AI与秋季旗舰备货双驱动，先进制程与先进封装满载延续至2027。**高层建议：2027年先进制程与CoWoS产能须提前一年锁量。", "l": "台积电官网/工商时报 9/10", "u": "https://pr.tsmc.com/schinese/news/3340"}, {"tag": "代工格局", "t": "三星泰勒厂试跑、2nm良率升至70%+，美国产能成其反攻支点", "s": "核心观点：三星泰勒厂9/13投入测试晶圆开始试运行，2nm GAA良率由约20%升至**70%+**、4nm稳定80%+，月产能5万片；Q2代工份额台积电72.5%、三星5.9%、中芯5.4%。**代工由一超独走转向一超一强，中芯紧追三星。**高层建议：把2027年三星美国2nm产能纳入议价新选项。", "l": "AJU PRESS/TrendForce 9/9-9/13", "u": "https://m.ajupress.com/view/20260913180470562"}, {"tag": "HBM竞赛", "t": "HBM4三强竞速：美光冲10万片/月、三星25万片、SK完成开发", "s": "核心观点：美光年底HBM产能冲**10万片/月**(HBM4 12层占比达50%)；三星已出业界首款商用HBM4、产能17万→**25万片/月**；SK海力士完成HBM4开发，**I/O翻倍至2048、能效+40%**、下半年量产12层。**供给集中度下降，2027议价窗口初现。**高层建议：HBM4导入双源认证，避免绑定单一韩厂。", "l": "Asiae/Index Today 9/11-9/13", "u": "https://www.asiae.co.kr/en/article/2026091112450761035"}, {"tag": "管制转向", "t": "管制重心转向断维保：MATCH三法案进参院NDAA，中国以库存换时间", "s": "核心观点：AI OVERWATCH、Chip Security、MATCH三法案已纳入参议院NDAA manager修正案，**参院9/14复会待表决**；FT称长鑫/长存已囤足**3年扩产用ASML DUV**，新机禁令被提前对冲。**真正杀伤力在维保断供，中国正用库存换国产化时间。**高层建议：按最坏情形盘点在产设备维保与备件敞口。", "l": "Axios/FT/TechTimes 9/8-9/10", "u": "https://www.axios.com/2026/09/08/anthropic-breaks-tech-group-chips"}, {"tag": "国产设备", "t": "国产替代由设备走向材料与采购闭环，设备国产化率破30%", "s": "核心观点：9/10科创板业绩会显示设备国产化率由2024年16%升至**2026H1超30%**；9/14太平洋石英炉管通过国内头部DRAM厂300mm认证、天岳先进SiC衬底**市占全球第一**、中直机关便携机采购**10个包全部国产平台**(兆芯/飞腾/龙芯/海光/鲲鹏)。**替代正从设备扩散到材料与终端采购。**高层建议：国产料件按季度提验证批次，形成可切换清单。", "l": "科创板日报/太平洋科技 9/10-9/14", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}, {"tag": "国产存储", "t": "长鑫份额10%列第四但HBM3良率仅25%，规模换时间窗口仍在", "s": "核心观点：Counterpoint Q2长鑫DRAM营收份额**10%列全球第四**、当季全球DRAM营收环比+57%、同比+385%；但韩媒9/10称其HBM3试产**良率仅25%**、TSV为瓶颈，落后韩厂约3-5年。**常规DRAM已能自我造血，HBM仍是短板。**高层建议：长鑫纳入常规DRAM双供，HBM按2027后放量规划。", "l": "Counterpoint/网易 9/10-9/11", "u": "https://www.163.com/dy/article/L6HIAHQB05118HA4.html"}, {"tag": "终端SoC", "t": "2nm旗舰同台但制程红利递减：3nm玄戒O3多核反超2nm双雄", "s": "核心观点：GeekBench显示小米玄戒O3(3nm N3P)多核**15221分**，反超2nm的天玑9600 Pro(13086)与骁龙8E6(约14200)；天玑9600 Pro 9/15发布、骁龙峰会9/22。**制程数字不再是性能护城河，架构与调度决定体验。**高层建议：旗舰选型以实测能效与供货稳定性为先，勿唯制程论。", "l": "GeekBench/网易 9/8-9/13", "u": "https://dy.163.com/article/L6ARU76I053502RT.html"}, {"tag": "算法变量", "t": "算法正在替代堆硬件：DeepSeek V4.1把HBM需求打到四分之一", "s": "核心观点：9/10发布的DeepSeek V4.1 Flash(552B MoE)采用Causal-Encoder-Decoder非对称结构，**KV Cache对HBM需求降至上一代1/4、SSD需求降至1/8**；此前谷歌TurboQuant已把KV Cache压到1/6。**推理效率每翻倍即释放一轮虚拟供给。**高层建议：存储需求模型加入算法效率因子，警惕AI存储需求被高估。", "l": "DeepSeek/太平洋科技 9/10-9/14", "u": "https://www.toutiao.com/article/7684802125028753920/"}, {"tag": "设备景气", "t": "设备端景气外溢至2027：KLA指引全球设备支出1900亿美元", "s": "核心观点：KLA指引**2027年全球晶圆设备支出约1900亿美元(+20%)**，应用材料、泛林同步上调目标；SEMI统计2026Q2全球设备405.3亿美元(+23%)连创新高。**资本开支周期已锁定到2027，产能释放在2027下半年。**高层建议：2027产能紧张难缓解，但须防范2028设备过热后的周期反转。", "l": "Matterfact/KLA 9/12", "u": "https://www.matterfact.com/newsletter/2026-09-12-broadcom-ai-guide-memory-shortage-record"}], "opinionLeaders": [{"name": "KB Securities 金东元(Kim Dong-won)", "role": "存储供需", "items": [{"hl": "**三星/SK库存降至不足10天，2027年或现史上最严重存储紧缺**", "detail": "KB Securities 9/9报告：AI云投资2027达1.3万亿美元(+60%)，存储占AI基建投资占比由14%→40%→57%；HBM4耗用约3倍DRAM晶圆、挤出传统DRAM。三星/SK股价三月回调超30%、预期PE降至约3倍，被列为板块首选。缺口由产能而非需求驱动，延续至2030。", "l": "KB Securities 9/9", "u": "https://www.toutiao.com/article/7683411112431206964/"}]}, {"name": "铠侠 CEO 太田裕雄", "role": "NAND 定价", "items": [{"hl": "**内存价格已经涨得够多了，已指示销售团队不再积极推动涨价**", "detail": "9/9接受媒体采访时表示，其已指示销售团队不再向数据中心客户积极推动大幅涨价，首要任务是把芯片价格维持在当前高位而非继续推高。这是本轮周期中首个公开转向'保价稳量'的原厂声音，与苹果与其签3-5年NAND长协形成呼应。", "l": "日媒/太平洋科技 9/9-9/14", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}]}, {"name": "高通 CEO 安蒙(Cristiano Amon)", "role": "手机 SoC / 成本传导", "items": [{"hl": "**自9/1起全系提价两位数，只是把已发生的成本上涨向下游传导**", "detail": "台积电2nm晶圆报3万美元/片、较3nm约+50%，成本涨速快于售价调整节奏；骁龙8E6单颗成本已破300美元，为安卓史上最贵SoC。对终端厂意味着芯片与存储双重成本压力。", "l": "快科技/电子工程专辑 9/1", "u": "https://news.mydrivers.com/1/1147/1147510.htm"}]}, {"name": "博通 CEO 陈福阳(Hock Tan)", "role": "定制 ASIC / AI 半导体", "items": [{"hl": "**FY26 AI收入580亿美元、FY27 1150亿，FY28 指引约2300亿超预期500亿**", "detail": "管理层称需求'高到供不上货'，已向谷歌量产交付下一代TPU 8i；OpenAI Jalapeño 2027年部署1.3GW。定制ASIC放量额外拉动HBM与CoWoS先进封装需求，是本轮存储与封装紧缺的另一主引擎。", "l": "博通财报/财联社 9/2-9/12", "u": "https://finance.eastmoney.com/a/202609033863199575.html"}]}, {"name": "美国商务部长 卢特尼克(Lutnick)", "role": "半导体关税政策", "items": [{"hl": "**在美建厂就不用缴税，不在美建厂想进美国市场就要付钱**", "detail": "正制定第二轮半导体232关税框架，免税进口配额挂钩企业在美产能承诺；税率、税目、生效时间均未公布，或按国别设差异化税率与配额，未来数周至数月仍可能大幅调整。三星泰勒厂9/13试运行正是这一逻辑的产业映射。", "l": "Bloomberg Law/Roic AI 9/2", "u": "https://www.roic.ai/news/lutnick-signals-tariff-relief-for-chipmakers-that-build-in-us-09-02-2026"}]}, {"name": "高盛 内存价格追踪团队", "role": "存储价格", "items": [{"hl": "**DDR5 16Gb 现货较合约溢价约16%、DDR4 8Gb 溢价达43%**", "detail": "8月DDR5 8GB PC模组由130升至133美元、DDR5 64GB服务器模组+1%至1500美元；DDR5较DDR4溢价扩至16%。维持三星/海力士买入，判断Q4或是本轮价格高点，与铠侠9/9'涨得够多了'的表态相互印证。", "l": "高盛存储价格追踪 9/1", "u": "https://news.qq.com/rain/a/20260901A0BIL500"}]}, {"name": "集邦咨询 TrendForce", "role": "报价与份额", "items": [{"hl": "**3Q26 传统DRAM合约价+13-18%、NAND+10-15%，涨幅持续收敛**", "detail": "9/10另报Q2前十大代工产值534.9亿美元(+11.5%)创新高，台积电72.5%/中芯5.4%破30亿/三星5.9%；台积电8月营收5148亿新台币(+53.3%)、1-8月+39.3%印证AI与旗舰备货双驱动；预估2026中国高端AI芯片出货+83%、国产份额近90%；HBM+RDIMM占2026 DRAM位元51%。", "l": "TrendForce 8月报告/东方财富 9/2-9/10", "u": "https://finance.eastmoney.com/a/202609103870688279.html"}]}, {"name": "中微公司 尹志尧", "role": "国产设备", "items": [{"hl": "**订单进入大规模交付期，未来5年厂房面积增至90万㎡、覆盖60%以上IC高端设备**", "detail": "9/10科创板业绩会：中微已形成金桥/临港一期/南昌三大基地，临港总部8/1落成、广州/成都2027H1投产、临港二期2026H2开工；针对零部件涨价提前战略备库并推进国产导入。行业设备国产化率由2024年16%升至2026H1超30%。", "l": "科创板日报/中国证券报 9/10", "u": "https://news.qq.com/rain/ /9", "u": "http://www.chinadaily.com.cn/a/202609/09/WS6aa0b0dce4b06d4aa055d074.html"}]}, {"name": "美银全球研究(BofA)", "items": [{"s": "**9月存储现货供给满足率不足50%，DRAM/NAND仍有10-20%上涨空间**；另估若MATCH法案全面禁止DUV销售与维保，ASML收入受影响14-15%、营业利润16-17%(其Q2装机服务收入已约32.1亿美元)。英伟达给出2027年营收约+70%展望。", "l": "美银 9/1-9/9", "u": "https://www.sina.cn/gc/article/niqiaua3672040.html"}]}, {"name": "花旗 Citi (9/3)", "items": [{"s": "**因韩元汇率逆风(约5万亿韩元损失)+额外绩效奖金(约5万亿)，下调SK海力士3Q OP 76.7→74万亿、三星3Q OP 115.5→104.1万亿(低于一致预期9%)**；但维持买入，认为长协与供给受限支撑景气上行，三星HBM4有望下半年提升份额。", "l": "花旗/财闻 9/3", "u": "https://www.toutiao.com/article/7681279818066870838/"}]}, {"name": "伯恩斯坦 Bernstein (9/8-9/9)", "items": [{"s": "**DRAM Q3约+17%、NAND+20%仍双位数但涨幅明显放缓**，存储股9/8跌3-6%反映价格临近峰值；其分析师林清源向FT表示**华为在中国国产DUV推进中扮演'项目管理'角色**，投资覆盖投影镜头与光源等最卡脖子环节，但原型机到产业化仍缺上千家配套厂商。", "l": "伯恩斯坦/FT 9/8-9/9", "u": "https://www.gate-link.net/pt/news/detail/dram-nand-price-gains-slow-in-q3-as-demand-resistance-mounts-storage-stocks-23315615"}]}], "instsSummary": "① **涨价进入尾声**：9/13周度DRAM指数4358.7(+1.97%周/+6.18%月)、NAND指数2973.8(-0.21%周)，铠侠明确控价。② **代工一超一强**：Q2前十大代工产值534.9亿美元(+11.5%)，台积电72.5%、三星5.9%、中芯5.4%破30亿。③ **HBM供给分散**：Counterpoint Q2份额SK 50%/三星33%(Q1为21%)/美光18%，2026年底三强产能合计超55万片/月。④ **国产份额抬升**：Q2全球DRAM营收环比+57%/同比+385%，长鑫营收份额10%列第四、前三合计由94%降至87%。⑤ **设备景气锁至2027**：KLA指引全球设备支出约1900亿美元(+20%)，SEMI Q2设备405.3亿美元(+23%)创新高。⑥ **算法效率变量**：DeepSeek V4.1使KV Cache对HBM需求降至1/4、SSD降至1/8，存储需求模型须加效率因子。", "topNews": [{"t": "台积电8月营收5148.06亿新台币(约163亿美元)，年增53.3%、月增10.1%；1-8月+39.3%", "s": "9/10公布，AI/HPC与秋季旗舰备货推动3nm满载、先进封装供不应求；8月另核准约294亿美元资本预算用于先进制程产能与建厂", "u": "https://pr.tsmc.com/schinese/news/3340"}, {"t": "三星泰勒厂9/13投入测试晶圆开始试运行，2nm GAA良率升至70%+、4nm稳定80%+", "s": "月产能5万片；全线试运行推迟至今年晚些时候、目标明年初量产；Q2代工份额5.9%，落后台积电72.5%差距扩大至66.6个百分点", "u": "https://m.ajupress.com/view/20260913180470562"}, {"t": "HBM4三强竞速：美光年底冲10万片/月、三星出货首款商用HBM4并冲25万片/月、SK完成开发", "s": "美光HBM4 12层占其HBM产出年底达50%(年初20-30%)；三星HBM产能17万→25万片/月(+47%)、2026 HBM销售额增超3倍；SK海力士HBM4 I/O翻倍至2048、能效+40%、下半年量产12层", "u": "https://www.asiae.co.kr/en/articl 累计", "power": "2026-07", "invest": "1—7月累计"}, "brief": {"window": "数据窗口 2026-08-09 → 2026-09-09　|　聚焦消费电子 / 汽车消费 / 进出口 / AI 与信息通信产业链", "lead": "宏观温度：**外需高热、生产回暖、内需偏冷、成本上行**——经济呈现明显的 **K 型分化**，增长几乎全部由 **AI 电子链 + 出口** 贡献，消费与地产链仍在收缩。对终端业务：机会在「AI 换机 + 出口」，风险在「BOM 成本 + 汽车生态」。", "conclusions": ["**增长已高度集中于「AI 电子链 + 出口」一条线，宏观总量口径失真。**8 月出口 +25.0%、1—7 月电子行业利润 **+110%**（单独拉动全部规上工业利润 **9.3 个百分点**），而汽车制造 **-20.4%**、黑色冶炼 -51.2% 仍在深跌——**不能用「工业利润 +17.6%」推导终端需求，必须按 AI 电子链与传统制造链分别设定目标**。", "**成本上行已获官方价格指数确认，且涨价开始向终端传导。**8 月工业生产者购进价格 **+5.8%** 高出出厂价格 **+3.8%** 两个百分点，**计算机通信电子设备制造业出厂价同比 +5.3%、环比 +0.6%**，集成电路进口均价 **+72.2%** 而出口量 -7.9%——**2027 上半年 BOM 成本仍将上行，但终端已打开提价空间，定价与锁量动作必须前移**。", "**内需只有 AI 终端一条增量，政策主力已从货币切换到财政与产业投资。**7 月通讯器材社零 **+20.4%**（唯一两位数品类）而汽车 **-17.0%**；M2 7.7% 但贷款增速降至 5.1%、住户贷款减少 8271 亿元——**机会在「AI 换机 + 出口 + 六张网项目」，不在总量刺激**。"], "implications": [{"h": "① 成本与定价：提前锁价锁量", "c": "存储/芯片「量缩价涨」未结束，集成电路进口均价 **+72.2%** 已开始向下游报表传导。建议 **2027H1 关键器件提前锁量锁价**，并把涨价因子前置进 Q4 新品定价模型，避免毛利被动侵蚀。"}, {"h": "② 产品与营销：押注 AI 终端", "c": "手机/平板/PC 是内需唯一两位数增长且能提价的品类，1—7 月**可穿戴智能设备零售额增长超 1 倍**。建议把 **AI 手机 / AI PC / 智能穿戴** 作为 2027 年产品与营销资源主战场，主打「AI 体验」而非参数。"}, {"h": "③ 渠道与生态：重估车 / 家电协同", "c": "汽车类社零 -17.0%、家电 -1.9%，国补退坡叠加高基数双重压制。建议**下调车机/家电商量目标、暂缓渠道资源加码**；同时把主推资源向通讯器材（**+20.4%**）倾斜。"}, {"h": "④ 政策红利：对接「六张网」与两重清单", "c": "发改委推进算力网 + 新型电网 + 新一代通信网 **「2+3+N」** 协调机制，媒体披露算力网投资量级达 **4 万亿元**。终端与计算业务应对接重大项目清单，争取**政企与行业侧的算力/终端组合方案**落地。"}, {"h": "⑤ 供应链：警惕 2027 价格回落风险", "c": "集成电路 8 月出口额 **+129.8%** 但出口量 -7.9%，纯价格驱动。**高价备货需设置安全库存上限与跌价准备**，避免周期反转时形成呆滞库存。"}, {"h": "⑥ 出口：AI 硬件是当下最强 Beta", "c": "8 月计算机产品出口首破 **300 亿美元**、集成电路首破 **400 亿美元**，双双创历史新高。海外市场资源应优先配置到 **AI 终端与高附加值硬件**，借全球 AI 投资热潮放大出口弹性。"}], "gauge": [{"n": "外需 / 出口", "v": "高热", "s": "出口连续 4 个月两位数，机电出口创历史新高", "p": 88}, {"n": "AI 与电子产业链", "v": "高热", "s": "电子行业利润 +110%，集成电路 +18.5 倍", "p": 92}, {"n": "工业生产", "v": "中温", "s": "8 月 PMI 49.8% 回升，高技术制造业 52.9%", "p": 52}, {"n": "内需消费", "v": "偏冷", "s": "社零 +0.6%，汽车 -17%，仅通讯器材 +20.4%", "p": 30}, {"n": "价格 / 成本", "v": "升温", "s": "PPI +3.8%、购进 +5.8%，芯片进口均价 +72.2%", "p": 78}, {"n": "货币金融", "v": "宽松", "s": "M2 7.7%、社融 7.4%，但贷款增速降至 5.1%", "p": 60}]}, "headlineViewpoints": [{"tag": "政策", "t": "算力网升格国常会专题、AI+软件方案同日落地：**AI 竞争胜负手已从终端上移到算力底座与软件生态**", "s": "核心观点：9/11 国常会专题研究算力网建设，要求**算电协同、算网融合**、绿电直连与源网荷储落地；同日工信部《「人工智能+软件」专项行动实施方案》提出 2028 年覆盖 **2 万家**规上软件企业、打造 **100 个**智能体软件标杆应用。<b class=\"hl-red\">算力升格为国家级基础设施，智能体软件成为下一形态竞争点。</b>高层建议：2027 路线图把端侧 AI 与算力 / 软件生态绑定，争取算力券与新型政策性金融工具支持。", "l": "国务院常务会议 / 工业和信息化部", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080787.htm"}, {"tag": "价格传导", "t": "8月CPI+0.8%/PPI+3.8%、平板价格+21.5%：**算力涨价已传导至终端消费品定价**", "s": "核心观点：8 月 PPI 同比 **+3.8%**（连续 6 个月上涨），电子电路制造价格环比 +3.5%；CPI 端统计局首次把手机、平板、存储涨价归因于「算力需求快速增长」，三者同比 **+11.0% / +21.5% / +19.6%**。<b class=\"hl-red\">终端行业拿到 2023 年以来最明确的提价窗口，但成本同步上行、毛利未必改善。</b>高层建议：2026H2 定价从「保份额」切到「保毛利」，上游优先锁价、结构上移中高端。", "l": "国家统计局", "u": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260909_1965261.html"}, {"tag": "增长结构", "t": "8月出口+25.0%、集成电路出口额+129.8%但出口量-7.9%：**宏观增长已集中于 AI 电子一条链，且是纯价格驱动**", "s": "核心观点：8 月出口同比 **+25.0%**，机电产品 2623 亿美元创单月新高；1—7 月电子行业利润 **+110%**，单独拉动全部规上工业利润 9.3pct，同期汽车制造 **-20.4%**。集成电路出口额 +129.8% 但**出口量 -7.9%**、进口均价 **+72.2%**。<b class=\"hl-red\">宏观「平均温度」已失真，电子链繁荣是量缩价涨。</b>高层建议：改以「AI 电子链 vs 传统制造链」双口径定目标，涨价因子前置进 Q4 定价。", "l": "国家统计局 / 海关总署", "u": "https://www.stats.gov.cn/"}, {"tag": "政策", "t": "成本核算新规与 60 日现金回款同日落地：**价格战与账期两项隐性竞争工具同时戴上合规紧箍**", "s": "核心观点：9/10 发改委与市场监管总局明确重要工业品**低价无序竞争按个别成本 / 行业平均成本核算**，同日国办要求龙头企业对中小企业 **60 日内现金付款**、电子凭证期限压至 6 个月。<b class=\"hl-red\">过去靠低价与拖账期换份额的打法，正在从商业选择变成合规风险。</b>高层建议：把合规成本计入 2027 年竞争模型，价格策略由「低价换份额」切到合规下的价值定价，并提前压降应付账款与电子凭证敞口。", "l": "国家发展改革委 / 国务院办公厅", "u": "https://www.ndrc.gov.cn/xwdt/tzgg/202609/t20260910_1407525.html"}, {"tag": "内需机会", "t": "7月社零仅+0.6%、通讯器材+20.4%：**AI 换机是内需唯一确定的增量**", "s": "核心观点：7 月社零 39022 亿元、同比 +0.6%（扣除汽车后 +2.5%），**汽车是拖累项而非消费本身失速**。通讯器材类 +20.4%（1—7 月 +15.1%），汽车 -17.0%、家电 -1.9%、建材 -14.2%。**AI 终端是唯一逆势提价的耐用消费品**。高层建议：把 AI 手机/AI PC/智能穿戴作为 2027 年主战场，资源从车机/家电向通讯器材倾斜。", "l": "国家统计局", "u": "https://www.stats.gov.cn/"}], "opinionLeaders": [{"name": "国务院常务会议", "role": "宏观经济与产业政策顶层部署", "items": [{"hl": "算力网是人工智能发展的基础支撑，要推动算电协同、算网融合，加强算力资源监测调度和骨干光纤网络建设", "detail": "会议要求坚持合理布局、规范有序，进一步完善算力基础设施，积极推进关键技术和装备研发应用，构建多层次网络化算力体系；强化算电设施规划衔接，加快绿电直连、源网荷储等项目落地，更好发挥市场机制作用，支持企业开展科技创新、资源整合和应用推广，促进供需更好匹配。我国已形成 8 大国家算力枢纽、10 个国家算力集群、3 个算电协同发展区域的空间布局。", "l": "国务院常务会议研究算力网建设有关工作（9/11）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080787.htm"}]}, {"name": "国家统计局", "role": "国民经济核算与价格、工业、贸易统计", "items": [{"hl": "8 月 CPI 环比 +0.4%、同比 +0.8%（涨幅扩大 0.3pct），核心 CPI 同比 +1.0%；PPI 环比 +0.4%、同比 +3.8%", "detail": "CPI 端：汽油价格同比 +9.3%（涨幅扩大 8.3pct）拉动能源涨幅由 0.6% 扩至 4.1%；受算力需求快速增长影响，移动电话机、平板电脑、数据存储设备价格环比分别 +2.3%、+2.1%、+2.1%，同比分别 +11.0%、+21.5%、+19.6%（计算机）。PPI 端：煤炭开采 +26.6%、有色冶炼 +20.8%，计算机通信和其他电子设备制造业 +5.3%；汽车制造业位列价格下拉前六。", "l": "2026 年 8 月份 CPI / PPI 数据解读（9/09）", "u": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260909_1965261.html"}, {"hl": "8 月制造业 PMI 49.8%（+0.6pct），新订单 50.6%（+2.1pct）重回扩张，生产 50.4%", "detail": "电气机械器材、计算机通信电子设备生产与新订单指数均高于 53.0%；高技术制造业 PMI 52.9%、装备制造业 51.4%，消费品行业 49.0%。", "l": "2026 年 8 月中国采购经理指数（8/31）", "u": "https://www.stats.gov.cn/"}, {"hl": "1—7 月规上工业利润 45820.6 亿元、同比 +17.6%，营收利润率 5.66% 为 2023 年以来同期最高", "detail": "电子行业 +110% 拉动 9.3pct、高技术制造业 +50.1% 拉动 9.6pct、原材料制造 +55.2% 拉动 7.1pct，三项合计贡献全部利润增速的近九成。", "l": "1—7 月全国规模以上工业企业利润（8/27）", "u": "https://www.stats.gov.cn/"}]}, {"name": "中国人民银行", "role": "货币政策与金融统计", "items": [{"hl": "《金融强国建设「十五五」规划》正式出台，2030 年形成中国特色现代金融体系总体框架、2035 年基本建成", "detail": "陆磊：坚持「防风险、强监管、促高质量发展」主线，构建科学稳健的货币政策体系与覆盖全面的宏观审慎管理体系「双支柱」；保持社融、货币供应量增长同经济增长与价格总水平预期目标相匹配。6 月末「五篇大文章」结构性货币政策工具余额 4.6 万亿元、相关贷款同比 +10.9%，科技、绿色、普惠、养老、数字贷款增速均高于全部贷款平均。", "l": "国新办「开局起步‘十五五’」金融专题发布会（9/10）", "u": "https://www.gov.cn/lianbo/202609/content_7080658.htm"}, {"hl": "9 月 14 日至 17 日开展隔夜逆回购操作，固定利率、数量招标，每日操作量不超过 6000 亿元", "detail": "公开市场业务公告〔2026〕第 8 号。9/15 为本月主要税种申报纳税截止日，继 8 月后再次月中连续 4 次投放，意在削峰填谷、引导 DR001 围绕政策利率平稳运行，推动货币政策框架从数量型向价格型转型。", "l": "中国人民银行公开市场业务公告（9/10）", "u": "http://www.pbc.gov.cn/"}, {"hl": "7 月末 M2 +7.7%（355.51 万亿）、社融存量 +7.4%（463.27 万亿）、人民币贷款增速 5.1%", "detail": "前 7 月社融增量 22.25 万亿元、同比少增 1.74 万亿元；住户贷款减少 8271 亿元；外汇储备 34188 亿美元，连续 4 个月站上 3.4 万亿。", "l": "2026 年 7 月金融统计数据报告（8/14）", "u": "http://www.pbc.gov.cn/"}]}, {"name": "国家发展改革委", "role": "宏观调控、投资与产业协调", "items": [{"hl": "在现行成品油价格机制框架下实施临时调控，9/11 汽、柴油标准品价格应上调 435 元/吨和 420 元/吨，调控后实际分别上调 260 元/吨和 250 元/吨", "detail": "受国际原油价格持续上涨影响，按机制计算的上调幅度被临时压缩约四成，意在抑制输入性通胀向物流与居民消费端传导；与 8 月 CPI 能源项涨幅由 0.6% 扩至 4.1%、汽油价格同比 +9.3% 形成对冲。", "l": "国家发展改革委成品油价格临时调控（9/11）", "u": "https://www.ndrc.gov.cn/"}, {"hl": "民营局召开民营企业和行业协会座谈会，集中推介交通、物流、水利、能源四大领域 36 个项目，预计总投资 614 亿元、拟引入民间资本 156 亿元", "detail": "民间资本可通过独资、控股、参股项目公司等多种方式参与，涵盖铁路、仓储、风电、储能、充电设施、引水工程等类型；与近期多场「六张网」「两重」建设推进会、全国投资工作推进会议形成组合，力促投资止跌企稳。机构预计 1—8 月固定资产投资累计同比约 -7%。", "l": "国家发展改革委民营局民间投资项目推介（9/11）", "u": "https://www.ndrc.gov.cn/"}, {"hl": "联合市场监管总局印发《关于重要工业品低价无序竞争成本核算有关事项的通知》，明确成本核算主体、内容与方式", "detail": "发改价格〔2026〕1303 号。成本核算原则上以经营者个别成本为基础，个别成本无法核算时参考行业平均成本并考虑一定下浮幅度；产能利用率大幅低于行业平均的经营者将适当考虑其对成本的影响。目标是推动相关行业从「拼价格」转向「拼质量、拼创新」，营造优质优价环境。", "l": "重要工业品低价无序竞争成本核算通知（9/10）", "u": "https://www.ndrc.gov.cn/xwdt/tzgg/202609/t20260910_1407525.html"}, {"hl": "与美在华跨国企业高层圆桌会在京举办，主题「拥抱‘十五五’ 共谋新发展」", "detail": "亚马逊云、英伟达、戴尔、霍尼韦尔等 60 余家科技算力、工业能源、消费医药领域美资企业参会；发改委介绍「十五五」规划纲要政策考虑、利用外资政策、新一轮大规模设备更新和消费品以旧换新实施成效与提振消费政策精神。", "l": "与美在华跨国企业高层圆桌会（9/10）", "u": "https://www.ndrc.gov.cn/"}]}, {"name": "海关总署", "role": "进出口贸易统计", "items": [{"hl": "8 月进出口 4.65 万亿元、同比 +19.8%，连续 3 个月超 4.5 万亿", "detail": "集成电路出口 407.3 亿美元 / +129.8%（首破 400 亿美元）、自动数据处理设备 304 亿美元 / +76.5%（首破 300 亿美元），双双创历史新高；高新技术产品出口占出口总额 29.0%。", "l": "2026 年 8 月进出口数据（9/08）", "u": "http://www.customs.gov.cn/"}]}, {"name": "工业和信息化部", "role": "电子信息制造业运行", "items": [{"hl": "《「人工智能+软件」专项行动实施方案》：2028 年推广覆盖 2 万家规上软件企业、打造 100 个智能体软件标杆应用", "detail": "工信部信发〔2026〕209 号。到 2030 年关键软件全面实现智能化升级，智能编程、智能体软件及智能服务成为产业新增长极。六方面部署：优化智能编程工具链条、推进软件企业智能化技改、加快基础与工业软件智能化升级、培育智能体软件新业态、拓展智能软件服务、夯实智能化发展基础； function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function redify(s){
  var t = String(s==null?'':s);
  /* 数据中历史写入的 <b class="hl-red">…</b> 先归一化为 **…**，
     否则经 esc() 转义后会在页面上显示成可见的标签文本（程序符号） */
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>([\s\S]*?)<\/b\s*>/gi, '**$2**');
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>/gi, '');
  t = t.replace(/<\/b\s*>/gi, '');
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>');
}

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return redify(t||'');
  return '<div class="summary-lines">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}

function brandColor(b){ if(!b) return '#2563eb'; for(const k in BRAND_COLORS){ if(b.indexOf(k)>=0) return BRAND_COLORS[k]; } return '#2563eb'; }
function bodyClean(t){ return (t||'').replace(/^(关键发现|管理启示|分析观点)[：:]\s*/, ''); }
function numberedLines(t){
  const s = bodyClean(t);
  const parts = s.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<=1) return esc(s);
  return '<div class="nl">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div class="nl-i"><span class="mk">'+mk+'</span>'+esc(body)+'</div>';
  }).join('')+'</div>';
}

function drawMkt(key){
  const d = cur.marketData[key][mktGC];
  const labels = d.series.map(s=>s.label);
  const vals = d.series.map(s=>s.shipment);
  const yoy = d.series.map(s=>(typeof s.yoy==='number'? s.yoy : null));
  if(charts.mkt) charts.mkt.dispose();
  charts.mkt = echarts.init(el('mkt-chart'));
  charts.mkt.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },
    tooltip:{ trigger:'axis' },
    legend:{ data:['出货','同比YoY'], bottom:0 },
    grid:{ left:55, right:55, top:50, bottom:50 },
    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }
    ]
  }, true);
  const sh = el('mkt-shares');
  if(d.shares){
    el('mkt-share-note').textContent = '（'+(mktGC==='global'?'全球':'中国')+'厂商份额）';
    sh.innerHTML = '<tr><th>厂商</th><th>份额(%)</th><th>同比变化(pp)</th></tr>'+d.shares.map(s=>'<tr><td><b>'+esc(s.brand)+'</b></td><td>'+s.share+'</td><td class="'+(s.chg.indexOf('+')===0?'up':'down')+'">'+esc(s.chg)+'</td></tr>').join('');
  } else { sh.innerHTML=''; el('mkt-share-note').textContent='（该品类暂无分厂商份额数据 · '+(mktGC==='global'?'全球':'中国')+'）'; }
  const seg = el('mkt-segments');
  seg.innerHTML = d.segments? '<tr><th>分类</th><th>数值</th><th>说明</th></tr>'+d.segments.map(s=>'<tr><td>'+esc(s.name)+'</td><td><b>'+esc(s.val)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('') : '';
  const tbl = el('mkt-tbl');
  tbl.innerHTML = '<tr><th>周期</th><th>出货量(亿)</th><th>同比</th></tr>'+d.series.map(s=>'<tr><td>'+esc(s.label)+'</td><td>'+s.shipment+'</td><td>'+esc(s.yoy)+'</td></tr>').join('');
  drawMktShare(key);
}
function drawMktShare(key){
  const d = cur.marketData[key][mktGC];
  const box = el('mkt-share-chart');
  if(!d.shares || !d.shares.length){ if(charts.mktShare){charts.mktShare.dispose();} charts.mktShare=null; box.innerHTML='<div style="color:#9ca3af;text-align:center;padding:46px 0;font-size:13px">该品类暂无分厂商份额可视化数据</div>'; return; }
  const brands=d.shares.map(s=>s.brand), shares=d.shares.map(s=>s.share);
  const chgList=d.shares.map(s=>String(s.chg==null?'':s.chg));
  if(charts.mktShare) charts.mktShare.dispose();
  charts.mktShare = echarts.init(box);
  charts.mktShare.setOption({

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);
    else if(card.type==='brandtable') drawBrandTable(id, card);
  });
}

function ensureBrandTableCss(){

function drawBrandTable(id, card){
  ensureBrandTableCss();
  const maxScale = 40;   // 比亚迪规模远超其余，按 40 万为满条，避免其他不可见
  const rows = (card.rows||[]).map(function(r){
    const barW = Math.min(100, (r.sales/maxScale)*100);
    let yoyCls=''; let yoyTxt='—';

    const share=(typeof r.share==='number')?r.share+'%':(r.share||'—');
    return '<tr><td><b>'+esc(r.brand)+'</b></td>'+
      '<td><div class="bt-bar-wrap"><div class="bt-bar" style="width:'+barW.toFixed(1)+'%"></div><span class="bt-val">'+r.sales+'</span></div></td>'+

      '<td>'+share+'</td></tr>'+

}

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
    series:s1
  });
  // 九·2 当年累计（各品牌 + 五界/三境/一塔汇总）
  var g = H.group_ytd || {};
  var extra = [];
  ['智界','享界','尊界','尚界'].forEach(function(b){ if(H.ytd && H.ytd[b]!=null) extra.push([b, H.ytd[b]]); });
  var x2 = bn.concat(extra.map(function(e){return e[0];})).concat(['五界汇总','三境汇总','一塔汇总']);
  var y2 = bn.map(function(b){return H.ytd[b]||0;}).concat(extra.map(function(e){return e[1];})).concat([g['五界']||0, g['三境']||0, g['一塔']||0]);
  var groupColors = {'五界汇总':'#111827','三境汇总':'#ea580c','一塔汇总':'#0d9488'};
  var y2data = y2.map(function(v,i){
    var c = (i < bn.length+extra.length) ? pal[i % pal.length] : groupColors[x2[i]];
    return {value:v, itemStyle:{color:c}};
  });
  abMk('ab_c_hima_ytd', {
    tooltip:{trigger:'axis'}, grid:{left:72,right:30,top:30,bottom:56},
    xAxis:{type:'category',data:x2,axisLabel:{interval:0,rotate:30,fontSize:11}},
    yAxis:{type:'value',name:'2026YTD(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
    series:[{type:'bar',data:y2data, label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(1)+'万';}}}]
  });
}

function renderMacroT3(){
  const c = el('t3');
  const s = cur.industryProfit || {};
  let h = '<div class="card"><div class="section-title">一、规模以上工业企业利润 <span class="en">Industrial Profits · '+esc((cur.asOf&&cur.asOf.profit)||'')+'</span></div>'+
    mcVerdict(s.verdict)+ mcSection(s) +'</div>';
  if(cur.electronicsMfg){
    const e = cur.electronicsMfg;
    h += '<div class="card"><div class="section-title">二、电子信息制造业运行 <span class="en">Electronics Manufacturing · 工信部口径</span></div>'+
      mcVerdict(e.verdict)+ mcSection(e) +'</div>';
  }
  if(cur.earnSnap){
    h += '<div class="card"><div class="section-title">三、关键发现与管理启示 <span class="en">Findings / Implications</span></div>'+
      '<div class="snap-box find"><div class="snap-h">关键发现</div>'+numberedLines(cur.earnSnap.find)+'</div>'+
      '<div class="snap-box impl"><div class="snap-h">管理层启示</div>'+numberedLines(cur.earnSnap.impl)+'</div></div>';
  }
  c.innerHTML = h;
  macDraw();
}

/* ---------------- 宏观 T4 宏观指标大盘（三级子页签） ---------------- */
function renderMacroT4(){
  const c = el('t4');
  const subs = (cur.market && cur.market.subs) || [];
  let h = '<div class="card"><div class="section-title">口径与导读 <span class="en">Reading Guide · 四个维度看什么</span></div>'+
    '<div class="summary-box">'+splitSummary(cur.marketView||'')+'</div>'+
    '<div class="mc-asof">'+esc((cur.asOf&&cur.asOf.note)||'')+'</div></div>';
  h += '<div class="card"><div id="msub-tabs" class="mkt-tabs"></div><div id="msub-body"></div></div>';
  if(cur.sources && cur.sources.length){
    h += '<div class="card"><div class="section-title">数据来源 <span class="en">Sources · 官方发布</span></div><div class="mc-src">'+
      cur.sources.map(function(g){
        return '<div class="mc-src-c"><div class="h">'+esc(g.h)+'</div><ul>'+(g.items||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      }).join('')+'</div></div>';
  }
  c.innerHTML = h;
  el('msub-tabs').innerHTML = subs.map(function(s,i){
    return '<div class="mkt-tab '+(i===0?'active':'')+'" data-k="'+s.k+'">'+esc(s.label)+'</div>';}).join('');
  el('msub-tabs').querySelectorAll('.mkt-tab').forEach(function(t){
    t.addEventListener('click',function(){
      el('msub-tabs').querySelectorAll('.mkt-tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curMacroSub=t.dataset.k; renderMacroSub(); macDraw();
    });
  });
  if(subs.length) curMacroSub = subs[0].k;
  renderMacroSub();
}
function renderMacroSub(){
  const body = el('msub-body'); if(!body) return;
  const subs = (cur.market && cur.market.subs) || [];
  const s = subs.filter(function(x){return x.k===curMacroSub;})[0];
  if(!s){ body.innerHTML=''; return; }
  body.innerHTML = mcVerdict(s.verdict) + mcSection(s);
}

/* ---------------- 宏观图表绘制 ---------------- */
function macDraw(){
  if(curCat!=='macro' || !window.echarts) return;
  document.querySelectorAll('.mc-chart').forEach(function(box){
    if(!box.id) return;
    const cfg = MC_CHART_MAP[box.id]; if(!cfg) return;
    if(charts[box.id]){ try{charts[box.id].dispose();}catch(e){} }
    charts[box.id] = echarts.init(box);
    charts[box.id].setOption(mcOpt(cfg), true);
  });
}
function drawMacroCharts(){ macDraw(); }
function mcOpt(cfg){
  const AX = {color:'#6b7280', fontSize:11};
  if(cfg.type==='line'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), bottom:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:52,bottom:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',min:(cfg.min==null?null:cfg.min),max:(cfg.max==null?null:cfg.max),axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'line',data:s.data,smooth:0.28,symbol:'circle',symbolSize:5,connectNulls:true,
          lineStyle:{width:2.4,color:s.color},itemStyle:{color:s.color},
          markLine:s.markLine?{silent:true,symbol:'none',lineStyle:{color:'#cbd5e1',type:'dashed',width:1.2},
            label:{formatter:s.markLine,position:'insideEndTop',color:'#6b7280',fontSize:10},data:[{yAxis:s.markVal}]}:null};
      }) };
  }
  if(cfg.type==='hbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:20,right:52,top:46,bottom:20,containLabel:true},
      xAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      yAxis:{type:'category',data:cfg.y,axisLabel:Object.assign({width:cfg.yw||150,overflow:'truncate'},AX)},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',barMaxWidth:15,
          data:s.data.map(function(v,i){ return {value:v, itemStyle:{color:(s.colors&&s.colors[i])||s.color||'#2563eb', borderRadius:[0,3,3,0]}}; }),
          label:{show:true,fontSize:10.5,color:'#6b7280',formatter:function(p){return (p.value>0?'+':'')+p.value+'%';}},
          labelLayout:function(p){ var pos=p.value>=0; return {x:p.rect.x+(pos?p.rect.width+6:-6),y:p.rect.y+p.rect.height/2,verticalAlign:'middle',align:pos?'left':'right'}; }};
      }) };
  }
  if(cfg.type==='vbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:46,bottom:cfg.rotate?82:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,rotate:cfg.rotate||0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',data:s.data,barMaxWidth:s.barMaxWidth||26,
          itemStyle:{color:s.color||'#2563eb',borderRadius:[3,3,0,0]},
          label:{show:true,position:'top',fontSize:10.5,color:'#6b7280',
            formatter:function(p){return p.value==null?'':(p.value>0?'+':'')+p.value+'%';}}};
      }) };
  }
  if(cfg.type==='combo'){
    return { tooltip:{trigger:'axis'},
      legend:{data:[cfg.bar.name,cfg.line.name], top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:58,top:46,bottom:cfg.rotate?74:44,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,lineHeight:13,fontSize:10.5},AX)},
      yAxis:[{type:'value',name:cfg.yBar||'',axisLabel:AX},{type:'value',name:cfg.yLine||'',splitLine:{show:false},axisLabel:AX}],
      series:[
        {name:cfg.bar.name,type:'bar',data:cfg.bar.data,barMaxWidth:30,
         itemStyle:{color:cfg.bar.color||'#2563eb',borderRadius:[3,3,0,0]},
         label:{show:true,position:'top',fontSize:10,color:'#6b7280',formatter:'{c}'}},
        {name:cfg.line.name,type:'line',yAxisIndex:1,data:cfg.line.data,smooth:0.2,symbol:'circle',symbolSize:8,
         lineStyle:{width:2.4,color:cfg.line.color||'#dc2626'},itemStyle:{color:cfg.line.color||'#dc2626'}}
      ]};
  }
  return {};
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  /* 事件委托：tabnav 的 innerHTML 会随一级板块重写，逐个绑定会导致切换后监听失效 */
  const nav = el('tabnav');
  nav.addEventListener('click', function(ev){
    const t = ev.target && ev.target.closest ? ev.target.closest('.tab-item') : null;
    if(!t) return;
    nav.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id = t.dataset.tab;
    curTab = id;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    renderMacroBrief();
    setTimeout(()=>{
      for(const k in charts){ try{ charts[k].resize(); }catch(e){} }
      if(id==='t4'){
        if(cur===DATA.auto) drawAutoBoardCharts();
        if(curCat==='macro') drawMacroCharts();
      }
    },60);
  });
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
</body>
