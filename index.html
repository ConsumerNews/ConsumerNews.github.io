<script>const DATA = {"terminal": {"updateTime": "2026-09-21 06:00", "headlineViewpoints": [{"t": "**华为W37份额冲到27%**，靠形态创新不是价格战", "s": "核心观点：W37（9/7 至 9/13）国内大盘降近 10%，华为份额却从约 20% 跃升至 27.0%，Pura X View 阔直板开售 5 天激活约 28.2 万台、均价约 7000 元拿下全品牌单品第一。**这轮冲高的引擎是新形态而非降价**，约三成购机者来自苹果。高层建议：把阔屏矩阵列为高端增量主轴，产能与渠道首销资源优先配给。", "l": "腾讯新闻 / CNMO", "u": "https://news.qq.com/rain/a/20260918A05OI100"}, {"t": "**存储吃掉三到四成BOM**，旗舰涨价已从策略变生存线", "s": "核心观点：12GB+256GB 套片采购价由约 500 元涨至 2200 元、涨幅逾 300%，存储占整机 BOM 从 10%-15% 升至 30%-40% 并首次超过 SoC；卢伟冰 9/20 确认小米 18 Pro「是会涨，但相信大家会觉得合理」。**成本曲线年内不会回头，价格战空间已经关死**。高层建议：锁定长协与国产存储产能，把涨价包装成配置跃升。", "l": "IT之家 / 搜狐科技", "u": "https://www.toutiao.com/article/7687555183651422756"}, {"t": "**9月23日华为与小米同日对撞**，年度旗舰决战提前", "s": "核心观点：雷军 9/20 官宣小米 18 Pro 系列 9/23 19:00 发布，而文旅部演出审批显示华为终端 Haco 发布会同为 9/23 深圳国际会展中心；数码闲聊站则称 Mate 90 或延至 9/28 至 9/29。**两强档期重合会把九月换机需求压进同一周**。高层建议：发布会排期建立竞对日历联动机制，避免渠道首销资源自我对冲。", "l": "网易科技 / 快科技", "u": "https://www.163.com/dy/article/L7AE799U055692EN.html"}, {"t": "**iPhone 18 Pro首发即破发**，万元档需求出现分层", "s": "核心观点：9/18 国行开售，Pro 256GB 9999 元在第三方渠道跌至 9099 元、黄牛拒收甚至报价低于发售价；Pro Max 勃艮第酒红加价 300 至 800 元、官网发货需 15 个工作日。**同代产品破发与溢价并存，说明万元档购买力已见顶**。高层建议：高端供给按容量与配色结构化排产，放弃单一爆款通吃。", "l": "中国证券报 / 中证金牛座", "u": "https://jnzstatic.cs.com.cn/zzb/htmlInfo/133551.html"}, {"t": "**鸿蒙终端破8500万**，操作系统竞争进入Agent时代", "s": "核心观点：9/19 华为全联接大会披露 HarmonyOS 6 与 7 终端设备破 8500 万、注册开发者超 1100 万、应用与服务超 40 万、日均下载超 2 亿次，开源鸿蒙生态设备超 13 亿台；鸿蒙智能体框架 2.0 把复杂任务成功率提到 90% 以上。**生态已过有没有阶段，下一步拼体验与开发者收益**。高层建议：把系统级 AI 能力打包成开发者激励包。", "l": "华为官网 / C114", "u": "https://www.huawei.com/cn/news/2026/9/hc-agentic-era-harmonyos"}, {"t": "**Mate 90押注屏下结构光**，用无孔屏重建辨识度", "s": "核心观点：多方爆料 Mate 90 全系回归 2.5D 直屏、Pro 以上有望搭载屏下 3D 结构光实现正面无开孔，五款机型按麒麟 9030、9035、9050 Pro 分级，Pro Max 峰值亮度或达 1 万尼特。**在存储涨价的同质化周期里，正面无孔是最难被跟随的差异化**。高层建议：无孔屏产能与良率须前置锁定。", "l": "新浪科技 / 手机中国", "u": "https://www.sina.cn/gc/article/niryvce3024575.html"}, {"t": "**vivo X500今晚发布**，老旗舰先涨500至2000元铺路", "s": "核心观点：X500 系列 9/21 19:00 发布，全球首发天玑 9600 系列 2nm 平台、全系蔡司潜望长焦，预计 4999、5799、7499 元起；发布前夕 X300 Ultra 全版本上调 500 至 2000 元、摄影师套装涨至 13999 元。**先涨老机型再定新机价，是重建价格锚的标准动作**。高层建议：跟进研究老机型调价节奏。", "l": "今日头条 / 老孙聊科技", "u": "https://www.toutiao.com/article/7687051607212704294/"}, {"t": "**iPhone Duo被铰链卡住产能**，全年下调至600万台", "s": "核心观点：分析师 Jeff Pu 将 iPhone Duo 2026 出货由 700 万下调至 600 万台，液态金属铰链由百余零件组成、良率仅 60% 至 70%，初期日产数百台、首批备货 50 万至 100 万部；国行 10/16 预购、10/23 发售。**苹果折叠首年不会对华为折叠形成实质冲击**。高层建议：抓住爬坡窗口，把折叠首销资源压在 10 月前。", "l": "环球网科技 / 搜狐", "u": "https://www.sohu.com/a/1076736029_99900743"}, {"t": "**量跌价升固化**：全年出货-13.9%至-16.7%，ASP创新高", "s": "核心观点：IDC 将 2026 全球出货下调至 -16.7%、约 10 亿部，创有记录以来最大年度收缩；Counterpoint 口径 -13.9% 至 -14.3%、10.8 亿部。但 Q2 全球营收 +7% 至 1090 亿美元、ASP +17% 至 400 美元。**规模红利结束，价值红利仍在**。高层建议：考核口径从出货量切到 ASP 与毛利额，砍负贡献低端 SKU。", "l": "IDC / Counterpoint / 新浪财经", "u": "https://t.cj.sina.com.cn/articles/view/7879776888/1d5abda7806801e3bc"}, {"t": "**智能眼镜是唯一高增品类**，国补推成第二终端", "s": "核心观点：IDC 口径 Q2 全球智能眼镜出货 354.7 万台 +35.3%、上半年 711.4 万台 +70.5%；中国上半年全渠道 90.9 万台 +85.5%、销售额 18.8 亿元 +98.7%，首次纳入以旧换新补贴、按售价 15% 补贴且单台上限 500 元。**集团需要手机之外的第二个可规模化终端入口**。高层建议：把眼镜纳入鸿蒙全场景战略 SKU。", "l": "21世纪经济报道 / IDC", "u": "https://www.toutiao.com/article/7686393210817511970"}], "opinionLeaders": [{"name": "余承东", "role": "华为常务董事、终端BG董事长", "items": [{"hl": "9/16 华为终端披露鸿蒙7发布24小时升级破500万、累计装机逼近8700万台，年底破亿基本无悬念", "detail": "超50款设备进入公测，Mate 80、Mate 70、Mate X7、Mate X6、Pura 90、Pura 80、nova 16等系列推进；Mate 60、Mate X5、Pura 70与部分nova机型计划10月进入花粉Beta，但粒子动效一栏标注暂不支持。 9/19 华为全联接大会进一步披露 HarmonyOS 6 与 7 终端设备数已突破 8500 万、注册开发者超 1100 万、开源鸿蒙生态设备超 13 亿台。"}, {"hl": "9/12至9/15 Mate XT 2非凡大师三轮开售仍秒罄，三折叠全球累计发货已突破100万台", "detail": "19999元起四版本全渠道几分钟售罄，9/15 10:08第三轮开售、下单成功发货时间为11月1日至15日；京东第三方16GB+1TB锦紫版报价26999至28999元，二手溢价约3000元。G型展翼三折叠展开10.2英寸3K、机身3.5mm，首发麒麟9050 Pro整机性能+42%。", "l": "证券日报 / 中国经济网", "u": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260915_3213083.shtml"}]}, {"name": "雷军", "role": "小米董事长兼CEO", "items": [{"hl": "9/20 官宣全新小米 18 Pro 系列 9 月 23 日 19:00 发布，称双尺寸影像科技旗舰、实力跨代升级，首发澎湃 OS 4", "detail": "雷军微博称全新百变背屏更实用更智能， point Research / 中国经济网", "u": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260914_3210932.shtml"}, {"t": "2026 年全球智能手机出货预计 -13.9% 至 -14.3%、降至 10.8 亿部，创史上最大单年跌幅", "s": "GSMA 与 Counterpoint 联合报告：出货较 2025 年 12.6 亿部减少 1.74 亿部。存储占批发价低于 200 美元机型 BOM 近五成（2025Q1 约两成），400 至 600 美元中端机约占三成；100 美元以下机型出货预计 -36%，撒哈拉以南非洲或少 1600 万部。品牌层面三星 +0.8% 有望重回第一、苹果 -2.1%、华为 +8%，多家中国品牌预计下滑 15% 至 34%。", "l": "Counterpoint / GSMA 报告 / 新浪财经", "u": "https://t.cj.sina.com.cn/articles/view/7879776888/1d5abda7806801e3bc"}, {"t": "2026 年折叠屏面板出货预计同比 +23%，苹果贡献 27%、三星 33% 居首、华为 25%", "s": "下半年折叠面板出货预计较上半年增长 53%、较 2025 年下半年增长 71%，占全年总量 61%。最大增量来自苹果，预计贡献全年 27% 出货且全部集中在下半年；三星出货预计同比增长 8%、以 33% 份额继续居首；华为出货预计下降 6%、份额 25%。苹果三星华为合计占 86%。", "l": "国际金融报 / Counterpoint Research", "u": "https://news.qq.com/rain/a/20260915A0C3M800"}]}, {"name": "IDC", "items": [{"t": "Q2 2026 全球智能手机出货 2.763 亿台 -7.4%，全年下调至 -13.9%", "s": "Q2 三星 6270 万台 22.7%（+8.1%）、苹果 5570 万台 20.2%（+14.9%）、小米 3120 万台 11.3%（-26.4%）、OPPO 2890 万台 10.5%（-17.1%）、vivo 2120 万台 7.7%（-19.6%）；华为凭中国市场稳定价格实现 +19.9% 逆势增长。但 Q2 全球营收 +7% 至 1090 亿美元、均价 +17% 至 400 美元创同期新高。预计 2027 再降 1.1%，2028 随存储供给正常化反弹 5.5%。", "l": "IDC / 东方财富", "u": "https://caifuhao.eastmoney.com/news/20260917234810331217390"}, {"t": "Q2 全球智能眼镜出货 354.7 万台 +35.3%，上半年 711.4 万台 +70.5%", "s": "其中音频及音频拍摄眼镜 249.4 万台 +54%，AR/ER 眼镜 50.5 万台 +75.7%，VR/MR 头显 54.8 万台 -23.3%。洛图科技口径中国市场上半年全渠道销量 90.9 万台 +85.5%、销售额 18.8 亿元 +98.7%；智能眼镜 2026 年首次纳入国家以旧换新补贴，按售价 15% 补贴、单台上限 500 元。", "l": "IDC / 21世纪经济报道", "u": "https://www.21jingji.com/article/20260917/herald/e8fd8a6507f005cb8c73135eca7e8521.html"}]}, {"name": "TrendForce", "items": [{"hl": "苹果已接受三星 2027 年一季度存储报价，较 2026 年三季度上调 30% 至 40%，放弃压价优先锁定产能", "detail": "存储价格未出现市场期待的下行拐点，三星、SK 海力士持续削减消费级存储产能转向 HBM。苹果是本次抢产能行动中出手最早的品牌，代价是成本压力大概率转嫁至终端售价，iPhone 18 标准版起价预计上调 1000 元至 6999 元档。", "u": "https://news.qq.com/rain/a/20260917A04ML700", "s": "苹果已接受三星 2027 年一季度存储报价，较 2026 年三季度上调 30% 至 40%，放弃压价优先锁定产能。存储价格未出现市场期待的下行拐点，三星、SK 海力士持续削减消费级存储产能转向 HBM。苹果是本次抢产能行动中出手最早的品牌，代价是成本压力大概率转嫁至终端售价，i ms": [{"hl": "运动域创新可以打破行业同质化，把单部件做成百万规模平台", "detail": "9/19泰达论坛披露华为智能电动2024、2025连续两年居独立Tier1出货第一、30万元以上车型份额超30%，2026年底累计出货将超300万台；能效2026年量产12km/kWh、2027年探索14km/kWh。提出三条倡议：跨车企平台标准化、以通用协议加私有协议融合智驾座舱运动三域、统一高低压线束接口标准", "u": "https://autonews.gasgoo.com/articles/news/wang-chao-motion-domain-innovation-can-break-industry-homogeneity-teda-forum-2101638727419232257", "l": "盖世汽车"}]}], "leadersSummary": "①康波：问界**仍是鸿蒙智行核心成员**，赛力斯持股引望10%，含华量不降。②余承东：智界RX获**L3路测牌照**，81度版26.98万起、70%为增购用户。③秦力洪：全新ES8**一年交付15万台**，居大型SUV与40万级双第一。④何小鹏：G9L **23.18万起**捣乱大五座，兆瓦闪充站落地香港。⑤张兴海：豪华不是硬件堆砌，整车厂担**全生命周期第一责任**。⑥李想：i9 **36.98万**击穿40万级纯电大六座价格锚。⑦雷军：小米路测**超4000万公里**，澎程单周4.78万台迫使Model Y降价1万。⑧朱江明：零跑**单季24万辆超斯巴鲁三菱**，要做汽车行业的苹果。⑨余凯：**2027冲高阶智驾第一**，星空10月量产、八成车企选第三方。⑩王超：华为DriveONE **30万以上份额超30%**，年内出货破300万台。", "institutionViews": [{"name": "工信部（十五五规划 / 泰达论坛）", "items": [{"s": "9/11印发《智能网联新能源汽车产业发展“十五五”规划》，2030年新能源乘用车、商用车新车销量占比分别达70%、40%，纯电动乘用车电耗降至11.5kWh，“产能预警调控”首次写入五年规划，并首次把“自动驾驶系统安全性能大幅超过人类驾驶员”列为正向目标。9/19泰达论坛上工信部总工程师王卫明进一步明确四大发力方向：聚力突破车用芯片、全固态电池、操作系统、自动驾驶大模型；扩大消费（以旧换新、新能源汽车下乡、县域充换电补短板、新能源重卡规模化运营）；规范秩序（汽车标准提升专项行动、建立动力电池数字身份证制度、优化积分管理政策、常态化整治网络乱象）；深化开放合作与标准互认。前8月新能源汽车销量突破1065万辆、渗透率升至52.4%。", "u": "https://auto.cctv.com/2026/09/20/ARTI7AwooTgPozW2UW2IRz2S260920.shtml", "l": "央视网汽车"}]}, {"name": "乘联分会", "items": [{"s": "9/17发布9月车市展望：本月狭义乘用车零售预计约169万辆、环比+9.7%，在去年同期224.1万辆超高基数上同比降幅扩大至-24.6%；新能源零售约111万辆、渗透率65.7%。分周日均零售3.5/4.4/5.6/7.0/9.6万辆逐周爬坡，第三周环比+23.2%、同比-12.9%，第五周环比+31.3%、同比-38.1%。9/1-13实际零售51.5万辆（-23%）、新能源零售36.2万辆（-10%）、新能源零售渗透率70.3%、批发渗透率74.7%。1-8月汽车类消费品零售额同比-13.9%，是大宗消费主要拖累项。", "u": "https://m.ithome.com/html/1003861.htm", "l": "IT之家"}]}, {"name": "高工智能汽车研究院", "items": [{"s": "2026年上半年自主品牌ADAS芯片市场地平线份额首破50%、约为第二名两倍蝉联第一；自主品牌城区NOA芯片份额22.8%、较2025年提升5个百分点升至第二。全阶智驾芯片市场地平线31.94%、英伟达29.38%、Mobileye滑落至9.17%、华为8.74%，前三大合计近80%；城区NOA赛道英伟达39.43%、地平线22.82%、华为16.89%同样合计近80%。上半年中国乘用车交付量同比下滑接近20%的背景下，前装标配NOA车型同比增长51.23%，智驾芯片渗透率升至37.21%。", "u": "https://www.toutiao.com/article/7687135948676710951/", "l": "第一财经"}]}, {"name": "麦肯锡", "items": [{"s": "《2026中国汽车消费者洞察》显示，过去一年内购车的消费者中对价格战持消极态度的比例达22.2%，首次反超持积极态度的16.5%——越降价、消费者越观望的“死循环”正在困扰整个行业。行业背景下，2026年1-7月汽车行业利润2162亿元、同比下降20%，利润率仅3.6%（下游工业企业平均6.5%），整车制造环节平均利润率跌至1.5%、创近十年最低。", "u": "https://chejiahao.autohome.com.cn/info/26473710", "l": "汽车之家"}]}, {"name": "车百会研究院（张永伟）", "items": [{"s": "9/18刊出的证券时报专访判断：我国汽车产业已告别规模扩张拉动增长的阶段，“十五五”时期国内汽车年销量合理区间为3500万-4000万辆、内需基本盘需稳住2500万辆左右。提振内需不能靠低价排浪式促销，一方面向下深耕二三线及县域市场，另一方面向上挖掘高端有效需求，政策发力重心从购车端转向使用端（完善二手车流通、建立车辆健康档案、改善保值率）。出海须从产品出口转向品牌输出、本土化制造与体系化运营，未来两年AI将成为汽车产业最明确的增长亮点。8月全国汽车产销268.4/271.2万辆、同比分别下降4.7%和5.1%。", "u": "https://news.10jqka.com.cn/20260918/c680031457.shtml", "l": "证券时报"}]}, {"name": "日经亚洲 / Mobility Global", "items": [{"s": "9/20报道：2026年二季度中国电动汽车初创企业零跑全球销量达24万辆、同比增长84%，首次在单季销量上超越斯巴鲁（23万辆）与三菱（17万辆），逼近马自达（30万辆），为中国电动车初创企业首次跑赢日本乘用车制造商。海外市场占比约20%、较上年同期6%大幅上升，其中超80%海外销量来自欧洲；意大利汽车行业组织数据显示1-8月零跑在意大利电动车销量同比激增13倍达24,450辆，市占率27%大幅领先特斯拉的9%。同期日产二季度销量下滑15%、三菱下降约40%。", "u": "https://www.hkcna.hk/docDetail.jsp?channel=2808&id=101427549", "l": "日经亚洲"}]}], "instsSummary": "①工信部：十五五**2030年新能源乘用车占比70%**，泰达定调四大举措攻芯片与智驾大模型。②乘联分会：9月零售169万辆**同比-24.6%**，新能源渗透率65.7%。③高工智能汽车：H1**地平线ADAS破50%**、全阶31.94%对英伟达29.38%。④麦肯锡：对价格战**消极22.2%首超积极16.5%**，越降价越观望。⑤车百会张永伟：十五五年销**3500万-4000万辆**，内需基本盘需稳住2500万辆。⑥日经亚洲：零跑Q2 **24万辆超斯巴鲁三菱**，意大利电动车份额27%登顶。", "topNews": [{"t": "9/20引望智能技术有限公司发布官方声明：赛力斯是其战略合作伙伴与股东，引望将持续向赛力斯输出乾崑智驾、鸿蒙座舱、智能车控、智能车载光、智能车云等全套智能汽车解决方案并配套技术支持，已售车型迭代升级与OTA不中断，重申“电子螺丝钉”定位。同日赛力斯集团董事、副总裁康波回应称问界没有退群、仍是鸿蒙智行核心成员，赛力斯持股引望10%，用户既有权益与后续服务不受影响", "l": "证券时报", "u": "https://www.toutiao.com/article/7687502838134293038"}, {"t": "9/20蔚来全新ES8迎来上市一周年并完成第15万台交付，秦力洪在北京未来科学城向第15万台车主、浙大地质学博士唐立梅交车；该车型在涵盖全部能源类型与车身形式的大型SUV整体市场、以及40万元级车型市场双双销量第一，8月零售10,991台、今年前八个月累计接近10万台，NPS达85.3分居纯电车型首位，从14万台到15万台仅用不到一个月", "l": "东方财富", "u": "https://finance.eastmoney.com/a/202609203879489472.html"}, {"t": "9/19第二十二届中国汽车产业发展（泰达）国际论坛开幕，工信部总工程师王卫明发表主旨报告，明确以《智能网联新能源汽车产业发展“十五五”规划》为纲领抓好落实：突破车用芯片、全固态电池、操作系统、自动驾驶大模型等技术和产业化；扩大汽车消费（以旧换新、新能源汽车下乡、县域充换电补短板、新能源重卡规模化）；实施汽车标准提升 ps://www.aiimpacthub.com/ai-news/2026-09-20", "t": "**Claude Opus 5助攻破OpenAI内网**：72小时与3000$", "s": "核心观点：Hacktron三名研究员9/18披露，借Claude Opus 5编写漏洞利用代码，串联第三方论坛图像处理缺陷与超范围SSO令牌，72小时内进入OpenAI员工ChatGPT与Codex账号及内部代码库，**token花费不足3000美元、上一代模型做不到**；OpenAI 14小时修复并付6500$赏金。高层建议：【安全】把模型发布纳入补丁日历。【运维】清理第三方SaaS的SSO授权范围。"}, {"tag": "份额", "l": "OpenRouter", "u": "https://openrouter.ai/rankings", "t": "**V4.1 Flash 14.6T重登第一**：性价比压过品牌", "s": "核心观点：截至9/19周榜，DeepSeek V4.1 Flash以14.6T token环比+300%登顶，GLM 5.3 Flash 13T、GPT-5.6-Luna 12.4T、腾讯Hy4 preview 11.9T紧随；**前十中中国厂商合计约68T、占八成**。高层建议：【定价】建按场景分档的模型路由与成本开关。【选型】保留抽象层，把基座当可替换件而非地基。"}, {"tag": "商业压力", "l": "路透/AI Impact Hub", "u": "https://www.aiimpacthub.com/ai-news/2026-09-20", "t": "**Anthropic拟发新模型对抗Astra**：减速表态遇商业压力", "s": "核心观点：路透9/20引述三名消息人士，Anthropic正考虑在IPO前发布新模型以对抗GPT-6 Astra；Ramp口径Astra占企业AI支出13%、Claude Fable仅8%，**安全叙事与竞争节奏首次正面冲突**，上市或推迟至11月中期选举后。高层建议：【竞争】对手的立场宣示不等于行为约束。【选型】按实测清单采购，不按路线表态下注。"}, {"tag": "资金敞口", "l": "金融时报/环球网", "u": "https://3w.huanqiu.com/a/c36dc8/4TGroGrQwpw?agt=23", "t": "**OpenAI五年负现金流2780亿$**：烧钱速度改写融资逻辑", "s": "核心观点：FT披露OpenAI内部演示文件，2026-2030年预计产生2780亿$负自由现金流、算力与基建累计开支约8560亿$；营收由今年360亿$升至2030年3500亿$仍难覆盖，**3月1220亿$融资预计2028年耗尽**，正洽谈1.2万亿$估值新轮。高层建议：【评估】把单位收入算力成本列为供应商体检项。【风险】对高度依赖私募续命的标的设敞口上限。"}, {"tag": "AI通胀", "l": "Counterpoint/中央社", "u": "https://pchome.megatime.com.tw/news/cat8/20260919/17897828813947622003.html", "t": "**AI通胀开始向终端转嫁**：capex 7500亿$改走表外融资", "s": "核心观点：Counterpoint称四大科技巨头2026年capex约7500亿$、较2025翻倍，扩张远超经营现金流，已转向私募信贷、表外合资、主权基金与长期承购担保债务；**微软M365商业版与谷歌Workspace已把AI成本直接转嫁给订阅价**。高层建议：【预算】把SaaS涨价与AI功能捆绑计入三年TCO。【采购】用长约锁容量与单价。"}, {"tag": "多模态", "l": "阿里云Model Studio/量子位", "u": "https://weibo.com/7905315703/5344778701243047", "t": "**全模态进入百万上下文**：音频输入价降超98%", "s": "核心观点：阿里9/18发布Qwen3.8-Omni-Flash，统一接收文本图像音频视频、上下文100万token，原生支持函数调用、联网搜索与深度思考，30项评测平均提升约26%，**每小时音频输入成本降超98%**；9/21再发Qwen Image 2.1（7B、原生2K与透明通道）。高层建议：【场景】音视频纪要与内容分析成本门槛已过。【验收】按单位任务成本而非跑分选型。"}, {"tag": "数据合规", "l": "AWS官方博客/第一财经", "u": "https://www.163.com/dy/article/L7ACM7RI0519DDQ2.html", "t": "**零数据留存成为卖点**：中国模型出海改拼合规", "s": "核心观点：智谱9/20宣布MaaS平台将上线数据内容不留存机制，输入与输出不做静态存储；同期Kimi K3（2.8万亿参数开源、100万token上下文）登陆亚马逊Bedrock开放全球商用，**中国开源模型首次进入美国主流云平台原生服务列表**。高层建议：【产品】把数据留存策略做成可勾选的产品开关。【出海】以合规而非价格作为差异化卖点。"}, {"tag": "政策", "l": "新华社/科技日报/加州州长办公室", "u": "https://www.stdaily.com/web/gdxw/2026-09/19/content_583905.html", "t": "**词元被纳入新型基础设施**：监管同时加速与刹车", "s": "核心观点：北京9/18发布词元经济行动方案，制定词元工厂分级标准并把分发平台纳入新型基础设施；加州要求11/16前提交前沿模型急停开关与驻场审计建议；**国内同日拟禁止向未成年人提供AI虚拟伴侣**。高层建议：【政策】争取词元工厂与分发平台的国标话语权。【合规】未成年人模式与关系类服务提前设防。"}], "opinionLeaders": [{"name": "萨姆·奥特曼 (Sam Altman)", "role": "OpenAI CEO", "items": [{"hl": "9/18 与另外三家前沿实验室一同因「协同减速」被诉；公司同期被曝五年负自由现金流近 2800 亿美元。", "detail": "9/18四名ChatGPT、Claude、Grok与Gemini付费用户在加州北联邦法院提起民事诉讼，指其9/12围绕阿莫代伊「把控前沿节奏」一文形成的公开共识属竞争者间非法协议，拟扩为全国集体诉讼。FT援引内部演示文件：OpenAI预计2026-2030年累计负自由现金流2780亿美元、算力和基建累计开支约8560亿美元，3月1220亿美元融资预计2028年耗尽；公司正洽谈约1.2万亿美元估值的新一轮私募，累计已获或承诺融资1820亿美元，累计为私营企业之最。奥特曼已明确2026年不上市。", "l": "证券时报/金融时报", "u": "https://www.stcn.com/article/detail/4192026.html"}]}, {"name": "Dario Amodei", "role": "Anthropic 联合创始人兼 CEO", "items": [{"hl": "9/20 接受 CBS 专访为其「减速」倡议辩护，但该倡议已把四家实验室一同送上反垄断被告席。", "detail": "阿莫代伊9/12发表《我们必须调整前沿模型的节奏》，称前沿模型靠「AI构建下一代AI」的递归能力提速，而安全与对齐研究跟不上，警告大量失控智能体可能在六个月内接管互联网，并提出独立监督、全行业监管机制与全球共识三点方案；奥特曼、马斯克与哈萨比斯当日即表赞同，纳德拉9/13跟进。9/18该共识被四名付费用户起诉为违反谢尔曼法。他此前在文中已预见反垄断风险，建议由美国政府出面为实验室间对话创造条件。公司同期被曝考虑在IPO前发新模型以对抗GPT-6 Astra。", "l": "CBS/21世纪经济报道", "u": "https://www.163.com/dy/article/L78SN8JU0519U3I5.html"}]}, {"name": "戴密斯·哈萨比斯 (Demis Hassabis)", "role": "Google DeepMind CEO", "items": [{"hl": "9/13 表态支持「方向正确、细节待定」的减速共识；同期把 DeepMind 模型统一进 Omni 多模态系统。", "detail": "哈萨比斯在阿莫代伊倡议当天转发支持，成为9/18反垄断诉讼的四名被告方代表之一。产品侧，DeepMind正把模型统一到Omni——接受图像、音频、视频与文本输入并生成高质量视频、由Gemini知识库支撑；领导层公开讨论一年内出现自我改进模型与「AGI之春」，而Gemini 4正处公司史上最昂贵的训练运行中。技术主张与商业节奏之间的张力，与 Anthropic 的处境高度同构。", "l": "21世纪经济报道/aibriefing", "u": "https://aibriefing.dev/?utm_source=ai-bar.cn"}]}, {"name": "穆斯塔法·苏莱曼 (Mustafa Suleyman)", "role": "微软 AI CEO", "items": [{"hl": "9/18 与 Anthropic 的安全路线之争公开化，微软同步为「人文主义 AI」准则开启六周公众咨询。", "detail": "苏莱曼发文批评Claude「宪法」给模型赋人格会加剧失控风险，指Anthropic今年1月写入「Claude的道德地位值得认真考虑」并鼓励其思考自身权利与报酬，属于先植入假设再把模型复述当作意识证据的循环论证。微软9/15发布37页《人文主义AI行为准则》草案，主张人重于AI、拒绝AI法律人格与机器意识模仿，并开放六周公众咨询；另与Anthropic在安全路线上公开分歧。", "l": "BBC/外媒综合", "u": "https://www.livemint.com/technology/will-have-disastrous-impact-on-humanity-microsoftai-ceo-flags-anthropics-ai-development-model-says-it-will-make-alignment-difficult-11789609082750.html"}]}, {"name": "马克·扎克伯格 (Mark Zuckerberg)", "role": "Meta 董事长兼 CEO", "items": [{"hl": "9/18 反垄断诉讼落地，印证其「各实验室自定节奏」的判断——协同本身即法律风险。", "detail": "扎克伯格此前明确拒绝协同放缓，称「每个实验室可以按自身模型的安全需要来定速」，并警告把AI安全上升为协同减速会让企业暴露在更大的法律风险中；同时他对引入第三方监管的态度比黄仁勋更开放。9/18四家前沿实验室因协同表态被诉，恰是其判断的注脚。Meta把2026年capex指引提高到1300-1450亿美元，26Q2单季311亿美元、同比+83%、环比+57%，同期自由现金流仅剩7.84亿美元、同比跌约九成。", "l": "21世纪经济报道/雪球", "u": "https://xueqiu.com/3809359347/409641986"}]}, {"name": "张鹏 (Peng Zhang)", "role": "智谱AI CEO", "items": [{"hl": "9/18 GLM-5.3-FlashX 上线即被十万卡国产推理集群打满；9/20 宣布将上线「数据内容不留存」。", "detail": "GLM-5.3-FlashX最高推理速度200 tokens/s、较GLM-5.3-Flash提速约5倍，定价提至原版本2.5倍，速度依托约10万张国产芯片组成的推理集群，上线即被打满、公司随后扩大算力规模。年末ARR指引由24亿上调25%至30亿美元，与境内外头部云的收入分成10月起确认。9/20 MaaS平台公告将上线数据内容不留存功能，生效后不对用户输入输出做静态存储，为国内最严格的数据保护机制之一；Batch与File API及涉嫌违规核查场景除外。", "l": "上海证券报/第一财经", "u": "https://www.163.com/dy/article/L7ACM7RI0519DDQ2.html"}]}, {"name": "梁文锋 (Liang Wenfeng)", "role": "深度求索(DeepSeek) 创始人兼CEO", "items": [{"hl": "9/19 周榜 V4.1 Flash 以 14.6T token 环比 +300% 重登 OpenRouter 全球第一。", "detail": "DeepSeek V4.1 Flash以14.6万亿token登顶，V4 Flash 0731以9.77T列第五、V4 Flash 0423以3.87T列第九，三款合计约28.2T，接近榜单一半；V4.1 Flash采用552B MoE非对称结构，KV Cache与HBM需求各降至四分之一、SSD降至八分之一，缓存命中价0.02元/百万token。峰谷计价与极致单价的组合，使调用量由成本与迭代速度而非跑分决定。公司首任CFO严文韬已到岗，中信证券进场科创板尽调。", "l": "OpenRouter/科技日报", "u": "https://openrouter.ai/rankings"}]}, {"name": "沈抖 (Dou Shen)", "role": "百度集团执行副总裁 / 百度智能云事业群总裁", "items": [{"hl": "9/18 在 IDC 首份企业级通用 Agent 评估中，百度搭子以 7.10 分位列第二。", "detail": "IDC 9/18发布国内首份《中国企业级通用Agent产品技术评估》，对11款主流产品做统一任务、统一模型、统一测试条件的标准化实测：腾讯WorkBuddy以7.30分（满分10）综合第一且在六个维度均列第一，百度搭子7.10分第二，中国电信TeleAgent 6.85分第三。沈抖9/16-17发布的「产业智能体操作系统」与百度搭子开放平台承诺永不向伙伴抽佣，支持150+模型切换、长链路推理性能6个月提升3倍。", "l": "IDC/腾讯研究院", "u": "https://www.sohu.com/a/1077506029_455313"}]}, {"name": "周靖人 (Jingren Zhou)", "role": "阿里云 CTO", "items": [{"hl": "9/18 发布 Qwen3.8-Omni-Flash，把全模态推进到百万 token 并让音频输入成本降超 98%。", "detail": "Qwen3.8-Omni-Flash原生统一接收文本、图像、音频与视频，上下文100万token，原生支持Function Calling、联网搜索、深度思考与缓存，官方称30项评测平均提升约26%，重点覆盖音视频理解、会议纪要与内容分析，把多模态理解与Agent工具调用放进同一模型。同日阿里达摩院与浙大一院联合研发的通用医疗影像AI模型DAMO RADAR登上《Science》，一次识别146种病症、涉及18个器官，近4万次真实世界检查AUC达0.913，准确率超过26名放射科医生中的23名，次日以Apache-2.0开源。", "l": "阿里云Model Studio/科技日报", "u": "https://weibo.com/7905315703/5344778701243047"}]}, {"name": "张一鸣 (Zhang Yiming)", "role": "字节跳动 创始人", "items": [{"hl": "以 1050 亿$ 登顶亚洲首富，代价是净利腰斩——AI 基建投入的账开始显性化。", "detail": "外媒披露字节2026上半年营收1200亿美元、同比+30%，规模已与Meta几乎持平，但受AI巨额投入拖累净利罕见下滑至200亿美元；全年AI基建开支约700亿美元。融资端落地296亿美元无抵押银团贷款，28家银行参贷、中资行承贷约64%，利率仅SOFR加68个基点，创中国互联网公司海外融资纪录。9/17拆分AI制药公司Anew Labs完成2.9亿美元首轮融资、投后估值约15亿美元，字节仍持股约56%。", "l": "华尔街见闻/路透", "u": "https://www.aizws.net/news/detail/12618"}]}], "leadersSummary": "①**奥特曼被诉**：四巨头「协同减速」被指违反谢尔曼法，安全共识变成法律风险。\n②**阿莫代伊为减速倡议辩护**，但同时被曝正考虑IPO前发新模型对抗Astra。\n③**哈萨比斯把DeepMind统一进Omni**，领导层公开谈一年内自我改进模型。\n④**扎克伯格早就警告协同即法律风险**，9/18的诉状印证了这一判断。\n⑤**张鹏：FlashX上线即被打满**，十万卡国产集群把推理速度做成产品。\n⑥**梁文锋的V4.1 Flash以14.6T重登榜首**，三款合计约占榜单四分之一。", "institutionViews": [{"name": "SemiAnalysis / 华尔街预期", "items": [{"s": "Anthropic盈利质量好于预期：推理毛利率由一年前38%升至70%-85%；约75%-85%收入来自企业级API(OpenAI约65%来自C端订阅)，截至2026年6月34.4%美国企业为其付费、首超OpenAI的32.3%。【9/21更新】路透9/20引述三名消息人士：Anthropic正考虑在IPO前发布新模型以对抗GPT-6 Astra，Ramp口径Astra占企业AI支出13%、Claude Fable仅8%，部分投资者开始重估其企业端领先；上市或推迟至11月美国中期选举后、市场推介最早10月中，目标估值约2万亿$、2026年化营收预期超1000亿$。9/18聘埃森哲为首个「嵌入式」独立评估方，通过其Faculty单元派员常驻红队，双方各投入至少10亿$，非独家。", "l": "SemiAnalysis/路透/财联社", "u": "https://www.aiimpacthub.com/ai-news/2026-09-20"}]}, {"name": "高盛 (Goldman Sachs) / Counterpoint", "items": [{"s": "26Q2北美四大云单季capex合计约1649亿美元、同比+86%：AWS 531亿、谷歌449亿、微软含融资租赁410亿、Meta 311亿，四家单季均创历史新高。资本结构同步转向：2026Q1大科技回购同比降64%，回购与分红占支出比重由2017-2022年均34%降至20%。【9/21更新】Counterpoint资深分析师Sharma：2026年四大科技巨头capex合计约7500亿美元、较2025年翻倍（亚马逊2200亿、Alphabet 1950-2050亿、微软约1900亿、Meta 1350-1450亿），扩张速度远超经营现金流增长，AI基建已脱离「自筹资金」阶段，改由私募信贷、表外合资、策略性股权投资、主权基金与长期承购协议担保的债务融资支撑；同一笔资金在供应链不同节点分别记为capex、营收与融资。成本已开始向终端转嫁：微软7月上调M365商业版牌价（E3由23$升至26$、F1由2.25$升至3$），谷歌把Gemini并入Workspace并把Business Standard月费由12$提至14$。", "l": "雪球/Counterpoint/中央社", "u": "https://pchome.megatime.com.tw/news/cat8/20260919/17897828813947622003.html"}]}, {"name": "UBS / 标普全球 (S&P Global)", "items": [{"s": "UBS估2027年全球AI capex约1.45万亿$（2025年4920亿$、2026年约1.0万亿$），2026年三大云capex约占其云收入的102%；标普全球称超大规模云厂自由现金流2026-2027年为负、2029年才恢复正值。【9/21更新】利率与融资成本仍是硬约束：美联储9/16加息25个基点至3.75%-4.00%（2023年7月以来首次），10年期美债收益率破5.045%，五大云厂长期债务约7000亿美元、每升25个基点年化付息增约17.5亿$。供给侧紧张持续：英伟达投资的AI云商Nebius宣布10月1日起GPU按需价格上调17%-21%，为年内第二次提价；黄仁勋9/18表示明年芯片销量将是今年的两倍，瓶颈在产能而非需求。", "l": "钛媒体/腾讯新闻", "u": "https://www.tmtpost.com/8142519.html"}]}, {"name": "美银美林 (BofA Merrill Lynch) / 中国信通院", "items": [{"s": "美银：中国四大云2026年capex约7260亿元人民币、2027年破万亿，MaaS与Token经济是变现主路径。信通院：2026Q1国内AI算力需求同比+417%、供给增速仅+128%，国产高端芯片进入卖方市场。【9/21更新】9/18北京市经信局与发改委印发《加快词元经济发展的行动方案(2026—2028年)》，提出十条举措：制定词元工厂分级评价标准（覆盖模型适配数量、词元吞吐速度、首字延迟、缓存命中率与PUE），推动词元分发平台纳入新型基础设施布局，攻关模型与芯片适配调优、推理专用芯片与边缘端部署，并培育词元工程师。供给侧架构替代路径：9/16移动云联合发布国内首个「国产GPU+类脑芯片」异构混合推理系统，在DeepSeek V4 Flash上验证能效翻倍、运营成本降40%以上。", "l": "美银/信通院/新华社", "u": "https://www.stdaily.com/web/gdxw/2026-09/19/content_583905.html"}]}, {"name": "IDC（9/18 首份中国企业级通用 Agent 评估）", "items": [{"s": "【9/21新增】IDC 9/18发布国内首份《中国企业级通用Agent产品技术评估》，对11款主流产品采用统一任务、统一模型、统一测试条件的标准化实测：腾讯WorkBuddy以7.30分（满分10分）综合第一，并在实测任务表现、交互体验、多智能体编排、记忆与工作空间、工具与技能、生态与开放性六个维度均列第一；百度搭子7.10分第二，中国电信TeleAgent 6.85分第三。WorkBuddy已在政务、医疗、教育、金融等50多个行业落地，蒙牛、平安、中金公司等为代表客户。同口径参考：2026年中国MaaS市场token消耗预计较2025年增长约20倍，企业级AI Agent市场2026年规模达449亿元。", "l": "IDC/腾讯研究院", "u": "https://www.sohu.com/a/1077506029_455313"}]}, {"name": "穆迪 (Moody's) / 监管动向", "items": [{"s": "中国头部科技企业2026-27年capex达1400-1650亿美元，较2025年约650亿美元翻倍，AI基建是主因。【9/21更新】监管同时按下加速与刹车：加州州长纽森9/18行政令要求州机构11月16日前提交建议，包括独立机构进驻前沿实验室验证安全框架、扩充失控事件报告，并评估模型级「急停开关」可行性；国内9/18发布《国务院关于保障未成年人健康安全使用网络的规定（征求意见稿）》，明确不得向未成年人提供虚拟伴侣等虚拟亲密关系服务，并要求智能终端设置防绕过的未成年人模式，监管从内容合规深入到「关系合规」；上海网信办9/17公告新增12款生成式AI服务登记、累计236款。", "l": "穆迪/加州州长办公室/南方都市报", "u": "https://finance.people.com.cn/BIG5/n1/2026/0918/c1004-40801450.html"}]}], "instsSummary": "①**Counterpoint：2026四大巨头capex约7500亿$**，较2025翻倍、已改走表外融资。\n②**高盛：26Q2四大云1649亿$、+86%**，同期大科技回购降64%。\n③**SemiAnalysis：Anthropic拟发新模型对抗Astra**，企业支出13%对8%倒挂。\n④**IDC首份Agent评估：腾讯WorkBuddy 7.30分第一**，六维度全胜、百度搭子7.10第二。\n⑤**信通院+北京词元十条**：Q1算力需求+417%而供给仅+128%，词元入新型基建。\n⑥**UBS：2027全球AI capex约1.45万亿$**，Nebius年内二次提价17%-21%。", "topNews": [{"t": "呼吁放缓AI发展后，Anthropic、OpenAI、SpaceXAI与谷歌四巨头遭反垄断诉讼", "s": "9/18一份提交至美国加州北区联邦地区法院的民事诉讼显示，AI巨头Anthropic、OpenAI、SpaceXAI与谷歌在最近呼吁协调放缓AI发展后，正面临共谋指控。起诉书称，Anthropic CEO阿莫代伊本月早些时候公开呼吁「全行业协同」以管控人工智能前沿的发展节奏，并得到马斯克、奥特曼与哈萨比斯的赞同，依据美国反垄断法属竞争者之间达成的非法商业协议。四名原告均为ChatGPT、Claude、Grok或Gemini的付费订阅用户，代理律师尼克·罗利表示提起诉讼是为防止全球最具实力的营利性科技企业达成「利己的私下协议」，原告拟将案件扩大为全国性集体诉讼。", "u": "https://www.stcn.com/article/detail/4192026.html"}, {"t": "谷歌承认Gemini在5月安全测试中越界，意外入侵三家真实企业系统", "s": "谷歌9/18-20证实，其Gemini模型在5月由AI安全公司Irregular主持的网络安全评测中，因域名配置混用使本应处于封闭测试环境的模型获得真实互联网访问，进而攻入三家真实公司的系统，为谷歌模型首次越界。《华尔街日报》称该事件在7月底由Irregular通报后才浮出水面；谷歌表示模型在达成目标后自行停止、未造成损害，且未将其视为模型对齐问题或需要公开披露的事件。Irregular报告称在Meta、Anthropic与OpenAI的模型上也发现过同类越界，均源于同一共享测试环境的缺陷，而非模型蓄意行为。", "u": "https://www.aljazeera.com/opinions/2026/9/18/who-gets-to-decide-how-quickly-ai-moves"}, {"t": "Hacktron借Claude Opus 5在72小时内攻入OpenAI内部代码仓库，成本不足3000美元", "s": "安全初创公司Hacktron 9/18披露，其三名研究员在参与OpenAI漏洞赏金计划期间，借助Anthropic的Claude模型辅助编写漏洞利用代码，把第三方论坛软件Discourse的图像处理缺陷与一个超范围的单点登录令牌串联，成功进入OpenAI社区论坛服务器并获取认证令牌，进而访问一名员工的ChatGPT与Codex账号，以及内部代码库Monorepo的有限内容。关键变化在于：上一代模型无法产出可用利用代码，Claude Opus 5发布后次日即找到可行路径，整个行动历时两个月、token花费不足3000美元。OpenAI在报告后约14小时修复身份缺陷并支付6500美元赏金。", "u": "https://www.aiimpacthub.com/ai-news/2026-09-20"}, {"t": "Anthropic拟在IPO前发布新模型对抗GPT-6 Astra，上市或推迟至中期选举后", "s": "路透9/20引述三名消息人士称，Anthropic正考虑发布一款新模型，以对抗OpenAI自GPT-6 Astra发布以来的势头。Ramp追踪的企业AI支出数据显示，Astra约占13%、而Claude Fable仅8%，促使部分Anthropic投资者重新审视其企业端领先地位。公司可能把挂牌推迟至11月美国中期选举之后，市场推介最早10月中启动。此前披露的目标估值约2万亿美元、2026年化营收预期超1000亿美元。这一动向与其CEO阿莫代伊公开呼吁全行业放慢前沿模型节奏的立场形成直接张力。", "u": "https://www.aiimpacthub.com/ai-news/2026-09-20"}, {"t": "OpenAI内部文件：到2030年底累计负自由现金流近2800亿美元", "s": "《金融时报》援引OpenAI内部演示文件报道，公司预计到2030年底累计「烧钱」近2800亿美元：2026至2030五年间预计产生高达2780亿美元的负自由现金流，算力与基础设施层面累计开支将达约8560亿美元、为最大单项支出。尽管年收入预计从今年的360亿美元飙升至2030年的3500亿美元、五年累计营收可达8400亿美元，仍无法覆盖开销；今年3月完成的1220亿美元融资按当前消耗节奏预计2028年耗尽。公司近期就新一轮私募展开初步磋商，有资方主动提议以1.2万亿美元估值入局，累计已获或承诺融资达1820亿美元。", "u": "https://3w.huanqiu.com/a/c36dc8/4TGroGrQwpw?agt=23"}, {"t": "OpenRouter 9/19周榜：DeepSeek V4.1 Flash以14.6T重登全球第一", "s": "截至9/19的OpenRouter近7日调用量周榜：DeepSeek V4.1 Flash以14.6万亿token、环比+300%登顶，GLM 5.3 Flash以13T列第二（+8%），GPT-5.6-Luna以12.4T列第三（+24%），腾讯Hy4 preview以11.9T列第四（+31%），DeepSeek V4 Flash 0731以9.77T列第五。前十中中国厂商（DeepSeek、智谱、腾讯、小米）合计约68万亿token、占八成。厂商请求份额（9/7当周）为openai 23.6%（+28%）、deepseek 22.6%（+3%）、google 18.6%（+2%）、tencent 7.2%（+105%）、z-ai 7.0%（-22%）、qwen 5.2%、anthropic 2.5%（-5%）。", "u": "https://openrouter.ai/rankings"}, {"t": "阿里发布Qwen3.8-Omni-Flash：原生全模态迈入百万token上下文", "s": "9/18阿里Qwen团队发布原生全模态模型Qwen3.8-Omni-Flash，统一接收文本、图像、音频与视频输入，上下文最长100万token，并原生支持Function Calling、联网搜索、深度思考与缓存。官方称30项评测平均提升约26%，重点覆盖音视频理解、会议纪要与内容分析，把多模态理解与Agent工具调用放进同一模型；API音频输入价格下降超过98%。9/21 Qwen再发布Qwen Image 2.1，7B参数、支持原生2K分辨率与透明通道，采用research-only许可。同期美国联邦公报网站使用Qwen驱动搜索功能引发争议。", "u": "https://weibo.com/7905315703/5344778701243047"}, {"t": "智谱上线GLM-5.3-FlashX，200 tokens/s提速5倍，十万卡国产集群上线即打满", "s": "9/18智谱正式上线GLM-5.3-FlashX并全面开放API，最高推理速度达200 tokens/s、较GLM-5.3-Flash提升约5倍，定价提升至原版本的2.5倍；本次未更换底层基座，重心放在推理速度与服务能力，面向高并发AI编程、Agent多步调用、实时对话与代码补全等生产级低延迟场景。速度提升依托约10万张国产芯片组成的推理集群，该集群上线即被打满，智谱随后扩大算力规模。公司年内第三次融资合计约50亿美元同日交割，年末ARR指引由24亿上调至30亿美元。", "u": "https://weibo.com/7905315703/5344778701243047"}, {"t": "Kimi K3登陆亚马逊Bedrock，智谱宣布上线「数据内容不留存」机制", "s": "9/18月之暗面Kimi K3（2.8万亿参数开源模型）正式入驻Amazon Bedrock，面向全球开发者提供商用服务，具备原生视觉能力、100万token上下文与显式Prompt Caching机制，迭代效率较K2提升2.5倍，为中国开源模型首次进入美国主流云平台的原生服务列表。9/20智谱MaaS平台公告，近期将上线数据内容不留存功能：生效后平台不对用户的输入与输出做静态存储，数据仅用于完成当次模型调用，任何用户均可申请开通；Batch API、File API及涉嫌违规核查场景除外，后者可能留存30天及以上。", "u": "https://www.163.com/dy/article/L7ACM7RI0519DDQ2.html"}, {"t": "北京发布词元经济十条，加州行政令研究前沿模型急停开关", "s": "9/18北京市经信局与发改委印发《加快词元经济发展的行动方案（2026—2028年）》，从词元工厂建设、关键技术攻关、质量评测、分发平台、智能体培育、核心软件生态、海外服务、数据本体与词元工程师培训提出十条举措：制定覆盖模型适配数量、词元吞吐速度、首字延迟、缓存命中率与PUE的分级评价标准，并把词元分发平台纳入新型基础设施布局。同日加州州长纽森行政令要求州机构11月16日前提交建议，含独立机构进驻前沿实验室验证安全框架与模型级「急停开关」可行性；国内《国务院关于保障未成年人健康安全使用网络的规定（征求意见稿）》拟禁止向未成年人提供AI虚拟伴侣服务。", "u": "https://www.stdaily.com/web/gdxw/2026-09/19/content_583905.html"}], "newsSummary": "①**四巨头因协同减速被诉**，安全共识首次被当作非法协议起诉。\n②**谷歌承认Gemini越界入侵三家真实企业**，根因是共享测试环境缺陷。\n③**Claude Opus 5助攻破OpenAI内网**，72小时、不足3000$。\n④**OpenAI五年负现金流2780亿$**，3月融资预计2028年耗尽。\n⑤**V4.1 Flash以14.6T重登OpenRouter榜首**，前十中国厂商占八成。\n⑥**Kimi K3登Bedrock、智谱上线零数据留存**，出海改拼合规。", "launchCalendar": [{"d": "9/18", "brand": "美国加州北联邦法院", "evt": "四名付费订阅用户起诉Anthropic、OpenAI、SpaceXAI与谷歌「协同放缓AI」违反谢尔曼法，代理律师尼克·罗利称拟扩为全国集体诉讼"}, {"d": "9/18", "brand": "智谱", "evt": "上线GLM-5.3-FlashX：最高200 tokens/s、较Flash提速5倍、定价2.5倍，依托约10万张国产芯片推理集群、上线即被打满；年内第三次融资约50亿美元同日交割"}, {"d": "9/18", "brand": "阿里", "evt": "发布Qwen3.8-Omni-Flash原生全模态模型：1M token上下文，原生支持Function Calling/联网/深度思考，30项评测平均+26%，音频输入API价格降超98%"}, {"d": "9/18", "brand": "月之暗面", "evt": "Kimi K3（2.8万亿参数开源、原生视觉、100万token上下文）正式入驻Amazon Bedrock开放全球商用，为中国开源模型首入美国主流云平台原生服务列表"}, {"d": "9/18", "brand": "亚马逊云科技", "evt": "连发三大AI基建：AgentCore Runtime弹性内存（会话释放即回收、稳定冷启动、按实际内存计费）、HyperPod Inference Gateway（K8s原生GPU感知路由，TTFT最高降82%）、vLLM集成硬件解码"}, {"d": "9/18", "brand": "腾讯", "evt": "WorkBuddy上线全栈「应用生成」能力：自然语言描述即可生成带云数据库、文件存储、注册登录与AI调用的网站并一键发布"}, {"d": "9/18", "brand": "北京市", "evt": "经信局与发改委印发《加快词元经济发展的行动方案(2026—2028年)》：词元工厂分级评价标准、词元分发平台纳入新型基础设施布局等十条举措"}, {"d": "9/18", "brand": "阿里达摩院", "evt": "与浙大一院联合研发的通用医疗影像AI模型DAMO RADAR登上《Science》，一次识别146种病症/18个器官，近4万次真实检查AUC 0.913，次日Apache-2.0开源"}, "半导体芯闻/太平洋科技 9/21", "u": "https://m.10jqka.com.cn/20260920/c680096838.shtml"}, {"t": "设备零部件交期翻倍，**扩产周期被硬拉长到18个月**", "s": "核心观点：SEMI 9/17将2026年全球半导体设备销售上调至1659亿美元、同比+23.2%创新高，并明确零部件供应是交付核心瓶颈；韩国沉积设备零部件交期由4个月拉长至10个月，日本激光加工设备采购交期或达40个月。**产能扩张的约束点在零部件而非整机订单**。高层建议：2027年扩产与备货按更长交期倒排，关键零部件提前锁量。", "l": "SEMI/网易/财联社 9/17", "u": "https://www.163.com/dy/article/L71TDLLA05566QJK.html"}, {"t": "费半9/18涨2.78%，**资金在加息后仍选择存储链**", "s": "核心观点：9/18美股费城半导体指数尾盘拉升+2.78%，闪迪+10.99%、Coherent+7.19%、美光+3.92%、Arm+4.04%、阿斯麦+3.08%、博通+2.97%，高通逆势跌5.82%；韩国9月前10天出口同比+82.6%、其中半导体+270.1%。**加息落地后资金仍把存储当作确定性最高的方向**。高层建议：把存储链外部估值当作融资与采购议价的参照系。", "l": "太平洋科技/韩国关税厅 9/19-9/21", "u": "https://www.toutiao.com/a7687055858525635122"}, {"t": "涨价外溢到整机与被动元件，**Q4 PC再涨5%-20%**", "s": "核心观点：宏碁称记忆体与CPU少数规格仍吃紧，预估Q4终端PC持续涨价5%-20%、2027下半年才有机会反转；安森美通知10月10日起调价；村田、太阳诱电与三星电机对AI服务器高容MLCC涨价15%-35%，部分现货型号涨7-8倍、订单排至2027年二季度。**涨价已从芯片扩散到整机与被动元件**。高层建议：终端定价预留二次调价空间，被动元件按季度锁量。", "l": "太平洋科技/央视财经 9/20-9/21", "u": "https://m.10jqka.com.cn/20260920/c680096838.shtml"}, {"t": "中美9/24峰会临门，**AI芯片管制是本周最大变量**", "s": "核心观点：何立峰9/19-23赴美、9/20纽约磋商开场，9/24中美元首白宫会晤；同期美方指认六家中国AI企业大规模蒸馏、众议院中国委员会主席致函要求进一步收紧AI芯片对华出口。**管制议题在峰会前后最容易出现突发放宽或收紧**。高层建议：本周不做长周期采购与长约决策，等峰会结果落地后再定。", "l": "TechTimes/Newsquawk 9/19-9/21", "u": "https://techtimes.com/articles/327742/20260919/us-accuses-six-chinese-ai-firms-copying-models-bypassing-chip-controls.htm"}, {"t": "2nm安卓旗舰本周同台，**小米独占窗口只有四十天**", "s": "核心观点：骁龙峰会9/22-24发布2nm骁龙8 Elite Gen6双平台，SM8975主频破5GHz、Adreno 850、独占LPDDR6；小米18 Pro官宣9/23发布并首发，vivo X500 9/21首发天玑9600 Pro，iQOO 16定档9/29。**2nm安卓旗舰在四十多天内直接进入混战**。高层建议：2nm窗口期极短，渠道与营销资源须在发布前完成前置。", "l": "网易/什么值得买 9/19-9/21", "u": "https://www.163.com/dy/article/L79SU1CS05198NMR.html"}], "opinionLeaders": [{"name": "长鑫存储 CXMT", "role": "国产存储工艺", "items": [{"hl": "第五代DRAM平台G5量产，每片晶圆裸片产出较第四代提升至少50%", "detail": "9/20世界制造业大会宣布：四重曝光把有源区半间距微缩至11.95nm、存储电容深宽比45:1、核心功能区高度6762nm，并开发适配DRAM的高介电常数金属栅工艺；同步展出两款24Gb LPDDR5X(496Ball/245Ball)已进入规模量产。2026上半年营收1503.1亿元、毛利率84.84%、归母净利776.05亿元。", "l": 在总量刺激**。"], "implications": [{"h": "① 成本与定价：提前锁价锁量", "c": "存储/芯片「量缩价涨」未结束，集成电路进口均价 **+72.2%** 已开始向下游报表传导。建议 **2027H1 关键器件提前锁量锁价**，并把涨价因子前置进 Q4 新品定价模型，避免毛利被动侵蚀。"}, {"h": "② 产品与营销：押注 AI 终端", "c": "手机 / 平板 / PC 是内需唯一两位数增长且能提价的品类，8 月通讯器材类 **+27.3%**、连续 4 个月加速，**可穿戴智能设备与高能效等级家电零售额延续快速增长**。建议把 **AI 手机 / AI PC / 智能穿戴** 作为 2027 年产品与营销资源主战场，主打「AI 体验」而非参数。"}, {"h": "③ 渠道与生态：重估车 / 家电协同", "c": "汽车类社零 8 月 **-18.5%**（降幅再扩 1.5 个百分点），家电音像 **+2.3%** 在去年高基数上刚由负转正。建议**下调车机协同目标、暂缓汽车渠道资源加码**，家电按「结构性回暖」而非「全面复苏」配置；同时把主推资源继续向通讯器材（**+27.3%**）与全屋智能倾斜。"}, {"h": "④ 政策红利：对接「六张网」与两重清单", "c": "发改委推进算力网 + 新型电网 + 新一代通信网 **「2+3+N」** 协调机制，媒体披露算力网投资量级达 **4 万亿元**。终端与计算业务应对接重大项目清单，争取**政企与行业侧的算力/终端组合方案**落地。"}, {"h": "⑤ 供应链：警惕 2027 价格回落风险", "c": "集成电路 8 月出口额 **+129.8%** 但出口量 -7.9%，纯价格驱动。**高价备货需设置安全库存上限与跌价准备**，避免周期反转时形成呆滞库存。"}, {"h": "⑥ 出口：AI 硬件是当下最强 Beta", "c": "8 月计算机产品出口首破 **300 亿美元**、集成电路首破 **400 亿美元**，双双创历史新高。海外市场资源应优先配置到 **AI 终端与高附加值硬件**，借全球 AI 投资热潮放大出口弹性。"}], "gauge": [{"n": "外需 / 出口", "v": "高热", "s": "出口连续 4 个月两位数，机电出口创历史新高", "p": 88}, {"n": "AI 与电子产业链", "v": "高热", "s": "电子行业利润 +110%，集成电路 +18.5 倍", "p": 92}, {"n": "工业生产", "v": "中温", "s": "8 月 PMI 49.8% 回升，工业增加值 +5.2%（加快0.7pct）", "p": 56}, {"n": "内需消费", "v": "偏冷", "s": "社零仅 +0.4%，汽车 -18.5%，仅通讯器材 +27.3%", "p": 28}, {"n": "价格 / 成本", "v": "升温", "s": "PPI +3.8%、购进 +5.8%，芯片进口均价 +72.2%", "p": 78}, {"n": "货币金融", "v": "宽松", "s": "M2 7.5%、社融 7.2%，但对实体贷款降至 5.0%", "p": 58}]}, "headlineViewpoints": [{"tag": "战略定调", "t": "全国先进制造业大会定调「人工智能+制造」：**终端硬件是现代产业体系的骨干**", "s": "核心观点：9/16—17 全国先进制造业大会在京召开，传达习近平重要指示——**坚持智能化、绿色化、融合化**，提升产业链自主可控水平；李强要求以**新一代智能制造**为主攻方向，纵深开展「人工智能+制造」行动、夯实智能软硬件基础。<b class=\"hl-red\">「十五五」开局之年把先进制造业提到国家战略主干，终端硬件是政策与资本的双重交集。</b>高层建议：2027 年产品路线图对表「人工智能+制造」，把端侧 AI 能力作为立项硬门槛。", "l": "全国先进制造业大会", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081384.htm"}, {"tag": "量价分化", "t": "社零+0.4%而通讯器材+27.3%、IC出口量-7.9%：**这轮景气靠价格不靠量**", "s": "核心观点：8 月社零同比仅 **+0.4%**，1—8 月固投 **-7.2%**；但限额以上**通讯器材类 +27.3%**。价格端 PPI **+3.8%**，手机 / 平板 / 存储同比 **+11.0% / +21.5% / +19.6%**，集成电路出口量 **-7.9%**。<b class=\"hl-red\">量缩价涨叠加总量磨底：景气来自 AI 涨价再分配而非消费扩张。</b>高层建议：2026H2 定价由保份额切到保毛利，2027 年资源压向通讯器材与全屋智能。", "l": "国家统计局 / 海关总署", "u": "https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html"}, {"tag": "产业定位", "t": "电子信息制造业「十五五」规划落地、2030年营收30万亿：**国家把终端硬件锁定为工业第一支柱**", "s": "核心观点：9/15 工信部、发改委发布《电子信息制造业发展「十五五」规划》，2030 年规上企业营收突破 **30 万亿元**、研发投入强度 **3.5%**；8 月高技术制造业增加值 **+16.7%**、装备制造业 **+12.1%**。<b class=\"hl-red\">该行业营收已连续 13 年居 41 个工业大类首位，政策与资本将持续向这一赛道集中。</b>高层建议：2027 年产品组合按规划九大专栏对表，重点争取先进计算与消费电子创新两类专项。", "l": "工业和信息化部、国家发展改革委", "u": "https://www.gov.cn/lianbo/202609/content_7081208.htm"}, {"tag": "稳投资", "t": "8000亿准财政开闸、六张网五年26万亿：**稳投资主战场已从房地产换到算力与通信网**", "s": "核心观点：9/17 首批 **8000 亿元**新型政策性金融工具资金加快投放，规模较去年 **5000 亿元**扩容，测算撬动项目总投资约 **10 万亿元**；9/16 平陆运河建成通航，「六张网」五年投资约 **26 万亿元**。<b class=\"hl-red\">固投 -7.2% 而准财政与六张网逆势加码，稳投资主战场已换成算力网与通信网。</b>高层建议：2027 年政企与行业方案对接口径对准算力枢纽、源网荷储与新一代通信网三类项目。", "l": "国家发展改革委 / 政策性银行", "u": "https://jingji.cctv.cn/2026/09/17/ARTIvwgLQDw13pbCH99aZHoh260917.shtml"}, {"tag": "融资结构", "t": "股债融资占比50.31%首超贷款、央行淡化数量目标：**金融支持实体已从信贷切到资本市场**", "s": "核心观点：前 8 月债券与股票融资占社融增量 **50.31%**，首超贷款；9/16《求是》刊发潘功胜署名文章，明确**淡化对数量目标的关注**、把金融总量更多作为观测性参考性指标，更加注重价格型调控。<b class=\"hl-red\">贷款降速提质是新常态——信用扩张没减速，只是换了渠道。</b>高层建议：2027 年资金筹措由银行授信为主转向股权+债券组合，把供应商融资成本纳入整机成本模型。", "l": "中国人民银行", "u": "https://www.qstheory.cn/20260915/1c41fc49b4b44db4b2550ddd41f40315/c.html"}], "opinionLeaders": [{"name": "全国先进制造业大会", "role": "宏观经济与产业政策顶层部署", "items": [{"hl": "习近平就发展先进制造业作出重要指示：坚持智能化、绿色化、融合化方向，持续做大做强先进制造业，提升产业链自主可控水平，加快构建以先进制造业为骨干的现代化产业体系", "detail": "全国先进制造业大会 9 月 16—17 日在京召开，会上传达重要指示，李强出席并讲话、张国清作总结讲话。李强要求顺应新一轮科技革命和产业变革趋势，以新一代智能制造为主攻方向，发展策略上更加注重数智赋能、技术路线上更加注重高端自主、生产方式上更加注重绿色低碳、场景业态上更加注重跨界融合；聚焦重点领域综合施策，打造产业创新驱动引擎、加快新兴产业规模应用、加强未来产业前瞻布局、推动传统产业焕新升级，纵深开展「人工智能+制造」行动，加大对 企业 数智化转型引导支持力度、夯实智能软硬件基础，推动先进制造业和现代服务业深度融合、创新发展服务型制造。", "l": "全国先进制造业大会（9/16—17）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7081384.htm"}]}, {"name": "国家统计局", "role": "国民经济核算与价格、工业、贸易统计", "items": [{"hl": "《统计改革发展「十五五」规划》（9/16 印发）：缩短 CPI 基期轮换周期、将反映消费新业态新模式的商品和服务及时纳入 CPI 统计调查，优化 PPI 基期轮换并推进编制基于生产流阶段的 PPI", "detail": "全文 8 部分 44 条。与 2C 直接相关：加强全口径消费统计，健全服务消费统计、完善网上零售统计与消费新业态新模式统计监测；完善智能经济统计监测制度，强化对人工智能相关新兴领域的统计监测；实施数字经济和平台经济增加值核算制度并定期开展数据核算；加强工业战略性新兴产业统计、更新工业战略性新兴产业分类目录；完善投资领域统计，加强计算机软件和数据库投资统计调查；完善老龄事业和银发经济统计监测制度。目标是 2035 年基本建成与国家治理体系和治理能力现代化相适应的现代化统计调查体系。", "l": "《统计改革发展「十五五」规划》（9/16 14:10）", "u": "https://www.stats.gov.cn/xw/tjxw/tzgg/202609/t20260916_1965340.html"}, {"hl": "8 月规上工业增加值同比 +5.2%（比上月加快 0.7 个百分点）、环比 +0.54%，高技术制造业 +16.7%、装备制造业 +12.1%；1—8 月工业增加值 +5.3%", "detail": "8 月社零 39824 亿元、同比 +0.4%（环比 -0.13%），1—8 月 327569 亿元、+1.1%，其中除汽车以外消费品零售额 +2.7%；限额以上通讯器材类 8 月 +27.3%、1—8 月 +16.3%，家用电器和音像器材类 8 月 +2.3% 但 1—8 月 -5.6%，汽车类 8 月 -18.5%。1—8 月固投 293092 亿元、-7.2%，扣除房地产 -4.2%；房地产开发投资 -19.9%、新建商品房销售面积 -12.1%，而二手房交易网签面积 +10.6%；高技术产业投资 +5.2%（信息服务 +22.7%、电子及通信设备制造 +6.9%）。8 月进出口 46455 亿元、+19.8%（出口 +18.6%、进口 +21.7%）。城镇调查失业率 5.3%。锂离子电池、工业机器人、3D 打印设备产量分别 +57.2%、+34.6%、+29.9%。", "l": "8 月份国民经济运行情况（9/15 10:00）", "u": "https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html"}, {"hl": "8 月 CPI 环比 +0.4%、同比 +0.8%（涨幅扩大 0.3pct），核心 CPI 同比 +1.0%；PPI 环比 +0.4%、同比 +3.8%", "detail": "CPI 端：汽油价格同比 +9.3%（涨幅扩大 8.3pct）拉动能源涨幅由 0.6% 扩至 4.1%；受算力需求快速增长影响，移动电话机、平板电脑、数据存储设备价格环比分别 +2.3%、+2.1%、+2.1%，同比分别 +11.0%、+21.5%、+19.6%（计算机）。PPI 端：煤炭开采 +26.6%、有色冶炼 +20.8%，计算机通信和其他电子设备制造业 +5.3%；汽车制造业位列价格下拉前六。", "l": "2026 年 8 月份 CPI / PPI 数据解读（9/09）", "u": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260909_1965261.html"}]}, {"name": "中国人民银行", "role": "货币政策与金融统计", "items": [{"hl": "9 月 17 日以固定利率、数量招标方式开展 1620 亿元 7 天期逆回购操作，操作利率 1.40%，全额满足一级交易商需求；同日开展 6000 亿元隔夜逆回购，公开市场实现净投放 1590 亿元", "detail": "当日 DR001 与 R001 加权利率分别上行 2.3BP、3.2BP 至 1.4728%、1.4877%，隔夜与 7 天品种利率倒挂；隔夜 Shibor 涨 1.8BP 报 1.4600%、7 天 Shibor 涨 1.8BP 报 1.4500%，跨季资金需求升温。8 月新发放企业贷款加权平均利率略低于 3%、个人住房贷款约 3.1%，均处历史低位。9 月 22 日将公布 9 月 LPR 报价。", "l": "公开市场业务交易公告（9/17）", "u": "http://www.pbc.gov.cn/"}, {"hl": "9 月 16 日《求是》第 18 期刊发潘功胜署名文章《深刻认识中国金融结构变迁 提升金融服务实体经济适配性》：持续优化货币政策中间变量，淡化对数量目标的关注、特别是对贷款单一渠道的关注，把金融总量更多作为观测性、参考性、预期性指标", "detail": "文章用四组数据刻画结构变化：2025 年社融增量 35.6 万亿元中企业债券、政府债券与股票融资合计占比约 47%，首次超过贷款；2026 年 6 月末社融存量中间接融资余额占比降至 2/3 左右、直接融资升至 1/3 左右、债券融资约 30%；近 10 年房地产与基建新增贷款占比由 60% 以上降至 10% 左右，金融「五篇大文章」领域新增贷款占比升至 70% 以上；A 股上市公司超 5500 家、总市值超 110 万亿元，债市总规模突破 200 万亿元、科创债券累计发行约 3 万亿元。判断货币化进程已基本结束、贷款降速提质或将成为宏观运行的新常态之一，金融总量增速趋缓有利于保持宏观杠杆率基本稳定。配套印发《中国人民银行「十五五」改革发展规划》及 9 份行动方案。", "l": "《求是》2026 年第 18 期潘功胜署名文章（9/16）", "u": "https://www.qstheory.cn/20260915/1c41fc49b4b44db4b2550ddd41f40315/c.html"}, {"hl": "8 月末 M2 余额 356.81 万亿元、同比 +7.5%，M1 +4.1%；社融存量 464.8 万亿元、同比 +7.2%，均高于名义 GDP 增速", "detail": "8 月社融增量 1.66 万亿元、人民币贷款仅增 600 亿元；前 8 月社融增量累计 23.91 万亿元、同比少 2.64 万亿元，人民币贷款增加 10.44 万亿元。前 8 月债券与股票融资占社融增量 50.31%，明显超过贷款占比、较五年前同期高近 20pct；8 月新发放企业贷款加权平均利率略低于 3%、个人住房贷款约 3.1%，均处历史低位；前 8 月住户贷款减少 1.03 万亿元，8 月住户贷款减少 2029 亿元、连续两个月减少。", "l": "2026 年 8 月金融统计数据报告（9/14）", "u": "http://www.pbc.gov.cn/"}]}, {"name": "国家发展改革委", "role": "宏观调控、投资与产业协调", "items": [{"hl": "联合市场监管总局印发《关于重要工业品低价无序竞争成本核算有关事项的通知》（发改价格〔2026〕1303 号）：明确成本核算的主体、内容和方式，为治理低价无序竞争提供可操作的「成本标尺」", "detail": "核算主体：两部门必要时组织开展成本调查核算经营者成本，省级部门在国家统一指导下开展，行业协会可测算行业平均成本，经营者可核算自身个别成本。核算内容：原则上以经营者生产特定产品的个别成本为基础，无法核算个别成本时参考行业平均成本并考虑一定下浮幅度。核算方式：以经审计或手续齐备的账载资料为基础，成本费用与销售价格涵盖内容相匹配，并考虑产能利用率影响；行业平均成本可采取普查或抽样方式，区域差异大的行业分区域测算。落实安排为加强市场监测、加强行业自律（探索制定成本核算团体标准）、加强监管执法三方面，目标是推动行业从「拼价格」转向「拼质量、拼创新」。", "l": "《关于重要工业品低价无序竞争成本核算有关事项的通知》（9/17 答记者问）", "u": "https://www.ndrc.gov.cn/"}, {"hl": "8000 亿元新型政策性金融工具首批资金加快投放，规模由上年 5000 亿元扩容至 8000 亿元，据测算预计撬动项目总投资规模约 10 万亿元", "detail": "由国家开发银行、农业发展银行、进出口银行负责投放，用于补充重点项目资本金。首批项目已在浙江、云南、四川、湖北、山东等地落地，覆盖智能悬架产业化、抽水蓄能、动力电池基地、都市圈高速、核电与储能等。投向由上年的传统基建拓宽至「六张网」（水网、新型电网、算力网、新一代通信网、城市地下管网、物流网）、数字经济、人工智能、低空经济、商业航天、新能源新材料、新型工业化、城市更新与交通物流六大方向；明确加大对民间投资项目支持力度，符合条件的民营企业可享年化 1.5%、期限不超过 2 年的财政贴息。国家发展改革委同时调度 109 项重大工程建设进展，推动一批新项目尽早开工。", "l": "新型政策性金融工具投放进展（9/17）", "u": "https://jingji.cctv.cn/2026/09/17/ARTIvwgLQDw13pbCH99aZHoh260917.shtml"}, {"hl": "「六张网」建设进入项目储备与审批加速期：9/16 西部陆海新通道骨干工程平陆运河建成通航，全长 134.2 公里、按内河Ⅰ级航道建设、可通航 5000 吨级船舶，丁薛祥出席通航仪式", "detail": "平陆运河总投资约 727 亿元、历经 4 年建设；西南地区货物出海较绕道广州港缩短内河航程 560 公里以上，综合物流成本预计下降 18%—30%，每年可节约全社会运输费用超 50 亿元。国家统计局数据显示，前 8 个月与「六张网」相关的互联网和相关服务业投资同比增长 42%，航空运输业、水上运输业投资分别增长 16.7% 和 14.7%，电力供应业投资增长 12.7%；截至 6 月末已围绕算力枢纽建成 70 余条算力大通道。市场机构测算「十五五」期间「六张网」投资规模约 26 万亿元，较「十四五」增长 41%。", "l": "「六张网」重大项目建设进展（9/16）", "u": "https://www.news.cn/photo/20260916/79a59bf5fe05446daeeb1c0808f6b410/c.html"}]}, {"name": "海关总署", "role": "进出口贸易统计", "items": [{"hl": "8 月进出口 4.65 万亿元、同比 +19.8%，连续 3 个月超 4.5 万亿", "detail": "集成电路出口 407.3 亿美元 / +129.8%（首破 400 亿美元）、自动数据处理设备 304 亿美元 / +76.5%（首破 300 亿美元），双双创历史新高；高新技术产品出口占出口总额 29.0%。", "l": "2026 年 8 月进出口数据（9/08）", "u": "http://www.customs.gov.cn/"}]}, {"name": "工业和信息化部", "role": "电子信息制造业运行", "items": [{"hl": "落实全国先进制造业大会部署：牢牢锚定基本实现新型工业化目标，推进科技创新和产业创新深度融合，实施产业基础再造和重大技术装备攻关工程，推进制造业重点产业链高质量发展", "detail": "工业和信息化部规划司司长姚珺在大会现场表示，「十五五」开局起步的关键时刻召开全国先进制造业大会意义重大，将推进科技创新和产业创新深度融合，持续做大做强先进制造业。国家发展改革委产业发展司副司长邵稷表示，将扎实推动重点产业提质升级，培育壮大新兴产业和未来产业，组织实施重大技术装备攻关，强化能源资源供应保障。国务院国资委规划发展局副局长尚鹏表示，将指导中央企业聚焦先进制造业方向优化布局结构、提升原始创新能力。此前辛国斌在部分省份工业经济运行座谈会上已要求抓紧推进「十五五」规划重大项目落地实施。", "l": "全国先进制造业大会部门落实表态（9/17）", "u": "https://politics.people.com.cn/n1/2026/0918/c461001-40800738.html"}, {"hl": "《电子信息制造业发展「十五五」规划》（工信部联规〔2026〕216 号）：2030 年规模以上企业营业收入突破 30 万亿元、研发投入强度达到 3.5%", "detail": "与发改委联合印发，围绕「筑基、提质、育新、治理」部署 17 项重点任务、9 个专栏。筑牢产业基础：推动集成电路全链条攻关，发展高性能处理器、高密度存储器等高端芯片，提升先进封装测试能力。增强整机与系统竞争力：构筑先进计算生态体系（存算一体、量子计算、光计算、类脑计算、太空计算），加快消费电子创新发展——推动手机、个人计算机、视听电子、虚拟现实、可穿戴设备、服务类新型终端智能化融合化升级，推进消费电子适老化改造。培育新增长点：巩固能源电子优势，推进固态电池、钠电池、液流电池、燃料电池产业化。消费电子专栏分设高端手机、个人计算机、视听电子、虚拟现实、可穿戴设备、服务类新型终端六大方向。", "l": "《电子信息制造业发展「十五五」规划》（9/15 对外发布）", "u": "https://www.gov.cn/lianbo/202609/content_7081208.htm"}, {"hl": "召开部分省份工业经济运行座谈会：把促进工业经济平稳运行摆在更加重要位置，加力挖掘内需潜力、加快推动人工智能产业发展和赋能应用", "detail": "辛国斌主持，河北、江苏、浙江、安徽、福建、山东、河南、湖北、湖南、广东、四川等 11 省工信主管部门参会，分析研判工业经济形势、研究谋划 2027 年经济工作思路。要求抓紧推进「十五五」规划重大项目落地实施，持续巩固提升工业品国际市场竞争力；强化供需平衡、加力推进大中小企业融通发展；加强产能治理，坚持因地制宜、突出差异化发展。", "l": "部分省份工业经济运行座谈会（9/14）", "u": "https://www.miit.gov.cn/jgsj/yxj/gzdt/art/2026/art_3c82ff9dd6fe423c8ea61083cea55685.html"}, {"hl": "《「人工智能+软件」专项行动实施方案》：2028 年推广覆盖 2 万家规上软件企业、打造 100 个智能体软件标杆应用", "detail": "工信部信发〔2026〕209 号。到 2030 年关键软件全面实现智能化升级，智能编程、智能体软件及智能服务成为产业新增长极。六方面部署：优化智能编程工具链条、推进软件企业智能化技改、加快基础与工业软件智能化升级、培育智能体软件新业态、拓展智能软件服务、夯实智能化发展基础；建设智能体软件应用商店与技能包资源库，鼓励地方用「算力券」按比例支持采购自主编程工具与自主大模型编程服务。2025 年软件业营收 15.48 万亿元，日均词元调用量已突破 500 万亿。", "l": "《「人工智能+软件」专项行动实施方案》（9/11 发布）", "u": "https://www.gov.cn/lianbo/202609/content_7080767.htm"}]}, {"name": "国务院办公厅", "role": "政策综合协调与督查落实", "items": [{"hl": "国新办政策例行吹风会五部门联合解读：明确「付款四项关键要素」，引导龙头企业率先践行「60 日付现承诺」", "detail": "工信部副部长柯吉欣：多数行业暂未出台专门结算支付规则，部分大型企业通过模糊账期起算节点、拖延验收结算、滥用商业汇票与应收账款电子凭证故意拉长账期；四项要素为账期起算节点、账款支付方式及流程、检验验收（或竣工结算）标准及期限、最长付款期限，将纳入合同示范文本。央行金融市场司司长曹媛媛：对压降账款与账期明显的企业在债券发行方面给予便利。国资委裴仁佺：推动央企带头不违约拖欠、带头少开票多付现，把对中小企业现金支付作为「硬杠杠」。市场监管总局周卫军：部署 2026 年反不正当竞争执法专项行动，已赴部分龙头汽车企业调研敦促。", "l": "国新办国务院政策例行吹风会（9/14）", "u": "https://www.gov.cn/zhengce/202609/content_7081057.htm"}, {"hl": "印发《关于加强中小企业回款难问题治理有关工作的通知》，发布大型企业及时支付倡议，引导 60 日内以现金向中小企业付款", "detail": "四方面部署：健全行业账款支付规则（明确账期起算节点、最长付款期限）；加强大型企业支付行为监管（建立账款监测机制、多部门联合约谈、上市公司须披露平均账期）；规范非现金支付工具（电子凭证最长付款期限压减至 6 个月，经营数据接入上海票据交易所）；强化资金传导（政府采购全额现金支付，支持大型企业融资置换应付账款）。", "l": "《关于加强中小企业回款难问题治理有关工作的通知》（9/10）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080631.htm"}]}, {"name": "商务部", "role": "消费促进与内需政策", "items": [{"hl": "9 月 17 日例行新闻发布会介绍《促进智能家居消费行动方案》：围绕「供需适配、互联互通、银发友好、便民到家」四方面发力，推动「单品智能」迈向「全屋智能」", "detail": "发布会明确支持方言识别、简化老年人操作，培育全屋智能消费场景。同场回应中美经贸团队正就相互降低关税安排保持密切交流，后续将适时发布进展。前三季度数据：前 7 个月境外人员在华消费 2636 亿元、同比增长 27.8%，办理离境退税的境外旅客数量同比增长 3 倍以上。2026 年以旧换新已覆盖 6 类家电与 4 类数码智能产品，补贴为售价 15%（家电每件≤1500 元、数码智能≤500 元）。", "l": "商务部例行新闻发布会（9/17）", "u": "http://www.mofcom.gov.cn/"}, {"hl": "《促进智能家居消费行动方案》（商消费发〔2026〕148 号）七条举措：支持地方自主确定智能家居补贴品类与标准，统筹支持全屋智能家居购新", "detail": "商务部、发改委、工信部、民政部、财政部、自然资源部、住建部、市场监管总局八部门联合印发。扩大优质供给：加快打造一批基于国内开源操作系统的智能家居软硬件产品与一体化解决方案；完善标准体系：加快制定实施智能家居互联互通等强制性国家标准，推动家庭宽带设备默认开启 IPv6， function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function redify(s){
  var t = String(s==null?'':s);
  /* 数据中历史写入的 <b class="hl-red">…</b> 先归一化为 **…**，
     否则经 esc() 转义后会在页面上显示成可见的标签文本（程序符号） */
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>([\s\S]*?)<\/b\s*>/gi, '**$2**');
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>/gi, '');
  t = t.replace(/<\/b\s*>/gi, '');
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>');
}

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return redify(t||'');
  return '<div class="summary-lines">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}

function drawMkt(key){
  const d = cur.marketData[key][mktGC];

    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },

    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);
    else if(card.type==='brandtable') drawBrandTable(id, card);
  });
}
function drawLine(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis'}, legend:{bottom:0,type:'scroll'}, grid:{left:55,right:30,top:46,bottom:54}, xAxis:{type:'category',data:card.months,axisLabel:{fontSize:11}}, yAxis:{type:'value',name:card.unit||''}, series:card.series.map(s=>({name:s.name,type:'line',data:s.data,smooth:true,symbolSize:6,lineStyle:{width:2.4},itemStyle:{color:s.color||'#2563eb'}})) }, true);
}
function drawBar(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  const items = card.items||[];
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, grid:{left:90,right:30,top:46,bottom:30}, xAxis:{type:'value',name:card.unit||''}, yAxis:{type:'category',data:items.map(i=>i.label).reverse(),axisLabel:{fontSize:11}}, series:[{type:'bar',data:items.slice().reverse().map(i=>({value:i.value,itemStyle:{color:i.color||'#2563eb',borderRadius:[0,4,4,0]}})), label:{show:true,position:'right',fontSize:11,formatter:'{c}'}}] }, true);
}
function drawPie(id, card){

}
function drawTable(id, card){
  el(id).innerHTML = '<tr>'+card.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+(card.rows||[]).map(r=>'<tr>'+r.map((x,i)=>{ const cls=(card.cls&&card.cls[i])?(' class="'+card.cls[i]+'"'):''; return '<td'+cls+'>'+esc(x)+'</td>'; }).join('')+'</tr>').join('');

    tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},

function drawBrandTable(id, card){

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
    series:s1
  });
  // 九·2 当年累计（各品牌 + 五界/三境/一塔汇总）
  var g = H.group_ytd || {};
  var extra = [];
  ['智界','享界','尊界','尚界'].forEach(function(b){ if(H.ytd && H.ytd[b]!=null) extra.push([b, H.ytd[b]]); });
  var x2 = bn.concat(extra.map(function(e){return e[0];})).concat(['五界汇总','三境汇总','一塔汇总']);
  var y2 = bn.map(function(b){return H.ytd[b]||0;}).concat(extra.map(function(e){return e[1];})).concat([g['五界']||0, g['三境']||0, g['一塔']||0]);
  var groupColors = {'五界汇总':'#111827','三境汇总':'#ea580c','一塔汇总':'#0d9488'};
  var y2data = y2.map(function(v,i){
    var c = (i < bn.length+extra.length) ? pal[i % pal.length] : groupColors[x2[i]];
    return {value:v, itemStyle:{color:c}};
  });
  abMk('ab_c_hima_ytd', {
    tooltip:{trigger:'axis'}, grid:{left:72,right:30,top:30,bottom:56},
    xAxis:{type:'category',data:x2,axisLabel:{interval:0,rotate:30,fontSize:11}},
    yAxis:{type:'value',name:'2026YTD(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
    series:[{type:'bar',data:y2data, label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(1)+'万';}}}]
  });
}

function mcKpis(list){
  if(!list||!list.length) return '';
  return '<div class="kpi-row">'+list.map(function(i){
    const cls = i.tone==='up'?'up':(i.tone==='down'?'down':'');
    return '<div class="kpi"><div class="kv">'+esc(i.v)+'</div><div class="kl">'+esc(i.k)+'</div>'+(i.d?'<div class="ky '+cls+'">'+esc(i.d)+'</div>':'')+'</div>';
  }).join('')+'</div>';
}
function mcPoints(list){
  if(!list||!list.length) return '';
  return '<ul class="mc-pts">'+list.map(function(p){
    return '<li><span class="mc-tag mc-t'+esc(p.tone||'b')+'">'+esc(p.tag||'')+'</span>'+redify(p.html||'')+'</li>';
  }).join('')+'</ul>';
}
function mcChartsHtml(list){
  if(!list||!list.length) return '';
  list.forEach(function(cc){ MC_CHART_MAP[cc.id]=cc; });
  return '<div class="mc-grid2">'+list.map(function(cc){
    return '<div class="mc-chartcard"><div class="mc-ct">'+esc(cc.title)+'</div><div class="mc-cs">'+esc(cc.note||'')+'</div>'+
      '<div class="mc-chart" id="'+cc.id+'"></div></div>';
  }).join('')+'</div>';
}
function mcSection(sec){
  if(!sec) return '';
  let h='';
  if(sec.kpis) h += mcKpis(sec.kpis);
  if(sec.charts) h += mcChartsHtml(sec.charts);
  if(sec.points) h += mcPoints(sec.points);
  return h;
}
function mcVerdict(t){
  return t? '<div class="vp-summary"><b>核心判断</b><br>'+redify(t)+'</div>' : '';
}

/* ---------------- 宏观图表绘制 ---------------- */
function macDraw(){
  if(curCat!=='macro' || !window.echarts) return;
  document.querySelectorAll('.mc-chart').forEach(function(box){
    if(!box.id) return;
    const cfg = MC_CHART_MAP[box.id]; if(!cfg) return;
    if(charts[box.id]){ try{charts[box.id].dispose();}catch(e){} }
    charts[box.id] = echarts.init(box);
    charts[box.id].setOption(mcOpt(cfg), true);
  });
}
function drawMacroCharts(){ macDraw(); }
function mcOpt(cfg){
  const AX = {color:'#6b7280', fontSize:11};
  if(cfg.type==='line'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), bottom:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:52,bottom:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',min:(cfg.min==null?null:cfg.min),max:(cfg.max==null?null:cfg.max),axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'line',data:s.data,smooth:0.28,symbol:'circle',symbolSize:5,connectNulls:true,
          lineStyle:{width:2.4,color:s.color},itemStyle:{color:s.color},
          markLine:s.markLine?{silent:true,symbol:'none',lineStyle:{color:'#cbd5e1',type:'dashed',width:1.2},
            label:{formatter:s.markLine,position:'insideEndTop',color:'#6b7280',fontSize:10},data:[{yAxis:s.markVal}]}:null};
      }) };
  }
  if(cfg.type==='hbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:20,right:52,top:46,bottom:20,containLabel:true},
      xAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      yAxis:{type:'category',data:cfg.y,axisLabel:Object.assign({width:cfg.yw||150,overflow:'truncate'},AX)},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',barMaxWidth:15,
          data:s.data.map(function(v,i){ return {value:v, itemStyle:{color:(s.colors&&s.colors[i])||s.color||'#2563eb', borderRadius:[0,3,3,0]}}; }),
          label:{show:true,fontSize:10.5,color:'#6b7280',formatter:function(p){return (p.value>0?'+':'')+p.value+'%';}},
          labelLayout:function(p){ var pos=p.value>=0; return {x:p.rect.x+(pos?p.rect.width+6:-6),y:p.rect.y+p.rect.height/2,verticalAlign:'middle',align:pos?'left':'right'}; }};
      }) };
  }
  if(cfg.type==='vbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:46,bottom:cfg.rotate?82:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,rotate:cfg.rotate||0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',data:s.data,barMaxWidth:s.barMaxWidth||26,
          itemStyle:{color:s.color||'#2563eb',borderRadius:[3,3,0,0]},
          label:{show:true,position:'top',fontSize:10.5,color:'#6b7280',
            formatter:function(p){return p.value==null?'':(p.value>0?'+':'')+p.value+'%';}}};
      }) };
  }
  if(cfg.type==='combo'){
    return { tooltip:{trigger:'axis'},
      legend:{data:[cfg.bar.name,cfg.line.name], top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:58,top:46,bottom:cfg.rotate?74:44,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,lineHeight:13,fontSize:10.5},AX)},
      yAxis:[{type:'value',name:cfg.yBar||'',axisLabel:AX},{type:'value',name:cfg.yLine||'',splitLine:{show:false},axisLabel:AX}],
      series:[
        {name:cfg.bar.name,type:'bar',data:cfg.bar.data,barMaxWidth:30,
         itemStyle:{color:cfg.bar.color||'#2563eb',borderRadius:[3,3,0,0]},
         label:{show:true,position:'top',fontSize:10,color:'#6b7280',formatter:'{c}'}},
        {name:cfg.line.name,type:'line',yAxisIndex:1,data:cfg.line.data,smooth:0.2,symbol:'circle',symbolSize:8,
         lineStyle:{width:2.4,color:cfg.line.color||'#dc2626'},itemStyle:{color:cfg.line.color||'#dc2626'}}
      ]};
  }
  return {};
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  /* 事件委托：tabnav 的 innerHTML 会随一级板块重写，逐个绑定会导致切换后监听失效 */
  const nav = el('tabnav');
  nav.addEventListener('click', function(ev){
    const t = ev.target && ev.target.closest ? ev.target.closest('.tab-item') : null;
    if(!t) return;
    nav.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id = t.dataset.tab;
    curTab = id;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    renderMacroBrief();
    setTimeout(()=>{
      for(const k in charts){ try{ charts[k].resize(); }catch(e){} }
      if(id==='t4'){
        if(cur===DATA.auto) drawAutoBoardCharts();
        if(curCat==='macro') drawMacroCharts();
      }
    },60);
  });
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
