<script>const DATA = {"terminal": {"updateTime": "2026-09-17 06:00", "headlineViewpoints": [{"t": "**存储成本占BOM逼近一半**，整机定价体系已被上游重构", "s": "核心观点：9/16多方测算显示存储**占整机BOM比重已从去年约10%升至近50%**，12GB+256GB存储套片采购价由约500元涨至2200元；华为、小米、荣耀9月起对在售老机型集中调价。高层建议：**把存储保供与锁价纳入产品立项前置条件**，定价从成本加成转向价值定价。", "l": "今日头条 / 聊透数码圈", "u": "https://www.toutiao.com/article/7685988497718542884/"}, {"t": "**老机型反向涨价**，量价背离下换机需求被系统性推迟", "s": "核心观点：9/16劳动报调查显示华为Mate 80标准版全系+800元、Pro与Pro Max各版本+1000元，小米17系列一个月两次调价、起售价累计涨600至1000元，荣耀Magic8与Power2同步上调。高层建议：**老机型涨价是在为新品让出价格带**，需提前锁定渠道库存与以旧换新补贴。", "l": "劳动报 / 网易科技", "u": "https://www.163.com/dy/article/L6VOBIDI05568W0A.html"}, {"t": "**全球首款AI智能体手机量产商用**，竞争变量从形态转向办事能力", "s": "核心观点：9/16努比亚NaviX Ultra发布，12GB+512GB售5999元、国补后5499元起，配实体AI键与系统级跨应用执行，中兴称其由工程样机迈入规模化量产。高层建议：**端侧智能体已成可量产卖点而非概念**，小艺需尽快给出可量化的任务完成率指标。", "l": "证券时报", "u": "https://www.stcn.com/article/detail/4187834.html"}, {"t": "**鸿蒙7装机逼近8700万台**，华为开始把完整体验按硬件分层", "s": "核心观点：鸿蒙7发布24小时升级破500万、累计装机逼近8700万台；官网粒子动效支持清单把Mate 60、Pura 70、Mate X5与初代Mate XT标为暂不支持，Mate 70与Pura 90需升级到指定版本。高层建议：**明确公示老机型功能差异清单**，避免升级预期落差反噬口碑。", "l": "搜狐科技", "u": "https://www.sohu.com/a/1077020545_122066678"}, {"t": "**小米18 Pro真机公开**，背屏从装饰件升级为AI交互入口", "s": "核心观点：9/16卢伟冰首次公开展示小米18 Pro，背屏升级“百变背屏”、支持AI生成应用卡，侧边新增AI实体键，双2亿像素与7000mAh以上电池，背屏日调用超400万次。高层建议：**背屏已跑通用户习惯**，需评估副屏形态的投入产出比。", "l": "驱动中国 / 今日头条", "u": "https://www.toutiao.com/article/7685566251845812779"}, {"t": "**ColorOS 17统一三品牌底层**，国产OS竞争转入体验一致性", "s": "核心观点：9/17 OPPO在珠海举办ColorOS 17发布暨开发者大会，融合底层代码实现OPPO、一加、realme三品牌体验统一，覆盖超130款机型，Find X10系列首发搭载。高层建议：**鸿蒙需以生态规模对冲安卓阵营系统体验的收敛**。", "l": "腾讯新闻", "u": "https://new.qq.com/rain/a/20260915A0005S00"}, {"t": "**Mate X8将同台Mate 90发布**，折叠屏首次与直板旗舰同芯起跑", "s": "核心观点：多方信息显示9/23华为Mate 90系列与大折叠Mate X8同台发布，麒麟9050 Pro从近两万元三折叠下放到万元档大折叠，折叠屏“性能矮一截”的长期短板被补齐。高层建议：**折叠与直板共用旗舰SoC应成为产品组合标准动作**。", "l": "潮数码 / 今日头条", "u": "https://www.toutiao.com/article/7685998310141788722/"}, {"t": "**六大旗舰十天内对撞**，九月下旬成高端份额决定性窗口", "s": "核心观点：vivo X500 9/21、OPPO Find X10 9/22、华为Mate 90 9/23、荣耀Magic9 9/28、iQOO 16 9/29密集发布，2nm芯片、2亿像素长焦与8000mAh电池成为标配。高层建议：**首销备货与渠道主推资源需提前两周锁定**。", "l": "玩尽新机 / 网易科技", "u": "https://dy.163.com/article/L706D2CP055284IJ.html"}, {"t": "**中国手机连续第五季下滑**，华为与苹果逆势双增成唯一两极", "s": "核心观点：IDC数据显示Q2中国出货6601万台、同比-4.3%并连续第五个季度走低，同期华为+19.4%、苹果+24.4%为仅有的两家正增长，OPPO、vivo、小米均下滑。高层建议：**存量市场只做高价值机型**，把资源从走量机收拢到4000元以上价位。", "l": "财经头条 / 新浪", "u": "https://t.cj.sina.com.cn/articles/view/7879776882/1d5abda7206801nmc2"}, {"t": "**AI眼镜进入价格战**，品类扩张与均价下行同时发生", "s": "核心观点：洛图数据显示7月京东、天猫、抖音智能眼镜零售量7.4万台同比-15.3%、零售额1.3亿元同比-25.8%，均价持续下探；Omdia预计2026年全球AI眼镜出货突破1500万台。高层建议：**眼镜品类宜以生态绑定切入**，避免陷入硬件价格战。", "l": "什么值得买 / 洛图科技", "u": "https://post.m.smzdm.com/p/ak8k2r98"}], "opinionLeaders": [{"name": "余承东", "role": "华为常务董事、终端BG董事长", "items": [{"hl": "9/16 华为终端披露鸿蒙7发布24小时升级破500万、累计装机逼近8700万台，年底破亿基本无悬念", "detail": "超50款设备进入公测，Mate 80、Mate 70、Mate X7、Mate X6、Pura 90、Pura 80、nova 16等系列推进；Mate 60、Mate X5、Pura 70与部分nova机型计划10月进入花粉Beta，但粒子动效一栏标注暂不支持。"}, {"hl": "9/12至9/15 Mate XT 2非凡大师三轮开售仍秒罄，三折叠全球累计发货已突破100万台", "detail": "19999元起四版本全渠道几分钟售罄，9/15 10:08第三轮开售、下单成功发货时间为11月1日至15日；京东第三方16GB+1TB锦紫版报价26999至28999元，二手溢价约3000元。G型展翼三折叠展开10.2英寸3K、机身3.5mm，首发麒麟9050 Pro整机性能+42%。", "l": "证券日报 / 中国经济网", "u": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260915_3213083.shtml"}]}, {"name": "雷军", "role": "小米董事长兼CEO", "items": [{"hl": "9/10小米18 Fold开售喊出物超所值，首销同比+310%、首日销量约3.6万台", "detail": "第三方博主RD观测首日销量约3.6万台（10999元起），远超荣耀Magic V6首销三天3.46万台；首发玄戒O3（10核全大核、GeekBench6多核15221分、较前代+60%）+长鑫LPDDR6双国产。雷军称这是小米迄今最高端的手机，定价不便宜但绝对物超所值。", "l": "17173 / 今日头条", "u": "https://news.17173.com/content/09132026/020604795.shtml"}]}, {"name": "卢伟冰", "role": "小米集团总裁", "items": [{"hl": "9/16 首次公开展示小米18 Pro真机：背屏升级“百变背屏”，支持AI生成应用卡", "detail": "官方演示煮蛋计时、喝水打卡、专注模式、背单词与随机抽签等轻量工具；侧边新增一颗实体按键，背屏卡片日调用超400万次、壁纸日新增超350万次，小米在背屏领域累计投入近10亿元研发。"}]}, {"name": "郭明錤", "role": "天风国际证券分析师", "items": [{"hl": "预判iPhone Duo第三季组装出货仅50万至100万部，等待4至6周、二手溢价可达官方售价50%至100%", "detail": "日经亚洲引述供应链消息称iPhone Duo截至8月日产量仅数百部，折叠结构生产难度大；截至9/13京东旗舰店预约已超80万人，全网预约破120万，黄牛现货加价2.4万元、代抢最高叫价9.9万元。供给端的稀缺性是溢价的唯一来源。", "l": "联合早报 / 今日头条", "u": "https://www.toutiao.com/article/7685049152333513250/"}]}, {"name": "孙燕飙", "role": "手机中国联盟秘书长", "items": [{"hl": "9/16 判断老机型反向涨价是存储成本压力下的被动选择，“等等党”换机策略失效", "detail": "华为Mate 80全系涨800至1000元、小米17系列一个月两次调价累计涨600至1000元、荣耀Magic8与Power2同步上调；行业呈现鲜明量价背离，涨价的终端传导尚未见顶。"}]}, {"name": "马克·古尔曼", "role": "彭博社首席记者", "items": [{"hl": "9/10苹果发布会前再报折叠iPhone目前日产量仅数百台、品控严苛致产能爬坡缓慢", "detail": "iPhone Duo铰链良率约65%、初期日产量仅数百台，国行延后至国庆后。9/4苹果收跌2.51%报319.97美元，单日市值蒸发1203亿美元（约8074亿元人民币）。", "l": "彭博社 / 新浪财经", "u": "https://finance.sina.cn/tech/2026-09-04/detail-2.html"}]}], "leadersSummary": "①**余承东锁定9/23双旗舰同台**：Mate 90五款齐发且入网标注5G，Mate X8同台发布、麒麟9050 Pro下放万元大折叠\n②**卢伟冰9/16公开小米18 Pro真机**：百变背屏支持AI生成应用卡、侧边新增AI实体键，背屏日调用超400万次\n③**孙燕飙判断老机型反向涨价是被动选择**：存储成本压力下“等等党”策略失效，行业正式进入量价背离阶段", "institutionViews": [{"name": "Counterpoint", "items": [{"t": "Q2智能手机内存价格环比涨超80%，DRAM首超SoC成旗舰最贵单一器件；2026年以来全球在售手机均价涨约15%", "s": "分价格段看：低端机（批发价低于200美元）BOM同比增70%、几乎全部由存储驱动；中端机（400至600美元）BOM增52%、内存已占总成本40%；旗舰（800美元以上）BOM增近50%。2026年以来全球在售智能手机平均零售价上涨约15%、中国市场涨幅约10%，涨价主要集中在上市新机型；8月国内移动电话机价格同比上涨11.0%。价格越低的机型受涨价挤压越重，往高端走才有消化成本的空间。", "l": "Counterpoint Research / 中国经济网", "u": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260914_3210932.shtml"}, {"t": "2026年迄今全球智能手机零售价平均上涨约15%，中国市场涨幅约10%，新上市机型较去年同期高约25%", "s": "国家统计局数据8月移动电话机价格同比上涨11.0%，涨价主要集中在上市新机型；苹果中国官网已同步上调iPhone 17等四款在售机型售价，iPhone 17起售价涨至6799元、较发布价上调800元。消费者普遍推迟换机、延长换机周期至42个月。", "l": "Counterpoint Research / 证券日报", "u": "https://www.toutiao.com/article/7685055606079717915/"}, {"t": "2026年折叠屏面板出货预计同比+23%，苹果贡献27%、三星33%居首、华为25%", "s": "下半年折叠面板出货预计较上半年增长53%、较2025年下半年增长71%，占全年总量61%。厂商方面最大增量来自苹果，预计贡献全年27%的出货量且全部集中在下半年；三星出货预计同比增长8%、以33%份额继续居首；华为出货预计下降6%、份额25%。苹果、三星与华为合计占出货量86%。", "l": "国际金融报 / Counterpoint Research", "u": "https://news.qq.com/rain/a/20260915A0C3M800"}]}, {"name": "IDC", "items": [{"t": "2026年全球智能手机出货下调至-16.7%、略高于10亿部，为有记录以来最大年度收缩；但均价+27.6%至581美元", "s": "市场总值仍增长6.3%至6130亿美元，下半年出货同比-27.2%。NAND与DRAM成本同比上升超300%，去年出货1.73亿部的百美元以下机型面临生存危机，Q2该价位段同比近乎-60%。折叠屏是唯一亮点、全年+12.6%。", "l": "IDC Worldwide Quarterly Mobile Phone Tracker", "u": "https://www.idc.com/?p=19948/"}, {"t": "2026Q2全球出货2.763亿部(-7.4%)：三星62.7M/22.7%(+8.1%)、苹果55.7M/20.2%(+14.9%)、小米31.2M/11.3%(-26.4%)", "s": "OPPO 28.9M/10.5%(-17.1%)、vivo 21.2M/7.7%(-19.6%)、其他76.6M。华为是唯一逆势者：在安卓竞品普遍涨价时保持中国区价格稳定、做定向促销、扩大价格带覆盖，取得+19.9%同比增长。二手与翻新机市场2026年预计增长13%。", "l": "IDC Quarterly Mobile Phone Tracker", "u": "https://www.idc.com/?p=19948/"}, {"t": "2026Q2全球腕戴设备出货4801万台同比-4.3%，华为970万台、份额20.5%连续两季全球第一", "s": "智能手表出货3708万台同比-4.2%，手环出货1092万台同比-4.7%。华为依托WATCH FIT系列、星钻绽放款与儿童手表覆盖多元细分市场，出货仅微降1.9%；小米850万台居次、份额17.7%；苹果640万台、份额13.3%且同比-13.6%；佳明330万台同比+19.8%为前五唯一高增长。IDC预计2026全年智能手表出货1.597亿台、同比-2.8%。", "l": "电器杂志 / IDC", "u": "https://www.dianqizazhi.com/2026/09/10/74044.html"}, {"t": "2026Q2中国智能手机出货6601万台、同比-4.3%，连续第五个季度下滑；华为+19.4%、苹果+24.4%为仅有的两家正增长", "s": "华为以22.6%份额稳居国内第一、苹果紧随其后，OPPO、vivo、小米均不同程度下滑。华为增长支点为全价位产品线覆盖（Q1国内折叠屏份额60%）、价格克制与自研芯片鸿蒙生态；苹果增长来自iPhone 17促销与新品涨价预期前置购机。"}]}, {"name": "TrendForce", "items": [{"t": "2026Q3传统DRAM合约价预计环比上涨13%至18%，NAND闪存合约价预计上涨10%至15%", "s": "存储容量越大涨幅越大：iPhone 18系列256GB版本BOM成本预估年增幅达38%，从256GB到1TB、2TB版本涨幅递增，反映存储元器件已成为整机成本结构中的核心变量。AI服务器单台内存需求是普通服务器8至10倍，已消耗全球过半DRAM月产能。", "l": "TrendForce / 证券日报", "u": "https://www.toutiao.com/article/7685055606079717915/"}, {"t": "苹果已接受三星2027年一季度存储报价：DRAM接近2.0美元/Gb、NAND接近0.33美元/Gb，较2026Q3上涨30%至40%", "s": "三大原厂2027年DRAM与HBM产能已基本分配完毕，NAND产能8月底全部锁定，客户实际可获配额约为申请量的六至七成。测算显示2026Q3的256GB版iPhone 18 Pro存储成本同比涨近400%，存储占整机BOM由约10%升至34%。"}]}, {"name": "QuestMobile", "items": [{"t": "存量报告：华为2.76亿台21.6%居首但同比-4.0%、苹果20.9%-1.0%、vivo+9.5%至16.5%、小米+6.4%", "s": "2000至4999元活跃占比48.1%，中端价位段成存量主力。华为存量虽降但凭借Mate/Pura旗舰稳住高端基本盘，vivo靠iQOO游戏场景逆势增长。数据反映存量市场已进入零和博弈，份额增长须靠抢夺而非做大蛋糕。", "l": "QuestMobile / QQ新闻", "u": "https://new.qq.com/rain/a/20260909A035SN00"}]}, {"name": "Omdia", "items": [{"t": "2026Q2美国PC出货量(不含平板)同比增长1.0%至1880万台，平均渠道出货价格首次突破1000美元、同比+12.0%", "s": "本季度恢复增长主要得益于零售商与渠道伙伴在存储器和存储产品供应受限导致价格上涨之前提前备货，带动部分需求提前释放。PC与手机同受存储成本冲击，均价上行与需求前置是共同特征。", "l": "Omdia / 同花顺财经", "u": "https://m.10jqka.com.cn/20260913/c679852420.shtml"}, {"t": "2026H1全球折叠出货510万部同比-21.6%，但苹果入局将引爆下半年", "s": "上半年折叠屏出货下滑主因三星Z Fold7生命周期末端+华为三折叠尚未规模交付。9/7华为Mate XT 2已开售、9/10苹果iPhone Duo发布、9/10小米18 Fold开售，三强落地将驱动下半年反弹，预计2026全年折叠出货+20%，苹果首年夺25%份额升至第二。", "l": "Omdia / 网易新闻", "u": "https://c.m.163.com/news/a/L1S1I03R053159A3.html"}, {"t": "全球AI眼镜出货：2023年38万台、2024年206万台、2025年870万台，2026年预计突破1500万台", "s": "洛图数据补充：2026年7月京东、天猫、抖音三大平台智能眼镜零售量7.4万台、同比-15.3%，零售额1.3亿元、同比-25.8%，零售额降幅大于零售量说明均价下行、价格战已开打；近两年进入该赛道企业近70家。"}]}, {"name": "广发证券（Jeff Pu）", "items": [{"t": "9/15下调iPhone 18 Pro与Pro Max总产量至7200万台，iPhone Duo 2026年产量由700万降至600万台", "s": "蒲得宇指出iPhone 18 Pro系列预售初期发货等待时长表现平平、热度不高，核心原因是硬件升级幅度有限且整机定价走高、大容量版本溢价尤其明显。供给端受新款可变光圈摄像头产能受限影响下调Pro系列产量；折叠iPhone则因铰链结构量产难度超出预期下调。预判部分原本计划购买18 Pro Max的消费者会转向iPhone Duo，维持苹果持有评级、目标价369美元。", "l": "IT之家 / 广发证券", "u": "https://www.toutiao.com/article/7685716864417022499"}]}], "instsSummary": "①**Counterpoint**：2026年折叠面板出货+23%，苹果贡献27%、三星33%、华为25%；Q2手机内存环比涨超80%、DRAM首超SoC\n②**IDC**：2026全球手机出货下调至-16.7%创史上最大收缩、均价+27.6%至581美元；Q2中国出货6601万台-4.3%连续第五季下滑\n③**TrendForce**：Q3 DRAM合约价再涨13%至18%、NAND涨10%至15%；苹果接受三星2027Q1报价、较Q3上涨30%至40%", "topNews": [{"t": "9/16 努比亚NaviX Ultra发布：全球首款AI智能体手机，12+512GB售5999元、国补后5499元起", "s": "中兴通讯称该机由工程样机迈入规模化量产商用，搭载第五代骁龙8至尊版、长鑫与三星10667Mbps LPDDR5X、京东方6.78英寸超窄四等边屏，配实体AI键与豆包手机助手消费者版，支持一句话跨应用执行复杂任务。", "u": "https://www.stcn.com/article/detail/4187834.html"}, {"t": "9/16 在售老机型集中反向调价：Mate 80全系涨800至1000元，小米17一月两次累计涨600至1000元", "s": "华为Mate 80标准版全配置统一+800元、顶配由6499元涨至7299元，Pro与Pro Max各版本+1000元；小米17系列起售价一个月内两次上调；荣耀Magic8与Power2同步调价，三品牌均归因于关键物料与核心元器件成本上涨。", "u": "https://www.163.com/dy/article/L6VOBIDI05568W0A.html"}, {"t": "9/16 存储芯片成本占比飙至近一半：12+256GB存储套片采购价由约500元涨至2200元", "s": "手机中最贵器件已由处理器变为内存与闪存。三大原厂2026年把70%至90%先进产能调拨给HBM，22%的DRAM晶圆投入只堆出9%的存储位元产出；A股12家核心存储公司H1归母净利合计1172亿元，去年同期整体仍亏损。", "u": "https://www.toutiao.com/article/7685988497718542884/"}, {"t": "9/16 卢伟冰首次公开展示小米18 Pro真机：百变背屏支持AI生成应用卡，侧边新增AI实体键", "s": "背屏可生成煮蛋计时、喝水打卡、番茄时钟、背单词等轻量工具，官方披露背屏卡片日调用超400万次、壁纸日新增超350万次、累计投入近10亿元；新机另配双2亿像素与7000mAh以上电池。", "u": "https://www.toutiao.com/article/7685566251845812779"}, {"t": "9/17 OPPO举办ColorOS 17发布暨开发者大会：三品牌统一底层，覆盖超130款机型", "s": "大会在珠海举行，带来“浮岛式导航”“凝光视效”与柔性反馈系统，融合底层代码实现OPPO、一加、realme三品牌体验统一，Find X10系列将首发搭载。", "u": "https://new.qq.com/rain/a/20260915A0005S00"}, {"t": "9/16 鸿蒙7官网粒子动效清单调整：Mate 60、Pura 70、Mate X5与初代Mate XT标注暂不支持", "s": "鸿蒙7发布24小时升级破500万、累计装机逼近8700万台，超50款设备进入公测；Mate 70与Mate 70 Air需升级至7.0.0.105 SP10以上才有粒子动效。同日六年前的Mate 40系列仍收到鸿蒙4.2维护更新，9/14鸿蒙1.0正式停服。", "u": "https://www.sohu.com/a/1077020545_122066678"}, {"t": "9/16 多方信息显示Mate X8将于9/23与Mate 90同台发布，麒麟9050 Pro下放万元档大折叠", "s": "原只在近两万元三折叠首秀的逻辑折叠架构将下放到万元档折叠，折叠屏长期“芯片慢半拍”问题被解决：同面积多容纳五成以上晶体管、等性能下功耗降四成、主频提升一档。", "u": "https://www.toutiao.com/article/7685998310141788722/"}, {"t": "9/16 vivo辟谣周杰伦出席发布会，X500系列确认9月21日19:00发布", "s": "X500/X500 Pro/X500 Pro Max三款，全球首发天玑9600系列，Pro系列首发蓝图光御900蔡司超动态主摄、动态范围最高17EV，支持4K 240fps慢动作；市场预测起售4999/5999/6999元，较上代X300上涨约600元。", "u": "https://www.163.com/dy/article/L6UJVTBT05364A6D.html"}, {"t": "9/16 IDC：Q2中国手机出货6601万台同比-4.3%，连续第五个季度下滑", "s": "同期华为出货同比+19.4%、苹果+24.4%，为全行业仅有的两家正增长；华为以22.6%份额稳居国内第一，OPPO、vivo、小米均不同程度下滑，用户换机周期继续拉长。", "u": "https://t.cj.sina.com.cn/articles/view/7879776882/1d5abda7206801nmc2"}, {"t": "9/16 AI眼镜价格战开打：7月三大平台零售量7.4万台-15.3%，零售额1.3亿元-25.8%", "s": "零售额降幅大于零售量意味着均价下行。Omdia统计全球AI眼镜出货由2023年38万台增至2025年870万台，2026年预计突破1500万台；近两年进入赛道企业近70家，平均每9天一款新品上市。", "u": "https://post.m.smzdm.com/p/ak8k2r98"}], "newsSummary": "①**9/16努比亚NaviX Ultra发布**：全球首款AI智能体手机，12+512GB售5999元、国补后5499元起，配实体AI键\n②**9/16在售老机型集中反向调价**：Mate 80全系+800至1000元、小米17一月两次累计+600至1000元、荣耀Magic8与Power2上调\n③**9/16存储占BOM逼近一半**：12+256GB存储套片采购价由约500元涨至2200元，整机定价体系被上游重构", "launchCalendar": [{"d": "9/10", "brand": "苹果", "evt": "秋季发布会凌晨1:00实测：iPhone Duo折叠15999元起（10/16预购10/23发售）+Pro 9999/Pro Max 10999元起（9/12预购9/18发售）+AirPods 5 999元起+Watch S12/Ultra 4，A20 Pro 2nm首秀"}, {"d": "9/15", "b "智谱AI CEO", "items": [{"hl": "393亿港元押注「完全自训练」：数据自产、环境自造、基础设施自优化的递归闭环。", "detail": "9/13港交所公告配售新H股并发行201.4亿元零息可转债，合计净募约393亿港元；约60%(235亿港元)投下一代GLM基础模型与完全自训练体系，15%用于业务拓展与并购，2028年6月底前用完。上市不足九个月累计净募约755亿港元。", "l": "港交所公告/腾讯研究院", "u": "https://www.sohu.com/a/1076026719_455313"}]}, {"name": "梁文锋 (Liang Wenfeng)", "role": "深度求索(DeepSeek) 创始人兼CEO", "items": [{"hl": "**补齐CFO冲刺科创板**：开源派的资本化与C端化同时提速。", "detail": "9/13路透独家：高瓴创投合伙人严文韬(1991年生)将任首任CFO，中信证券已进场尽调、目标2027年科创板挂牌，估值由6月500亿$升至约740亿$。同期QuestMobile显示7月MAU回落至9417万(-21%)，落后豆包3.82亿、千问1.67亿；9/12灰度语音对话、Harness放出约150个工程岗。", "l": "路透/新浪财经", "u": "https://finance.sina.com.cn/wm/2026-09-15/doc-inirwmwa7020425.shtml"}]}, {"name": "曹鹏 (Peng Cao)", "role": "京东集团技术委员会主席 / 京东云总裁", "items": [{"hl": "**从万卡走向十万卡**：国产集群由「可用」进入「规模训练」验证期。", "detail": "9/15 JDD大会宣布京东云已与摩尔线程等伙伴建成国产万卡集群，下一步规划十万卡集群，瞄准大模型训练、推理与具身智能；摩尔线程创始人张建中称Scaling Law仍有效、十万卡是大势所趋。上半年京东研发投入同比+53.2%，连续三个季度加速。", "l": "36氪/京东JDD", "u": "https://www.36kr.com/p/3984300425582470"}]}, {"name": "陶哲轩 (Terence Tao)", "role": "菲尔兹奖得主 / UCLA 教授", "items": [{"hl": "联名25位菲尔兹奖得主：把解题当基准的竞赛式推进正在损害数学科学与共同体。", "detail": "9/13公开声明指出解题只是工具、根本目标是概念理解与洞见；仓促发布的解答来不及规范写作与引用，引发成果归属与剽窃问题，数学家之间的传承链条可能断裂。此前OpenAI以GPT-6 Astra刷FrontierMath、Anthropic以Claude 11天证费马大定理。", "l": "公开声明/腾讯新闻", "u": "https://www.sohu.com/a/1076026719_455313"}]}, {"name": "周靖人 (Jingren Zhou)", "role": "阿里云 CTO", "items": [{"hl": "企业侧Token份额32%跃居第一：阿里云从模型竞赛转向Agent数据底座卡位。", "detail": "2H26阿里云占中国企业日均Token消耗32%(上半年17.7%)，8月千问DAU 2810万；9/15上线PolarDB Agentic Data Foundation，把数据库统一为Agent的记忆、上下文与执行状态层，直指生产级Agent数据管理痛点。", "l": "Macrostream/阿里云", "u": "https://www.macrostream.ai/articles/6aa789db6fa5837594321ae0"}]}, {"name": "张一鸣 (Zhang Yiming)", "role": "字节跳动 创始人", "items": [{"hl": "实时空间视频模型之外，先把Agent的「记忆」开源：火山引擎开放OpenViking。", "detail": "9/15火山引擎开源自进化上下文数据库OpenViking，同一LLM下tau2-bench任务成功率提升6.87-11.87个百分点；同时筹备基于Seedance的实时空间视频生成模型。公司正从近30家银行获296亿美元无抵押银团贷款，为今年亚洲第二大美元贷款交易。", "l": "火山引擎/彭博", "u": "https://www.sohu.com/a/1076026719_455313"}]}], "leadersSummary": "①**奥特曼从单方承诺转向三巨头协同**：OpenAI与Anthropic、DeepMind磋商安全数周。②**阿莫代伊一边喊减速一边签5170亿$算力**，安全呼吁与扩表同步。③**纳德拉写出37页AI行为准则**，拒绝AI法律人格、抢标准解释权。④**梁文锋补齐CFO冲刺科创板**，但7月MAU回落21%至9417万。⑤**曹鹏宣布京东从万卡走向十万卡**，国产集群进入规模训练验证期。⑥**张鹏393亿港元押注完全自训练**，智谱九个月三轮累计755亿港元。⑦**周靖人把企业Token份额做到32%**，阿里云转向Agent数据底座。", "institutionViews": [{"name": "SemiAnalysis / 华尔街预期", "items": [{"s": "Anthropic盈利质量好于预期：推理毛利率由一年前38%升至70%-85%，Q3 GAAP口径EBIT或超10亿$、利润率约6%；投资者预计其年底年化营收达1200亿$、2027年底接近三倍。收入结构优于同行——约75%-85%来自企业级API(OpenAI约65%来自C端订阅)，截至2026年6月34.4%美国企业为其付费、首超OpenAI的32.3%。【9/16更新】算力承诺进一步加码：过去11个月签下5170亿美元算力合同(约一年收入的8倍)，另与Rum Group签137亿美元协议。", "l": "SemiAnalysis/腾讯新闻", "u": "https://news.qq.com/rain/a/20260914A04N1H00"}]}, {"name": "高盛 (Goldman Sachs)", "items": [{"s": "美系四大云2026 capex约7250亿$(较2025年约4100亿$增约77%)；五家(含Oracle)单季自由现金流跌至不足50亿$(此前约610亿$)，2025年末以来举债超1000亿$；2026年4340亿$设备支出中仅约1490亿$计入当期损益。单位效率分化：AWS每1$ capex产出0.30$营业利润，谷歌云仅0.17-0.18$。", "l": "高盛研报", "u": "https://wogoo.com/sq/w/8d1ab6820ba54c8fb4fb708ab8a2283f"}]}, {"name": "UBS / 标普全球 (S&P Global)", "items": [{"s": "超大规模厂商AI capex将由2025年约4920亿$翻倍至2026年约1.0万亿$、2027年约1.45万亿$；2026年三大云capex将吃掉约102%的云收入。标普全球模型显示Alphabet/亚马逊/微软/Meta/Oracle等在2026与2027年自由经营性现金流均为负，恢复要等到2029年。", "l": "UBS/标普全球", "u": "https://t.10jqka.com.cn/pid_691050890.shtml"}]}, {"name": "美银美林 (BofA Merrill Lynch)", "items": [{"s": "中国四大云（阿里/腾讯/字节/百度）capex由2025年近4000亿元升至2026年约7260亿元、2027年破万亿；MaaS 2030年达6760亿元（CAGR 81%）为AI云最快赛道。阿里8月下旬香港配售募800亿港元全部投AI，字节从近30家银行获296亿美元无抵押银团贷款，中国大厂以股权+债权双线备战。", "l": "美银美林/腾讯新闻", "u": "https://www.36kr.com/p/3984300425582470"}]}, {"name": "摩根士丹利 (Morgan Stanley)", "items": [{"s": "AI capex并未放缓：2027年或再+29%、达约1.4万亿美元；开放权重压低Token价格反而扩大推理需求，云巨头凭借GPU/自研芯片/生态仍享20%-60% ROIC。但AI投资进入「半场休整」，主线转向应用端与能源/储能等HALO资源。", "l": "大摩研报", "u": "https://um.stcn.com/article/detai"}]}, {"name": "穆迪 (Moody's)", "items": [{"s": "中国头部科技企业2026-2027年资本支出总额预计由2025年约650亿美元增至1400亿-1650亿美元。2026Q2国内云capex已验证：阿里676.78亿元(+75%)、腾讯527.84亿元(+176%)、百度113.90亿元(+200%)，单季合计1318.52亿元(+114%)；字节202  Q4 新品定价模型，避免毛利被动侵蚀。"}, {"h": "② 产品与营销：押注 AI 终端", "c": "手机 / 平板 / PC 是内需唯一两位数增长且能提价的品类，8 月通讯器材类 **+27.3%**、连续 4 个月加速，**可穿戴智能设备与高能效等级家电零售额延续快速增长**。建议把 **AI 手机 / AI PC / 智能穿戴** 作为 2027 年产品与营销资源主战场，主打「AI 体验」而非参数。"}, {"h": "③ 渠道与生态：重估车 / 家电协同", "c": "汽车类社零 8 月 **-18.5%**（降幅再扩 1.5 个百分点），家电音像 **+2.3%** 在去年高基数上刚由负转正。建议**下调车机协同目标、暂缓汽车渠道资源加码**，家电按「结构性回暖」而非「全面复苏」配置；同时把主推资源继续向通讯器材（**+27.3%**）与全屋智能倾斜。"}, {"h": "④ 政策红利：对接「六张网」与两重清单", "c": "发改委推进算力网 + 新型电网 + 新一代通信网 **「2+3+N」** 协调机制，媒体披露算力网投资量级达 **4 万亿元**。终端与计算业务应对接重大项目清单，争取**政企与行业侧的算力/终端组合方案**落地。"}, {"h": "⑤ 供应链：警惕 2027 价格回落风险", "c": "集成电路 8 月出口额 **+129.8%** 但出口量 -7.9%，纯价格驱动。**高价备货需设置安全库存上限与跌价准备**，避免周期反转时形成呆滞库存。"}, {"h": "⑥ 出口：AI 硬件是当下最强 Beta", "c": "8 月计算机产品出口首破 **300 亿美元**、集成电路首破 **400 亿美元**，双双创历史新高。海外市场资源应优先配置到 **AI 终端与高附加值硬件**，借全球 AI 投资热潮放大出口弹性。"}], "gauge": [{"n": "外需 / 出口", "v": "高热", "s": "出口连续 4 个月两位数，机电出口创历史新高", "p": 88}, {"n": "AI 与电子产业链", "v": "高热", "s": "电子行业利润 +110%，集成电路 +18.5 倍", "p": 92}, {"n": "工业生产", "v": "中温", "s": "8 月 PMI 49.8% 回升，工业增加值 +5.2%（加快0.7pct）", "p": 56}, {"n": "内需消费", "v": "偏冷", "s": "社零仅 +0.4%，汽车 -18.5%，仅通讯器材 +27.3%", "p": 28}, {"n": "价格 / 成本", "v": "升温", "s": "PPI +3.8%、购进 +5.8%，芯片进口均价 +72.2%", "p": 78}, {"n": "货币金融", "v": "宽松", "s": "M2 7.5%、社融 7.2%，但对实体贷款降至 5.0%", "p": 58}]}, "headlineViewpoints": [{"tag": "内需分化", "t": "8月社零仅+0.4%、固投-7.2%，但**通讯器材类+27.3%**：终端已是内需唯一高增赛道", "s": "核心观点：8 月社零 39824 亿元、同比仅 **+0.4%**，1—8 月固投 **-7.2%**、房地产开发投资 -19.9%；但限额以上**通讯器材类 8 月 +27.3%**、1—8 月 +16.3%，远超家电 +2.3%。<b class=\"hl-red\">总量磨底下终端是少数两位数品类，增长来自换机与涨价而非消费扩张。</b>高层建议：2027 年勿押注社零回暖，资源压向通讯器材与全屋智能这两类有补贴覆盖的品类。", "l": "国家统计局", "u": "https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html"}, {"tag": "产业定位", "t": "电子信息制造业「十五五」规划落地、2030年营收30万亿：**国家把终端硬件锁定为工业第一支柱**", "s": "核心观点：9/15 工信部、发改委发布《电子信息制造业发展「十五五」规划》，2030 年规上企业营收突破 **30 万亿元**、研发投入强度 **3.5%**；8 月高技术制造业增加值 **+16.7%**、装备制造业 **+12.1%**。<b class=\"hl-red\">该行业营收已连续 13 年居 41 个工业大类首位，政策与资本将持续向这一赛道集中。</b>高层建议：2027 年产品组合按规划九大专栏对表，重点争取先进计算与消费电子创新两类专项。", "l": "工业和信息化部、国家发展改革委", "u": "https://www.gov.cn/lianbo/202609/content_7081208.htm"}, {"tag": "政策", "t": "算力网升格国常会专题、AI+软件方案同日落地：**AI 竞争胜负手已从终端上移到算力底座与软件生态**", "s": "核心观点：9/11 国常会专题研究算力网建设，要求**算电协同、算网融合**、绿电直连与源网荷储落地；同日工信部《「人工智能+软件」专项行动实施方案》提出 2028 年覆盖 **2 万家**规上软件企业、打造 **100 个**智能体软件标杆应用。<b class=\"hl-red\">算力升格为国家级基础设施，智能体软件成为下一形态竞争点。</b>高层建议：2027 路线图把端侧 AI 与算力 / 软件生态绑定，争取算力券与新型政策性金融工具支持。", "l": "国务院常务会议 / 工业和信息化部", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080787.htm"}, {"tag": "价格传导", "t": "8月PPI+3.8%、平板+21.5%、集成电路出口量-7.9%：**这轮景气是价格驱动，量能未同步扩张**", "s": "核心观点：8 月 PPI 同比 **+3.8%**，统计局把手机、平板、存储涨价归因于「算力需求快速增长」，三者同比 **+11.0% / +21.5% / +19.6%**；同期集成电路出口额高增但出口量 **-7.9%**。<b class=\"hl-red\">量缩价涨说明景气来自 AI 涨价再分配，而非需求扩张。</b>高层建议：2026H2 定价由「保份额」切到「保毛利」，并把核算新规与 60 日付现的合规成本前置计入 2027 年竞争模型。", "l": "国家统计局 / 海关总署", "u": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260909_1965261.html"}, {"tag": "融资结构", "t": "8月金融数据股债融资占比50.31%首超贷款：**金融支持实体的方式已从银行信贷切换到资本市场**", "s": "核心观点：8 月末 M2 **+7.5%**、社融存量 **+7.2%** 均高于名义 GDP 增速，但 8 月人民币贷款仅增 **600 亿元**、前 8 月住户贷款减少 1.03 万亿元；债券与股票融资占社融增量 **50.31%**，较五年前高近 20pct。<b class=\"hl-red\">信用扩张没减速，只是换了渠道——靠抵押与信贷驱动的旧模式正在退场。</b>高层建议：2027 年资金筹措从银行授信为主转向股权+债券组合，把供应商融资成本纳入整机成本模型。", "l": "中国人民银行", "u": "http://www.pbc.gov.cn/"}], "opinionLeaders": [{"name": "国务院常务会议", "role": "宏观经济与产业政策顶层部署", "items": [{"hl": "算力网是人工智能发展的基础支撑，要推动算电协同、算网融合，加强算力资源监测调度和骨干光纤网络建设", "detail": "会议要求坚持合理布局、规范有序，进一步完善算力基础设施，积极推进关键技术和装备研发应用，构建多层次网络化算力体系；强化算电设施规划衔接，加快绿电直连、源网荷储等项目落地，更好发挥市场机制作用，支持企业开展科技创新、资源整合和应用推广，促进供需更好匹配。我国已形成 8 大国家算力枢纽、10 个国家算力集群、3 个算电协同发展区域的空间布局。", "l": "国务院常务会议研究算力网建设有关工作（9/11）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080787.htm"}]}, {"name": "国家统计局", "role": "国民经济核算与价格、工业、贸易统计", "items": [{"hl": "8 月规上工业增加值同比 +5.2%（比上月加快 0.7 个百分点）、环比 +0.54%，高技术制造业 +16.7%、装备制造业 +12.1%；1—8 月工业增加值 +5.3%", "detail": "8 月社零 39824 亿元、同比 +0.4%（环比 -0.13%），1—8 月 327569 亿元、+1.1%，其中除汽车以外消费品零售额 +2.7%；限额以上通讯器材类 8 月 +27.3%、1—8 月 +16.3%，家用电器和音像器材类 8 月 +2.3% 但 1—8 月 -5.6%，汽车类 8 月 -18.5%。1—8 月固投 293092 亿元、-7.2%，扣除房地产 -4.2%；房地产开发投资 -19.9%、新建商品房销售面积 -12.1%，而二手房交易网签面积 +10.6%；高技术产业投资 +5.2%（信息服务 +22.7%、电子及通信设备制造 +6.9%）。8 月进出口 46455 亿元、+19.8%（出口 +18.6%、进口 +21.7%）。城镇调查失业率 5.3%。锂离子电池、工业机器人、3D 打印设备产量分别 +57.2%、+34.6%、+29.9%。", "l": "8 月份国民经济运行情况（9/15 10:00）", "u": "https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965307.html"}, {"hl": "8 月 CPI 环比 +0.4%、同比 +0.8%（涨幅扩大 0.3pct），核心 CPI 同比 +1.0%；PPI 环比 +0.4%、同比 +3.8%", "detail": "CPI 端：汽油价格同比 +9.3%（涨幅扩大 8.3pct）拉动能源涨幅由 0.6% 扩至 4.1%；受算力需求快速增长影响，移动电话机、平板电脑、数据存储设备价格环比分别 +2.3%、+2.1%、+2.1%，同比分别 +11.0%、+21.5%、+19.6%（计算机）。PPI 端：煤炭开采 +26.6%、有色冶炼 +20.8%，计算机通信和其他电子设备制造业 +5.3%；汽车制造业位列价格下拉前六。", "l": "2026 年 8 月份 CPI / PPI 数据解读（9/09）", "u": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260909_1965261.html"}, {"hl": "8 月制造业 PMI 49.8%（+0.6pct），新订单 50.6%（+2.1pct）重回扩张，生产 50.4%", "detail": "电气机械器材、计算机通信电子设备生产与新订单指数均高于 53.0%；高技术制造业 PMI 52.9%、装备制造业 51.4%，消费品行业 49.0%。", "l": "2026 年 8 月中国采购经理指数（8/31）", "u": "https://www.stats.gov.cn/"}]}, {"name": "中国人民银行", "role": "货币政策与金融统计", "items": [{"hl": "9 月 15 日开展 5000 亿元买断式逆回购操作，期限 6 个月（181 天）、到期日 2027 年 3 月 15 日，为到期等量续作", "detail": "以固定数量、利率招标、多重价位中标方式操作，目的是保持银行体系流动性充裕。同日开展 5970 亿元隔夜逆回购，全口径净投放 5920 亿元。买断式逆回购结束此前连续两个月的加量操作，投放结构呈现「收长放短」。9 月 22 日将公布 9 月 LPR 报价。", "l": "公开市场业务交易公告（9/15）", "u": "http://www.pbc.gov.cn/"}, {"hl": "8 月末 M2 余额 356.81 万亿元、同比 +7.5%，M1 +4.1%；社融存量 464.8 万亿元、同比 +7.2%，均高于名义 GDP 增速", "detail": "8 月社融增量 1.66 万亿元、人民币贷款仅增 600 亿元；前 8 月社融增量累计 23.91 万亿元、同比少 2.64 万亿元，人民币贷款增加 10.44 万亿元。前 8 月债券与股票融资占社融增量 50.31%，明显超过贷款占比、较五年前同期高近 20pct；8 月新发放企业贷款加权平均利率略低于 3%、个人住房贷款约 3.1%，均处历史低位；前 8 月住户贷款减少 1.03 万亿元，8 月住户贷款减少 2029 亿元、连续两个月减少。", "l": "2026 年 8 月金融统计数据报告（9/14）", "u": "http://www.pbc.gov.cn/"}, {"hl": "《金融强国建设「十五五」规划》正式出台，2030 年形成中国特色现代金融体系总体框架、2035 年基本建成", "detail": "陆磊：坚持「防风险、强监管、促高质量发展」主线，构建科学稳健的货币政策体系与覆盖全面的宏观审慎管理体系「双支柱」；保持社融、货币供应量增长同经济增长与价格总水平预期目标相匹配。6 月末「五篇大文章」结构性货币政策工具余额 4.6 万亿元、相关贷款同比 +10.9%，科技、绿色、普惠、养老、数字贷款增速均高于全部贷款平均。", "l": "国新办「开局起步‘十五五’」金融专题发布会（9/10）", "u": "https://www.gov.cn/lianbo/202609/content_7080658.htm"}]}, {"name": "国家发展改革委", "role": "宏观调控、投资与产业协调", "items": [{"hl": "郑栅洁主任主持召开民营企业座谈会，围绕优化发展环境、拓展投资空间听取电气设备、算力基础设施、文旅、养老服务、商业航天等领域企业意见", "detail": "参会企业建议进一步开放应用场景、优化审批流程、拓宽融资渠道、盘活存量资产并强化要素保障。此前发改委已召开「十五五」规划《纲要》重大工程建设推进会议，调度 109 项重大工程项目实施；并召开「六张网」重大项目协调推进会研究加强要素保障。", "l": "民营企业座谈会（9/15）", "u": "https://www.ndrc.gov.cn/"}, {"hl": "在现行成品油价格机制框架下实施临时调控，9/11 汽、柴油标准品价格应上调 435 元/吨和 420 元/吨，调控后实际分别上调 260 元/吨和 250 元/吨", "detail": "受国际原油价格持续上涨影响，按机制计算的上调幅度被临时压缩约四成，意在抑制输入性通胀向物流与居民消费端传导；与 8 月 CPI 能源项涨幅由 0.6% 扩至 4.1%、汽油价格同比 +9.3% 形成对冲。", "l": "国家发展改革委成品油价格临时调控（9/11）", "u": "https://www.ndrc.gov.cn/"}, {"hl": "联合市场监管总局印发《关于重要工业品低价无序竞争成本核算有关事项的通知》，明确成本核算主体、内容与方式", "detail": "发改价格〔2026〕1303 号。成本核算原则上以经营者个别成本为基础，个别成本无法核算时参考行业平均成本并考虑一定下浮幅度；产能利用率大幅低于行业平均的经营者将适当考虑其对成本的影响。目标是推动相关行业从「拼价格」转向「拼质量、拼创新」，营造优质优价环境。", "l": "重要工业品低价无序竞争成本核算通知（9/10）", "u": "https://www.ndrc.gov.cn/xwdt/tzgg/202609/t20260910_1407525.html"}]}, {"name": "海关总署", "role": "进出口贸易统计", "items": [{"hl": "8 月进出口 4.65 万亿元、同比 +19.8%，连续 3 个月超 4.5 万亿", "detail": "集成电路出口 407.3 亿美元 / +129.8%（首破 400 亿美元）、自动数据处理设备 304 亿美元 / +76.5%（首破 300 亿美元），双双创历史新高；高新技术产品出口占出口总额 29.0%。", "l": "2026 年 8 月进出口数据（9/08）", "u": "http://www.customs.gov.cn/"}]}, {"name": "工业和信息化部", "role": "电子信息制造业运行", "items": [{"hl": "《电子信息制造业发展「十五五」规划》（工信部联规〔2026〕216 号）：2030 年规模以上企业营业收入突破 30 万亿元、研发投入强度达到 3.5%", "detail": "与发改委联合印发，围绕「筑基、提质、育新、治理」部署 17 项重点任务、9 个专栏。筑牢产业基础：推动集成电路全链条攻关，发展高性能处理器、高密度存储器等高端芯片，提升先进封装测试能力。增强整机与系统竞争力：构筑先进计算生态体系（存算一体、量子计算、光计算、类脑计算、太空计算），加快消费电子创新发展——推动手机、个人计算机、视听电子、虚拟现实、可穿戴设备、服务类新型终端智能化融合化升级，推进消费电子适老化改造。培育新增长点：巩固能源电子优势，推进固态电池、钠电池、液流电池、燃料电池产业化。消费电子专栏分设高端手机、个人计算机、视听电子、虚拟现实、可穿戴设备、服务类新型终端六大方向。", "l": "《电子信息制造业发展「十五五」规划》（9/15 对外发布）", "u": "https://www.gov.cn/lianbo/202609/content_7081208.htm"}, {"hl": "召开部分省份工业经济运行座谈会：把促进工业经济平稳运行摆在更加重要位置，加力挖掘内需潜力、加快推动人工智能产业发展和赋能应用", "detail": "辛国斌主持，河北、江苏、浙江、安徽、福建、山东、河南、湖北、湖南、广东、四川等 11 省工信主管部门参会，分析研判工业经济形势、研究谋划 2027 年经济工作思路。要求抓紧推进「十五五」规划重大项目落地实施，持续巩固提升工业品国际市场竞争力；强化供需平衡、加力推进大中小企业融通发展；加强产能治理，坚持因地制宜、突出差异化发展。", "l": "部分省份工业经济运行座谈会（9/14）", "u": "https://www.miit.gov.cn/jgsj/yxj/gzdt/art/2026/art_3c82ff9dd6fe423c8ea61083cea55685.html"}, {"hl": "《「人工智能+软件」专项行动实施方案》：2028 年推广覆盖 2 万家规上软件企业、打造 100 个智能体软件标杆应用", "detail": "工信部信发〔2026〕209 号。到 2030 年关键软件全面实现智能化升级，智能编程、智能体软件及智能服务成为产业新增长极。六方面部署：优化智能编程工具链条、推进软件企业智能化技改、加快基础与工业软件智能化升级、培育智能体软件新业态、拓展智能软件服务、夯实智能化发展基础；建设智能体软件应用商店与技能包资源库，鼓励地方用「算力券」按比例支持采购自主编程工具与自主大模型编程服务。2025 年软件业营收 15.48 万亿元，日均词元调用量已突破 500 万亿。", "l": "《「人工智能+软件」专项行动实施方案》（9/11 发布）", "u": "https://www.gov.cn/lianbo/202609/content_7080767.htm"}, {"hl": "《信息通信行业发展「十五五」规划》：2030 年行业收入 4.1 万亿元、智能算力 9800EFLOPS、5G（含 5G-A）用户普及率 95%", "detail": "信息基础设施累计投资 3.8 万亿元、电信业务总量年均增速 7%；适时启动 6G 商用、新建 5G-A 基站 50 万个、50G-PON 端口 100 万个、千兆以上宽带用户超 3.2 亿户、通信网络终端连接数 65 亿个；加快 1.6Tb/s 光传输系统与 5G-A/6G 设备攻关，探索太空算力前瞻研究。", "l": "《信息通信行业发展「十五五」规划》（9/07 发布）", "u": "https://www.miit.gov.cn/jgsj/txs/wjfb/art/2026/art_f55fe09a1e26411fa6926e5195850990.html"}]}, {"name": "国务院办公厅", "role": "政策综合协调与督查落实", "items": [{"hl": "国新办政策例行吹风会五部门联合解读：明确「付款四项关键要素」，引导龙头企业率先践行「60 日付现承诺」", "detail": "工信部副部长柯吉欣：多数行业暂未出台专门结算支付规则，部分大型企业通过模糊账期起算节点、拖延验收结算、滥用商业汇票与应收账款电子凭证故意拉长账期；四项要素为账期起算节点、账款支付方式及流程、检验验收（或竣工结算）标准及期限、最长付款期限，将纳入合同示范文本。央行金融市场司司长曹媛媛：对压降账款与账期明显的企业在债券发行方面给予便利。国资委裴仁佺：推动央企带头不违约拖欠、带头少开票多付现，把对中小企业现金支付作为「硬杠杠」。市场监管总局周卫军：部署 2026 年反不正当竞争执法专项行动，已赴部分龙头汽车企业调研敦促。", "l": "国新办国务院政策例行吹风会（9/14）", "u": "https://www.gov.cn/zhengce/202609/content_7081057.htm"}, {"hl": "印发《关于加强中小企业回款难问题治理有关工作的通知》，发布大型企业及时支付倡议，引导 60 日内以现金向中小企业付款", "detail": "四方面部署：健全行业账款支付规则（明确账期起算节点、最长付款期限）；加强大型企业支付行为监管（建立账款监测机制、多部门联合约谈、上市公司须披露平均账期）；规范非现金支付工具（电子凭证最长付款期限压减至 6 个月，经营数据接入上海票据交易所）；强化资金传导（政府采购全额现金支付，支持大型企业融资置换应付账款）。", "l": "《关于加强中小企业回款难问题治理有关工作的通知》（9/10）", "u": "https://www.gov.cn/yaowen/liebiao/202609/content_7080631.htm"}]}, {"name": "商务部", "role": "消费促进与内需政策", "items": [{"hl": "《促进智能家居消费行动方案》（商消费发〔2026〕148 号）七条举措：支持地方自主确定智能家居补贴品类与标准，统筹支持全屋智能家居购新", "detail": "商务部、发改委、工信部、民政部、财政部、自然资源部、住建部、市场监管总局八部门联合印发。扩大优质供给：加快打造一批基于国内开源操作系统的智能家居软硬件产品与一体化解决方案；完善标准体系：加快制定实施智能家居互联互通等强制性国家标准，推动家庭宽带设备默认开启 IPv6，对新建全装修住宅明确户内基本智能产品要求；发展适老化智能家居：推广家庭服务机器人、健康监测、智能照护，推动银发产品认证；加大财政金融支持：用好个人消费贷款财政贴息政策。2026 年以旧换新已覆盖 6 类家电与 4 类数码智能产品，补贴为售价 15%（家电每件≤1500 元、数码智能≤500 元）。", "l": "《促进智能家居消费行动方案》（9/14 对外发布）", "u": "https://www.gov.cn/lianbo/202609/content_7081030.htm"}]}], "metricNotes": [{"metric": "制造业 / 非制造业 / 综合 PMI", "org": "国家统计局服务业调查中心", "freq": "月度（月末）", "latest": "49.8% / 49.0% / 49.5%（8月）", "imp": "景气温度；计算机通信电子与电气机械分项是 ICT 与 AI 硬件订单的同步指标"}, {"metric": "CPI / PPI 当月同比", "org": "国家统计局城市司", "freq": "月度（9—10日）", "latest": "+0.8% / +3.8%（8月）", "imp": "剪刀差决定成本能否向终端传导；消费电子 CPI 分项反映实际提价能力"}, {"metric": "社会消费品零售总额（分品类）", "org": "国家统计局贸易外经司", "freq": "月度（15日前后）", "latest": "39824 亿元 / +0.4%（8月，除汽车 +2.5%）", "imp": "通讯器材类是 AI 换机先行指标；汽车类决定车机与渠道协同目标"}, {"metric": "规模以上工业增加值", "org": "国家统计局工业司", "freq": "月度（15日前后）", "latest": "+5.2%（8月，1—8月累计 +5.3%）", "imp": "电子与高技术制造业分项校验 AI 产业链实际产出强度"}, {"metric": "规模以上工业企业利润（分行业）", "org": "国家统计局工业司", "freq": "月度（27日前后）", "latest": "1—7月 4.58 万亿元 / +17.6%", "imp": "电子行业利润集中度决定供应链议价权归属与长协谈判节奏"}, {"metric": "进出口（分商品）", "org": "海关总署", "freq": "月度（7—8日）", "latest": "4.65 万亿元 / +19.8%（8月）", "imp": "集成电路与计算机产品出口是 AI 硬件外需读数；进口均价直接映射 BOM 成本"}, {"metric": "M2 / 社融 / 贷款 / LPR", "org": "中国人民银行", "freq": "月度（10—20日）", "latest": "M2 +7.5%、社融 +7.2%、对实体贷款 +5.0%", "imp": "融资成本与信用扩张；贷款增速反映居民与企业真实加杠杆意愿"}, {"metric": "全社会用电量（分行业）", "org": "国家能源局", "freq": "月度（20日前后）", "latest": "1.04 万亿千瓦时 / +1.7%（7月）", "imp": "充换电与互联网数据服务用电是 AI 算力与电动化真实需求的硬指标"}, {"metric": "固定资产投资（分领域）", "org": "国家统计局投资司", "freq": "月度（15日前后）", "latest": "1—8月 -7.2%（扣房地产 -4.2%）", "imp": "信息服务业与电子通信设备制造投资反映 AI 基建落地节奏"}, {"metric": "发改委宏观经济运行与政策", "org": "国家发展改革委", "freq": "月度（月中发布会）", "latest": "8 月发布会（8/28）；9 月发布会 9/16", "imp": "「六张网」与两重项目清单是政企与行业侧需求的前置信号"}, {"metric": "货币政策执行报告", "org": "中国人民银行", "freq": "季度", "latest": "2026 年第二季度（8/12）", "imp": "政策取向与利率汇率框架，影响海外业务结算与集团融资安排"}, {"metric": "GDP 与国民经济运行情况", "org": "国家统计局", "freq": "季度", <script>'use strict';
/* ============================================================
   统一渲染引擎：4 产业（终端/汽车/互联网/芯片半导体）× 4 栏目
   （行业今日头条 / 新产品发布解读 / 最新财报解读 / 市场大盘追踪）
   ============================================================ */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function redify(s){
  var t = String(s==null?'':s);
  /* 数据中历史写入的 <b class="hl-red">…</b> 先归一化为 **…**，
     否则经 esc() 转义后会在页面上显示成可见的标签文本（程序符号） */
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>([\s\S]*?)<\/b\s*>/gi, '**$2**');
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>/gi, '');
  t = t.replace(/<\/b\s*>/gi, '');
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>');
}

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return redify(t||'');
  return '<div class="summary-lines">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}
const BRAND_COLORS = {
  '华为':'#c7000b','苹果':'#1d1d1f','小米':'#ff6900','红米':'#ff0000','三星':'#1428a0',
  '荣耀':'#00b4a0','索尼':'#1d4ed8','OPPO':'#0b8a3d','vivo':'#415fff','联想':'#16a34a',
  '高通':'#7c3aed','台积电':'#ea580c','SK海力士':'#ea580c','英伟达':'#16a34a','OpenAI':'#0ea5e9',
  '字节':'#1d4ed8','Meta':'#7c3aed','RayNeo':'#0ea5e9','XREAL':'#7c3aed','华硕':'#d90012',
  '阿里':'#ff6a00','腾讯':'#07c160','百度':'#2932e1','谷歌':'#4285f4','微软':'#00a4ef',
  '比亚迪':'#e61a27','吉利':'#0a4a9e','理想':'#0aa36b','蔚来':'#00b9c9','零跑':'#e60012',
  '赛力斯':'#1a6fb5','特斯拉':'#cc0000','小鹏':'#00b0f0','长安':'#1f6f3a','奇瑞':'#c8102e',
  '广汽':'#0a6cb0','上汽':'#7a1f1f','长城':'#c9a227','智界':'#c7000b','问界':'#c7000b'
};
function brandColor(b){ if(!b) return '#2563eb'; for(const k in BRAND_COLORS){ if(b.indexOf(k)>=0) return BRAND_COLORS[k]; } return '#2563eb'; }
function bodyClean(t){ return (t||'').replace(/^(关键发现|管理启示|分析观点)[：:]\s*/, ''); }
function numberedLines(t){
  const s = bodyClean(t);
  const parts = s.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<=1) return esc(s);
  return '<div class="nl">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div class="nl-i"><span class="mk">'+mk+'</span>'+esc(body)+'</div>';

let mktGC = 'global';
function renderCategoryMarket(){
  const keys = Object.keys(cur.marketData);
  el('mkt-gc').innerHTML = '<div class="gc-btn active" data-gc="global">全球</div><div class="gc-btn" data-gc="china">中国</div>';
  el('mkt-gc').querySelectorAll('.gc-btn').forEach(t=>t.addEventListener('click',()=>{
    el('mkt-gc').querySelectorAll('.gc-btn').forEach(x=>x.classList.remove('active'));

  }));
  el('mkt-tabs').innerHTML = keys.map((k,i)=>'<div class="mkt-tab '+(i===0?'active':'')+'" data-k="'+k+'">'+esc(cur.marketData[k].name)+'</div>').join('');
  el('mkt-tabs').querySelectorAll('.mkt-tab').forEach(t=>t.addEventListener('click',()=>{
    el('mkt-tabs').querySelectorAll('.mkt-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); drawMkt(t.dataset.k);
  }));
  el('mkt-toggle').addEventListener('click',()=>{ const t=el('mkt-tbl'); t.classList.toggle('show'); el('mkt-toggle').textContent = t.classList.contains('show')?'▾ 隐藏数据表格':'▸ 显示数据表格'; });
  drawMkt(keys[0]);
}
function drawMkt(key){
  const d = cur.marketData[key][mktGC];
  const labels = d.series.map(s=>s.label);
  const vals = d.series.map(s=>s.shipment);
  const yoy = d.series.map(s=>(typeof s.yoy==='number'? s.yoy : null));
  if(charts.mkt) charts.mkt.dispose();
  charts.mkt = echarts.init(el('mkt-chart'));
  charts.mkt.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },
    tooltip:{ trigger:'axis' },
    legend:{ data:['出货','同比YoY'], bottom:0 },
    grid:{ left:55, right:55, top:50, bottom:50 },
    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }
    ]
  }, true);
  const sh = el('mkt-shares');
  if(d.shares){
    el('mkt-share-note').textContent = '（'+(mktGC==='global'?'全球':'中国')+'厂商份额）';
    sh.innerHTML = '<tr><th>厂商</th><th>份额(%)</th><th>同比变化(pp)</th></tr>'+d.shares.map(s=>'<tr><td><b>'+esc(s.brand)+'</b></td><td>'+s.share+'</td><td class="'+(s.chg.indexOf('+')===0?'up':'down')+'">'+esc(s.chg)+'</td></tr>').join('');
  } else { sh.innerHTML=''; el('mkt-share-note').textContent='（该品类暂无分厂商份额数据 · '+(mktGC==='global'?'全球':'中国')+'）'; }
  const seg = el('mkt-segments');
  seg.innerHTML = d.segments? '<tr><th>分类</th><th>数值</th><th>说明</th></tr>'+d.segments.map(s=>'<tr><td>'+esc(s.name)+'</td><td><b>'+esc(s.val)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('') : '';
  const tbl = el('mkt-tbl');
  tbl.innerHTML = '<tr><th>周期</th><th>出货量(亿)</th><th>同比</th></tr>'+d.series.map(s=>'<tr><td>'+esc(s.label)+'</td><td>'+s.shipment+'</td><td>'+esc(s.yoy)+'</td></tr>').join('');
  drawMktShare(key);
}
function drawMktShare(key){
  const d = cur.marketData[key][mktGC];
  const box = el('mkt-share-chart');
  if(!d.shares || !d.shares.length){ if(charts.mktShare){charts.mktShare.dispose();} charts.mktShare=null; box.innerHTML='<div style="color:#9ca3af;text-align:center;padding:46px 0;font-size:13px">该品类暂无分厂商份额可视化数据</div>'; return; }
  const brands=d.shares.map(s=>s.brand), shares=d.shares.map(s=>s.share);
  const chgList=d.shares.map(s=>String(s.chg==null?'':s.chg));
  if(charts.mktShare) charts.mktShare.dispose();
  charts.mktShare = echarts.init(box);
  charts.mktShare.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）厂商份额与同比变化', left:'center', textStyle:{fontSize:13,color:'#1f2937'} },
    tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, formatter:function(p){ const i=p[0].dataIndex; let s='<b>'+brands[i]+'</b><br/>份额：'+shares[i]+'%'; if(chgList[i]&&chgList[i]!=='—') s+='<br/>同比变化：'+chgList[i]+' pp'; return s; } },
    grid:{ left:46, right:24, top:46, bottom:28 },
    xAxis:{ type:'category', data:brands, axisLabel:{interval:0, fontSize:11} },
    yAxis:{ type:'value', name:'%' },
    series:[{ type:'bar', barWidth:'52%', data:d.shares.map((s,idx)=>{ const ch=chgList[idx]; let col='#9ca3af'; if(ch){ if(ch.indexOf('+')===0)col='#dc2626'; else if(ch.indexOf('-')===0)col='#16a34a'; } return { value:s.share, itemStyle:{color:brandColor(s.brand), borderRadius:[4,4,0,0]}, label:{show:true,position:'top',fontSize:11,color:col,formatter:function(p){ return p.value+'%'+(ch&&ch!=='—'?' ('+ch+')':''); }} }; }) }]
  }, true);
}

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);
    else if(card.type==='brandtable') drawBrandTable(id, card);
  });
}
function drawLine(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis'}, legend:{bottom:0,type:'scroll'}, grid:{left:55,right:30,top:46,bottom:54}, xAxis:{type:'category',data:card.months,axisLabel:{fontSize:11}}, yAxis:{type:'value',name:card.unit||''}, series:card.series.map(s=>({name:s.name,type:'line',data:s.data,smooth:true,symbolSize:6,lineStyle:{width:2.4},itemStyle:{color:s.color||'#2563eb'}})) }, true);
}
function drawBar(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  const items = card.items||[];
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, grid:{left:90,right:30,top:46,bottom:30}, xAxis:{type:'value',name:card.unit||''}, yAxis:{type:'category',data:items.map(i=>i.label).reverse(),axisLabel:{fontSize:11}}, series:[{type:'bar',data:items.slice().reverse().map(i=>({value:i.value,itemStyle:{color:i.color||'#2563eb',borderRadius:[0,4,4,0]}})), label:{show:true,position:'right',fontSize:11,formatter:'{c}'}}] }, true);
}
function drawPie(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'}, legend:{bottom:0,type:'scroll'}, series:[{type:'pie',radius:['38%','66%'],data:(card.items||[]).map(i=>({name:i.label,value:i.value,itemStyle:{color:i.color}})), label:{formatter:'{b}\n{c}%',fontSize:11}}] }, true);
}
function drawTable(id, card){
  el(id).innerHTML = '<tr>'+card.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+(card.rows||[]).map(r=>'<tr>'+r.map((x,i)=>{ const cls=(card.cls&&card.cls[i])?(' class="'+card.cls[i]+'"'):''; return '<td'+cls+'>'+esc(x)+'</td>'; }).join('')+'</tr>').join('');
}
function drawCombo(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({
    title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}},
    tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},
    legend:{bottom:0},
    grid:{left:60,right:60,top:46,bottom:54},
    xAxis:{type:'category',data:card.x,axisLabel:{fontSize:11}},
    yAxis:[
      {type:'value',name:card.yBar||'',position:'left'},
      {type:'value',name:card.yLine||'',position:'right',axisLabel:{formatter:'{value}'}}
    ],
    series:[
      {name:card.bar.name,type:'bar',data:card.bar.data,itemStyle:{color:card.bar.color||'#16a34a'},barWidth:'46%',
        label:{show:true,position:'top',fontSize:11,formatter:function(p){return p.value;}}},
      {name:card.line.name,type:'line',yAxisIndex:1,data:card.line.data,symbolSize:8,
        itemStyle:{color:card.line.color||'#b45309'},
        label:{show:true,position:'bottom',fontSize:11,formatter:function(p){return p.value==null?'—':p.value+'%';}}}
    ]
  }, true);
}
function ensureBrandTableCss(){
  if(document.getElementById('bt-css')) return;
  const s=document.createElement('style'); s.id='bt-css';
  s.textContent='.bt-bar-wrap{position:relative;display:flex;align-items:center;gap:8px;min-width:170px}.bt-bar{height:14px;border-radius:3px;background:linear-gradient(90deg,#16a34a,#22c55e);flex:0 0 auto}.bt-val{font-size:12px;color:#374151;font-weight:600}.bt-note-row td{background:#f8fafc;color:#6b7280;font-size:11px;padding:4px 10px}';
  document.head.appendChild(s);
}
function drawBrandTable(id, card){
  ensureBrandTableCss();
  const maxScale = 40;   // 比亚迪规模远超其余，按 40 万为满条，避免其他不可见
  const rows = (card.rows||[]).map(function(r){
    const barW = Math.min(100, (r.sales/maxScale)*100);
    let yoyCls=''; let yoyTxt='—';
    if(typeof r.yoy==='number'){ yoyTxt=(r.yoy>0?'+':'')+r.yoy+'%'; yoyCls=r.yoy>0?'up':'down'; }
    const share=(typeof r.share==='number')?r.share+'%':(r.share||'—');
    return '<tr><td><b>'+esc(r.brand)+'</b></td>'+
      '<td><div class="bt-bar-wrap"><div class="bt-bar" style="width:'+barW.toFixed(1)+'%"></div><span class="bt-val">'+r.sales+'</span></div></td>'+
      '<td class="'+yoyCls+'">'+yoyTxt+'</td>'+
      '<td>'+share+'</td></tr>'+
      (r.note?'<tr class="bt-note-row"><td colspan="4">'+esc(r.note)+'</td></tr>':'');
  }).join('');
  el(id).innerHTML = '<tr><th>'+card.headers.join('</th><th>')+'</th></tr>'+rows;
}

/* 汽车 / 互联网 / 芯片 专用大盘 */
function renderMarket(m){
  if(m.type==='auto' && m.cards){ renderCards(m.cards); return; }
  if(m.type==='internet'){ renderInternet(m); return; }

let abChartsPending = false;
function drawAutoBoardCharts(){
  if(cur !== DATA.auto) return;
  if(!abChartsPending) return;
  if(!el('t4') || !el('t4').classList.contains('active')) return; // 等 t4 可见再画
  const D = DATA.auto.autoBoard;
  if(!D) return;
  abChartsPending = false;
  try{
    abMk('ab_c_total', abLine(D.pt_dates,[{name:'终端销量(万辆)',type:'line',smooth:true,data:D.pt_total.map(function(v){return v==null?null:+(v/10000).toFixed(1);}),itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],false));
    abMk('ab_c_nev', abLine(D.pt_dates,[{name:'新能源渗透率',type:'line',smooth:true,data:D.nev_pen,itemStyle:{color:'#16a34a'},areaStyle:{color:'rgba(22,163,74,.08)'}}],true));
    // 三、自主品牌月度销量（堆叠柱）+ 自主品牌合计（折线，右轴）
    (function(){
      var win = Math.min(19, D.oem_dates.length);
      var idx0 = D.oem_dates.length - win;
      var months = D.oem_dates.slice(idx0);
      var brands = Object.keys(D.oem);
      var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2','#ea580c','#65a30d','#dc2626','#9333ea'];
      var s = brands.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:D.oem[b].slice(idx0),itemStyle:{color:pal[i%pal.length]}}; });
      var tot = months.map(function(_,i){ var s2=0; brands.forEach(function(b){ var v=D.oem[b][idx0+i]; if(v) s2+=v; }); return s2; });
      s.push({name:'自主品牌合计',type:'line',yAxisIndex:1,data:tot,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:6,
        label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(0)+'万';}}});
      abMk('ab_c_dom', {
        tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
        grid:{left:64,right:64,top:42,bottom:34},
        xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
        yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
               {type:'value',name:'合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
        series:s
      });
    })();
    abMk('ab_c_nh', abLine(D.noa_h_dates,[{name:'高速NOA',type:'line',smooth:true,data:D.noa_h,itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],true));
    abMk('ab_c_nu', abLine(D.noa_u_dates,[{name:'城区NOA',type:'line',smooth:true,data:D.noa_u,itemStyle:{color:'#7c3aed'},areaStyle:{color:'rgba(124,58,237,.08)'}}],true));
    var tcolors=['#0ea5e9','#0d9488','#f59e0b','#db2777','#64748b'];
    var tseries=Object.keys(D.tier).map(function(nm,i){return {name:nm,type:'line',smooth:true,data:D.tier[nm],itemStyle:{color:tcolors[i%tcolors.length]}};});
    abMk('ab_c_tier', abLine(D.tier_dates,tseries,true));

function drawHimaCharts(H){
  var months = H.months || [];

    h += '<div class="card"><div class="section-title">数据来源 <span class="en">Sources · 官方发布</span></div><div class="mc-src">'+
      cur.sources.map(function(g){
        return '<div class="mc-src-c"><div class="h">'+esc(g.h)+'</div><ul>'+(g.items||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      }).join('')+'</div></div>';
  }
  c.innerHTML = h;
  el('msub-tabs').innerHTML = subs.map(function(s,i){
    return '<div class="mkt-tab '+(i===0?'active':'')+'" data-k="'+s.k+'">'+esc(s.label)+'</div>';}).join('');
  el('msub-tabs').querySelectorAll('.mkt-tab').forEach(function(t){
    t.addEventListener('click',function(){
      el('msub-tabs').querySelectorAll('.mkt-tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curMacroSub=t.dataset.k; renderMacroSub(); macDraw();
    });
  });
  if(subs.length) curMacroSub = subs[0].k;
  renderMacroSub();
}
function renderMacroSub(){
  const body = el('msub-body'); if(!body) return;
  const subs = (cur.market && cur.market.subs) || [];
  const s = subs.filter(function(x){return x.k===curMacroSub;})[0];
  if(!s){ body.innerHTML=''; return; }
  body.innerHTML = mcVerdict(s.verdict) + mcSection(s);
}

/* ---------------- 宏观图表绘制 ---------------- */
function macDraw(){
  if(curCat!=='macro' || !window.echarts) return;
  document.querySelectorAll('.mc-chart').forEach(function(box){
    if(!box.id) return;
    const cfg = MC_CHART_MAP[box.id]; if(!cfg) return;
    if(charts[box.id]){ try{charts[box.id].dispose();}catch(e){} }
    charts[box.id] = echarts.init(box);
    charts[box.id].setOption(mcOpt(cfg), true);
  });
}
function drawMacroCharts(){ macDraw(); }
function mcOpt(cfg){
  const AX = {color:'#6b7280', fontSize:11};
  if(cfg.type==='line'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), bottom:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:52,bottom:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',min:(cfg.min==null?null:cfg.min),max:(cfg.max==null?null:cfg.max),axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'line',data:s.data,smooth:0.28,symbol:'circle',symbolSize:5,connectNulls:true,
          lineStyle:{width:2.4,color:s.color},itemStyle:{color:s.color},
          markLine:s.markLine?{silent:true,symbol:'none',lineStyle:{color:'#cbd5e1',type:'dashed',width:1.2},
            label:{formatter:s.markLine,position:'insideEndTop',color:'#6b7280',fontSize:10},data:[{yAxis:s.markVal}]}:null};
      }) };
  }
  if(cfg.type==='hbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:20,right:52,top:46,bottom:20,containLabel:true},
      xAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      yAxis:{type:'category',data:cfg.y,axisLabel:Object.assign({width:cfg.yw||150,overflow:'truncate'},AX)},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',barMaxWidth:15,
          data:s.data.map(function(v,i){ return {value:v, itemStyle:{color:(s.colors&&s.colors[i])||s.color||'#2563eb', borderRadius:[0,3,3,0]}}; }),
          label:{show:true,fontSize:10.5,color:'#6b7280',formatter:function(p){return (p.value>0?'+':'')+p.value+'%';}},
          labelLayout:function(p){ var pos=p.value>=0; return {x:p.rect.x+(pos?p.rect.width+6:-6),y:p.rect.y+p.rect.height/2,verticalAlign:'middle',align:pos?'left':'right'}; }};
      }) };
  }
  if(cfg.type==='vbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:46,bottom:cfg.rotate?82:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,rotate:cfg.rotate||0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',data:s.data,barMaxWidth:s.barMaxWidth||26,
          itemStyle:{color:s.color||'#2563eb',borderRadius:[3,3,0,0]},
          label:{show:true,position:'top',fontSize:10.5,color:'#6b7280',
            formatter:function(p){return p.value==null?'':(p.value>0?'+':'')+p.value+'%';}}};
      }) };
  }
  if(cfg.type==='combo'){
    return { tooltip:{trigger:'axis'},
      legend:{data:[cfg.bar.name,cfg.line.name], top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:58,top:46,bottom:cfg.rotate?74:44,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,lineHeight:13,fontSize:10.5},AX)},
      yAxis:[{type:'value',name:cfg.yBar||'',axisLabel:AX},{type:'value',name:cfg.yLine||'',splitLine:{show:false},axisLabel:AX}],
      series:[
        {name:cfg.bar.name,type:'bar',data:cfg.bar.data,barMaxWidth:30,
         itemStyle:{color:cfg.bar.color||'#2563eb',borderRadius:[3,3,0,0]},
         label:{show:true,position:'top',fontSize:10,color:'#6b7280',formatter:'{c}'}},
        {name:cfg.line.name,type:'line',yAxisIndex:1,data:cfg.line.data,smooth:0.2,symbol:'circle',symbolSize:8,
         lineStyle:{width:2.4,color:cfg.line.color||'#dc2626'},itemStyle:{color:cfg.line.color||'#dc2626'}}
      ]};
  }
  return {};
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  /* 事件委托：tabnav 的 innerHTML 会随一级板块重写，逐个绑定会导致切换后监听失效 */
  const nav = el('tabnav');
  nav.addEventListener('click', function(ev){
    const t = ev.target && ev.target.closest ? ev.target.closest('.tab-item') : null;
    if(!t) return;
    nav.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id = t.dataset.tab;
    curTab = id;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    renderMacroBrief();
    setTimeout(()=>{
      for(const k in charts){ try{ charts[k].resize(); }catch(e){} }
      if(id==='t4'){
        if(cur===DATA.auto) drawAutoBoardCharts();
        if(curCat==='macro') drawMacroCharts();
      }
    },60);
  });
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
</body>
