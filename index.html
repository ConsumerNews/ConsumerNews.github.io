<script>const DATA = {"terminal": {"updateTime": "2026-09-11 06:00", "headlineViewpoints": [{"t": "**苹果iPhone Duo定15999元但10/23才发售**，33天空窗给华为Mate XT 2", "s": "核心观点：苹果9/10发布首款折叠iPhone Duo国行15999元起，但10/23才发售、日产仅数百台、铰链良率65%、10/16预购。华为Mate XT 2三折叠9/12即开售，抢33天空窗。**苹果折叠产能爬坡漫长给了华为三折叠品类定义权的黄金窗口**。高层建议：终端应在窗口期密集铺货Mate XT 2与Pura X View，用三折叠加阔直板双形态锁定高端心智，10/23前完成首销量与口碑占位。", "l": "财联社 / 快科技", "u": "https://www.cls.cn/detail/2478764"}, {"t": "**小米18 Fold首销+310%验证万元折叠需求**，顶配售罄暴露产能误判", "s": "核心观点：小米18 Fold 9/10开售首销同比+310%，顶配16+1TB售罄、转让溢价400至1000元，陶瓷版15999元限量1500台秒没。**万元折叠需求被严重低估，产能误判致溢价流失到二手渠道**。首发玄戒O3+长鑫LPDDR6双国产。高层建议：集团终端应重估万元折叠需求弹性，产能按首销3倍预留，避免顶配断货催生二手溢价侵蚀品牌定价权。", "l": "微博 / 腾讯新闻", "u": "https://weibo.com/7447724345/5341208748491541"}, {"t": "**华为Pura X View首销18万台**，阔直板开辟折叠与直板间第三路线", "s": "核心观点：华为全球首款阔直板Pura X View 9/9开售首日销量超18万台，5999元起线下排长队、线上秒空，首批用户反馈旦阔难回。6.39英寸16:9.5阔屏+96.1%屏占比+7000mAh。**阔直板在传统细长直板与高价折叠间开辟第三路线，验证形态创新需求**。高层建议：阔直板是新赛道，华为应快速扩品，在友商跟进前卡位。", "l": "华尔街见闻 / QQ新闻", "u": "https://new.qq.com/rain/a/20260910A0AUQF00"}, {"t": "**存储1年翻4倍且扩产需至2027H2**，手机涨价至少持续一年", "s": "核心观点：DDR4 8Gb现货从3.2美元涨到15美元（+369%），12+256G套片从500元飙至2200元（+300%），存储占BOM从10%至15%飙至30%至40%首超SoC。AI服务器抢占70%先进产能，新建存储厂需1.5至2年。**扩产最快2027下半年才释放，短期看不到回调**。高层建议：终端定价须按存储高位运行1年以上建模，低端砍配保价、高端以品牌溢价消化。", "l": "新华财经 / 新浪科技", "u": "https://www.toutiao.com/article/7681574187386814986/"}, {"t": "**华为Mate 90提档9/15首发麒麟9050Pro+鸿蒙7**，正面截胡苹果", "s": "核心观点：华为Mate 90系列发布提档自9/23至9/15（选芯片断供纪念日），首发麒麟9050 Pro（韬定律逻辑折叠，晶体管密度+53.5%、能效+41%）+鸿蒙7，入网标注5G回归，麒麟产能爬坡完成可大批量现货。**9/15是华为正面截胡苹果iPhone 18 Pro（9/18发售）的关键节点**。高层建议：终端应确保9/15后即大批量现货，用韬定律芯片叙事对位苹果2nm。", "l": "今日头条 / 新浪科技", "u": "https://www.toutiao.com/article/7660186948727865894"}, {"t": "**鸿蒙7公测24小时破500万**，稳居国内第二大手机OS、Q4望破1亿", "s": "核心观点：鸿蒙7 9/7发布，24小时升级破500万，鸿蒙6+7终端破8500万、Q4望破1亿，稳居国内第二大手机OS。小艺升级系统级智能体，感知200余项数据、调度2100余项能力。工信部十五五规划把开源鸿蒙写入6G战略。**鸿蒙生态拐点已至，从兼容走向原生自循环**。高层建议：加速原生应用迁移与全场景设备适配，把鸿蒙升级为集团全场景底座。", "l": "中国日报 / IT之家", "u": "https://tech.chinadaily.com.cn/a/202609/08/WS6a9f728ce4b09a165c788921.html"}, {"t": "**苹果A20 Pro首发2nm+可变光圈**，特努斯首场标准版推迟2027春", "s": "核心观点：苹果9/10发布会特努斯接任CEO首场，iPhone 18 Pro 9999元起、Pro Max 10999元起，A20 Pro 2nm GPU最高+40%、VC均热板面积×3、自研C2基带，主摄首次四档可变光圈，标准版推迟2027春。**苹果2nm+可变光圈抬高旗舰硬件天花板**。高层建议：华为须用韬定律逻辑折叠加鸿蒙7智能体差异化应对，避免与苹果拼制程参数。", "l": "界面新闻 / 太平洋科技", "u": "https://www.toutiao.com/article/7683639221575303690/"}, {"t": "**9月折叠屏三强72小时定格局**，三档价格带成形", "s": "核心观点：9/7华为Mate XT 2三折叠19999元、9/7小米18 Fold中折叠10999元、9/10苹果iPhone Duo折叠15999元，72小时内三强定格局。三档价格带成形：华为守2万心智、小米卡万元空白带、苹果定义标杆。**折叠屏从错峰避让转正面交锋**。高层建议：终端应按价格带分层卡位，三折叠守超高端、中折叠卡万元、阔直板卡5至8千，避免内线互搏。", "l": "今日头条 / 微博", "u": "https://www.toutiao.com/article/7683434392647303716/"}, {"t": "**全球超40%手机机型涨价、均价+15%**，换机周期拉长至42个月", "s": "核心观点：Counterpoint数据2026年超40%手机机型涨价、零售均价+15%、新机较去年高25%。价格敏感市场涨幅最猛：印度+21%、亚太+19%、中东+18%。消费者延长换机周期至42个月、转向二手。**涨价潮加速低端出清与高端集中**。高层建议：集团应砍低端走量机型、资源向中高端倾斜，用以旧换新加分期缓解消费者价格痛感，保住存量盘。", "l": "新华财经 / 财经网", "u": "https://new.qq.com/rain/a/20260904A0DFHJ00"}, {"t": "**IDC Q2华为+19.4%逆势登顶中国第一**，苹果+24.4%仅两正增长品牌", "s": "核心观点：IDC Q2中国出货6601万台(-4.3%)连缩5季，华为+19.4%份额22.6%登顶、苹果+24.4%份额18.1%，为前十仅两个正增长品牌。小米-21.7%、OPPO-9.7%、vivo-11.4%均双位数下滑。**涨价周期中华为苹果凭品牌力逆势增长，国产中端承压**。高层建议：华为应维持售价稳定对冲竞品涨价，用麒麟加鸿蒙生态粘性锁定存量用户。", "l": "百度百科 / CNMO", "u": "https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E6%99%BA%E8%83%BD%E6%89%8B%E6%9C%BA%E5%B8%82%E5%9C%BA/67949403"}], "opinionLeaders": [{"name": "余承东", "role": "华为常务董事、终端BG董事长", "items": [{"hl": "9/10-9/11 Mate XT 2非凡大师9/12开售在即，门店真机到店围观火爆，消费者首问麒麟9050Pro水平", "detail": "9/12 10:08开售19999元起，顶配2TB手写笔套装29999元。门店真机一到店围观者不问价格不看赠品、第一句全是问麒麟9050Pro到底什么水平——这是韬定律首秀，国产芯片用逻辑折叠绕开传统缩微杀出新路。六年了大家等的不是参数是一口憋在胸口的气。", "l": "今日头条", "u": "https://www.toutiao.com/w/1875983474209923/"}, {"hl": "9/8官宣HarmonyOS 7公测24小时升级设备破500万，鸿蒙稳居国内第二大手机操作系统", "detail": "鸿蒙6与7终端数合计破8500万、四季度望破1亿；小艺升级为可养成的系统智能体，可调用2100余项系统能力与500多家伙伴精选Skills，一句话完成复杂任务；256GB机型最多可释放22GB、1TB机型最多释放109GB存储空间。", "l": "快科技 / IT之家", "u": "https://mobile.zol.com.cn/1245/12452173.html"}, {"hl": "9/7发布会详解麒麟9050 Pro：时隔六年再推全新麒麟芯片，采用逻辑折叠（韬定律）架构", "detail": "全球首发逻辑折叠技术，每平方毫米多容纳55%晶体管、关键任务功耗降66%、整机性能提升42%；Mate XT 2三折叠全球发货量已突破100万台，该品类从概念到百万级量产仅用一年多。", "l": "腾讯新闻 / 联合早报", "u": "https://www.toutiao.com/article/7683226445342081574/"}]}, {"name": "雷军", "role": "小米董事长兼CEO", "items": [{"hl": "9/10小米18 Fold开售喊出物超所值，首销同比+310%、顶配售罄", "detail": "小米18 Fold 9/10 10:00全渠道开售10999元起，首销较上代大折叠同比+310%，16+1TB顶配及15999元陶瓷特别版限量1500台迅速售罄，二手溢价400至1000元。雷军称摔了超1500台工程机做跌落测试，团队戏称折叠机的坟场；十年芯片研发预计投入500亿，已投210亿。", "l": "微博 / 腾讯新闻", "u": "https://weibo.com/8472074236/5341722486772988"}]}, {"name": "郭明錤", "role": "天风国际证券分析师", "items": [{"hl": "预判折叠iPhone一机难求：下半年仅700至800万台、Q3仅50至100万台", "detail": "iPhone Duo初期日产量仅数百台、铰链良率约65%、等待4至6周、二手溢价50%至100%。苹果折叠产能爬坡缓慢，国行延后至国庆后。KeyBanc预测2026H2 iPhone产量减1100万部(-12%)。", "l": "财联社 / 新浪科技", "u": "https://www.cls.cn/detail/2478764"}]}, {"name": "孙燕飙", "role": "手机中国联盟秘书长", "items": [{"hl": "判断手机起售价2000元起步，存储占BOM飙至30%以上、千元机绝迹", "detail": "过去一年全球存储芯片价格持续上涨，智能手机运行内存与机身存储价格均上涨超100%。12+256G套片采购成本从约500元涨到2200元翻了3倍多，存储已超越处理器成为手机最贵单一零件。4000元高端门槛标准失效，千元机份额从2023年22%降至2026Q1的2.7%。", "l": "新华财经 / 新浪科技", "u": "https://www.toutiao.com/article/7681574187386814986/"}]}, {"name": "何刚", "role": "华为终端BG首席运营官", "items": [{"hl": "9/7发布视频详解Mate XT 2非凡大师设计：33个星钻切面+织金云锦工艺", "detail": "青云纹理（紫气东来青云直上）+3.5mm超薄机身首次容纳内外双屏+玄黑/皓白/锦紫三配色+灵盾防窥屏版+防水抗跌落。余承东坦言内存成本涨了2000多，配置也增加很多，这次价格真的非常有诚意。", "l": "腾讯新闻 / 今日头条", "u": "https://www.toutiao.com/article/7683226445342081574/"}]}, {"name": "马克·古尔曼", "role": "彭博社首席记者", "items": [{"hl": "9/10苹果发布会前再报折叠iPhone目前日产量仅数百台、品控严苛致产能爬坡缓慢", "detail": "iPhone Duo铰链良率约65%、初期日产量仅数百台，国行延后至国庆后。9/4苹果收跌2.51%报319.97美元，单日市值蒸发1203亿美元（约8074亿元人民币）。", "l": "彭博社 / 新浪财经", "u": "https://finance.sina.cn/tech/2026-09-04/detail-2.html"}]}], "leadersSummary": "①**余承东9/10-9/11 Mate XT 2开售在即门店围观火爆**：9/12 10:08开售19999元起，消费者首问麒麟9050Pro水平②**雷军9/10喊出物超所值**：小米18 Fold首销+310%、顶配售罄，万元折叠验证国产高端需求，玄戒O3+长鑫LPDDR6双国产③**郭明錤预判折叠iPhone一机难求**：下半年700-800万台、Q3仅50-100万台，日产数百台、二手+50-100%④**孙燕飙判断起售价2000元起步**：存储占BOM飙至30%+、千元机绝迹，4000元高端门槛失效⑤**何刚详解Mate XT 2设计**：33星钻切面+织金云锦青云纹理，3.5mm超薄机身容纳内外双屏⑥**古尔曼再报折叠iPhone日产数百台**：铰链良率65%、国行延后国庆后，9/4苹果单日蒸发8074亿元", "institutionViews": [{"name": "Counterpoint", "items": [{"t": "Q2智能手机内存价格环比涨超80%，存储占BOM从10%至15%升至20%以上，内存首超SoC成旗舰最贵单一器件", "s": "分价格段看：低端机（批发价低于200美元）BOM同比增70%、几乎全部由存储驱动；中端机（400至600美元）BOM增52%、内存已占总成本40%；旗舰（800美元以上）BOM增近50%。价格越低的机型受涨价挤压越重，往高端走才有消化成本的空间。", "l": "Counterpoint Research / 21世纪经济报道", "u": "https://news.qq.com/rain/a/20260908A07N2Y00"}, {"t": "2026年迄今全球智能手机零售价平均上涨约15%，新上市机型较去年同期高约25%，超40%机型已调价", "s": "价格敏感市场涨幅最明显：印度+21%、亚太+17%、中东+18%；中国品牌因产品布局集中于入门级和中端受冲击严重，小米/OPPO/vivo二季度出货均录得两位数同比跌幅；消费者普遍推迟换机、转向老款或延长换机周期至42个月。", "l": "Counterpoint Research", "u": "https://new.qq.com/rain/a/20260904A0DFHJ00"}, {"t": "2026年底全球折叠屏累计出货将破1亿台，苹果首款折叠出货最高600万台、份额25%升至第二", "s": "三星以32%居首、华为24%第三、苹果25%升至第二；但苹果初期日产仅数百台、铰链良率65%、国行延后至国庆后；Omdia数据2026H1全球折叠出货510万部同比-21.6%，下半年苹果入局将重塑格局。", "l": "Counterpoint Research / 网易新闻", "u": "https://c.m.163.com/news/a/L1S1I03R053159A3.html"}]}, {"name": "IDC", "items": [{"t": "2026Q2中国智能手机出货6601万台(-4.3%)连缩5季，华为+19.4%份额22.6%登顶中国第一", "s": "苹果+24.4%份额18.1%为前十仅两个正增长品牌；小米-21.7%、OPPO-9.7%、vivo-11.4%均双位数下滑。华为与苹果维持售价稳定为观望消费者提供购买理由，苹果提前释放涨价信号促使部分消费者提前购机。千元机份额从2023年22%降至2026Q1的2.7%。", "l": "IDC / CNMO", "u": "https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E6%99%BA%E8%83%BD%E6%89%8B%E6%9C%BA%E5%B8%82%E5%9C%BA/67949403"}]}, {"name": "KeyBanc", "items": [{"t": "iPhone 18 Pro实测修正：国行9999元起（低于预测50美元）、Pro Max 10999元起、Duo 15999元起", "s": "iPhone 18 Pro 1199美元(+13.65%)、Pro Max 1299美元(+16.68%)、Duo 1999美元起。整体涨幅约10%低于早前暴涨传闻，标准版推迟至2027春。2026H2 iPhone产量减1100万部(-12.09%)，折叠iPhone产能爬坡缓慢是主因。", "l": "KeyBanc / 财联社", "u": "https://www.cls.cn/detail/2478764"}]}, {"name": "TrendForce", "items": [{"t": "存储供不应求持续至2027年，DDR4 8Gb现货从3.2美元涨到15美元(+369%)，新增产能至少2027H2才释放", "s": "AI服务器抢占70%先进产能，新建一座存储晶圆厂至少1.5至2年。SK海力士库存仅约4周、2026年HBM产能全部售罄。12+256G套片从500元飙至2200元(+300%)，存储占BOM从10%至15%飙至30%至40%首超SoC。换机周期从25个月拉长至42个月。", "l": "TrendForce / 新华财经", "u": "https://www.toutiao.com/article/768157418738681498 2027年前窗口。", "l": "博通财报/财联社 9/3", "u": "https://finance.eastmoney.com/a/202609033863199575.html"}, {"tag": "国产算力", "t": "2026年中国高端AI芯片国产份额近90%，管制逻辑由收货地转总部", "s": "核心观点：TrendForce 8月预测2026年中国高端AI芯片出货同比+83%、国产方案份额近90%。IDC：2025年中国AI加速卡出货约400万张，本土厂商165万张、份额达41%，华为昇腾81.2万张居国产第一。**管制逻辑已由看收货地转向看总部归属，国产替代由可选项变必选项**。高层建议：云与ICT算力采购向国产倾斜，同步构建自主互联与软件栈。", "l": "界面新闻/TrendForce 9/2", "u": "https://www.163.com/dy/article/L5R6GE6Q0534A4SC.html"}, {"tag": "国产存储", "t": "长鑫LPDDR6首发+份额10%列第四，苹果压价被拒、腾讯200亿长约", "s": "核心观点：长鑫H1营收1503亿元(+873.64%)、归母776亿元扭亏，8/29官宣LPDDR6量产(12800Mbps)小米18 Fold首发；苹果近期谈降价遭拒、产能已锁至2027。**Counterpoint Q2长鑫DRAM营收份额升至10%列全球第四、当季成长最快**，腾讯签3-5年超200亿元内存长约。高层建议：将长鑫纳入双供体系，跟踪HBM3E试产与客户认证。", "l": "腾讯新闻/21世纪 9/8-9/10", "u": "https://www.163.com/dy/article/L6A307OV05199NPP.html"}, {"tag": "关税管制", "t": "美逼荷兰禁售全部DUV并断维保，MATCH扩至盟友域外", "s": "核心观点：美正施压荷兰禁止对华销售几乎所有DUV光刻机，MATCH法案更进一步禁止已交付设备的日常维护与备件替换，将管制扩至盟国域外管辖；荷兰批评其损害主权。**从单边实体清单升级为多边锁链，成熟制程核心设备与维保亦被卡死**。高层建议：评估在产线维保与备件敞口，加速国产DUV/量测验证与备件备库。", "l": "同花顺 9/1", "u": "https://m.10jqka.com.cn/20260901/c679464996.shtml"}], "opinionLeaders": [{"name": "KB Securities 金东元(Kim Dong-won)", "role": "存储供需", "items": [{"hl": "**三星/SK库存降至不足10天，2027年或现史上最严重存储紧缺**", "detail": "KB Securities 9/9报告：AI云投资2027达1.3万亿美元(+60%)，存储占AI基建投资占比由14%→40%→57%；HBM4耗用约3倍DRAM晶圆、挤出传统DRAM。三星/SK股价三月回调超30%、预期PE降至约3倍，被列为板块首选。缺口由产能而非需求驱动，延续至2030。", "l": "KB Securities 9/9", "u": "https://www.toutiao.com/article/7683411112431206964/"}]}, {"name": "高通 CEO 安蒙(Cristiano Amon)", "role": "手机 SoC / 成本传导", "items": [{"hl": "**自9/1起全系提价两位数，只是把已发生的成本上涨向下游传导**", "detail": "台积电2nm晶圆报3万美元/片、较3nm约+50%，成本涨速快于售价调整节奏；骁龙8E6单颗成本已破300美元，为安卓史上最贵SoC。对终端厂意味着芯片与存储双重成本压力。", "l": "快科技/电子工程专辑 9/1", "u": "https://news.mydrivers.com/1/1147/1147510.htm"}]}, {"name": "博通 CEO 陈福阳(Hock Tan)", "role": "定制 ASIC / AI 半导体", "items": [{"hl": "**FY26 AI 半导体收入指引上调至580亿美元，FY27 翻倍至1150亿、FY28 达2300亿**", "detail": "已开始向谷歌量产交付下一代 TPU 8i，性能与英伟达 Vera Rubin 持平或更优；OpenAI Jalapeño 芯片2027年部署1.3GW；或为AI实验室提供残值担保支持其前期投入。", "l": "博通财报电话会 9/2", "u": "https://finance.eastmoney.com/a/202609033863199575.html"}]}, {"name": "美国商务部长 卢特尼克(Lutnick)", "role": "半导体关税政策", "items": [{"hl": "**在美建厂就不用缴税，不在美建厂想进美国市场就要付钱**", "detail": "正制定第二轮半导体232关税框架，免税进口配额挂钩企业在美产能承诺；税率、税目、生效时间均未公布，或按国别设差异化税率与配额，未来数周至数月仍可能大幅调整。", "l": "Bloomberg Law/Roic AI 9/2", "u": "https://www.roic.ai/news/lutnick-signals-tariff-relief-for-chipmakers-that-build-in-us-09-02-2026"}]}, {"name": "高盛 内存价格追踪团队", "role": "存储价格", "items": [{"hl": "**DDR5 16Gb 现货较合约溢价约16%、DDR4 8Gb 溢价达43%**", "detail": "8月DDR5 8GB PC模组由130升至133美元、DDR5 64GB服务器模组+1%至1500美元；DDR5较DDR4溢价扩至16%。维持三星/海力士买入，判断Q4或是本轮价格高点。", "l": "高盛存储价格追踪 9/1", "u": "https://news.qq.com/rain/a/20260901A0BIL500"}]}, {"name": "Ahn Ki-hyun(韩国半导体产业协会 KSIA)", "role": "HBM 产业", "items": [{"hl": "**HBM 每代新品良率即下降，HBM4 售价约为上代两倍、耗用更多 DRAM**", "detail": "随原厂提高产量，DRAM消耗上升、出口总量反而萎缩；即使新厂投产也只能缓解而无法消除短缺，必须建更多晶圆厂。SK海力士CEO郭鲁正称紧张将延续至2030年底。", "l": "首尔经济日报/财联社 8/31-9/1", "u": "https://www.toutiao.com/article/7680239820459655730/"}]}, {"name": "集邦咨询 TrendForce", "role": "报价与份额", "items": [{"hl": "**3Q26 传统 DRAM 合约价+13-18%、NAND+10-15%，涨幅收敛**", "detail": "消费端对高价承受力已达极限、涨幅较Q2明显收敛；9/10另报Q2前十大代工产值534.9亿美元(+11.5%)创新高，台积电72.5%/中芯5.4%破30亿；预估2026中国高端AI芯片出货+83%、国产份额近90%，英伟达中国份额或由约40%降至8%；HBM+RDIMM占2026 DRAM位元51%。", "l": "TrendForce 8月报告/东方财富 9/2-9/10", "u": "https://finance.eastmoney.com/a/202609103870688279.html"}]}, {"name": "中微公司 尹志尧", "role": "国产设备", "items": [{"hl": "**订单进入大规模交付期，未来5年厂房面积增至90万㎡、覆盖60%以上IC高端设备**", "detail": "9/10科创板业绩会：中微已形成金桥/临港一期/南昌三大基地，临港总部8/1落成、广州/成都2027H1投产、临港二期2026H2开工；针对零部件涨价提前战略备库并推进国产导入。CSEAC半年内两发6款自研新品，覆盖极高深宽比刻蚀/PECVD/ALD/金属薄膜/SiC外延。", "l": "科创板日报/中国证券报 9/10", "u": "https://news.qq.com/rain/a/20260910A0BW4G00"}]}, {"name": "长鑫存储 CXMT", "role": "国产存储", "items": [{"hl": "**苹果压价遭拒、产能锁至2027；HBM3E风险试产、韩媒称良率约25%**", "detail": "8/29官宣LPDDR6量产(12800Mbps)小米18 Fold首发；苹果近期谈降价被拒，华为/小米等已以长约锁定产能。HBM3E小批量试产、寒武纪/平头哥测试(韩媒9/10称试产良率约25%、TSV为瓶颈)。Counterpoint Q2 DRAM营收份额10%列全球第四；腾讯签3-5年超200亿长约，境外收入占比63.8 径失真。**8 月出口 +25.0%、1—7 月电子行业利润 **+110%**（单独拉动全部规上工业利润 **9.3 个百分点**），而汽车制造 **-20.4%**、黑色冶炼 -51.2% 仍在深跌——**不能用「工业利润 +17.6%」推导终端需求，必须按 AI 电子链与传统制造链分别设定目标**。", "**成本上行已获官方价格指数确认，且涨价开始向终端传导。**8 月工业生产者购进价格 **+5.8%** 高出出厂价格 **+3.8%** 两个百分点，**计算机通信电子设备制造业出厂价同比 +5.3%、环比 +0.6%**，集成电路进口均价 **+72.2%** 而出口量 -7.9%——**2027 上半年 BOM 成本仍将上行，但终端已打开提价空间，定价与锁量动作必须前移**。", "**内需只有 AI 终端一条增量，政策主力已从货币切换到财政与产业投资。**7 月通讯器材社零 **+20.4%**（唯一两位数品类）而汽车 **-17.0%**；M2 7.7% 但贷款增速降至 5.1%、住户贷款减少 8271 亿元——**机会在「AI 换机 + 出口 + 六张网项目」，不在总量刺激**。"], "implications": [{"h": "① 成本与定价：提前锁价锁量", "c": "存储/芯片「量缩价涨」未结束，集成电路进口均价 **+72.2%** 已开始向下游报表传导。建议 **2027H1 关键器件提前锁量锁价**，并把涨价因子前置进 Q4 新品定价模型，避免毛利被动侵蚀。"}, {"h": "② 产品与营销：押注 AI 终端", "c": "手机/平板/PC 是内需唯一两位数增长且能提价的品类，1—7 月**可穿戴智能设备零售额增长超 1 倍**。建议把 **AI 手机 / AI PC / 智能穿戴** 作为 2027 年产品与营销资源主战场，主打「AI 体验」而非参数。"}, {"h": "③ 渠道与生态：重估车 / 家电协同", "c": "汽车类社零 -17.0%、家电 -1.9%，国补退坡叠加高基数双重压制。建议**下调车机/家电商量目标、暂缓渠道资源加码**；同时把主推资源向通讯器材（**+20.4%**）倾斜。"}, {"h": "④ 政策红利：对接「六张网」与两重清单", "c": "发改委推进算力网 + 新型电网 + 新一代通信网 **「2+3+N」** 协调机制，媒体披露算力网投资量级达 **4 万亿元**。终端与计算业务应对接重大项目清单，争取**政企与行业侧的算力/终端组合方案**落地。"}, {"h": "⑤ 供应链：警惕 2027 价格回落风险", "c": "集成电路 8 月出口额 **+129.8%** 但出口量 -7.9%，纯价格驱动。**高价备货需设置安全库存上限与跌价准备**，避免周期反转时形成呆滞库存。"}, {"h": "⑥ 出口：AI 硬件是当下最强 Beta", "c": "8 月计算机产品出口首破 **300 亿美元**、集成电路首破 **400 亿美元**，双双创历史新高。海外市场资源应优先配置到 **AI 终端与高附加值硬件**，借全球 AI 投资热潮放大出口弹性。"}], "gauge": [{"n": "外需 / 出口", "v": "高热", "s": "出口连续 4 个月两位数，机电出口创历史新高", "p": 88}, {"n": "AI 与电子产业链", "v": "高热", "s": "电子行业利润 +110%，集成电路 +18.5 倍", "p": 92}, {"n": "工业生产", "v": "中温", "s": "8 月 PMI 49.8% 回升，高技术制造业 52.9%", "p": 52}, {"n": "内需消费", "v": "偏冷", "s": "社零 +0.6%，汽车 -17%，仅通讯器材 +20.4%", "p": 30}, {"n": "价格 / 成本", "v": "升温", "s": "PPI +3.8%、购进 +5.8%，芯片进口均价 +72.2%", "p": 78}, {"n": "货币金融", "v": "宽松", "s": "M2 7.7%、社融 7.4%，但贷款增速降至 5.1%", "p": 60}]}, "headlineViewpoints": [{"tag": "价格传导", "t": "8月CPI+0.8%/PPI+3.8%、平板价格+21.5%：**算力涨价已传导至终端消费品定价**", "s": "核心观点：8 月 PPI 同比 **+3.8%**（连续 6 个月上涨），电子电路制造价格环比 +3.5%；CPI 端统计局首次把手机、平板、存储涨价归因于「算力需求快速增长」，三者同比 **+11.0% / +21.5% / +19.6%**。<b class=\"hl-red\">终端行业拿到 2023 年以来最明确的提价窗口，但成本同步上行、毛利未必改善。</b>高层建议：2026H2 定价从「保份额」切到「保毛利」，上游优先锁价、结构上移中高端。", "l": "国家统计局", "u": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260909_1965261.html"}, {"tag": "增长结构", "t": "8月出口+25.0%、集成电路出口额+129.8%但出口量-7.9%：**宏观增长已集中于 AI 电子一条链，且是纯价格驱动**", "s": "核心观点：8 月出口同比 **+25.0%**，机电产品 2623 亿美元创单月新高；1—7 月电子行业利润 **+110%**，单独拉动全部规上工业利润 9.3pct，同期汽车制造 **-20.4%**。集成电路出口额 +129.8% 但**出口量 -7.9%**、进口均价 **+72.2%**。<b class=\"hl-red\">宏观「平均温度」已失真，电子链繁荣是量缩价涨。</b>高层建议：改以「AI 电子链 vs 传统制造链」双口径定目标，涨价因子前置进 Q4 定价。", "l": "国家统计局 / 海关总署", "u": "https://www.stats.gov.cn/"}, {"tag": "政策", "t": "成本核算新规与 60 日现金回款同日落地：**价格战与账期两项隐性竞争工具同时戴上合规紧箍**", "s": "核心观点：9/10 发改委与市场监管总局明确重要工业品**低价无序竞争按个别成本 / 行业平均成本核算**，同日国办要求龙头企业对中小企业 **60 日内现金付款**、电子凭证期限压至 6 个月。<b class=\"hl-red\">过去靠低价与拖账期换份额的打法，正在从商业选择变成合规风险。</b>高层建议：把合规成本计入 2027 年竞争模型，价格策略由「低价换份额」切到合规下的价值定价，并提前压降应付账款与电子凭证敞口。", "l": "国家发展改革委 / 国务院办公厅", "u": "https://www.ndrc.gov.cn/xwdt/tzgg/202609/t20260910_1407525.html"}, {"tag": "内需机会", "t": "7月社零仅+0.6%、通讯器材+20.4%：**AI 换机是内需唯一确定的增量**", "s": "核心观点：7 月社零 39022 亿元、同比 +0.6%（扣除汽车后 +2.5%），**汽车是拖累项而非消费本身失速**。通讯器材类 +20.4%（1—7 月 +15.1%），汽车 -17.0%、家电 -1.9%、建材 -14.2%。**AI 终端是唯一逆势提价的耐用消费品**。高层建议：把 AI 手机/AI PC/智能穿戴作为 2027 年主战场，资源从车机/家电向通讯器材倾斜。", "l": "国家统计局", "u": "https://www.stats.gov.cn/"}, {"tag": "政策换挡", "t": "M2 7.7%但贷款增速降至5.1%：**政策主力已从货币切换到财政与产业投资**", "s": "核心观点：7 月末 M2 +7.7%、社融存量 +7.4%，均高于名义 GDP 增速，但人民币贷款增速降至 5.1%，前 7 月住户贷款减少 8271 亿元，典型「宽货币 + 紧信用」。融资结构正从贷款转向债券：企业债券净融资同比多增 1.1 万亿元。央行 Q2 报告定调**「加大逆周期调节、及时谋划增量政策」**。高层建议：把握财政与产业投资窗口，对接「两重」与新型政策性金融工具项目清单。", "l": "中国人民银行", "u": "http://www.pbc.gov.cn/"}], "opinionLeaders": [{"name": "国家统计局", "role": "国民经济核算与价格、工业、贸易统计", "items": [{"hl": "8 月 CPI 环比 +0.4%、同比 +0.8%（涨幅扩大 0.3pct），核心 CPI 同比 +1.0%；PPI 环比 +0.4%、同比 +3.8%", "detail": "CPI 端：汽油价格同比 +9.3%（涨幅扩大 8.3pct）拉动能源涨幅由 0.6% 扩至 4.1%；受算力需求快速增长影响，移动电话机、平板电脑、数据存储设备价格环比分别 +2.3%、+2.1%、+2.1%，同比分别 +11.0%、+21.5%、+19.6%（计算机）。PPI 端：煤炭开采 +26.6%、有色冶炼 +20.8%，计算机 function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function redify(s){
  var t = String(s==null?'':s);
  /* 数据中历史写入的 <b class="hl-red">…</b> 先归一化为 **…**，
     否则经 esc() 转义后会在页面上显示成可见的标签文本（程序符号） */
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>([\s\S]*?)<\/b\s*>/gi, '**$2**');
  t = t.replace(/<b\s+class=(["']?)hl-red\1[^>]*>/gi, '');
  t = t.replace(/<\/b\s*>/gi, '');
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<span class="hl-red">$1</span>');
}

function splitSummary(t){
  const parts = (t||'').split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return redify(t||'');
  return '<div class="summary-lines">'+parts.map(p=>{
    const m = p.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*([\s\S]*)$/);
    const mk = m? m[1] : '·'; const body = m? m[2] : p;
    return '<div><span class="mk">'+mk+'</span>'+redify(body)+'</div>';
  }).join('')+'</div>';
}

function numberedLines(t){
  const s = bodyClean(t);

}

let mktGC = 'global';
function renderCategoryMarket(){
  const keys = Object.keys(cur.marketData);

  }));

  el('mkt-tabs').querySelectorAll('.mkt-tab').forEach(t=>t.addEventListener('click',()=>{

    t.classList.add('active'); drawMkt(t.dataset.k);

  el('mkt-toggle').addEventListener('click',()=>{ const t=el('mkt-tbl'); t.classList.toggle('show'); el('mkt-toggle').textContent = t.classList.contains('show')?'▾ 隐藏数据表格':'▸ 显示数据表格'; });
  drawMkt(keys[0]);
}
function drawMkt(key){
  const d = cur.marketData[key][mktGC];
  const labels = d.series.map(s=>s.label);
  const vals = d.series.map(s=>s.shipment);
  const yoy = d.series.map(s=>(typeof s.yoy==='number'? s.yoy : null));
  if(charts.mkt) charts.mkt.dispose();
  charts.mkt = echarts.init(el('mkt-chart'));
  charts.mkt.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）出货大盘', left:'center', textStyle:{fontSize:14,color:'#1f2937'} },
    tooltip:{ trigger:'axis' },
    legend:{ data:['出货','同比YoY'], bottom:0 },
    grid:{ left:55, right:55, top:50, bottom:50 },
    xAxis:{ type:'category', data:labels },
    yAxis:[{ type:'value', name:'亿', axisLabel:{formatter:'{value}'} },{ type:'value', name:'%', axisLabel:{formatter:'{value}'} }],
    series:[
      { name:'出货', type:'bar', data:vals, itemStyle:{color:'#2563eb'}, barWidth:'45%', label:{show:true,position:'top',formatter:'{c}'} },
      { name:'同比YoY', type:'line', yAxisIndex:1, data:yoy, itemStyle:{color:'#1d4ed8'}, symbolSize:8, label:{show:true,position:'bottom',formatter:function(p){ return p.value==null?'—':p.value+'%'; }} }
    ]
  }, true);
  const sh = el('mkt-shares');
  if(d.shares){
    el('mkt-share-note').textContent = '（'+(mktGC==='global'?'全球':'中国')+'厂商份额）';
    sh.innerHTML = '<tr><th>厂商</th><th>份额(%)</th><th>同比变化(pp)</th></tr>'+d.shares.map(s=>'<tr><td><b>'+esc(s.brand)+'</b></td><td>'+s.share+'</td><td class="'+(s.chg.indexOf('+')===0?'up':'down')+'">'+esc(s.chg)+'</td></tr>').join('');
  } else { sh.innerHTML=''; el('mkt-share-note').textContent='（该品类暂无分厂商份额数据 · '+(mktGC==='global'?'全球':'中国')+'）'; }
  const seg = el('mkt-segments');
  seg.innerHTML = d.segments? '<tr><th>分类</th><th>数值</th><th>说明</th></tr>'+d.segments.map(s=>'<tr><td>'+esc(s.name)+'</td><td><b>'+esc(s.val)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('') : '';
  const tbl = el('mkt-tbl');
  tbl.innerHTML = '<tr><th>周期</th><th>出货量(亿)</th><th>同比</th></tr>'+d.series.map(s=>'<tr><td>'+esc(s.label)+'</td><td>'+s.shipment+'</td><td>'+esc(s.yoy)+'</td></tr>').join('');
  drawMktShare(key);
}
function drawMktShare(key){
  const d = cur.marketData[key][mktGC];
  const box = el('mkt-share-chart');
  if(!d.shares || !d.shares.length){ if(charts.mktShare){charts.mktShare.dispose();} charts.mktShare=null; box.innerHTML='<div style="color:#9ca3af;text-align:center;padding:46px 0;font-size:13px">该品类暂无分厂商份额可视化数据</div>'; return; }
  const brands=d.shares.map(s=>s.brand), shares=d.shares.map(s=>s.share);
  const chgList=d.shares.map(s=>String(s.chg==null?'':s.chg));
  if(charts.mktShare) charts.mktShare.dispose();
  charts.mktShare = echarts.init(box);
  charts.mktShare.setOption({
    title:{ text:cur.marketData[key].name+'（'+(mktGC==='global'?'全球':'中国')+'）厂商份额与同比变化', left:'center', textStyle:{fontSize:13,color:'#1f2937'} },
    tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, formatter:function(p){ const i=p[0].dataIndex; let s='<b>'+brands[i]+'</b><br/>份额：'+shares[i]+'%'; if(chgList[i]&&chgList[i]!=='—') s+='<br/>同比变化：'+chgList[i]+' pp'; return s; } },
    grid:{ left:46, right:24, top:46, bottom:28 },
    xAxis:{ type:'category', data:brands, axisLabel:{interval:0, fontSize:11} },
    yAxis:{ type:'value', name:'%' },
    series:[{ type:'bar', barWidth:'52%', data:d.shares.map((s,idx)=>{ const ch=chgList[idx]; let col='#9ca3af'; if(ch){ if(ch.indexOf('+')===0)col='#dc2626'; else if(ch.indexOf('-')===0)col='#16a34a'; } return { value:s.share, itemStyle:{color:brandColor(s.brand), borderRadius:[4,4,0,0]}, label:{show:true,position:'top',fontSize:11,color:col,formatter:function(p){ return p.value+'%'+(ch&&ch!=='—'?' ('+ch+')':''); }} }; }) }]
  }, true);
}

/* 通用卡片渲染（汽车 market.cards 使用） */
function renderCards(cards){
  (cards||[]).forEach(card=>{
    const id = 'ac'+(autoCardSeq++);
    const wrap = document.createElement('div'); wrap.className='card';
    let inner = '<div class="section-title">'+esc(card.title||'')+' <span class="en">'+esc(card.note||'')+'</span></div>';
    if(card.type==='line'||card.type==='bar'||card.type==='pie'){ inner += '<div class="chart-box" id="'+id+'"></div>'; }
    if(card.type==='table'){ inner += '<table class="data-tbl show" id="'+id+'"></table>'; }
    if(card.type==='text'){ inner += '<div class="summary-box">'+splitSummary(card.html||'')+'</div>'; }
    wrap.innerHTML = inner; el('t4').appendChild(wrap);
    if(card.type==='line') drawLine(id, card);
    else if(card.type==='bar') drawBar(id, card);
    else if(card.type==='pie') drawPie(id, card);
    else if(card.type==='table') drawTable(id, card);
    else if(card.type==='combo') drawCombo(id, card);
    else if(card.type==='brandtable') drawBrandTable(id, card);
  });
}
function drawLine(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis'}, legend:{bottom:0,type:'scroll'}, grid:{left:55,right:30,top:46,bottom:54}, xAxis:{type:'category',data:card.months,axisLabel:{fontSize:11}}, yAxis:{type:'value',name:card.unit||''}, series:card.series.map(s=>({name:s.name,type:'line',data:s.data,smooth:true,symbolSize:6,lineStyle:{width:2.4},itemStyle:{color:s.color||'#2563eb'}})) }, true);
}
function drawBar(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  const items = card.items||[];
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, grid:{left:90,right:30,top:46,bottom:30}, xAxis:{type:'value',name:card.unit||''}, yAxis:{type:'category',data:items.map(i=>i.label).reverse(),axisLabel:{fontSize:11}}, series:[{type:'bar',data:items.slice().reverse().map(i=>({value:i.value,itemStyle:{color:i.color||'#2563eb',borderRadius:[0,4,4,0]}})), label:{show:true,position:'right',fontSize:11,formatter:'{c}'}}] }, true);
}
function drawPie(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({ title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}}, tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'}, legend:{bottom:0,type:'scroll'}, series:[{type:'pie',radius:['38%','66%'],data:(card.items||[]).map(i=>({name:i.label,value:i.value,itemStyle:{color:i.color}})), label:{formatter:'{b}\n{c}%',fontSize:11}}] }, true);
}
function drawTable(id, card){
  el(id).innerHTML = '<tr>'+card.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+(card.rows||[]).map(r=>'<tr>'+r.map((x,i)=>{ const cls=(card.cls&&card.cls[i])?(' class="'+card.cls[i]+'"'):''; return '<td'+cls+'>'+esc(x)+'</td>'; }).join('')+'</tr>').join('');
}
function drawCombo(id, card){
  const inst = echarts.init(el(id)); charts[id]=inst;
  inst.setOption({
    title:{text:card.title,left:'center',textStyle:{fontSize:13,color:'#1f2937'}},
    tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},
    legend:{bottom:0},
    grid:{left:60,right:60,top:46,bottom:54},
    xAxis:{type:'category',data:card.x,axisLabel:{fontSize:11}},
    yAxis:[
      {type:'value',name:card.yBar||'',position:'left'},
      {type:'value',name:card.yLine||'',position:'right',axisLabel:{formatter:'{value}'}}
    ],
    series:[
      {name:card.bar.name,type:'bar',data:card.bar.data,itemStyle:{color:card.bar.color||'#16a34a'},barWidth:'46%',
        label:{show:true,position:'top',fontSize:11,formatter:function(p){return p.value;}}},
      {name:card.line.name,type:'line',yAxisIndex:1,data:card.line.data,symbolSize:8,
        itemStyle:{color:card.line.color||'#b45309'},
        label:{show:true,position:'bottom',fontSize:11,formatter:function(p){return p.value==null?'—':p.value+'%';}}}
    ]
  }, true);
}
function ensureBrandTableCss(){
  if(document.getElementById('bt-css')) return;
  const s=document.createElement('style'); s.id='bt-css';
  s.textContent='.bt-bar-wrap{position:relative;display:flex;align-items:center;gap:8px;min-width:170px}.bt-bar{height:14px;border-radius:3px;background:linear-gradient(90deg,#16a34a,#22c55e);flex:0 0 auto}.bt-val{font-size:12px;color:#374151;font-weight:600}.bt-note-row td{background:#f8fafc;color:#6b7280;font-size:11px;padding:4px 10px}';
  document.head.appendChild(s);
}
function drawBrandTable(id, card){
  ensureBrandTableCss();
  const maxScale = 40;   // 比亚迪规模远超其余，按 40 万为满条，避免其他不可见
  const rows = (card.rows||[]).map(function(r){
    const barW = Math.min(100, (r.sales/maxScale)*100);
    let yoyCls=''; let yoyTxt='—';
    if(typeof r.yoy==='number'){ yoyTxt=(r.yoy>0?'+':'')+r.yoy+'%'; yoyCls=r.yoy>0?'up':'down'; }
    const share=(typeof r.share==='number')?r.share+'%':(r.share||'—');
    return '<tr><td><b>'+esc(r.brand)+'</b></td>'+
      '<td><div class="bt-bar-wrap"><div class="bt-bar" style="width:'+barW.toFixed(1)+'%"></div><span class="bt-val">'+r.sales+'</span></div></td>'+
      '<td class="'+yoyCls+'">'+yoyTxt+'</td>'+
      '<td>'+share+'</td></tr>'+
      (r.note?'<tr class="bt-note-row"><td colspan="4">'+esc(r.note)+'</td></tr>':'');
  }).join('');
  el(id).innerHTML = '<tr><th>'+card.headers.join('</th><th>')+'</th></tr>'+rows;
}

/* 汽车 / 互联网 / 芯片 专用大盘 */
function renderMarket(m){
  if(m.type==='auto' && m.cards){ renderCards(m.cards); return; }
  if(m.type==='internet'){ renderInternet(m); return; }
  if(m.type==='chip'){ renderChip(m); return; }
  if(m.cards){ renderCards(m.cards); }
}

function abPie(data, title){
  return {
    tooltip:{trigger:'item', formatter:function(p){return p.name+': '+p.value+'%';}},
    legend:{type:'scroll', orient:'vertical', right:4, top:6, bottom:6, textStyle:{fontSize:11}},

function abMk(id, opt){ if(charts[id]){try{charts[id].dispose();}catch(e){} } charts[id]=echarts.init(el(id)); charts[id].setOption(opt); }
function abCard(title, sub, id, tall, tableHtml){

let abChartsPending = false;
function drawAutoBoardCharts(){
  if(cur !== DATA.auto) return;
  if(!abChartsPending) return;
  if(!el('t4') || !el('t4').classList.contains('active')) return; // 等 t4 可见再画
  const D = DATA.auto.autoBoard;
  if(!D) return;
  abChartsPending = false;
  try{
    abMk('ab_c_total', abLine(D.pt_dates,[{name:'终端销量(万辆)',type:'line',smooth:true,data:D.pt_total.map(function(v){return v==null?null:+(v/10000).toFixed(1);}),itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],false));
    abMk('ab_c_nev', abLine(D.pt_dates,[{name:'新能源渗透率',type:'line',smooth:true,data:D.nev_pen,itemStyle:{color:'#16a34a'},areaStyle:{color:'rgba(22,163,74,.08)'}}],true));
    // 三、自主品牌月度销量（堆叠柱）+ 自主品牌合计（折线，右轴）
    (function(){
      var win = Math.min(19, D.oem_dates.length);
      var idx0 = D.oem_dates.length - win;
      var months = D.oem_dates.slice(idx0);
      var brands = Object.keys(D.oem);
      var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2','#ea580c','#65a30d','#dc2626','#9333ea'];
      var s = brands.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:D.oem[b].slice(idx0),itemStyle:{color:pal[i%pal.length]}}; });
      var tot = months.map(function(_,i){ var s2=0; brands.forEach(function(b){ var v=D.oem[b][idx0+i]; if(v) s2+=v; }); return s2; });
      s.push({name:'自主品牌合计',type:'line',yAxisIndex:1,data:tot,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:6,
        label:{show:true,position:'top',formatter:function(p){return (p.value/10000).toFixed(0)+'万';}}});
      abMk('ab_c_dom', {
        tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
        grid:{left:64,right:64,top:42,bottom:34},
        xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
        yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
               {type:'value',name:'合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],
        series:s
      });
    })();
    abMk('ab_c_nh', abLine(D.noa_h_dates,[{name:'高速NOA',type:'line',smooth:true,data:D.noa_h,itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'}}],true));
    abMk('ab_c_nu', abLine(D.noa_u_dates,[{name:'城区NOA',type:'line',smooth:true,data:D.noa_u,itemStyle:{color:'#7c3aed'},areaStyle:{color:'rgba(124,58,237,.08)'}}],true));
    var tcolors=['#0ea5e9','#0d9488','#f59e0b','#db2777','#64748b'];
    var tseries=Object.keys(D.tier).map(function(nm,i){return {name:nm,type:'line',smooth:true,data:D.tier[nm],itemStyle:{color:tcolors[i%tcolors.length]}};});
    abMk('ab_c_tier', abLine(D.tier_dates,tseries,true));
    // 七、智驾域控SoC格局（饼图，按厂家份额）
    abMk('ab_c_soc', abPie(D.soc.map(function(x){return {name:x.name,value:x.share};}), '域控SoC 份额(%)'));
    // 八、智驾域控供应商格局（饼图，按厂家份额）
    abMk('ab_c_sup', abPie(D.sup.map(function(x){return {name:x.name,value:x.share};}), '域控供应商 份额(%)'));
    // 九、鸿蒙智行（数据驱动）
    if(D.harmony_brands){ drawHimaCharts(D.harmony_brands); }
  }catch(e){ console.error('drawAutoBoardCharts', e); }
}

function drawHimaCharts(H){
  var months = H.months || [];
  // 九·1 各品牌分月销量（堆叠柱）+ 五界(鸿蒙智行)合计折线
  var bn = Object.keys(H.brands || {});
  var pal=['#2563eb','#16a34a','#f59e0b','#db2777','#7c3aed','#0891b2'];
  var s1 = bn.map(function(b,i){ return {name:b,type:'bar',stack:'t',emphasis:{focus:'series'},data:H.brands[b],itemStyle:{color:pal[i%pal.length]}}; });
  var five = (H.groups && H.groups['五界']) ? H.groups['五界'] : null;
  if(five) s1.push({name:'五界合计',type:'line',yAxisIndex:1,data:five,lineStyle:{width:3,color:'#111827'},itemStyle:{color:'#111827'},symbolSize:5});
  abMk('ab_c_hima_m', {
    tooltip:{trigger:'axis'}, legend:{top:0,type:'scroll'},
    grid:{left:64,right:64,top:42,bottom:34},
    xAxis:{type:'category',data:months,axisLabel:{fontSize:11,rotate: months.length>14?40:0}},
    yAxis:[{type:'value',name:'当月(辆)',axisLabel:{formatter:function(v){return (v/10000).toFixed(0)+'万';}}},
           {type:'value',name:'五界合计(万)',position:'right',axisLabel:{formatter:function(v){return (v/10000).toFixed(0);}}}],

function macDraw(){
  if(curCat!=='macro' || !window.echarts) return;
  document.querySelectorAll('.mc-chart').forEach(function(box){
    if(!box.id) return;
    const cfg = MC_CHART_MAP[box.id]; if(!cfg) return;
    if(charts[box.id]){ try{charts[box.id].dispose();}catch(e){} }
    charts[box.id] = echarts.init(box);
    charts[box.id].setOption(mcOpt(cfg), true);
  });
}
function drawMacroCharts(){ macDraw(); }
function mcOpt(cfg){
  const AX = {color:'#6b7280', fontSize:11};
  if(cfg.type==='line'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), bottom:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:52,bottom:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',min:(cfg.min==null?null:cfg.min),max:(cfg.max==null?null:cfg.max),axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'line',data:s.data,smooth:0.28,symbol:'circle',symbolSize:5,connectNulls:true,
          lineStyle:{width:2.4,color:s.color},itemStyle:{color:s.color},
          markLine:s.markLine?{silent:true,symbol:'none',lineStyle:{color:'#cbd5e1',type:'dashed',width:1.2},
            label:{formatter:s.markLine,position:'insideEndTop',color:'#6b7280',fontSize:10},data:[{yAxis:s.markVal}]}:null};
      }) };
  }
  if(cfg.type==='hbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:20,right:52,top:46,bottom:20,containLabel:true},
      xAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      yAxis:{type:'category',data:cfg.y,axisLabel:Object.assign({width:cfg.yw||150,overflow:'truncate'},AX)},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',barMaxWidth:15,
          data:s.data.map(function(v,i){ return {value:v, itemStyle:{color:(s.colors&&s.colors[i])||s.color||'#2563eb', borderRadius:[0,3,3,0]}}; }),
          label:{show:true,fontSize:10.5,color:'#6b7280',formatter:function(p){return (p.value>0?'+':'')+p.value+'%';}},
          labelLayout:function(p){ var pos=p.value>=0; return {x:p.rect.x+(pos?p.rect.width+6:-6),y:p.rect.y+p.rect.height/2,verticalAlign:'middle',align:pos?'left':'right'}; }};
      }) };
  }
  if(cfg.type==='vbar'){
    return { tooltip:{trigger:'axis'},
      legend:{data:cfg.series.map(function(s){return s.name;}), top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:26,top:46,bottom:cfg.rotate?82:34,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,rotate:cfg.rotate||0},AX)},
      yAxis:{type:'value',name:cfg.unit||'',axisLabel:AX},
      series:cfg.series.map(function(s){
        return {name:s.name,type:'bar',data:s.data,barMaxWidth:s.barMaxWidth||26,
          itemStyle:{color:s.color||'#2563eb',borderRadius:[3,3,0,0]},
          label:{show:true,position:'top',fontSize:10.5,color:'#6b7280',
            formatter:function(p){return p.value==null?'':(p.value>0?'+':'')+p.value+'%';}}};
      }) };
  }
  if(cfg.type==='combo'){
    return { tooltip:{trigger:'axis'},
      legend:{data:[cfg.bar.name,cfg.line.name], top:0, textStyle:{fontSize:11.5}},
      grid:{left:58,right:58,top:46,bottom:cfg.rotate?74:44,containLabel:true},
      xAxis:{type:'category',data:cfg.x,axisLabel:Object.assign({interval:0,lineHeight:13,fontSize:10.5},AX)},
      yAxis:[{type:'value',name:cfg.yBar||'',axisLabel:AX},{type:'value',name:cfg.yLine||'',splitLine:{show:false},axisLabel:AX}],
      series:[
        {name:cfg.bar.name,type:'bar',data:cfg.bar.data,barMaxWidth:30,
         itemStyle:{color:cfg.bar.color||'#2563eb',borderRadius:[3,3,0,0]},
         label:{show:true,position:'top',fontSize:10,color:'#6b7280',formatter:'{c}'}},
        {name:cfg.line.name,type:'line',yAxisIndex:1,data:cfg.line.data,smooth:0.2,symbol:'circle',symbolSize:8,
         lineStyle:{width:2.4,color:cfg.line.color||'#dc2626'},itemStyle:{color:cfg.line.color||'#dc2626'}}
      ]};
  }
  return {};
}

/* ---------------- 访问计数：由不蒜子(busuanzi)前端脚本自动填充，GitHub Pages 静态托管即可，无需服务端函数 ---------------- */

function setUpdate(){ el('update-badge').textContent = '更新于 ' + (cur.updateTime || DATA.terminal.updateTime || ''); }

function bindTabs(){
  /* 事件委托：tabnav 的 innerHTML 会随一级板块重写，逐个绑定会导致切换后监听失效 */
  const nav = el('tabnav');
  nav.addEventListener('click', function(ev){
    const t = ev.target && ev.target.closest ? ev.target.closest('.tab-item') : null;
    if(!t) return;
    nav.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const id = t.dataset.tab;
    curTab = id;
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    el(id).classList.add('active');
    renderMacroBrief();
    setTimeout(()=>{
      for(const k in charts){ try{ charts[k].resize(); }catch(e){} }
      if(id==='t4'){
        if(cur===DATA.auto) drawAutoBoardCharts();
        if(curCat==='macro') drawMacroCharts();
      }
    },60);
  });
}
function bindCatnav(){
  document.querySelectorAll('.cat-item').forEach(t=>t.addEventListener('click',()=>setCategory(t.dataset.cat)));
}
function init(){
  bindTabs(); bindCatnav(); setCategory('terminal');
  const hh=document.querySelector('.header').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh+'px');
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize',()=>{ for(const k in charts){ try{ charts[k].resize(); }catch(e){} } });
</script>
